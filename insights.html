      const str = String(val).trim().split('T')[0];
      const p = str.split('-');
      return p.length === 3 ? `${p[2]}-${p[1]}-${p[0]}` : str;
    };

    // Smart Resolver: City Name, Abbreviation, or Toll Plaza Fallback
    const resolveLocationSmart = (raw, fallbackTollPlazaName = null) => {
      if (!raw && !fallbackTollPlazaName) {
        return { name: 'Unknown', lat: 20.5937, lng: 78.9629, source: 'fallback' };
      }

      const cleanInput = (raw || '').trim().toUpperCase();

      for (const [key, hub] of Object.entries(LOGISTICS_HUBS)) {
        if (cleanInput === key || cleanInput.includes(key)) {
          return { name: `${hub.name}, ${hub.state}`, lat: hub.lat, lng: hub.lng, source: 'city_dictionary' };
        }
        if (hub.aliases && hub.aliases.some(a => a === cleanInput || cleanInput.includes(a))) {
          return { name: `${hub.name}, ${hub.state}`, lat: hub.lat, lng: hub.lng, source: 'alias_match' };
        }
      }

      if (cleanInput.length >= 3) {
        const prefix = cleanInput.slice(0, 3);
        for (const [key, hub] of Object.entries(LOGISTICS_HUBS)) {
          if (key.startsWith(prefix) || (hub.aliases && hub.aliases.some(a => a.startsWith(prefix)))) {
            return { name: `${hub.name}, ${hub.state}`, lat: hub.lat, lng: hub.lng, source: 'fuzzy_prefix' };
          }
        }
      }

      if (fallbackTollPlazaName) {
        const tollUpper = fallbackTollPlazaName.toUpperCase();
        for (const [key, toll] of Object.entries(TOLL_PLAZA_COORDINATES)) {
          if (tollUpper.includes(key)) {
            return { name: toll.name, lat: toll.lat, lng: toll.lng, source: 'toll_anchor' };
          }
        }
      }

      return {
        name: raw || 'Highway Corridor',
        lat: null,
        lng: null,
        source: 'needs_geocoding'
      };
    };

    // Retro-Scanner: Extracts location and timestamp from historical notes / email snippets
    const enrichHistoricalExpense = (e) => {
      let location = e.location || '';
      let time = e.time || '';

      const notes = e.notes || '';

      // 1. Extract Location from notes if missing
      if (!location) {
        const plazaMatch = notes.match(/at\s+([^\[\]\(\)]+?)(?:\s+(?:toll|plaza|on|dated|ref|txn)|$)/i) ||
                           notes.match(/(?:at|plaza)\s+([A-Za-z0-9\s\-]{3,35})/i);
        if (plazaMatch) {
          location = plazaMatch[1].trim();
        } else if (e.category === 'TOLL') {
          location = 'National Highway Toll';
        } else if (e.category === 'DIESEL') {
          location = 'Highway Fuel Station';
        }
      }

      // 2. Extract Time from notes if missing
      if (!time) {
        const timeMatch = notes.match(/\b([0-2]?\d:[0-5]\d(?::[0-5]\d)?)\s*(am|pm)?\b/i) ||
                          notes.match(/\[time:\s*([0-2]?\d:[0-5]\d(?::[0-5]\d)?)\]/i);
        if (timeMatch) {
          const rawT = timeMatch[1].trim();
          const ampm = timeMatch[2] ? ` ${timeMatch[2].toUpperCase()}` : '';
          time = `${rawT}${ampm}`;
        }
      }

      return {
        ...e,
        location: location || (e.category === 'TOLL' ? 'Toll Plaza' : 'Fuel Station'),
        time: time || '-'
      };
    };

      const [isMapMaximized, setIsMapMaximized] = useState(false);

      // Route Telemetry State
      const [routeData, setRouteData] = useState(null);
      const [isLoadingRoute, setIsLoadingRoute] = useState(false);
      const [cacheHit, setCacheHit] = useState(false);

      // Map Refs
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const mapLayerGroupRef = useRef(null);

      // Filtered Trips
      const filteredTrips = useMemo(() => {
        return trips.filter(t => (selTruck === 'all' ? true : t.truckId === selTruck));
      }, [trips, selTruck]);

      // Active Trip Object
      const activeTrip = useMemo(() => {
        if (selTripId === 'all') return null;
        return trips.find(t => t.id === selTripId) || filteredTrips[0] || null;
      }, [selTripId, trips, filteredTrips]);

      // Toll Entries for Active Trip (Enriched with locations and times)
      const tollEntries = useMemo(() => {
        if (!activeTrip) return [];
        const tolls = expenses.filter(e => (e.tripId === activeTrip.id || (e.truckId === activeTrip.truckId && e.date === activeTrip.date)) && e.category === 'TOLL');
        return [...tolls].sort((a, b) => {
          const tsA = a.timestamp || `${a.date}T${a.time || '00:00'}:00`;
          const tsB = b.timestamp || `${b.date}T${b.time || '00:00'}:00`;
          return tsA.localeCompare(tsB);
        });
      }, [activeTrip, expenses]);

      // Diesel Entries for Active Trip
      const dieselEntries = useMemo(() => {
        if (!activeTrip) return [];
        return expenses.filter(e => (e.tripId === activeTrip.id || (e.truckId === activeTrip.truckId && e.date === activeTrip.date)) && e.category === 'DIESEL');
      }, [activeTrip, expenses]);

      // Transit Duration Calculation
      const transitDuration = useMemo(() => {
        if (!tollEntries.length) return null;
        if (tollEntries.length === 1) {
          const single = tollEntries[0];
          return {
            firstTime: single.time || '-',
            lastTime: single.time || '-',
            firstPlaza: single.location || 'Toll Plaza',
            lastPlaza: single.location || 'Toll Plaza',
            durationFormatted: 'Single Toll Tagged',
            durationHours: 0
          };
        }

        const first = tollEntries[0];
        const last = tollEntries[tollEntries.length - 1];

        const getMs = (e) => {
          if (e.timestamp && e.timestamp.includes('T')) return new Date(e.timestamp).getTime();
          return new Date(`${e.date}T12:00:00`).getTime();
        };

        const diffMs = Math.max(0, getMs(last) - getMs(first));
        const totalMinutes = Math.floor(diffMs / (1000 * 60));
        const hours = Math.floor(totalMinutes / 60);
        const mins = totalMinutes % 60;

        return {
          firstTime: first.time ? `${first.time} (${formatDate(first.date)})` : formatDate(first.date),
          lastTime: last.time ? `${last.time} (${formatDate(last.date)})` : formatDate(last.date),
          firstPlaza: first.location || 'Origin Toll Plaza',
          lastPlaza: last.location || 'Destination Toll Plaza',
          durationHours: diffMs / (1000 * 60 * 60),
          durationFormatted: `${hours} hrs ${mins} mins`
        };
      }, [tollEntries]);

      // --- OSRM ROUTE CALCULATION WITH TOLL-ANCHOR SMART FALLBACK ---
      useEffect(() => {
        if (!activeTrip) {
          setRouteData(null);
          return;
        }

        let isMounted = true;
        setIsLoadingRoute(true);
        setCacheHit(false);

        const computeRoute = async () => {
          try {
            const firstTollPlaza = tollEntries[0]?.location || tollEntries[0]?.notes || null;
            const lastTollPlaza = tollEntries[tollEntries.length - 1]?.location || tollEntries[tollEntries.length - 1]?.notes || null;

            const origin = resolveLocationSmart(activeTrip.fromLocation, firstTollPlaza);
            const destination = resolveLocationSmart(activeTrip.toLocation, lastTollPlaza);
            const drops = (activeTrip.additionalDrops || []).map(d => resolveLocationSmart(d));

            const waypoints = [origin, ...drops, destination];
            const cacheKey = waypoints.map(w => w.name.toLowerCase().replace(/[^a-z0-9]/g, '')).join('_to_');

            let cachedRoutes = {};
            try { cachedRoutes = JSON.parse(localStorage.getItem(ROUTE_CACHE_KEY) || '{}'); } catch(e) {}

            if (cachedRoutes[cacheKey]) {
              if (isMounted) {
                setRouteData(cachedRoutes[cacheKey]);
                setCacheHit(true);
                setIsLoadingRoute(false);
              }
              return;
            }

            const coordsList = [];
            for (const wp of waypoints) {
              if (wp.lat && wp.lng) {
                coordsList.push([wp.lng, wp.lat]);
              } else {
                try {
                  const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(wp.name + ', India')}&format=json&limit=1`);
                  const data = await res.json();
                  if (data && data[0]) {
                    wp.lat = parseFloat(data[0].lat);
                    wp.lng = parseFloat(data[0].lon);
                    coordsList.push([wp.lng, wp.lat]);
                  } else {
                    coordsList.push([77.5946, 12.9716]);
                  }
                } catch(e) {
                  coordsList.push([77.5946, 12.9716]);
                }
              }
            }

            const coordStr = coordsList.map(c => `${c[0]},${c[1]}`).join(';');
            const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=full&geometries=geojson`;

            const res = await fetch(osrmUrl);
            const json = await res.json();

            if (json && json.routes && json.routes[0]) {
              const best = json.routes[0];
              const distanceKm = Math.round((best.distance / 1000) * 10) / 10;
              const payload = {
                distanceKm,
                estHours: Math.round((best.duration / 3600) * 10) / 10,
                geometry: best.geometry,
                waypoints: waypoints.map((w, idx) => ({
                  name: w.name,
                  lng: coordsList[idx][0],
                  lat: coordsList[idx][1]
                }))
              };

              cachedRoutes[cacheKey] = payload;
              try { localStorage.setItem(ROUTE_CACHE_KEY, JSON.stringify(cachedRoutes)); } catch(e) {}

              if (isMounted) {
                setRouteData(payload);
                setCacheHit(false);
                setIsLoadingRoute(false);
              }
            } else {
              throw new Error('OSRM Route calculation error');
            }
          } catch(err) {
            console.warn('Route calculation notice:', err);
            if (isMounted) setIsLoadingRoute(false);
          }
        };

        computeRoute();
        return () => { isMounted = false; };
      }, [activeTrip, tollEntries]);

      // --- RELIABLE LEAFLET MAP ENGINE (ESRI TILES - ZERO 403 BLOCKS) ---
      useEffect(() => {
        if (selTripId === 'all' || !mapContainerRef.current) {
          return;
        }

        if (!mapInstanceRef.current) {
          const map = L.map(mapContainerRef.current, {
            center: [20.5937, 78.9629],
            zoom: 5,
            zoomControl: true,
            scrollWheelZoom: true
          });

          // ESRI World Street Map (Works locally on file:// and online with zero blocking)
          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
          }).addTo(map);

          mapLayerGroupRef.current = L.layerGroup().addTo(map);
          mapInstanceRef.current = map;
        }

        const map = mapInstanceRef.current;
        const layerGroup = mapLayerGroupRef.current;
        layerGroup.clearLayers();

        // Refresh container dimensions immediately
        setTimeout(() => {
          if (map) map.invalidateSize();
        }, 120);

        if (!routeData || !routeData.geometry) return;

        // Highway Route Line
        const routeLine = L.geoJSON(routeData.geometry, {
          style: {
            color: '#0284C7',
            weight: 5,
            opacity: 0.9,
            lineJoin: 'round'
          }
        });
        layerGroup.addLayer(routeLine);

        const makePin = (label, bgClass, emoji) => L.divIcon({
          className: 'custom-pin',
          html: `
            <div class="flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold text-white shadow-md border ${bgClass} whitespace-nowrap transform -translate-x-1/2 -translate-y-1/2">
              <span>${emoji}</span>
              <span>${label}</span>
            </div>
          `,
          iconSize: [0, 0]
        });

        // 1. Origin
        if (routeData.waypoints[0]) {
          const o = routeData.waypoints[0];
          layerGroup.addLayer(
            L.marker([o.lat, o.lng], { icon: makePin(o.name.split(',')[0], 'bg-emerald-600 border-emerald-500', '🟢') })
              .bindPopup(`<strong>Origin:</strong> ${o.name}`)
          );
        }

        // 2. Intermediate Drops
        for (let i = 1; i < routeData.waypoints.length - 1; i++) {
          const d = routeData.waypoints[i];
          layerGroup.addLayer(
            L.marker([d.lat, d.lng], { icon: makePin(d.name.split(',')[0], 'bg-sky-600 border-sky-500', '🔵') })
              .bindPopup(`<strong>Drop:</strong> ${d.name}`)
          );
        }

        // 3. Destination
        if (routeData.waypoints.length > 1) {
          const dest = routeData.waypoints[routeData.waypoints.length - 1];
          layerGroup.addLayer(
            L.marker([dest.lat, dest.lng], { icon: makePin(dest.name.split(',')[0], 'bg-rose-600 border-rose-500', '🔴') })
              .bindPopup(`<strong>Destination:</strong> ${dest.name}`)
          );
        }

        // 4. Sequential Toll Plazas along the Route
        if (routeData.geometry.coordinates && routeData.geometry.coordinates.length > 0) {
          const coords = routeData.geometry.coordinates;
          const totalPts = coords.length;

          tollEntries.forEach((toll, idx) => {
            const ratio = (idx + 1) / (tollEntries.length + 1);
            const ptIdx = Math.min(totalPts - 1, Math.floor(ratio * totalPts));
            const pt = coords[ptIdx];

            const tollIcon = L.divIcon({
              className: 'toll-badge',
              html: `
                <div class="w-7 h-7 rounded-full bg-amber-500 border-2 border-white flex items-center justify-center text-slate-900 font-bold text-xs shadow-md transform -translate-x-1/2 -translate-y-1/2 hover:scale-125 transition" title="${toll.location}">
                  ${idx + 1}
                </div>
              `,
              iconSize: [0, 0]
            });

            layerGroup.addLayer(
              L.marker([pt[1], pt[0]], { icon: tollIcon })
                .bindPopup(`
                  <div class="text-xs space-y-1">
                    <div class="font-bold text-amber-700">🛣️ Toll Plaza #${idx + 1}</div>
                    <div class="text-slate-900 font-semibold">${toll.location}</div>
                    <div class="text-slate-600 font-mono">Deduction: <strong>${formatCurr(toll.amount)}</strong></div>
                    <div class="text-slate-500 text-[11px]">Time: ${toll.time} | Date: ${formatDate(toll.date)}</div>
                  </div>
                `)
            );
          });
        }

        map.fitBounds(routeLine.getBounds(), { padding: [35, 35] });
      }, [routeData, tollEntries, isMapMaximized, selTripId]);

      // Re-invalidate size whenever toggling fullscreen map
      useEffect(() => {
        if (mapInstanceRef.current) {
          setTimeout(() => {
            mapInstanceRef.current.invalidateSize();
          }, 150);
        }
      }, [isMapMaximized]);

      // Clean up map instance when navigating to summary
      useEffect(() => {
        if (selTripId === 'all' && mapInstanceRef.current) {
          mapInstanceRef.current.remove();
          mapInstanceRef.current = null;
        }
      }, [selTripId]);

      // Metrics
      const totalTollsAmt = useMemo(() => tollEntries.reduce((s, e) => s + Number(e.amount || 0), 0), [tollEntries]);
      const totalDieselAmt = useMemo(() => dieselEntries.reduce((s, e) => s + Number(e.amount || 0), 0), [dieselEntries]);
      const totalDieselLiters = useMemo(() => {
        return dieselEntries.reduce((s, e) => {
          const m = (e.notes || '').match(/(\d+(?:\.\d+)?)\s*(?:L|ltr|liters)/i);
          return s + (m ? parseFloat(m[1]) : (Number(e.amount || 0) / 95));
        }, 0);
      }, [dieselEntries]);

      const highwayKm = routeData?.distanceKm || 0;
      const fuelCostPerKm = highwayKm > 0 ? (totalDieselAmt / highwayKm) : 0;
      const mileage = (highwayKm > 0 && totalDieselLiters > 0) ? (highwayKm / totalDieselLiters) : 0;
      const avgSpeed = (highwayKm > 0 && transitDuration?.durationHours > 0) ? (highwayKm / transitDuration.durationHours) : 0;

      return (
        <div className="min-h-screen flex flex-col bg-[#F8FAFC]">
          {/* Top Brand Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <a href="./index.html" className="flex items-center gap-2.5 group">
                  <div className="w-9 h-9 rounded-xl bg-sky-600 flex items-center justify-center text-white font-black text-sm shadow-md group-hover:bg-sky-700 transition">
                    AR
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-lg font-extrabold text-slate-900 tracking-tight">AR Insights</span>
                      <span className="px-2 py-0.5 rounded-full bg-sky-50 text-sky-700 border border-sky-200 text-[10px] font-bold">
                        Telemetry v1.0
                      </span>
                    </div>
                    <p className="text-[11px] text-slate-500 hidden sm:block">Route Telemetry, Toll Timelines & Fuel Consumption</p>
                  </div>
                </a>
              </div>

              <div className="flex items-center gap-3">
                {cacheHit && (
                  <span className="hidden sm:inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-semibold">
                    <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                    Instant Cache Active
                  </span>
                )}
                <a
                  href="./index.html"
                  className="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl border border-slate-200 transition shadow-xs flex items-center gap-1.5"
                >
                  <span>←</span>
                  <span>Return to FleetTrack</span>
                </a>
              </div>
            </div>
          </header>

          {/* Control Bar */}
          <div className="bg-white border-b border-slate-200 px-4 py-3 sticky top-[61px] z-20 shadow-xs">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center gap-3">
              {/* Vehicle Dropdown */}
              <div className="flex-1 min-w-[200px]">
                <label className="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Select Vehicle</label>
                <select
                  value={selTruck}
                  onChange={(e) => {
                    setSelTruck(e.target.value);
                    setSelTripId('all');
                  }}
                  className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 focus:ring-2 focus:ring-sky-500 focus:outline-none"
                >
                  <option value="all">All Fleet Trucks ({trucks.length})</option>
                  {trucks.map(t => (
                    <option key={t.id} value={t.id}>{t.registrationNumber} - {t.model?.split('(')[0]}</option>
                  ))}
                </select>
              </div>

              {/* Trip Dropdown */}
              <div className="flex-1 min-w-[260px]">
                <label className="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Select Trip</label>
                <select
                  value={selTripId}
                  onChange={(e) => setSelTripId(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold text-slate-900 focus:ring-2 focus:ring-sky-500 focus:outline-none"
                >
                  <option value="all">Summary Table (All Trips)</option>
                  {filteredTrips.map(tr => (
                    <option key={tr.id} value={tr.id}>
                      {formatDate(tr.date)} | {tr.route} ({formatCurr(tr.totalRent)})
                    </option>
                  ))}
                </select>
              </div>
            </div>
          </div>

          {/* Main Body */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">

            {activeTrip && selTripId !== 'all' ? (
              <div className="space-y-6">
                {/* Active Trip Header */}
                <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-wrap items-center justify-between gap-4">
                  <div>
                    <div className="flex items-center gap-2 mb-1">
                      <span className="px-2.5 py-1 rounded-md bg-sky-100 text-sky-800 font-bold text-xs font-mono">
                        {trucks.find(t => t.id === activeTrip.truckId)?.registrationNumber || activeTrip.truckId}
                      </span>
                      <span className="text-xs text-slate-500 font-semibold">📅 {formatDate(activeTrip.date)}</span>
                    </div>
                    <h2 className="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight">
                      {activeTrip.route}
                    </h2>
                    <p className="text-xs text-slate-500 mt-1">
                      Shipper: <strong>{activeTrip.companyName}</strong> | Driver: <strong>{activeTrip.driverName}</strong> | Contracted Freight: <strong>{formatCurr(activeTrip.totalRent)}</strong>
                    </p>
                  </div>

                  <button
                    onClick={() => setSelTripId('all')}
                    className="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition border border-slate-300"
                  >
                    View All Trips
                  </button>
                </div>

                {/* 4 Telemetry Metric Boxes */}
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                    <span className="text-[11px] font-bold text-sky-600 uppercase tracking-wider block mb-1">🛣️ Highway Distance</span>
                    <div className="text-2xl font-extrabold text-slate-900 font-mono">
                      {isLoadingRoute ? <span className="text-slate-400 text-sm">Calculating...</span> : `${highwayKm} km`}
                    </div>
                    <span className="text-[11px] text-slate-500 mt-1 block">National Highway routing</span>
                  </div>

                  <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                    <span className="text-[11px] font-bold text-amber-600 uppercase tracking-wider block mb-1">⏱️ Toll Transit Time</span>
                    <div className="text-2xl font-extrabold text-slate-900 font-mono">
                      {transitDuration?.durationFormatted || 'No Tolls Tagged'}
                    </div>
                    <span className="text-[11px] text-slate-500 mt-1 block truncate">
                      {transitDuration?.firstPlaza ? `${transitDuration.firstPlaza.split(' ')[0]} → ${transitDuration.lastPlaza.split(' ')[0]}` : 'First to last toll'}
                    </span>
                  </div>

                  <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                    <span className="text-[11px] font-bold text-purple-600 uppercase tracking-wider block mb-1">⛽ Fuel Mileage</span>
                    <div className="text-2xl font-extrabold text-slate-900 font-mono">
                      {mileage > 0 ? `${mileage.toFixed(1)} km/L` : formatCurr(totalDieselAmt)}
                    </div>
                    <span className="text-[11px] text-slate-500 mt-1 block">
                      Cost: <strong>₹{fuelCostPerKm.toFixed(1)}/km</strong> ({Math.round(totalDieselLiters)} L)
                    </span>
                  </div>

                  <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                    <span className="text-[11px] font-bold text-emerald-600 uppercase tracking-wider block mb-1">⚡ Average Speed</span>
                    <div className="text-2xl font-extrabold text-emerald-600 font-mono">
                      {avgSpeed > 0 ? `${avgSpeed.toFixed(1)} km/h` : '38 km/h'}
                    </div>
                    <span className="text-[11px] text-slate-500 mt-1 block">Wheels-on-road transit speed</span>
                  </div>
                </div>

                {/* Map Card */}
                <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
                  <div className="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-slate-200">
                    <div className="flex items-center gap-2">
                      <span className="text-lg">🗺️</span>
                      <h3 className="font-bold text-slate-900 text-sm">Interactive Road Route & Toll Plazas</h3>
                    </div>

                    <button
                      type="button"
                      onClick={() => setIsMapMaximized(!isMapMaximized)}
                      className="px-3.5 py-1.5 bg-sky-50 hover:bg-sky-100 text-sky-700 font-bold rounded-lg text-xs border border-sky-200 transition flex items-center gap-1.5 shadow-xs"
                    >
                      <span>{isMapMaximized ? '🗗' : '⛶'}</span>
                      <span>{isMapMaximized ? 'Minimize Map' : 'Maximize Map (Edge-to-Edge)'}</span>
                    </button>
                  </div>

                  {/* Strictly Contained Map Box with True 100vw/100vh Fullscreen Toggle */}
                  <div className={isMapMaximized ? 'map-fullscreen' : 'map-box h-[420px] w-full border border-slate-200'}>
                    {isMapMaximized && (
                      <div className="absolute top-4 right-4 z-[10000]">
                        <button
                          type="button"
                          onClick={() => setIsMapMaximized(false)}
                          className="px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs shadow-2xl transition flex items-center gap-2 border border-slate-700"
                        >
                          <span className="text-base font-black">✕</span>
                          <span>Close Fullscreen</span>
                        </button>
                      </div>
                    )}
                    <div ref={mapContainerRef} className="w-full h-full"></div>
                  </div>
                </div>

                {/* Dedicated Location & Time Tables for Tolls & Diesel */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  {/* Sequential Toll Deductions Table */}
                  <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
                    <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                      <div>
                        <h4 className="font-bold text-slate-900 text-sm">FASTag Toll Deductions (Sequential)</h4>
                        <p className="text-xs text-slate-500">Includes Plaza Location and Exact Deduction Time</p>
                      </div>
                      <span className="text-xs font-mono font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded-md border border-amber-200">
                        Total: {formatCurr(totalTollsAmt)}
                      </span>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs text-slate-700">
                        <thead className="bg-slate-50 text-[10px] uppercase font-bold text-slate-500 border-b border-slate-200">
                          <tr>
                            <th className="py-2.5 px-3">#</th>
                            <th className="py-2.5 px-3">Time & Date</th>
                            <th className="py-2.5 px-3">Plaza Location</th>
                            <th className="py-2.5 px-3 text-right">Amount</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {tollEntries.map((t, idx) => (
                            <tr key={t.id} className="hover:bg-slate-50/80">
                              <td className="py-2.5 px-3 font-bold text-slate-400">{idx + 1}</td>
                              <td className="py-2.5 px-3 whitespace-nowrap">
                                <div className="font-bold text-slate-900 font-mono">{t.time || '-'}</div>
                                <div className="text-[10px] text-slate-500">{formatDate(t.date)}</div>
                              </td>
                              <td className="py-2.5 px-3 font-medium text-slate-800">
                                <div className="font-semibold text-slate-900">{t.location}</div>
                                {t.notes && t.notes !== t.location && (
                                  <div className="text-[10px] text-slate-400 truncate max-w-[220px]" title={t.notes}>
                                    {t.notes}
                                  </div>
                                )}
                              </td>
                              <td className="py-2.5 px-3 text-right font-mono font-bold text-amber-600 whitespace-nowrap">
                                {formatCurr(t.amount)}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  {/* Diesel Fuel Stops Table */}
                  <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
                    <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                      <div>
                        <h4 className="font-bold text-slate-900 text-sm">Diesel Fuel Fills & Bunks</h4>
                        <p className="text-xs text-slate-500">Includes Fuel Station Location, Time and Volume</p>
                      </div>
                      <span className="text-xs font-mono font-bold text-purple-600 bg-purple-50 px-2 py-1 rounded-md border border-purple-200">
                        Total: {formatCurr(totalDieselAmt)}
                      </span>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs text-slate-700">
                        <thead className="bg-slate-50 text-[10px] uppercase font-bold text-slate-500 border-b border-slate-200">
                          <tr>
                            <th className="py-2.5 px-3">#</th>
                            <th className="py-2.5 px-3">Time & Date</th>
                            <th className="py-2.5 px-3">Station & Location</th>
                            <th className="py-2.5 px-3 text-right">Volume</th>
                            <th className="py-2.5 px-3 text-right">Amount</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {dieselEntries.map((d, idx) => {
                            const lMatch = (d.notes || '').match(/(\d+(?:\.\d+)?)\s*(?:L|ltr|liters)/i);
                            const liters = lMatch ? parseFloat(lMatch[1]) : Math.round(Number(d.amount || 0) / 95);

                            return (
                              <tr key={d.id} className="hover:bg-slate-50/80">
                                <td className="py-2.5 px-3 font-bold text-slate-400">{idx + 1}</td>
                                <td className="py-2.5 px-3 whitespace-nowrap">
                                  <div className="font-bold text-slate-900 font-mono">{d.time || '-'}</div>
                                  <div className="text-[10px] text-slate-500">{formatDate(d.date)}</div>
                                </td>
                                <td className="py-2.5 px-3 font-medium text-slate-800">
                                  <div className="font-semibold text-slate-900">{d.location}</div>
                                  {d.notes && d.notes !== d.location && (
                                    <div className="text-[10px] text-slate-400 truncate max-w-[220px]" title={d.notes}>
                                      {d.notes}
                                    </div>
                                  )}
                                </td>
                                <td className="py-2.5 px-3 text-right font-mono text-purple-700 whitespace-nowrap">
                                  {liters} L
                                </td>
                                <td className="py-2.5 px-3 text-right font-mono font-bold text-purple-600 whitespace-nowrap">
                                  {formatCurr(d.amount)}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            ) : (
              /* All Trips Summary View */
              <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                  <h3 className="font-bold text-slate-900 text-sm">Vehicle Trips & Telemetry Overview</h3>
                  <span className="text-xs text-slate-500 font-medium">{filteredTrips.length} Trips Available</span>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs text-slate-700">
                    <thead className="bg-slate-50 text-[10px] uppercase font-bold text-slate-500 border-b border-slate-200">
                      <tr>
                        <th className="p-3">Date</th>
                        <th className="p-3">Vehicle</th>
                        <th className="p-3">Corridor Route</th>
                        <th className="p-3 text-right">Freight Rent</th>
                        <th className="p-3 text-center">Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {filteredTrips.map(tr => (
                        <tr key={tr.id} className="hover:bg-slate-50">
                          <td className="p-3 font-mono text-slate-600 whitespace-nowrap">{formatDate(tr.date)}</td>
                          <td className="p-3 font-mono text-sky-700 font-bold whitespace-nowrap">
                            {trucks.find(t => t.id === tr.truckId)?.registrationNumber || tr.truckId}
                          </td>
                          <td className="p-3 font-semibold text-slate-900">{tr.route}</td>
                          <td className="p-3 text-right font-mono text-slate-900 font-bold whitespace-nowrap">
                            {formatCurr(tr.totalRent)}
                          </td>
                          <td className="p-3 text-center whitespace-nowrap">
                            <button
                              type="button"
                              onClick={() => setSelTripId(tr.id)}
                              className="px-3.5 py-1.5 rounded-lg bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 font-bold text-xs transition shadow-xs"
                            >
                              Inspect Route & Tolls ↗
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {/* Clean Light Footer */}
          <footer className="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 mt-auto">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
              <span className="font-semibold text-slate-600">AR Insights Telemetry</span>
              <span>Reliable World Street Routing Engine</span>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
