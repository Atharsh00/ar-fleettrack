    // --- TAB 3: COMPANY ACCOUNTS & RECEIVABLES LEDGER ---
    function CompanyAccountsTab() {
      const {
        companies,
        filteredTrips,
        filteredExpenses,
        filteredDriverPayments,
        filteredSettlements,
        addSettlement,
        updateSettlement,
        updateTrip,
        deleteTrip,
        deleteSettlement,
        deleteTruckExpense,
        deleteDriverPayment,
        getTruckReg,
        getTripReimbursable,
        getTripBalancePending,
      } = useFleet();
      const [settleModal, setSettleModal] = useState(null);
      const [settleAmt, setSettleAmt] = useState('');
      const [settleMethod, setSettleMethod] = useState('NEFT');
      const [settleRef, setSettleRef] = useState('');
      const [settleDate, setSettleDate] = useState(new Date().toISOString().split('T')[0]);
      const [settleNotes, setSettleNotes] = useState('');
      const [deepDiveCmpId, setDeepDiveCmpId] = useState(null);
      const [editTarget, setEditTarget] = useState(null);
      const [deepColFilters, setDeepColFilters] = useState({});
      const [payColFilters, setPayColFilters] = useState({});

      // Company Prior Due / Balance Adjustment Modal State
      const [compAdjModalOpen, setCompAdjModalOpen] = useState(false);
      const [editingCompAdj, setEditingCompAdj] = useState(null);
      const [compAdjTargetName, setCompAdjTargetName] = useState('');
      const [compAdjDate, setCompAdjDate] = useState(new Date().toISOString().split('T')[0]);
      const [compAdjAmount, setCompAdjAmount] = useState('');
      const [compAdjDirection, setCompAdjDirection] = useState('RECEIVABLE'); // 'RECEIVABLE' (+) | 'ADVANCE' (-)
      const [compAdjNotes, setCompAdjNotes] = useState('');

      const openCompAdjustmentModal = (companyName, existingRecord = null) => {
        setCompAdjTargetName(companyName);
        if (existingRecord) {
          setEditingCompAdj(existingRecord);
          setCompAdjDate(existingRecord.date || new Date().toISOString().split('T')[0]);
          setCompAdjAmount(String(existingRecord.amount || ''));
          const isRec = (existingRecord.notes || '').includes('[adjType:RECEIVABLE]');
          setCompAdjDirection(isRec ? 'RECEIVABLE' : 'ADVANCE');
          setCompAdjNotes((existingRecord.notes || '').replace(/\s*\[adjType:[^\]]+\]/g, '').trim());
        } else {
          setEditingCompAdj(null);
          setCompAdjDate(new Date().toISOString().split('T')[0]);
          setCompAdjAmount('');
          setCompAdjDirection('RECEIVABLE');
          setCompAdjNotes('');
        }
        setCompAdjModalOpen(true);
      };

      const handleSaveCompAdjustment = (e) => {
        e.preventDefault();
        const amt = parseFloat(compAdjAmount);
        if (!amt || amt <= 0) return alert('Please enter a valid amount');
        if (!compAdjTargetName) return alert('Company name is missing');

        const cleanNotes = (compAdjNotes || '').replace(/\s*\[adjType:[^\]]+\]/g, '').trim();
        const fullNotes = `${cleanNotes || (compAdjDirection === 'RECEIVABLE' ? 'Opening Prior Due' : 'Prior Advance Held')} [adjType:${compAdjDirection}]`.trim();

        if (editingCompAdj) {
          updateSettlement(editingCompAdj.id, {
            date: compAdjDate,
            companyName: compAdjTargetName,
            amount: amt,
            paymentMethod: 'OPENING_BALANCE',
            referenceNumber: 'ADJUSTMENT',
            notes: fullNotes
          });
        } else {
          addSettlement({
            date: compAdjDate,
            companyName: compAdjTargetName,
            amount: amt,
            paymentMethod: 'OPENING_BALANCE',
            referenceNumber: 'ADJUSTMENT',
            notes: fullNotes
          });
        }
        setCompAdjModalOpen(false);
        setEditingCompAdj(null);
      };

      // Synchronized horizontal scroll refs for Company Deep-Dive tables
      const cmpTable1Ref = useRef(null);
      const cmpTable2Ref = useRef(null);
      const isSyncingCmpScroll = useRef(false);

      const handleCmpScroll1 = () => {
        if (isSyncingCmpScroll.current) return;
        isSyncingCmpScroll.current = true;
        if (cmpTable2Ref.current) {
          cmpTable2Ref.current.scrollLeft = cmpTable1Ref.current.scrollLeft;
        }
        requestAnimationFrame(() => { isSyncingCmpScroll.current = false; });
      };

      const handleCmpScroll2 = () => {
        if (isSyncingCmpScroll.current) return;
        isSyncingCmpScroll.current = true;
        if (cmpTable1Ref.current) {
          cmpTable1Ref.current.scrollLeft = cmpTable2Ref.current.scrollLeft;
        }
        requestAnimationFrame(() => { isSyncingCmpScroll.current = false; });
      };

      const companyLedgers = companies.map(cmp => {
        const cTrips = filteredTrips.filter(t => (t.companyName || '').trim().toLowerCase() === (cmp.name || '').trim().toLowerCase());
        const cSettles = filteredSettlements.filter(s => (s.companyName || '').trim().toLowerCase() === (cmp.name || '').trim().toLowerCase());
        const contracted = cTrips.reduce((s, t) => s + Number(t.totalRent), 0);
        const advReceived = cTrips.reduce((s, t) => s + Number(t.advanceReceived), 0);
        const tripReceived = cTrips.reduce((s, t) => s + Number(t.receivedAmount || 0), 0);
        const commTotal = cTrips.reduce((s, t) => s + Number(t.commissionAmount || 0), 0);
        const tdsTotal = cTrips.reduce((s, t) => s + Number(t.tdsAmount || 0), 0);
        const reimbTotal = cTrips.reduce((s, t) => s + (getTripReimbursable ? getTripReimbursable(t.id) : 0), 0);

        // Separate prior due adjustments (+ receivables) from regular settlements and advance adjustments (- credits)
        const priorDueReceivable = cSettles
          .filter(st => st.paymentMethod === 'OPENING_BALANCE' && (st.notes || '').includes('[adjType:RECEIVABLE]'))
          .reduce((s, st) => s + Number(st.amount || 0), 0);

        const priorAdvanceAdj = cSettles
          .filter(st => st.paymentMethod === 'OPENING_BALANCE' && !(st.notes || '').includes('[adjType:RECEIVABLE]'))
          .reduce((s, st) => s + Number(st.amount || 0), 0);

        const regularSettled = cSettles
          .filter(st => st.paymentMethod !== 'OPENING_BALANCE')
          .reduce((s, st) => s + Number(st.amount || 0), 0);

        const settled = regularSettled + priorAdvanceAdj;
        const totalReceived = advReceived + tripReceived + settled;
        const netPriorAdjustment = priorDueReceivable - priorAdvanceAdj;
        const balanceDue = Math.max(0, (contracted + reimbTotal + priorDueReceivable) - totalReceived - commTotal - tdsTotal);

        return {
          cmp, contracted, advReceived, tripReceived, commTotal, tdsTotal, reimbTotal,
          settled, totalReceived, balanceDue, priorDueReceivable, priorAdvanceAdj, netPriorAdjustment,
          trips: cTrips, settlements: cSettles
        };
      });

      const deepDiveCmp = deepDiveCmpId ? companyLedgers.find(cl => cl.cmp.id === deepDiveCmpId) : null;

      // Unified Payments Received for the Selected Company:
      // Includes Trip Advances, Trip Payments Received, and General Settlements
      const deepPayments = useMemo(() => {
        if (!deepDiveCmp) return [];
        const rows = [];
        // Trip Advances
        (deepDiveCmp.trips || []).forEach(t => {
          const adv = Number(t.advanceReceived || 0);
          if (adv > 0) {
            const trBal = getTripBalancePending ? getTripBalancePending(t) : t.balancePending;
            rows.push({
              id: `adv-${t.id}`,
              date: t.date || '-',
              source: 'Trip Advance',
              details: `Truck: ${getTruckReg ? getTruckReg(t.truckId) : t.truckId} | Route: ${t.route || 'Direct'}`,
              method: 'Advance',
              ref: t.id ? `TRIP-${t.id.slice(-6)}` : '-',
              amount: adv,
              rawType: 'TRIP',
              rawObj: t,
              tripBal: trBal
            });
          }
          // Direct Trip Payments Received
          const rec = Number(t.receivedAmount || 0);
          if (rec > 0) {
            const trBal = getTripBalancePending ? getTripBalancePending(t) : t.balancePending;
            rows.push({
              id: `rec-${t.id}`,
              date: t.date || '-',
              source: 'Trip Payment Received',
              details: `Truck: ${getTruckReg ? getTruckReg(t.truckId) : t.truckId} | Route: ${t.route || 'Direct'}`,
              method: 'Direct Receipt',
              ref: t.id ? `TRIP-${t.id.slice(-6)}` : '-',
              amount: rec,
              rawType: 'TRIP',
              rawObj: t,
              tripBal: trBal
            });
          }
        });
        // Client Reimbursable Expenses (Paid on behalf of client, to be reimbursed)
        (deepDiveCmp.trips || []).forEach(t => {
          const tripExpList = (filteredExpenses || []).filter(e => e.tripId === t.id && e.isReimbursable);
          tripExpList.forEach(e => {
            const eAmt = Number(e.amount || 0);
            if (eAmt > 0) {
              const trBal = getTripBalancePending ? getTripBalancePending(t) : t.balancePending;
              rows.push({
                id: `reimb-${e.id}`,
                date: e.date || t.date || '-',
                source: 'Reimbursable Expense',
                details: `Truck: ${getTruckReg ? getTruckReg(e.truckId || t.truckId) : (e.truckId || t.truckId)} | Category: ${e.category} | ${e.notes || 'Incurred on behalf of client'}`,
                method: (e.paymentMethod && e.paymentMethod !== 'Fleet Card') ? e.paymentMethod : 'Direct Bill',
                ref: `TRIP-${t.id ? t.id.slice(-6) : '-'}`,
                amount: eAmt,
                isReimbursableBill: true,
                rawType: 'EXPENSE',
                rawObj: e,
                tripBal: trBal
              });
            }
          });
          // Client Reimbursable Driver Claims (incurred by driver on behalf of client)
          const driverClaimsReimbList = (filteredDriverPayments || []).filter(p => p.tripId === t.id && p.type === 'DRIVER_EXPENSE' && p.isReimbursable);
          driverClaimsReimbList.forEach(p => {
            const pAmt = Number(p.amount || 0);
            if (pAmt > 0) {
              const trBal = getTripBalancePending ? getTripBalancePending(t) : t.balancePending;
              rows.push({
                id: `reimb-dp-${p.id}`,
                date: p.date || t.date || '-',
                source: 'Reimbursable Driver Claim',
                details: `Truck: ${getTruckReg ? getTruckReg(p.truckId || t.truckId) : (p.truckId || t.truckId)} | Driver: ${p.driverName} | ${p.description || 'Roadside claim incurred on behalf of client'}`,
                method: (p.paymentMethod && p.paymentMethod !== 'Fleet Card') ? p.paymentMethod : 'Driver Cash',
                ref: `TRIP-${t.id ? t.id.slice(-6) : '-'}`,
                amount: pAmt,
                isReimbursableBill: true,
                rawType: 'DRIVER_PAYMENT',
                rawObj: p,
                tripBal: trBal
              });
            }
          });
        });

        // Ledger Settlements / Receipts & Prior Adjustments
        (deepDiveCmp.settlements || []).forEach(s => {
          const amt = Number(s.amount || 0);
          if (amt > 0) {
            const isOpeningBal = s.paymentMethod === 'OPENING_BALANCE';
            const isReceivable = isOpeningBal && (s.notes || '').includes('[adjType:RECEIVABLE]');
            const isAdvanceAdj = isOpeningBal && !isReceivable;

            let source = 'Account Settlement';
            let isBill = false;
            if (isReceivable) {
              source = '📌 Prior Due (+)';
              isBill = true; // adds to running due
            } else if (isAdvanceAdj) {
              source = '📌 Advance Adj (-)';
            }

            const cleanNotes = (s.notes || '').replace(/\s*\[adjType:[^\]]+\]/g, '').trim();

            rows.push({
              id: `set-${s.id}`,
              date: s.date || '-',
              source: source,
              details: cleanNotes || (isReceivable ? 'Prior Balance Due (Receivable)' : (isAdvanceAdj ? 'Prior Advance Held (Credit)' : 'Settlement Payment Received')),
              method: isOpeningBal ? 'Prior Balance' : (s.paymentMethod || 'NEFT'),
              ref: s.referenceNumber || (isOpeningBal ? 'ADJUSTMENT' : '-'),
              amount: amt,
              isOpeningBal,
              isReceivableAdj: isReceivable,
              isAdvanceAdj,
              isReimbursableBill: isBill,
              rawType: 'SETTLEMENT',
              rawObj: s
            });
          }
        });

        // Build full chronological event stream to compute running due balance accurately across time
        // Events on the same date:
        // Priority 10: TRIP_BILL (adds net contracted freight)
        // Priority 20: REIMB_BILL (adds reimbursable truck expenses & driver claims)
        // Priority 30: ADVANCE (deducts advance received)
        // Priority 40: DIRECT_RECEIPT (deducts direct trip payment received)
        // Priority 50: SETTLEMENT (deducts account settlement received)
        const timelineEvents = [];

        // 1. Add all trip billings (net contracted rent)
        (deepDiveCmp.trips || []).forEach(t => {
          const tNetRent = Math.max(0, Number(t.totalRent || 0) - Number(t.commissionAmount || 0) - Number(t.tdsAmount || 0));
          timelineEvents.push({
            date: t.date || '',
            priority: 10,
            type: 'TRIP_BILL',
            amount: tNetRent,
            tripId: t.id
          });
        });

        // 2. Add all reimbursables and payments
        rows.forEach(r => {
          let priority = 30;
          if (r.isReimbursableBill) {
            priority = 20;
          } else if (r.source === 'Trip Advance') {
            priority = 30;
          } else if (r.source === 'Trip Payment Received') {
            priority = 40;
          } else if (r.source === 'Account Settlement') {
            priority = 50;
          }

          timelineEvents.push({
            date: r.date || '',
            priority,
            type: r.isReimbursableBill ? 'REIMB_BILL' : 'PAYMENT',
            amount: r.amount,
            rowRef: r
          });
        });

        // Sort events chronologically (oldest first):
        timelineEvents.sort((a, b) => {
          const dateComp = (a.date || '').localeCompare(b.date || '');
          if (dateComp !== 0) return dateComp;
          return (a.priority || 0) - (b.priority || 0);
        });

        // 3. Walk through chronological events and calculate running due balance
        let currentRunningDue = 0;
        timelineEvents.forEach((evt, idx) => {
          if (evt.type === 'TRIP_BILL' || evt.type === 'REIMB_BILL') {
            currentRunningDue += evt.amount;
          } else if (evt.type === 'PAYMENT') {
            currentRunningDue = Math.max(0, currentRunningDue - evt.amount);
          }
          if (evt.rowRef) {
            evt.rowRef.remainingDue = currentRunningDue;
            evt.rowRef.seqOrder = idx; // preserves exact forward timeline sequence
          }
        });

        // 4. Return rows sorted newest date first for display (latest events on a given date at top)
        return rows.sort((a, b) => {
          const dateComp = (b.date || '').localeCompare(a.date || '');
          if (dateComp !== 0) return dateComp;
          const timeB = getRecordTimestamp(b);
          const timeA = getRecordTimestamp(a);
          if (timeB !== timeA) return timeB - timeA;
          return (b.seqOrder || 0) - (a.seqOrder || 0);
        });
      }, [deepDiveCmp, filteredExpenses, filteredDriverPayments, getTruckReg, getTripBalancePending]);

      // Filtered Payments Received
      const filteredDeepPayments = useMemo(() => {
        return deepPayments.filter(p => {
          if (payColFilters.date && !String(p.date || '').toLowerCase().includes(payColFilters.date.toLowerCase()) && !formatDate(p.date).toLowerCase().includes(payColFilters.date.toLowerCase())) return false;
          if (payColFilters.source && !String(p.source || '').toLowerCase().includes(payColFilters.source.toLowerCase())) return false;
          if (payColFilters.details && !String(p.details || '').toLowerCase().includes(payColFilters.details.toLowerCase())) return false;
          if (payColFilters.method && !String(p.method || '').toLowerCase().includes(payColFilters.method.toLowerCase())) return false;

          if (payColFilters.amount && !String(p.amount || '').includes(payColFilters.amount)) return false;
          return true;
        });

      const deepTotalPaymentsReceived = filteredDeepPayments.reduce((s, p) => s + Number(p.amount || 0), 0);

      const filteredDeepTrips = useMemo(() => {
        if (!deepDiveCmp) return [];

          const trkReg = getTruckReg ? getTruckReg(t.truckId) : t.truckId;

          const trBal = getTripBalancePending ? getTripBalancePending(t) : t.balancePending;

          if (deepColFilters.truck && !String(trkReg || '').toLowerCase().includes(deepColFilters.truck.toLowerCase())) return false;
          if (deepColFilters.route && !String(t.route || '').toLowerCase().includes(deepColFilters.route.toLowerCase())) return false;
          if (deepColFilters.rent && !String(t.totalRent || '').includes(deepColFilters.rent)) return false;
          if (deepColFilters.comm && !String(t.commissionAmount || 0).includes(deepColFilters.comm)) return false;
          if (deepColFilters.tds && !String(t.tdsAmount || 0).includes(deepColFilters.tds)) return false;
          if (deepColFilters.reimb && !String(trReimb).includes(deepColFilters.reimb)) return false;
          if (deepColFilters.adv && !String(t.advanceReceived || 0).includes(deepColFilters.adv)) return false;
          if (deepColFilters.bal && !String(trBal).includes(deepColFilters.bal)) return false;
          return true;
        });
        return [...list].sort(compareRecordsDesc);
      }, [deepDiveCmp, deepColFilters, getTruckReg, getTripReimbursable, getTripBalancePending]);

      const deepTotalContracted = filteredDeepTrips.reduce((s, t) => s + Number(t.totalRent || 0), 0);
      const deepTotalComm = filteredDeepTrips.reduce((s, t) => s + Number(t.commissionAmount || 0), 0);
      const deepTotalTds = filteredDeepTrips.reduce((s, t) => s + Number(t.tdsAmount || 0), 0);

      const deepTotalAdv = filteredDeepTrips.reduce((s, t) => s + Number(t.advanceReceived || 0), 0);
      const deepTotalBal = filteredDeepTrips.reduce((s, t) => s + Number(getTripBalancePending ? getTripBalancePending(t) : t.balancePending || 0), 0);

                          -{formatCurr(deepTotalComm)}

                          -{formatCurr(deepTotalTds)}

                          +{formatCurr(deepTotalReimb)}
                        </td>
                        <td className="p-2.5 text-right font-mono text-amber-400 font-extrabold">
                          {formatCurr(deepTotalBal)}
                        </td>
                        <td className="p-2.5"></td>
                      </tr>

                  </table>
                </div>

                      <div>
                        <h4 className="text-sm font-bold text-emerald-400 flex items-center gap-2">
                          <span>💰 Itemized Payments Received & Client Reimbursables — {deepDiveCmp.cmp.name}</span>
                          <span className="text-[11px] font-normal text-slate-400">({filteredDeepPayments.length} records)</span>

                        <p className="text-[11px] text-slate-400">Track trip advances, receipts, and expenses incurred on client's behalf (to be reimbursed) with corresponding dates</p>
                      </div>
                      <div className="flex items-center gap-2">
                        <div className="px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 flex items-center gap-3 text-xs font-mono">
                          <span className="text-slate-400 text-[11px]">Outstanding Due:</span>
                          <span className="text-amber-400 font-bold text-sm">{formatCurr(deepDiveCmp.balanceDue)}</span>
                        </div>
                        <button
                          onClick={() => openCompAdjustmentModal(deepDiveCmp.cmp.name)}

                          title="Add Prior Due or Opening Balance Adjustment"

                          <span>⚖️</span>
                          <span>+ Prior Due / Adjustment</span>
                        </button>
                        {deepDiveCmp.balanceDue > 0 && (
                          <button
                            onClick={() => { setSettleModal(deepDiveCmp); setSettleAmt(deepDiveCmp.balanceDue); }}
                            className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs shadow transition"

                            + Record Receipt

                    <div ref={cmpTable2Ref} onScroll={handleCmpScroll2} className="overflow-x-auto rounded-xl border border-slate-800">
                      <table className="w-full text-left text-xs text-slate-300 min-w-[850px]">
                        <thead className="bg-slate-800/80 text-[10px] uppercase text-slate-400">
                          <tr>

                          <tr className="bg-slate-900/90 border-b border-slate-800">
                            <th className="p-1"><ColFilterInput value={payColFilters.date} onChange={v => setPayColFilters({...payColFilters, date: v})} placeholder="Date..." /></th>
                            <th className="p-1"><ColFilterInput value={payColFilters.source} onChange={v => setPayColFilters({...payColFilters, source: v})} placeholder="Type..." /></th>
                            <th className="p-1"><ColFilterInput value={payColFilters.details} onChange={v => setPayColFilters({...payColFilters, details: v})} placeholder="Details..." /></th>

                            <th className="p-1"></th>
                            <th className="p-1 text-center">
                              {hasPayFilters && (

                <p className="text-xs text-amber-400 mb-4">{settleModal.cmp.name} (Outstanding Due: {formatCurr(settleModal.balanceDue)})</p>
                <form onSubmit={handleSettleSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Receipt Date *</label>
                    <input type="date" required value={settleDate} onChange={(e) => setSettleDate(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Amount Received (₹) *</label>
                    <input type="number" required min="1" value={settleAmt} onChange={(e) => setSettleAmt(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Cheque / UTR Reference</label>
                    <input type="text" placeholder="e.g. UTR-982348" value={settleRef} onChange={(e) => setSettleRef(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Notes / Remarks</label>
                    <input type="text" placeholder="e.g. Final payment for Oct invoices" value={settleNotes} onChange={(e) => setSettleNotes(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setSettleModal(null)} className="px-4 py-2 text-xs text-slate-400 hover:text-white">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-lg shadow-md">Record Receipt</button>
                  </div>
                </form>
              </div>
            </div>
          </ModalPortal>
        )}

          {/* Company Prior Due / Balance Adjustment Modal */}
          {compAdjModalOpen && (
            <ModalPortal>
              <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
                <div className="bg-slate-900 border border-slate-700 rounded-t-2xl sm:rounded-2xl w-full max-w-md shadow-2xl p-4 sm:p-6 max-h-[92vh] overflow-y-auto">
                  <div className="flex justify-between items-center mb-1">
                  <h3 className="text-base font-bold text-white flex items-center gap-2">
                    <span>⚖️</span>
                    <span>{editingCompAdj ? 'Edit Prior Due / Adjustment' : 'Add Prior Due / Balance Adjustment'}</span>
                  </h3>
                  <button onClick={() => { setCompAdjModalOpen(false); setEditingCompAdj(null); }} className="text-slate-400 hover:text-white text-lg">✕</button>
                </div>
                <p className="text-xs text-amber-400 mb-4">{compAdjTargetName}</p>
                <form onSubmit={handleSaveCompAdjustment} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">Adjustment Direction *</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => setCompAdjDirection('RECEIVABLE')}
                        className={`p-2.5 rounded-xl border text-left transition flex flex-col gap-1 ${
                          compAdjDirection === 'RECEIVABLE'
                            ? 'bg-amber-500/20 border-amber-500 text-amber-300 ring-1 ring-amber-500'
                            : 'bg-slate-800/60 border-slate-700 text-slate-400 hover:bg-slate-800'
                        }`}
                      >
                        <span className="font-bold text-xs flex items-center gap-1.5 text-white">
                          <span>🟢</span> Company Owes Us (+)
                        </span>
                        <span className="text-[10px] text-slate-400 leading-tight">
                          Adds to company due (unpaid old freight/bill)
                        </span>
                      </button>

                      <button
                        type="button"
                        onClick={() => setCompAdjDirection('ADVANCE')}
                        className={`p-2.5 rounded-xl border text-left transition flex flex-col gap-1 ${
                          compAdjDirection === 'ADVANCE'
                            ? 'bg-blue-500/20 border-blue-500 text-blue-300 ring-1 ring-blue-500'
                            : 'bg-slate-800/60 border-slate-700 text-slate-400 hover:bg-slate-800'
                        }`}
                      >
                        <span className="font-bold text-xs flex items-center gap-1.5 text-white">
                          <span>🔵</span> We Owe Company (-)
                        </span>
                        <span className="text-[10px] text-slate-400 leading-tight">
                          Reduces due (advance/credit note held)
                        </span>
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Effective Date *</label>
                      <input
                        type="date"
                        required
                        value={compAdjDate}
                        onChange={(e) => setCompAdjDate(e.target.value)}
                        className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Amount (₹) *</label>
                      <input
                        type="number"
                        required
                        min="1"
                        step="any"
                        placeholder="e.g. 50000"
                        value={compAdjAmount}
                        onChange={(e) => setCompAdjAmount(e.target.value)}
                        className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Reason / Notes / Ref</label>
                    <input
                      type="text"
                      placeholder="e.g. Opening balance from Excel / Old unbilled freight"
                      value={compAdjNotes}
                      onChange={(e) => setCompAdjNotes(e.target.value)}
                      className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => { setCompAdjModalOpen(false); setEditingCompAdj(null); }}
                      className="px-4 py-2 text-xs text-slate-400 hover:text-white"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-lg shadow-md transition"
                    >
                      {editingCompAdj ? 'Update Adjustment' : 'Save Adjustment'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </ModalPortal>
        )}

          {editTarget && <EditRecordModal target={editTarget} onClose={() => setEditTarget(null)} />}
        </div>
      );
    }

    // --- TAB 4: DRIVER SALARY & EXPENDITURE LEDGER ---
    function DriverLedgerTab() {
      const { drivers, trucks, filteredTrips, filteredDriverPayments, addDriverPayment, updateDriverPayment, deleteTrip, deleteDriverPayment } = useFleet();
      const [driverModal, setDriverModal] = useState(null);
      const [pType, setPType] = useState('SALARY_PAYOUT');
      const [pAmount, setPAmount] = useState('');
      const [pMethod, setPMethod] = useState('Cash');
      const [pDesc, setPDesc] = useState('');
      const [pTruck, setPTruck] = useState('');
      const [pTripId, setPTripId] = useState('');
      const [deepDiveDrvId, setDeepDiveDrvId] = useState(null);
      const [editTarget, setEditTarget] = useState(null);
      const [drvColFilters, setDrvColFilters] = useState({});

      // Driver Prior Due / Balance Adjustment Modal State
      const [drvAdjModalOpen, setDrvAdjModalOpen] = useState(false);
      const [editingDrvAdj, setEditingDrvAdj] = useState(null);
      const [drvAdjTargetName, setDrvAdjTargetName] = useState('');
      const [drvAdjDate, setDrvAdjDate] = useState(new Date().toISOString().split('T')[0]);
      const [drvAdjAmount, setDrvAdjAmount] = useState('');
      const [drvAdjDirection, setDrvAdjDirection] = useState('PAYABLE'); // 'PAYABLE' (+) | 'ADVANCE' (-)
      const [drvAdjNotes, setDrvAdjNotes] = useState('');

      const openDrvAdjustmentModal = (driverName, existingRecord = null) => {
        setDrvAdjTargetName(driverName);
        if (existingRecord) {
          setEditingDrvAdj(existingRecord);
          setDrvAdjDate(existingRecord.date || new Date().toISOString().split('T')[0]);
          setDrvAdjAmount(String(existingRecord.amount || ''));
          const isPayable = existingRecord.type === 'DRIVER_EXPENSE' || (existingRecord.description || '').includes('[adjType:PAYABLE]');
          setDrvAdjDirection(isPayable ? 'PAYABLE' : 'ADVANCE');
          setDrvAdjNotes((existingRecord.description || '').replace(/\s*\[adjType:[^\]]+\]/g, '').trim());
        } else {
          setEditingDrvAdj(null);
          setDrvAdjDate(new Date().toISOString().split('T')[0]);
          setDrvAdjAmount('');
          setDrvAdjDirection('PAYABLE');
          setDrvAdjNotes('');
        }
        setDrvAdjModalOpen(true);
      };

      const handleSaveDrvAdjustment = (e) => {
        e.preventDefault();
        const amt = parseFloat(drvAdjAmount);
        if (!amt || amt <= 0) return alert('Please enter a valid amount');
        if (!drvAdjTargetName) return alert('Driver name is missing');

        const type = drvAdjDirection === 'PAYABLE' ? 'DRIVER_EXPENSE' : 'SALARY_PAYOUT';
        const cleanNotes = (drvAdjNotes || '').replace(/\s*\[adjType:[^\]]+\]/g, '').trim();
        const fullDesc = `${cleanNotes || (drvAdjDirection === 'PAYABLE' ? 'Prior Salary Due' : 'Prior Advance Loan')} [adjType:${drvAdjDirection}]`.trim();

        if (editingDrvAdj) {
          updateDriverPayment(editingDrvAdj.id, {
            date: drvAdjDate,
            driverName: drvAdjTargetName,
            type: type,
            amount: amt,
            paymentMethod: 'OPENING_BALANCE',
            description: fullDesc
          });
        } else {
          addDriverPayment({
            date: drvAdjDate,
            driverName: drvAdjTargetName,
            type: type,
            amount: amt,
            paymentMethod: 'OPENING_BALANCE',
            description: fullDesc
          });
        }
        setDrvAdjModalOpen(false);
        setEditingDrvAdj(null);
      };

      const driverLedgers = drivers.map(drv => {
        const dTrips = filteredTrips.filter(t => t.driverName === drv.name);
        const dPayments = filteredDriverPayments.filter(p => p.driverName === drv.name);
        const totalSalaryEarned = dTrips.reduce((s, t) => s + Number(t.driverCommission), 0);
        const totalPayoutsMade = dPayments.filter(p => p.type === 'SALARY_PAYOUT').reduce((s, p) => s + Number(p.amount), 0);
        const totalDriverExpenses = dPayments.filter(p => p.type === 'DRIVER_EXPENSE').reduce((s, p) => s + Number(p.amount), 0);
        const netBalanceDue = (totalSalaryEarned + totalDriverExpenses) - totalPayoutsMade;

        const priorSalaryDue = dPayments
          .filter(p => p.paymentMethod === 'OPENING_BALANCE' && p.type === 'DRIVER_EXPENSE')
          .reduce((s, p) => s + Number(p.amount), 0);
        const priorAdvancesGiven = dPayments
          .filter(p => p.paymentMethod === 'OPENING_BALANCE' && p.type === 'SALARY_PAYOUT')
          .reduce((s, p) => s + Number(p.amount), 0);
        const netPriorAdj = priorSalaryDue - priorAdvancesGiven;

        return { drv, totalSalaryEarned, totalPayoutsMade, totalDriverExpenses, netBalanceDue, priorSalaryDue, priorAdvancesGiven, netPriorAdj, trips: dTrips, payments: dPayments };
      });

      const deepDiveDrv = deepDiveDrvId ? driverLedgers.find(dl => dl.drv.id === deepDiveDrvId) : null;

      const combinedDrvRows = useMemo(() => {
        if (!deepDiveDrv) return [];
        const rows = [];
        deepDiveDrv.trips.forEach(t => {
          rows.push({
            id: t.id,
            date: t.date,
            type: 'Trip Salary',
            details: `${t.route} (Net: ${formatCurr(t.netRent)})`,
            earned: Number(t.driverCommission || 0),
            paidOut: 0,
            rawType: 'TRIP',
            rawObj: t,
          });
        });
        deepDiveDrv.payments.forEach(p => {
          const isOpeningBal = p.paymentMethod === 'OPENING_BALANCE';
          const isPriorSalary = isOpeningBal && p.type === 'DRIVER_EXPENSE';
          const isPriorAdvance = isOpeningBal && p.type === 'SALARY_PAYOUT';

          const linkedTrk = p.truckId ? trucks.find(t => t.id === p.truckId)?.registrationNumber : null;
          const trkInfo = linkedTrk ? ` • Truck: ${linkedTrk}` : '';
          const tripInfo = p.tripId ? ' (Trip Linked)' : '';

          let typeLabel = p.type === 'SALARY_PAYOUT' ? 'Advance' : 'Expense Claim';
          if (isPriorSalary) typeLabel = '📌 Prior Salary Due (+)';
          else if (isPriorAdvance) typeLabel = '📌 Prior Advance Loan (-)';

          const cleanDesc = (p.description || '').replace(/\s*\[adjType:[^\]]+\]/g, '').trim();

          rows.push({
            id: p.id,
            date: p.date,
            type: typeLabel,
            details: isOpeningBal ? (cleanDesc || 'Prior Balance Adjustment') : `${cleanDesc}${trkInfo}${tripInfo} (${p.paymentMethod || 'Cash'})`,
            earned: p.type === 'DRIVER_EXPENSE' ? Number(p.amount || 0) : 0,
            paidOut: p.type === 'SALARY_PAYOUT' ? Number(p.amount || 0) : 0,
            isOpeningBal,
            isPriorSalary,
            isPriorAdvance,
            rawType: 'DRIVER_PAY',
            rawObj: p,
          });
        });
        return rows.sort(compareRecordsDesc);
      }, [deepDiveDrv]);

      const filteredDrvRows = useMemo(() => {
        return combinedDrvRows.filter(r => {
          if (drvColFilters.date && !String(r.date || '').toLowerCase().includes(drvColFilters.date.toLowerCase()) && !formatDate(r.date).toLowerCase().includes(drvColFilters.date.toLowerCase())) return false;
          if (drvColFilters.type && !String(r.type || '').toLowerCase().includes(drvColFilters.type.toLowerCase())) return false;
          if (drvColFilters.details && !String(r.details || '').toLowerCase().includes(drvColFilters.details.toLowerCase())) return false;
          if (drvColFilters.earned && !String(r.earned || '').includes(drvColFilters.earned)) return false;
          if (drvColFilters.paidOut && !String(r.paidOut || '').includes(drvColFilters.paidOut)) return false;
          return true;
        });
      }, [combinedDrvRows, drvColFilters]);

      const drvTotalEarned = filteredDrvRows.reduce((s, r) => s + r.earned, 0);
      const drvTotalPaidOut = filteredDrvRows.reduce((s, r) => s + r.paidOut, 0);
      const drvNetDue = drvTotalEarned - drvTotalPaidOut;
      const hasDrvFilters = Object.values(drvColFilters).some(Boolean);

      const handlePaymentSubmit = (e) => {
        e.preventDefault();
        const amt = parseFloat(pAmount);
        if (!amt || amt <= 0) return alert('Enter valid amount');
        if (!pDesc.trim()) return alert('Enter description');
        addDriverPayment({
          date: new Date().toISOString().split('T')[0],
          driverName: driverModal.name,
          truckId: pType === 'DRIVER_EXPENSE' ? pTruck || undefined : undefined,
          tripId: pType === 'DRIVER_EXPENSE' ? pTripId || undefined : undefined,
          type: pType,
          amount: amt,
          paymentMethod: pMethod,
          description: pDesc.trim(),
        });
        setDriverModal(null);
        setPAmount('');
        setPDesc('');
        setPTruck('');
        setPTripId('');
      };

      return (
        <div className="space-y-6">
          <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg flex justify-between items-center">
            <div>
              <h2 className="text-lg font-bold text-white">Driver Salary & Expenditure Ledger</h2>
              <p className="text-xs text-slate-400">Driver salary earnings, advances tracking, and roadside claims</p>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            {driverLedgers.map(dl => (
              <div key={dl.drv.id} className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg flex flex-col justify-between">
                <div>
                  <div className="flex justify-between items-start mb-2">
                    <h4 onClick={() => setDeepDiveDrvId(dl.drv.id)} className="font-bold text-white text-sm hover:text-purple-400 cursor-pointer">{dl.drv.name}</h4>
                    <span className="text-[10px] px-2 py-0.5 rounded font-bold bg-slate-800 text-slate-300">
                      {dl.trips.length} Trips
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-500 mb-3">{dl.drv.phone}</p>

                  <div className="space-y-1 text-xs">
                    <div className="flex justify-between text-slate-400">
                      <span>Trip Salary:</span>
                      <span className="text-purple-300 font-mono font-bold">{formatCurr(dl.totalSalaryEarned)}</span>
                    </div>
                    <div className="flex justify-between text-slate-400">
                      <span>Expenses Claimed:</span>
                      <span className="text-blue-300 font-mono">{formatCurr(dl.totalDriverExpenses)}</span>
                    </div>
                    <div className="flex justify-between text-slate-400">
                      <span>Payouts Made:</span>
                      <span className="text-rose-400 font-mono">{formatCurr(dl.totalPayoutsMade)}</span>
                    </div>
                    {dl.netPriorAdj !== 0 && (
                      <div className="flex justify-between text-slate-400">
                        <span>Prior Adj / Bal:</span>
                        <span className={`font-mono font-bold ${dl.netPriorAdj > 0 ? 'text-amber-400' : 'text-purple-400'}`}>
                          {dl.netPriorAdj > 0 ? `+${formatCurr(dl.netPriorAdj)}` : `-${formatCurr(Math.abs(dl.netPriorAdj))}`}
                        </span>
                      </div>
                    )}
                    <div className="flex justify-between text-slate-400 pt-1.5 border-t border-slate-800">
                      <span className="font-bold text-slate-200">Net Due:</span>
                      <span className={`font-bold font-mono ${dl.netBalanceDue >= 0 ? 'text-amber-400' : 'text-emerald-400'}`}>
                        {formatCurr(dl.netBalanceDue)}
                      </span>
                    </div>
                  </div>
                </div>

                <div className="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between gap-2">
                  <div className="flex items-center gap-2">
                    <button onClick={() => setDeepDiveDrvId(dl.drv.id)} className="text-xs text-slate-400 hover:text-white">
                      Deep-Dive &rarr;
                    </button>
                    <button
                      onClick={() => openDrvAdjustmentModal(dl.drv.name)}
                      className="px-2 py-0.5 rounded bg-purple-500/10 text-purple-300 hover:bg-purple-500/20 border border-purple-500/30 text-[11px] font-semibold transition"
                      title="Add Prior Due or Opening Balance Adjustment"
                    >
                      + Adj
                    </button>
                  </div>
                  <button
                    onClick={() => { setDriverModal(dl.drv); setPType('SALARY_PAYOUT'); }}
                    className="px-2.5 py-1 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-lg text-xs"
                  >
                    + Payout
                  </button>
                </div>
              </div>
            ))}
          </div>

          {/* Deep-Dive Modal */}
          {deepDiveDrv && (
            <ModalPortal>
              <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
                <div className="bg-slate-900 border border-slate-700 rounded-t-2xl sm:rounded-2xl w-full max-w-4xl shadow-2xl p-4 sm:p-6 max-h-[92vh] flex flex-col">
                  <div className="flex justify-between items-center pb-3 border-b border-slate-800">
                  <div>
                    <h3 className="text-lg font-bold text-white">{deepDiveDrv.drv.name} - Driver Deep-Dive</h3>
                    <p className="text-xs text-slate-400">Phone: {deepDiveDrv.drv.phone} • License: {deepDiveDrv.drv.licenseNumber}</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => openDrvAdjustmentModal(deepDiveDrv.drv.name)}
                      className="px-3 py-1.5 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl text-xs shadow transition flex items-center gap-1.5"
                      title="Add Prior Due or Opening Balance Adjustment"
                    >
                      <span>⚖️</span>
                      <span>+ Prior Due / Adjustment</span>
                    </button>
                    <button onClick={() => { setDeepDiveDrvId(null); setDrvColFilters({}); }} className="text-slate-400 hover:text-white text-lg">✕</button>
                  </div>
                </div>
                <div className="py-4 overflow-y-auto flex-1 space-y-4">
                  <table className="w-full text-left text-xs text-slate-300">
                    <thead className="bg-slate-800/80 text-[10px] uppercase text-slate-400">
                      <tr>
                        <th className="p-2">Date</th>
                        <th className="p-2">Type</th>
                        <th className="p-2">Details</th>
                        <th className="p-2 text-right">Earned/Claimed</th>
                        <th className="p-2 text-right">Paid Out</th>
                        <th className="p-2 text-center">Action</th>
                      </tr>
                      <tr className="bg-slate-900/90 border-b border-slate-800">
                        <th className="p-1"><ColFilterInput value={drvColFilters.date} onChange={v => setDrvColFilters({...drvColFilters, date: v})} placeholder="Date..." /></th>
                        <th className="p-1"><ColFilterInput value={drvColFilters.type} onChange={v => setDrvColFilters({...drvColFilters, type: v})} placeholder="Type..." /></th>
                        <th className="p-1"><ColFilterInput value={drvColFilters.details} onChange={v => setDrvColFilters({...drvColFilters, details: v})} placeholder="Details..." /></th>
                        <th className="p-1"><ColFilterInput value={drvColFilters.earned} onChange={v => setDrvColFilters({...drvColFilters, earned: v})} placeholder="Earned..." className="text-right" /></th>
                        <th className="p-1"><ColFilterInput value={drvColFilters.paidOut} onChange={v => setDrvColFilters({...drvColFilters, paidOut: v})} placeholder="Paid..." className="text-right" /></th>
                        <th className="p-1 text-center">
                          {hasDrvFilters && (
                            <button onClick={() => setDrvColFilters({})} className="text-[10px] text-amber-400 hover:underline font-bold">✕ Clear</button>
                          )}
                        </th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {filteredDrvRows.map(r => (
                        <tr key={`${r.rawType}-${r.id}`} className="hover:bg-slate-800/40">
                          <td className="p-2 font-mono text-slate-400 whitespace-nowrap">{formatDate(r.date)}</td>
                          <td className={`p-2 font-bold whitespace-nowrap ${
                            r.isOpeningBal
                              ? (r.isPriorSalary ? 'text-amber-400 font-extrabold' : 'text-purple-300 font-extrabold')
                              : (r.rawType === 'TRIP' ? 'text-purple-300' : (r.type === 'Advance' ? 'text-rose-400' : 'text-blue-300'))
                          }`}>
                            {r.type}
                          </td>
                          <td className="p-2 text-slate-300">{r.details}</td>
                          <td className="p-2 text-right font-mono text-purple-300 font-bold whitespace-nowrap">
                            {r.earned > 0 ? `+${formatCurr(r.earned)}` : '-'}
                          </td>
                          <td className="p-2 text-right font-mono text-rose-400 font-bold whitespace-nowrap">
