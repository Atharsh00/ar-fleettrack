    // --- TAB 5: TDS DEDUCTION LEDGER (NEW) ---
    function TdsLedgerTab() {
      const { filteredTrips, trucks, summaryMetrics, deleteTrip } = useFleet();
      const [tdsColFilters, setTdsColFilters] = useState({});

      const tdsTrips = filteredTrips.filter(t => t.isTdsDeducted && Number(t.tdsAmount) > 0).sort(compareRecordsDesc);
      const totalGrossSubjectToTds = tdsTrips.reduce((s, t) => s + Number(t.totalRent), 0);

      const filteredTdsTrips = useMemo(() => {
        return tdsTrips.filter(t => {
          const trk = trucks.find(x => x.id === t.truckId);
          const trkReg = trk ? trk.registrationNumber : t.truckId;
          if (tdsColFilters.date && !String(t.date || '').toLowerCase().includes(tdsColFilters.date.toLowerCase()) && !formatDate(t.date).toLowerCase().includes(tdsColFilters.date.toLowerCase())) return false;
          if (tdsColFilters.truck && !String(trkReg || '').toLowerCase().includes(tdsColFilters.truck.toLowerCase())) return false;
          if (tdsColFilters.company && !String(t.companyName || '').toLowerCase().includes(tdsColFilters.company.toLowerCase())) return false;
          if (tdsColFilters.rent && !String(t.totalRent || '').includes(tdsColFilters.rent)) return false;
          if (tdsColFilters.tds && !String(t.tdsAmount || '').includes(tdsColFilters.tds)) return false;
          if (tdsColFilters.net && !String(t.netRent || '').includes(tdsColFilters.net)) return false;
          if (tdsColFilters.tripId && !String(t.id || '').toLowerCase().includes(tdsColFilters.tripId.toLowerCase())) return false;
          return true;
        });
      }, [tdsTrips, tdsColFilters, trucks]);

      const tdsGrossTotal = filteredTdsTrips.reduce((s, t) => s + Number(t.totalRent || 0), 0);
      const tdsAmountTotal = filteredTdsTrips.reduce((s, t) => s + Number(t.tdsAmount || 0), 0);
      const tdsNetTotal = filteredTdsTrips.reduce((s, t) => s + Number(t.netRent || 0), 0);
      const hasTdsFilters = Object.values(tdsColFilters).some(Boolean);

      return (
        <div className="space-y-6">
          <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg flex justify-between items-center">
            <div>
              <h2 className="text-lg font-bold text-white flex items-center gap-2">
                <span>🧾</span> TDS Deduction Ledger (Section 194C)
              </h2>
              <p className="text-xs text-slate-400">Track 1% TDS withheld at source across client freight contracts</p>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-slate-900/80 border border-emerald-500/30 rounded-2xl p-5 shadow-lg">
              <span className="text-xs font-semibold uppercase text-slate-400">Total TDS Deducted</span>
              <div className="text-2xl font-bold font-mono text-emerald-400 mt-1">{formatCurr(summaryMetrics.totalTdsDeducted)}</div>
              <p className="text-xs text-slate-400 mt-1">Withheld across {summaryMetrics.tripsWithTdsCount} trips</p>
            </div>
            <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg">
              <span className="text-xs font-semibold uppercase text-slate-400">Gross Freight Subject to TDS</span>
              <div className="text-2xl font-bold font-mono text-white mt-1">{formatCurr(totalGrossSubjectToTds)}</div>
              <p className="text-xs text-slate-400 mt-1">Total taxable freight contracts</p>
            </div>
            <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg">
              <span className="text-xs font-semibold uppercase text-slate-400">Trips Without TDS</span>
              <div className="text-2xl font-bold font-mono text-slate-300 mt-1">{filteredTrips.length - tdsTrips.length} Trips</div>
              <p className="text-xs text-slate-400 mt-1">TDS flag unchecked</p>
            </div>
          </div>

          <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg overflow-x-auto">
            <h3 className="font-bold text-white text-base mb-3">TDS Deduction Table</h3>
            <table className="w-full text-left text-xs text-slate-300">
              <thead className="bg-slate-800/80 text-[10px] uppercase text-slate-400">
                <tr>
                  <th className="py-2.5 px-3">Trip Date</th>
                  <th className="py-2.5 px-3">Truck No.</th>
                  <th className="py-2.5 px-3">Company Name</th>
                  <th className="py-2.5 px-3 text-right">Agreed Gross Rent</th>
                  <th className="py-2.5 px-3 text-right">TDS Amount (1%)</th>
                  <th className="py-2.5 px-3 text-right">Net Rent</th>
                  <th className="py-2.5 px-3 text-center">Trip ID</th>
                </tr>
                <tr className="bg-slate-900/90 border-b border-slate-800">
                  <th className="p-1"><ColFilterInput value={tdsColFilters.date} onChange={v => setTdsColFilters({...tdsColFilters, date: v})} placeholder="Date..." /></th>
                  <th className="p-1"><ColFilterInput value={tdsColFilters.truck} onChange={v => setTdsColFilters({...tdsColFilters, truck: v})} placeholder="Truck..." /></th>
                  <th className="p-1"><ColFilterInput value={tdsColFilters.company} onChange={v => setTdsColFilters({...tdsColFilters, company: v})} placeholder="Company..." /></th>
                  <th className="p-1"><ColFilterInput value={tdsColFilters.rent} onChange={v => setTdsColFilters({...tdsColFilters, rent: v})} placeholder="Rent..." className="text-right" /></th>
                  <th className="p-1"><ColFilterInput value={tdsColFilters.tds} onChange={v => setTdsColFilters({...tdsColFilters, tds: v})} placeholder="TDS..." className="text-right" /></th>
                  <th className="p-1"><ColFilterInput value={tdsColFilters.net} onChange={v => setTdsColFilters({...tdsColFilters, net: v})} placeholder="Net..." className="text-right" /></th>
                  <th className="p-1">
                    <div className="flex items-center gap-1">
                      <ColFilterInput value={tdsColFilters.tripId} onChange={v => setTdsColFilters({...tdsColFilters, tripId: v})} placeholder="ID..." className="text-center" />
                      {hasTdsFilters && (
                        <button onClick={() => setTdsColFilters({})} title="Clear filters" className="text-[9px] text-amber-400 hover:underline font-bold px-0.5">✕</button>
                      )}
                    </div>
                  </th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-800">
                {filteredTdsTrips.length === 0 ? (
                  <tr><td colSpan={7} className="py-6 text-center text-slate-500">No matching TDS records found.</td></tr>
                ) : (
                  filteredTdsTrips.map(t => {
                    const trk = trucks.find(x => x.id === t.truckId);
                    return (
                      <tr key={t.id} className="hover:bg-slate-800/40">
                        <td className="py-3 px-3 font-mono text-slate-400">{formatDate(t.date)}</td>
                        <td className="py-3 px-3 font-mono font-bold text-white">{trk ? trk.registrationNumber : t.truckId}</td>
                        <td className="py-3 px-3 text-slate-200">{t.companyName}</td>
                        <td className="py-3 px-3 text-right font-mono font-bold text-white">{formatCurr(t.totalRent)}</td>
                        <td className="py-3 px-3 text-right font-mono font-bold text-emerald-400">{formatCurr(t.tdsAmount)}</td>
                        <td className="py-3 px-3 text-right font-mono text-blue-300">{formatCurr(t.netRent)}</td>
                        <td className="py-3 px-3 text-center font-mono text-[11px] text-slate-400">{t.id}</td>
                      </tr>
                    );
                  })
                )}
              </tbody>
              {filteredTdsTrips.length > 0 && (
                <tfoot className="bg-slate-950/90 font-bold border-t-2 border-slate-700 text-white">
                  <tr>
                    <td colSpan={3} className="py-3 px-3 text-amber-400 uppercase tracking-wider text-[11px] font-black">
                      Total ({filteredTdsTrips.length} Records)
                    </td>
                    <td className="py-3 px-3 text-right font-mono font-black text-white">{formatCurr(tdsGrossTotal)}</td>
                    <td className="py-3 px-3 text-right font-mono font-black text-emerald-400">{formatCurr(tdsAmountTotal)}</td>
                    <td className="py-3 px-3 text-right font-mono font-black text-blue-300">{formatCurr(tdsNetTotal)}</td>
                    <td></td>
                  </tr>
                </tfoot>
              )}
            </table>
          </div>
        </div>
      );
    }

    // --- TAB 6: UNIVERSAL DATA ENTRY LEDGER (VIEW, EDIT & DELETE) (NEW) ---
    function UniversalLedgerTab() {
      const {
        filteredTrips, filteredExpenses, filteredDriverPayments, filteredSettlements,
        trucks, companies, drivers, deleteTrip, deleteTruckExpense, deleteDriverPayment, deleteSettlement
      } = useFleet();

      const [typeFilter, setTypeFilter] = useState('ALL');
      const [searchTerm, setSearchTerm] = useState('');
      const [editTarget, setEditTarget] = useState(null);
      const [colFilters, setColFilters] = useState({});
      const [showAutomated, setShowAutomated] = useState(false);

      const unified = useMemo(() => {
        const list = [];
        filteredTrips.forEach(t => {
          list.push({
            id: t.id, type: 'TRIP', date: t.date, entity: t.companyName,
            title: `Trip: ${t.route}`, amount: t.totalRent,
            details: `Net: ${formatCurr(t.netRent)} | Salary: ${formatCurr(t.driverCommission)} | Due: ${formatCurr(t.balancePending)}`,
            rawObj: t,
            isAutomated: false
          });
        });
        filteredExpenses.forEach(e => {
          const trk = trucks.find(x => x.id === e.truckId);
          const autoEntry = isAutoExpenseRecord(e);
          const cleanMethod = (e.paymentMethod && e.paymentMethod !== 'Fleet Card') ? e.paymentMethod : '';
          const cleanNotes = (e.notes || '').trim();
          const details = cleanMethod && cleanNotes ? `${cleanMethod} • ${cleanNotes}` : (cleanMethod || cleanNotes || '-');
          list.push({
            id: e.id, type: 'EXPENSE', date: e.date, entity: trk ? trk.registrationNumber : e.truckId,
            title: `Expense: ${e.category}`, amount: e.amount,
            details,
            rawObj: e,
            isAutomated: autoEntry
          });
        });
        filteredDriverPayments.forEach(p => {
          const isOpeningBal = p.paymentMethod === 'OPENING_BALANCE';
          const isPriorSalary = isOpeningBal && p.type === 'DRIVER_EXPENSE';
          const isPriorAdv = isOpeningBal && p.type === 'SALARY_PAYOUT';
          let title = p.type === 'SALARY_PAYOUT' ? 'Advance Payout' : 'Expense Claim';
          if (isPriorSalary) title = '📌 Driver Prior Due (+)';
          else if (isPriorAdv) title = '📌 Driver Prior Advance (-)';

          const cleanDesc = (p.description || '').replace(/\s*\[adjType:[^\]]+\]/g, '').trim();
          list.push({
            id: p.id, type: 'DRIVER_PAY', date: p.date, entity: p.driverName,
            title,
            amount: p.amount, details: cleanDesc || (isOpeningBal ? 'Prior Balance Adjustment' : p.description),
            rawObj: p,
            isAutomated: false
          });
        });
        filteredSettlements.forEach(s => {
          const isOpeningBal = s.paymentMethod === 'OPENING_BALANCE';
          const isReceivable = isOpeningBal && (s.notes || '').includes('[adjType:RECEIVABLE]');
          const isAdvanceAdj = isOpeningBal && !isReceivable;
          let title = `Settlement (${s.paymentMethod})`;
          if (isReceivable) title = '📌 Company Prior Due (+)';
          else if (isAdvanceAdj) title = '📌 Company Advance Adj (-)';

          const cleanNotes = (s.notes || '').replace(/\s*\[adjType:[^\]]+\]/g, '').trim();
          list.push({
            id: s.id, type: 'SETTLEMENT', date: s.date, entity: s.companyName,
            title, amount: s.amount, details: cleanNotes || (isOpeningBal ? 'Prior Balance Adjustment' : (s.referenceNumber || s.notes || '')),
            rawObj: s,
            isAutomated: false
          });
        });
        return list.sort(compareRecordsDesc);
      }, [filteredTrips, filteredExpenses, filteredDriverPayments, filteredSettlements, trucks]);

      const autoCount = useMemo(() => unified.filter(item => item.isAutomated).length, [unified]);

      const filtered = unified.filter(item => {
        if (!showAutomated && item.isAutomated) return false;
        if (typeFilter !== 'ALL' && item.type !== typeFilter) return false;
        if (searchTerm.trim()) {
          const q = searchTerm.toLowerCase();
          return item.entity.toLowerCase().includes(q) || item.title.toLowerCase().includes(q) || item.details.toLowerCase().includes(q);
        }
        return true;
      });

      const displayedItems = useMemo(() => {
        return filtered.filter(item => {
          if (colFilters.date && !String(item.date || '').toLowerCase().includes(colFilters.date.toLowerCase()) && !formatDate(item.date).toLowerCase().includes(colFilters.date.toLowerCase())) return false;
          if (colFilters.type && !String(item.type || '').toLowerCase().includes(colFilters.type.toLowerCase())) return false;
          if (colFilters.entity && !String(item.entity || '').toLowerCase().includes(colFilters.entity.toLowerCase())) return false;
          if (colFilters.title && !String(item.title || '').toLowerCase().includes(colFilters.title.toLowerCase())) return false;
          if (colFilters.details && !String(item.details || '').toLowerCase().includes(colFilters.details.toLowerCase())) return false;
          if (colFilters.amount && !String(item.amount || '').includes(colFilters.amount)) return false;
          return true;
        });
      }, [filtered, colFilters]);

      const univTotalAmount = displayedItems.reduce((s, item) => s + Number(item.amount || 0), 0);
      const hasUnivColFilters = Object.values(colFilters).some(Boolean);

      const handleDelete = (item) => {
        if (!confirm(`Delete this ${item.type} record permanently? All ledgers will re-calculate.`)) return;
        if (item.type === 'TRIP') deleteTrip(item.id);
        else if (item.type === 'EXPENSE') deleteTruckExpense(item.id);
        else if (item.type === 'DRIVER_PAY') deleteDriverPayment(item.id);
        else if (item.type === 'SETTLEMENT') deleteSettlement(item.id);
      };

      return (
        <div className="space-y-6">
          <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg flex flex-wrap justify-between items-center gap-4">
            <div>
              <h2 className="text-lg font-bold text-white flex items-center gap-2">
                <span>📚</span> Universal Data Entry Ledger
              </h2>
              <p className="text-xs text-slate-400">Master chronological log with search, filter, and Delete/Edit actions</p>
            </div>
            <div className="flex flex-wrap items-center gap-3">
              {/* Toggle switch for automated email entries */}
              <label className="flex items-center gap-2 cursor-pointer select-none px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 hover:border-slate-600 transition">
                <input
                  type="checkbox"
                  checked={showAutomated}
                  onChange={(e) => setShowAutomated(e.target.checked)}
                  className="rounded text-amber-500 bg-slate-900 border-slate-700 cursor-pointer w-4 h-4 accent-amber-500"
                />
                <span className="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
                  <span>🤖</span>
                  <span>Show Automated Tolls</span>
                  {autoCount > 0 && (
                    <span className={`text-[10px] font-mono px-1.5 py-0.5 rounded font-bold ${showAutomated ? 'bg-amber-500/20 text-amber-300' : 'bg-slate-700 text-slate-400'}`}>
                      {autoCount}
                    </span>
                  )}
                </span>
              </label>

              <select value={typeFilter} onChange={(e) => setTypeFilter(e.target.value)} className="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                <option value="ALL">All Types</option>
                <option value="TRIP">Trips</option>
                <option value="EXPENSE">Expenses</option>
                <option value="DRIVER_PAY">Driver Payouts</option>
                <option value="SETTLEMENT">Settlements</option>
              </select>
              <input
                type="text"
                placeholder="Search..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                className="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
              />
            </div>
          </div>

          {!showAutomated && autoCount > 0 && (
            <div className="bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-2.5 flex items-center justify-between text-xs text-slate-400">
              <span className="flex items-center gap-2">
                <span>🛡️</span>
                <span><strong>{autoCount} automated toll/fuel entries</strong> hidden to keep ledger clean.</span>
              </span>
              <button
                type="button"
                onClick={() => setShowAutomated(true)}
                className="text-amber-400 hover:text-amber-300 hover:underline font-bold text-xs flex items-center gap-1"
              >
                <span>Show Tolls</span>
                <span>👁️</span>
              </button>
            </div>
          )}

          {/* Mobile Card Feed (Visible on phones < md) */}
          <div className="md:hidden space-y-3">
            {displayedItems.length === 0 ? (
              <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 text-center text-slate-500 text-xs">
                No records match the active filters.
              </div>
            ) : (
              displayedItems.map(item => (
                <div key={`m-${item.type}-${item.id}`} className="bg-slate-900/90 border border-slate-800 rounded-xl p-3.5 shadow space-y-2">
                  <div className="flex items-center justify-between text-xs">
                    <span className="font-mono text-slate-400 text-[11px]">{formatDate(item.date)}</span>
                    <div className="flex items-center gap-1.5">
                      {item.isAutomated && (
                        <span className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-amber-500/15 text-amber-300 border border-amber-500/30">
                          🤖 Auto
                        </span>
                      )}
                      <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-800 text-amber-300 border border-slate-700">
                        {item.type}
                      </span>
                    </div>
                  </div>
                  <div className="flex items-start justify-between gap-2">
                    <div>
                      <div className="font-bold text-white text-sm">{item.entity}</div>
                      <div className="text-xs text-slate-300 mt-0.5">{item.title}</div>
                      {item.details && <div className="text-[11px] text-slate-400 mt-1 leading-snug">{item.details}</div>}
                    </div>
                    <div className="text-right">
                      <div className="text-sm font-black font-mono text-white">{formatCurr(item.amount)}</div>
                    </div>
                  </div>
                  <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-800">
                    <button
                      onClick={() => setEditTarget({ type: item.type, data: item.rawObj })}
                      className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-300 text-xs font-bold transition flex items-center gap-1"
                    >
                      <span>✏️</span>
                      <span>Edit</span>
                    </button>
                    <button
                      onClick={() => handleDelete(item)}
                      className="px-3 py-1.5 rounded-lg bg-rose-950/60 hover:bg-rose-600 text-rose-300 hover:text-white text-xs font-bold transition flex items-center gap-1"
                    >
                      <span>🗑️</span>
                      <span>Delete</span>
                    </button>
                  </div>
                </div>
              ))
            )}
            {displayedItems.length > 0 && (
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-3 flex justify-between items-center text-xs font-bold">
                <span className="text-amber-400 uppercase">Total ({displayedItems.length} Records)</span>
                <span className="font-mono text-white font-black text-sm">{formatCurr(univTotalAmount)}</span>
              </div>
            )}
          </div>

          {/* Desktop Table View (Visible on md and up >= 768px) */}
          <div className="hidden md:block bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg overflow-x-auto">
            <table className="w-full text-left text-xs text-slate-300">
              <thead className="bg-slate-800/80 text-[10px] uppercase text-slate-400">
                <tr>
                  <th className="py-2.5 px-3">Date</th>
                  <th className="py-2.5 px-3">Type</th>
                  <th className="py-2.5 px-3">Entity</th>
                  <th className="py-2.5 px-3">Description</th>
                  <th className="py-2.5 px-3">Accounting Details</th>
                  <th className="py-2.5 px-3 text-right">Amount</th>
                  <th className="py-2.5 px-3 text-center">Action</th>
                </tr>
                <tr className="bg-slate-900/90 border-b border-slate-800">
                  <th className="p-1"><ColFilterInput value={colFilters.date} onChange={v => setColFilters({...colFilters, date: v})} placeholder="Date..." /></th>
                  <th className="p-1"><ColFilterInput value={colFilters.type} onChange={v => setColFilters({...colFilters, type: v})} placeholder="Type..." /></th>
                  <th className="p-1"><ColFilterInput value={colFilters.entity} onChange={v => setColFilters({...colFilters, entity: v})} placeholder="Entity..." /></th>
                  <th className="p-1"><ColFilterInput value={colFilters.title} onChange={v => setColFilters({...colFilters, title: v})} placeholder="Description..." /></th>
                  <th className="p-1"><ColFilterInput value={colFilters.details} onChange={v => setColFilters({...colFilters, details: v})} placeholder="Details..." /></th>
                  <th className="p-1"><ColFilterInput value={colFilters.amount} onChange={v => setColFilters({...colFilters, amount: v})} placeholder="Amount..." className="text-right" /></th>
                  <th className="p-1 text-center">
                    {hasUnivColFilters && (
                      <button onClick={() => setColFilters({})} className="text-[10px] text-amber-400 hover:underline font-bold">✕ Clear</button>
                    )}
                  </th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-800">
                {displayedItems.length === 0 ? (
                  <tr><td colSpan={7} className="py-8 text-center text-slate-500">No records match the active filters.</td></tr>
                ) : (
                  displayedItems.map(item => (
                    <tr key={`${item.type}-${item.id}`} className="hover:bg-slate-800/40">
                      <td className="py-3 px-3 font-mono text-slate-400 whitespace-nowrap">{formatDate(item.date)}</td>
                      <td className="py-3 px-3">
                        <div className="flex items-center gap-1.5">
                          <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-800 text-slate-300">{item.type}</span>
                          {item.isAutomated && (
                            <span className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-amber-500/15 text-amber-300 border border-amber-500/30">
                              🤖 Auto
                            </span>
                          )}
                        </div>
                      </td>
                      <td className="py-3 px-3 font-semibold text-white">{item.entity}</td>
                      <td className="py-3 px-3 text-slate-200">{item.title}</td>
                      <td className="py-3 px-3 text-slate-400 text-[11px]">{item.details}</td>
                      <td className="py-3 px-3 text-right font-mono font-bold text-white">{formatCurr(item.amount)}</td>
                      <td className="py-3 px-3 text-center whitespace-nowrap">
                        <div className="flex items-center justify-center gap-1.5">
                          <button onClick={() => setEditTarget({ type: item.type, data: item.rawObj })} className="p-1 px-2.5 rounded bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-300 text-[11px] font-bold">
                            Edit
                          </button>
                          <button onClick={() => handleDelete(item)} className="p-1 px-2.5 rounded bg-rose-900/40 hover:bg-rose-600 text-rose-300 hover:text-white text-[11px] font-bold">
                            Delete
                          </button>
                        </div>
                      </td>
                    </tr>
                  ))
                )}
              </tbody>
              {displayedItems.length > 0 && (
                <tfoot className="bg-slate-950/90 font-bold border-t-2 border-slate-700 text-white">
                  <tr>
                    <td colSpan={5} className="py-3 px-3 text-amber-400 uppercase tracking-wider text-[11px] font-black">
                      Total ({displayedItems.length} Records)
                    </td>
                    <td className="py-3 px-3 text-right font-mono font-black text-white">{formatCurr(univTotalAmount)}</td>
                    <td></td>
                  </tr>
                </tfoot>
              )}
            </table>
          </div>

          {editTarget && <EditRecordModal target={editTarget} onClose={() => setEditTarget(null)} />}
        </div>
      );
    }

    // --- TAB 7: DATA ENTRY PORTAL (WITH FROM/TO, DROPS, COMMISSION, TDS) ---
    function DataEntryTab() {
      const { trucks, companies, drivers, trips, filteredTrips, dateFilter, addTrip, addTruckExpense, addDriverPayment, addTruck, addCompany, addDriver, activeRules } = useFleet();
      const [formType, setFormType] = useState('trip');
      const [msg, setMsg] = useState(null);

      const notify = (m) => { setMsg(m); setTimeout(() => setMsg(null), 4000); };

      // Trip Form
      const isAutoSalary = activeRules?.autoDriverSalaryEnabled !== false;
      const [tDate, setTDate] = useState(new Date().toISOString().split('T')[0]);
      const [tTruck, setTTruck] = useState(trucks[0]?.id || '');
      const [tComp, setTComp] = useState(companies[0]?.name || '');
      const [tDriver, setTDriver] = useState(drivers[0]?.name || '');
      const [fromLoc, setFromLoc] = useState('');
      const [toLoc, setToLoc] = useState('');
      const [drops, setDrops] = useState([]);
      const [tRent, setTRent] = useState('');
      const [tComm, setTComm] = useState('0');
      const [isTds, setIsTds] = useState(false);
      const [tAdv, setTAdv] = useState('');
      const [tManualSalary, setTManualSalary] = useState('');
      const [tNotes, setTNotes] = useState('');

      const handleAddDrop = () => setDrops([...drops, '']);
      const handleUpdateDrop = (i, val) => { const n = [...drops]; n[i] = val; setDrops(n); };
      const handleRemoveDrop = (i) => setDrops(drops.filter((_, idx) => idx !== i));

      const grossNum = parseFloat(tRent) || 0;
      const commNum = parseFloat(tComm) || 0;
      const advNum = parseFloat(tAdv) || 0;
      const manualSalNum = parseFloat(tManualSalary) || 0;
      const defaultTdsRate = (activeRules && activeRules.defaultTdsPercent !== undefined) ? activeRules.defaultTdsPercent : 1;
      const defaultDrvRate = (activeRules && activeRules.defaultDriverSalaryPercent !== undefined) ? activeRules.defaultDriverSalaryPercent : 15;
      const tdsAmt = isTds ? (grossNum * (defaultTdsRate / 100)) : 0;
      const netRent = Math.max(0, grossNum - tdsAmt - commNum);
      const driverSalary = isAutoSalary ? (netRent * (defaultDrvRate / 100)) : manualSalNum;
      const balancePending = Math.max(0, grossNum - advNum - commNum - tdsAmt);

      const handleTripSubmit = (e) => {
        e.preventDefault();
        if (grossNum < 0) return alert('Rent cannot be negative');
        if (!tComp) return alert('Please select a client company from Master');
        if (!tDriver) return alert('Please select a driver from Master');
        if (!fromLoc.trim() || !toLoc.trim()) return alert('From and To locations are required');
        if (!isAutoSalary && (isNaN(manualSalNum) || manualSalNum < 0 || tManualSalary.trim() === '')) {
          return alert('Please enter Driver Salary for this trip (Manual Entry Mode is active)');
        }

        addTrip({
          date: tDate, truckId: tTruck, companyName: tComp, driverName: tDriver,
          fromLocation: fromLoc, toLocation: toLoc, additionalDrops: drops.filter(Boolean),
          totalRent: grossNum, commissionAmount: commNum, isTdsDeducted: isTds, advanceReceived: advNum, receivedAmount: 0,
          manualDriverSalary: !isAutoSalary ? manualSalNum : undefined,
          notes: tNotes
        });

        notify(`Trip saved! Net Rent: ${formatCurr(netRent)}, Driver Salary: ${formatCurr(driverSalary)}, Company Balance Due: ${formatCurr(balancePending)}`);
        setTRent(''); setTComm('0'); setTAdv(''); setTManualSalary(''); setFromLoc(''); setToLoc(''); setDrops([]); setTNotes(''); setIsTds(false);
      };

      // Expense
      const [eDate, setEDate] = useState(new Date().toISOString().split('T')[0]);
      const [eTruck, setETruck] = useState(trucks[0]?.id || '');
      const [eTripId, setETripId] = useState('');
      const [eCat, setECat] = useState('DIESEL');
      const [eAmt, setEAmt] = useState('');
      const [eMethod, setEMethod] = useState('');
      const [eNotes, setENotes] = useState('');
      const [eReimbursable, setEReimbursable] = useState(false);
      const [showAllTripsExpense, setShowAllTripsExpense] = useState(false);

      const periodLabel = (dateFilter && dateFilter.preset === 'all')
        ? 'All Time' 
        : (dateFilter && dateFilter.preset === 'this_month')
        ? 'Current Month' 
        : (dateFilter && dateFilter.preset === 'last_month')
        ? 'Last Month' 
        : (dateFilter && dateFilter.startDate && dateFilter.endDate ? `${formatDate(dateFilter.startDate)} to ${formatDate(dateFilter.endDate)}` : 'Custom Range');

      const filteredTripsForExpenseTruck = (showAllTripsExpense ? (trips || []) : (filteredTrips || [])).filter(t => t.truckId === eTruck);

      const handleExpenseSubmit = (e) => {
        e.preventDefault();
        const amt = parseFloat(eAmt);
        if (!amt || amt <= 0) return alert('Enter valid amount');
        addTruckExpense({
          date: eDate,
          truckId: eTruck,
          tripId: eTripId || undefined,
          category: eCat,
          amount: amt,
          paymentMethod: eMethod || undefined,
          notes: eNotes,
          isReimbursable: eReimbursable
        });
        notify(`Logged ${formatCurr(amt)} expense under ${eCat}${eTripId ? ' (linked to trip)' : ''}${eReimbursable ? ' [Reimbursable - added to Company Balance Due]' : ''}`);
        setEAmt(''); setENotes(''); setETripId(''); setEReimbursable(false);
      };

      // Driver
      const [dpDate, setDpDate] = useState(new Date().toISOString().split('T')[0]);
      const [dpDriver, setDpDriver] = useState(drivers[0]?.name || '');
      const [dpType, setDpType] = useState('SALARY_PAYOUT');
      const [dpAmt, setDpAmt] = useState('');
      const [dpMethod, setDpMethod] = useState('Cash');
      const [dpDesc, setDpDesc] = useState('');
      const [dpTruck, setDpTruck] = useState(trucks[0]?.id || '');
      const [dpTripId, setDpTripId] = useState('');
      const [dpReimbursable, setDpReimbursable] = useState(false);
      const [showAllTripsDriver, setShowAllTripsDriver] = useState(false);

      const filteredTripsForDriverTruck = (showAllTripsDriver ? (trips || []) : (filteredTrips || [])).filter(t => t.truckId === dpTruck);

      const handleDriverSubmit = (e) => {
        e.preventDefault();
        const amt = parseFloat(dpAmt);
        if (!amt || amt <= 0) return alert('Enter valid amount');
        if (!dpDriver) return alert('Please select a driver from Master');
        if (!dpDesc.trim()) return alert('Enter description');
        addDriverPayment({
          date: dpDate,
          driverName: dpDriver,
          truckId: dpType === 'DRIVER_EXPENSE' ? dpTruck || undefined : undefined,
          tripId: dpType === 'DRIVER_EXPENSE' ? dpTripId || undefined : undefined,
          type: dpType,
          isReimbursable: dpType === 'DRIVER_EXPENSE' ? dpReimbursable : false,
          amount: amt,
          paymentMethod: dpMethod,
          description: dpDesc
        });
        notify(`Driver ${dpType === 'SALARY_PAYOUT' ? 'cash advance' : (dpReimbursable ? 'reimbursable expense claim' : 'expense claim')} recorded`);
        setDpAmt(''); setDpDesc(''); setDpTripId(''); setDpReimbursable(false);
      };

      return (
        <div className="space-y-6">
          {msg && <div className="p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold animate-fadeIn">✅ {msg}</div>}

          <div className="flex flex-nowrap overflow-x-auto no-scrollbar sm:flex-wrap gap-2 border-b border-slate-800 pb-3">
            {[
              { id: 'trip', label: '1. Trip & Freight' },
              { id: 'expense', label: '2. Truck Expense' },
              { id: 'driver', label: '3. Driver Payout/Claim' },
              { id: 'fuel_statement', label: '4. 📊 Excel Import' },
            ].map(f => (
              <button
                key={f.id}
                onClick={() => setFormType(f.id)}
                className={`flex-shrink-0 px-3.5 sm:px-4 py-2 sm:py-2.5 rounded-xl text-xs font-bold transition whitespace-nowrap ${formType === f.id ? 'bg-amber-500 text-slate-950 shadow-md' : 'bg-slate-800 text-slate-300'}`}
              >
                {f.label}
              </button>
            ))}
          </div>

          {formType === 'trip' && (
            <form onSubmit={handleTripSubmit} className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl max-w-4xl mx-auto space-y-4">
              <h3 className="text-base font-bold text-white mb-2">New Trip Freight Entry</h3>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Date *</label>
                  <input type="date" required value={tDate} onChange={(e) => setTDate(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white [color-scheme:dark]" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Truck (Master) *</label>
                  <select value={tTruck} onChange={(e) => setTTruck(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-mono">
                    {trucks.map(t => <option key={t.id} value={t.id}>{t.registrationNumber} - {t.model}</option>)}
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Client Company (Master Dropdown) *</label>
                  <select required value={tComp} onChange={(e) => setTComp(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                    <option value="">-- Select Client Company --</option>
                    {companies.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                  </select>
                  {companies.length === 0 && <span className="text-[11px] text-amber-400 mt-1 block">Please add companies in Masters first</span>}
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Driver Assigned (Master Dropdown) *</label>
                  <select required value={tDriver} onChange={(e) => setTDriver(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                    <option value="">-- Select Assigned Driver --</option>
                    {drivers.map(d => <option key={d.id} value={d.name}>{d.name}</option>)}
                  </select>
                  {drivers.length === 0 && <span className="text-[11px] text-amber-400 mt-1 block">Please add drivers in Masters first</span>}
                </div>
              </div>

              {/* Dynamic Route Fields */}
              <div className="bg-slate-950/60 border border-slate-800 rounded-xl p-3.5 space-y-2.5">
                <div className="flex justify-between items-center">
                  <span className="text-xs font-bold text-amber-400">Route & Drops</span>
                  <button type="button" onClick={handleAddDrop} className="text-xs text-amber-400 hover:underline">+ Add Destination Drop (+)</button>
                </div>

    // --- FUEL STATEMENT EXCEL & CSV INGESTION COMPONENT ---
    function FuelStatementImportSection({ notify }) {
      const {
        trucks, trips, expenses, activeProfile,
        fuelStatementLogs, addFuelStatementLog, deleteFuelStatementLog,
        addExpensesBatch, deleteExpensesBatch,
        findOngoingTripForTruck, relinkUnlinkedExpensesToTrips
      } = useFleet();

      const [isDragging, setIsDragging] = useState(false);
      const [isLoading, setIsLoading] = useState(false);
      const [fileName, setFileName] = useState('');
      const [rawRows, setRawRows] = useState([]);
      const [headerRowIdx, setHeaderRowIdx] = useState(0);
      const [colMapping, setColMapping] = useState({
        dateCol: -1,
        truckCol: -1,
        amountCol: -1,
        txnIdCol: -1,
        litresCol: -1,
        rateCol: -1,
        stationCol: -1,
        cityCol: -1,
        typeCol: -1
      });
      const [showOverrides, setShowOverrides] = useState(false);
      const [importSuccess, setImportSuccess] = useState(null);
      const fileInputRef = useRef(null);

      // Helper: parse dates from various formats (01-Oct-2026, 01/10/2026, 2026-10-01, Excel serial)
      const parseAnyDateString = (val) => {
        if (!val) return '';
        if (val instanceof Date && !isNaN(val.getTime())) {
          const y = val.getFullYear();
          const m = String(val.getMonth() + 1).padStart(2, '0');
          const d = String(val.getDate()).padStart(2, '0');
          return `${y}-${m}-${d}`;
        }
        if (typeof val === 'number' && val > 30000 && val < 60000) {
          const jsDate = new Date(Math.round((val - 25569) * 86400 * 1000));
          if (!isNaN(jsDate.getTime())) {
            const y = jsDate.getUTCFullYear();
            const m = String(jsDate.getUTCMonth() + 1).padStart(2, '0');
            const d = String(jsDate.getUTCDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
          }
        }
        const s = String(val).trim();
        const months = { jan: '01', feb: '02', mar: '03', apr: '04', may: '05', jun: '06', jul: '07', aug: '08', sep: '09', oct: '10', nov: '11', dec: '12' };

        // Match DD-MMM-YYYY or DD MMM YYYY or DD-MMM-YY (e.g. 01-Oct-2026)
        const m1 = s.match(/^([0-3]?\d)[-\s/]([a-zA-Z]{3,9})[-\s/](\d{2,4})/);
        if (m1) {
          const d = m1[1].padStart(2, '0');
          const mKey = m1[2].toLowerCase().slice(0, 3);
          const m = months[mKey];
          let y = m1[3];
          if (y.length === 2) y = '20' + y;
          if (m) return `${y}-${m}-${d}`;
        }
        // Match YYYY-MM-DD
        const m2 = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
        if (m2) {
          return `${m2[1]}-${m2[2].padStart(2, '0')}-${m2[3].padStart(2, '0')}`;
        }
        // Match DD-MM-YYYY or DD/MM/YYYY
        const m3 = s.match(/^([0-3]?\d)[-\/.]([0-1]?\d)[-\/.](\d{2,4})/);
        if (m3) {
          let y = m3[3];
          if (y.length === 2) y = '20' + y;
          return `${y}-${m3[2].padStart(2, '0')}-${m3[1].padStart(2, '0')}`;
        }
        return '';
      };

      // Helper: Native CSV parser fallback
      const parseCsvTo2DArray = (text) => {
        const lines = text.split(/\r\n|\n|\r/);
        const result = [];
        for (let line of lines) {
          if (!line.trim()) continue;
          const row = [];
          let insideQuotes = false;
          let entry = '';
          for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (c === '"') {
              if (insideQuotes && line[i + 1] === '"') {
                entry += '"';
                i++;
              } else {
                insideQuotes = !insideQuotes;
              }
            } else if (c === ',' && !insideQuotes) {
              row.push(entry.trim());
              entry = '';
            } else {
              entry += c;
            }
          }
          row.push(entry.trim());
          result.push(row);
        }
        return result;
      };

      // Header row auto-detection (scans metadata header rows e.g. row 0-25)
      const detectHeaderRow = (rows) => {
        if (!rows || rows.length === 0) return 0;
        for (let i = 0; i < Math.min(rows.length, 30); i++) {
          const rowStr = (rows[i] || []).map(cell => String(cell || '').toLowerCase()).join(' ');
          const hasDate = rowStr.includes('date');
          const hasAmount = rowStr.includes('amount') || rowStr.includes('total') || rowStr.includes('rs.') || rowStr.includes('rs');
          const hasTruck = rowStr.includes('vehicle') || rowStr.includes('truck') || rowStr.includes('card') || rowStr.includes('txn');
          if (hasDate && hasAmount && hasTruck) return i;
        }
        for (let i = 0; i < Math.min(rows.length, 30); i++) {
          const rowStr = (rows[i] || []).map(cell => String(cell || '').toLowerCase()).join(' ');
          if (rowStr.includes('date') && (rowStr.includes('amount') || rowStr.includes('rs'))) return i;
        }
        return 0;
      };

      // Column auto-detection based on header strings
      const detectColumnMapping = (headers) => {
        const mapping = {
          dateCol: -1,
          truckCol: -1,
          amountCol: -1,
          txnIdCol: -1,
          litresCol: -1,
          rateCol: -1,
          stationCol: -1,
          cityCol: -1,
          typeCol: -1
        };
        if (!headers || !headers.length) return mapping;
        const clean = headers.map(h => String(h || '').toLowerCase().replace(/[^a-z0-9]/g, ' '));

        clean.forEach((h, idx) => {
          if (mapping.txnIdCol === -1 && (h.includes('transaction id') || h.includes('txn id') || h.includes('txnid') || h.includes('reference no') || h.includes('ref no') || h.includes('bill no') || h.includes('invoice no'))) {
            mapping.txnIdCol = idx;
          }
          if (mapping.dateCol === -1 && (h.includes('transaction date') || h.includes('txn date') || h.includes('txndate') || h.includes('trans date') || h.includes('date') || h.includes('bill date'))) {
            mapping.dateCol = idx;
          }
          if (mapping.truckCol === -1 && (h.includes('vehicle number') || h.includes('vehicleno') || h.includes('vehicle') || h.includes('truck no') || h.includes('truck') || h.includes('reg no') || h.includes('registration'))) {
            mapping.truckCol = idx;
          }
          if (mapping.amountCol === -1 && (h.includes('total transaction amount') || h.includes('transaction amount') || h.includes('total amount') || h.includes('net amount') || h.includes('fuel amount') || h.includes('total rs') || h.includes('amount rs') || h.includes('amount'))) {
            mapping.amountCol = idx;
          }
          if (mapping.litresCol === -1 && (h.includes('volume') || h.includes('litres') || h.includes('liters') || h.includes('quantity') || h.includes('qty') || h.includes('ltr'))) {
            mapping.litresCol = idx;
          }
          if (mapping.rateCol === -1 && (h.includes('rate') || h.includes('price litre') || h.includes('price ltr') || h.includes('rate ltr'))) {
            mapping.rateCol = idx;
          }
          if (mapping.stationCol === -1 && (h.includes('retail outlet') || h.includes('pump') || h.includes('station') || h.includes('merchant') || h.includes('vendor'))) {
            mapping.stationCol = idx;
          }
          if (mapping.cityCol === -1 && (h.includes('city') || h.includes('location') || h.includes('place'))) {
            mapping.cityCol = idx;
          }
          if (mapping.typeCol === -1 && (h.includes('credit debit') || h.includes('cr dr') || h.includes('type') || h.includes('dr cr'))) {
            mapping.typeCol = idx;
          }
        });

        // Fallbacks if not detected
        if (mapping.dateCol === -1) {
          mapping.dateCol = clean.findIndex(h => h.includes('date'));
        }
        if (mapping.amountCol === -1) {
          mapping.amountCol = clean.findIndex(h => h.includes('amount') || h.includes('rs'));
        }
        if (mapping.truckCol === -1) {
          mapping.truckCol = clean.findIndex(h => h.includes('vehicle') || h.includes('truck') || h.includes('card'));
        }

        return mapping;
      };

      // Read file and parse rows
      const handleFileSelected = (file) => {
        if (!file) return;
        setIsLoading(true);
        setImportSuccess(null);
        setFileName(file.name);

        const isExcel = /\.(xlsx|xls)$/i.test(file.name);
        const reader = new FileReader();

        reader.onload = (e) => {
          try {
            let parsed2DRows = [];
            if (isExcel && window.XLSX) {
              const data = new Uint8Array(e.target.result);
              const workbook = window.XLSX.read(data, { type: 'array', cellDates: true });
              const firstSheetName = workbook.SheetNames[0];
              const worksheet = workbook.Sheets[firstSheetName];
              parsed2DRows = window.XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false, dateNF: 'yyyy-mm-dd' });
            } else {
              const text = typeof e.target.result === 'string' ? e.target.result : new TextDecoder('utf-8').decode(e.target.result);
              parsed2DRows = parseCsvTo2DArray(text);
            }

            if (!parsed2DRows || parsed2DRows.length < 2) {
              notify('Uploaded file contains insufficient rows');
              setIsLoading(false);
              return;
            }

            const hIdx = detectHeaderRow(parsed2DRows);
            setHeaderRowIdx(hIdx);
            setRawRows(parsed2DRows);

            const headers = (parsed2DRows[hIdx] || []).map(cell => String(cell || '').trim());
            const detectedMap = detectColumnMapping(headers);
            setColMapping(detectedMap);
            setIsLoading(false);
          } catch (err) {
            console.error('File parsing error:', err);
            notify('Failed to parse statement file: ' + err.message);
            setIsLoading(false);
          }
        };

        reader.onerror = () => {
          notify('Error reading file from disk');
          setIsLoading(false);
        };

        if (isExcel) {
          reader.readAsArrayBuffer(file);
        } else {
          reader.readAsText(file);
        }
      };

      // Clean registration string for lookup
      const cleanReg = (reg) => String(reg || '').replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
      const truckMap = useMemo(() => {
        const m = new Map();
        trucks.forEach(t => {
          const c = cleanReg(t.registrationNumber);
          if (c) m.set(c, t);
        });
        return m;
      }, [trucks]);

      // Deduplication lookups from existing expenses
      const { existingTxnIds, existingTruckDateKeys } = useMemo(() => {
        const txnIds = new Set();
        const truckDateKeys = new Set();
        expenses.forEach(exp => {
          if (exp.notes) {
            const m = exp.notes.match(/\[txn:([^\]]+)\]/i);
            if (m && m[1]) txnIds.add(m[1].trim().toLowerCase());
          }
          if (exp.category === 'DIESEL' && exp.truckId && exp.date) {
            const roundedAmt = Math.round(Number(exp.amount) || 0);
            truckDateKeys.add(`${exp.truckId}_${exp.date}_${roundedAmt}`);
          }
        });
        return { existingTxnIds: txnIds, existingTruckDateKeys: truckDateKeys };
      }, [expenses]);

      // Parse data rows with column mapping & deduplication
      const parsedData = useMemo(() => {
        if (!rawRows || rawRows.length <= headerRowIdx + 1) return { items: [], summary: {} };

        const headers = (rawRows[headerRowIdx] || []).map(c => String(c || '').trim());
        const dataRows = rawRows.slice(headerRowIdx + 1);
        const seenInBatchTxnIds = new Set();
        const items = [];

        let minDate = null;
        let maxDate = null;
        let totalFileAmt = 0;

        // Try extracting metadata period from top lines (e.g. line 0-10: "Period,01 Oct 2026 to 23 Oct 2026")
        for (let i = 0; i < headerRowIdx; i++) {
          const metaStr = (rawRows[i] || []).join(' ');
          const periodMatch = metaStr.match(/(\d{1,2}[-\s][A-Za-z]{3}[-\s]\d{2,4})\s+to\s+(\d{1,2}[-\s][A-Za-z]{3}[-\s]\d{2,4})/i);
          if (periodMatch) {
            const s = parseAnyDateString(periodMatch[1]);
            const e = parseAnyDateString(periodMatch[2]);
            if (s && e) {
              minDate = s;
              maxDate = e;
              break;
            }
          }
        }

        dataRows.forEach((row, rIdx) => {
          if (!row || row.length === 0 || !row.some(c => c !== undefined && c !== null && String(c).trim() !== '')) {
            return; // Empty row
          }

          const rawDate = colMapping.dateCol >= 0 ? row[colMapping.dateCol] : '';
          const rawTruck = colMapping.truckCol >= 0 ? row[colMapping.truckCol] : '';
          const rawAmt = colMapping.amountCol >= 0 ? row[colMapping.amountCol] : '';
          const rawTxnId = colMapping.txnIdCol >= 0 ? row[colMapping.txnIdCol] : '';
          const rawLitres = colMapping.litresCol >= 0 ? row[colMapping.litresCol] : '';
          const rawRate = colMapping.rateCol >= 0 ? row[colMapping.rateCol] : '';
          const rawStation = colMapping.stationCol >= 0 ? row[colMapping.stationCol] : '';
          const rawCity = colMapping.cityCol >= 0 ? row[colMapping.cityCol] : '';
          const rawType = colMapping.typeCol >= 0 ? row[colMapping.typeCol] : '';

          const parsedDate = parseAnyDateString(rawDate);
          const cleanedAmtStr = String(rawAmt || '').replace(/[^0-9.]/g, '');
          const parsedAmount = parseFloat(cleanedAmtStr) || 0;
          const cleanedTruckStr = cleanReg(rawTruck);
          const txnId = String(rawTxnId || '').trim();
          const litres = parseFloat(String(rawLitres || '').replace(/[^0-9.]/g, '')) || null;
          const rate = parseFloat(String(rawRate || '').replace(/[^0-9.]/g, '')) || null;
          const station = String(rawStation || '').trim();
          const city = String(rawCity || '').trim();
          const typeStr = String(rawType || '').toLowerCase();

          // Date tracking
          if (parsedDate) {
            if (!minDate || parsedDate < minDate) minDate = parsedDate;
            if (!maxDate || parsedDate > maxDate) maxDate = parsedDate;
          }

          // Truck matching
          let matchedTruck = truckMap.get(cleanedTruckStr);
          if (!matchedTruck && cleanedTruckStr) {
            matchedTruck = trucks.find(t => {
              const reg = cleanReg(t.registrationNumber);
              return reg.includes(cleanedTruckStr) || (cleanedTruckStr.length > 5 && reg.endsWith(cleanedTruckStr.slice(-4)));
            });
          }

          // Status & Deduplication
          let status = 'READY';
          let statusMsg = 'Ready to Import';

          if (typeStr.includes('credit') || (typeStr === 'cr' && !typeStr.includes('dr'))) {
            status = 'CREDIT_REVERSAL';
            statusMsg = 'Reversal / Cashback (Skipped)';
          } else if (!parsedDate || parsedAmount <= 0) {
            status = 'INVALID';
            statusMsg = 'Missing date or amount';
          } else if (!matchedTruck) {
            status = 'UNMATCHED_TRUCK';
            statusMsg = `Truck ${rawTruck} not in Masters`;
          } else {
            // Deduplication checks
            const hasTxnMatch = txnId && (existingTxnIds.has(txnId.toLowerCase()) || seenInBatchTxnIds.has(txnId.toLowerCase()));
            const roundedAmt = Math.round(parsedAmount);
            const truckDateKey = `${matchedTruck.id}_${parsedDate}_${roundedAmt}`;
            const hasTruckDateMatch = existingTruckDateKeys.has(truckDateKey);

            if (hasTxnMatch || hasTruckDateMatch) {
              status = 'DUPLICATE';
              statusMsg = hasTxnMatch ? `Duplicate Txn ID (${txnId})` : 'Duplicate (Matches Truck, Date & Amount)';
            } else {
              if (txnId) seenInBatchTxnIds.add(txnId.toLowerCase());
              totalFileAmt += parsedAmount;
            }
          }

          // Trip linking lookup:
          // Tags the trip starting on or before parsedDate, whose window extends until the start of the next trip
          let linkedTrip = null;
          if (matchedTruck && parsedDate) {
            linkedTrip = findOngoingTripForTruck(matchedTruck.id, parsedDate);
          }

          items.push({
            id: `row-${rIdx}`,
            rawDate,
            parsedDate,
            rawTruck,
            cleanedTruckStr,
            matchedTruck,
            parsedAmount,
            txnId,
            litres,
            rate,
            station,
            city,
            linkedTrip,
            status,
            statusMsg
          });
        });

        const readyCount = items.filter(i => i.status === 'READY').length;
        const duplicateCount = items.filter(i => i.status === 'DUPLICATE').length;
        const unmatchedCount = items.filter(i => i.status === 'UNMATCHED_TRUCK').length;
        const reversalCount = items.filter(i => i.status === 'CREDIT_REVERSAL').length;

        return {
          headers,
          items,
          summary: {
            totalRows: items.length,
            readyCount,
            duplicateCount,
            unmatchedCount,
            reversalCount,
            totalReadyAmt: items.filter(i => i.status === 'READY').reduce((sum, i) => sum + i.parsedAmount, 0),
            periodStart: minDate,
            periodEnd: maxDate
          }
        };
      }, [rawRows, headerRowIdx, colMapping, truckMap, existingTxnIds, existingTruckDateKeys, trucks, trips]);

      // Automatic Date Gap Detection Banner Logic
      const gapAnalysis = useMemo(() => {
        if (!fuelStatementLogs || fuelStatementLogs.length === 0) {
          return { status: 'NO_LOGS', gaps: [], coveredRanges: [] };
        }

        const validLogs = fuelStatementLogs
          .filter(l => l.periodStart && l.periodEnd)
          .map(l => ({
            id: l.id,
            start: l.periodStart,
            end: l.periodEnd,
            fileName: l.fileName
          }))
          .sort((a, b) => a.start.localeCompare(b.start));

        if (validLogs.length === 0) {
          return { status: 'NO_LOGS', gaps: [], coveredRanges: [] };
        }

        const addDays = (dStr, days) => {
          const d = new Date(dStr);
          d.setDate(d.getDate() + days);
          return d.toISOString().split('T')[0];
        };
        const diffDays = (d1Str, d2Str) => {
          const d1 = new Date(d1Str);
          const d2 = new Date(d2Str);
          return Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
        };

        const merged = [];
        let cur = { ...validLogs[0] };

        for (let i = 1; i < validLogs.length; i++) {
          const next = validLogs[i];
          const dayAfterCurEnd = addDays(cur.end, 1);
          if (next.start <= dayAfterCurEnd) {
            if (next.end > cur.end) cur.end = next.end;
          } else {
            merged.push(cur);
            cur = { ...next };
          }
        }
        merged.push(cur);

        const gaps = [];
        for (let i = 0; i < merged.length - 1; i++) {
          const gapStart = addDays(merged[i].end, 1);
          const gapEnd = addDays(merged[i + 1].start, -1);
          const missingDays = diffDays(gapStart, gapEnd) + 1;
          if (missingDays > 0) {
            gaps.push({ start: gapStart, end: gapEnd, days: missingDays, isRecent: false });
          }
        }

        const todayStr = new Date().toISOString().split('T')[0];
        const lastMerged = merged[merged.length - 1];
        if (lastMerged && lastMerged.end < todayStr) {
          const recentGapStart = addDays(lastMerged.end, 1);
          const recentMissingDays = diffDays(recentGapStart, todayStr);
          if (recentMissingDays >= 3) {
            gaps.push({ start: recentGapStart, end: todayStr, days: recentMissingDays, isRecent: true });
          }
        }

        return {
          status: gaps.length > 0 ? 'GAPS_FOUND' : 'COVERED',
          gaps,
          coveredRanges: merged
        };
      }, [fuelStatementLogs]);

      // Confirm & Ingest Action
      const handleConfirmIngest = () => {
        const readyItems = parsedData.items.filter(i => i.status === 'READY');
        if (readyItems.length === 0) {
          notify('No ready transactions to import');
          return;
        }

        const statementId = `stmt-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
        const newExpenseIds = [];

        const newExpenses = readyItems.map(item => {
          const expId = `exp-${Date.now()}-${Math.floor(Math.random() * 1000000)}`;
          newExpenseIds.push(expId);
          return {
            id: expId,
            profileId: activeProfile?.id || 'prof-default',
            truckId: item.matchedTruck.id,
            tripId: item.linkedTrip ? item.linkedTrip.id : undefined,
            date: item.parsedDate,
            category: 'DIESEL',
            amount: item.parsedAmount,
            paymentMethod: 'Fuel Card (Statement)',
            isReimbursable: false,
            notes: `Fuel Statement Import - ${item.station ? item.station + ', ' : ''}${item.city ? item.city + ' | ' : ''}${item.litres ? item.litres + ' Ltrs @ ₹' + item.rate + '/L | ' : ''}[txn:${item.txnId || 'N/A'}] [stmt:${statementId}]`
          };
        });

        addExpensesBatch(newExpenses);

        addFuelStatementLog({
          id: statementId,
          fileName: fileName || 'Statement.xlsx',
          periodStart: parsedData.summary.periodStart || new Date().toISOString().split('T')[0],
          periodEnd: parsedData.summary.periodEnd || new Date().toISOString().split('T')[0],
          totalRows: parsedData.summary.totalRows,
          importedCount: readyItems.length,
          skippedDuplicates: parsedData.summary.duplicateCount,
          totalAmount: parsedData.summary.totalReadyAmt,
          expenseIds: newExpenseIds
        });

        setImportSuccess({
          fileName,
          importedCount: readyItems.length,
          skippedDuplicates: parsedData.summary.duplicateCount,
          totalAmount: parsedData.summary.totalReadyAmt,
          periodStart: parsedData.summary.periodStart,
          periodEnd: parsedData.summary.periodEnd
        });

        notify(`🎉 Ingested ${readyItems.length} fuel transactions totaling ${formatCurr(parsedData.summary.totalReadyAmt)}!`);
        setRawRows([]);
        setFileName('');
      };

      // Rollback & Delete Statement & Associated Expenses
      const handleDeleteLog = (log) => {
        const count = log.importedCount || (log.expenseIds ? log.expenseIds.length : 0);
        const choice = window.confirm(
          `Delete Statement "${log.fileName}"?\n\n` +
          `Do you want to REMOVE all ${count} imported fuel expense transactions from your ledger/reports?\n\n` +
          `• Click OK to completely ROLLBACK & DELETE both the log entry AND all its transactions.\n` +
          `• Click Cancel to keep everything.`
        );
        if (!choice) return;

        let idsToDelete = Array.isArray(log.expenseIds) && log.expenseIds.length > 0 ? [...log.expenseIds] : [];

        // Also check by [stmt:id], statementId, or period match in ledger
        const matchingByStmt = expenses.filter(e => {
          if (e.notes && e.notes.includes(`[stmt:${log.id}]`)) return true;
          if (idsToDelete.includes(e.id)) return true;
          if (e.statementId && e.statementId === log.id) return true;
          if (e.category === 'DIESEL' && (e.paymentMethod === 'Fuel Card (Statement)' || (e.notes && (e.notes.includes('Fuel Statement') || e.notes.includes('[txn:'))))) {
            if (log.periodStart && log.periodEnd && e.date >= log.periodStart && e.date <= log.periodEnd) return true;
          }
          return false;
        }).map(e => e.id);

        const allIds = Array.from(new Set([...idsToDelete, ...matchingByStmt]));

        if (allIds.length > 0) {
          deleteExpensesBatch(allIds);
        }
        deleteFuelStatementLog(log.id);
        notify(`Statement and ${allIds.length} fuel transactions were deleted from your ledger.`);
      };

      // Find all statement fuel expenses currently recorded in the active ledger
      const statementExpensesInLedger = useMemo(() => {
        return (expenses || []).filter(e => {
          return e.paymentMethod === 'Fuel Card (Statement)' ||
            (e.notes && (e.notes.includes('Fuel Statement') || e.notes.includes('[stmt:')));
        });
      }, [expenses]);

      const handleClearStaged = () => {
        setRawRows([]);
        setFileName('');
        setImportSuccess(null);
      };

      return (
        <div className="space-y-6 max-w-5xl mx-auto">
          {/* 1. AUTOMATIC DATE GAP DETECTION BANNER */}
          {gapAnalysis.status === 'GAPS_FOUND' && (
            <div className="bg-amber-500/10 border-2 border-amber-500/40 rounded-2xl p-5 shadow-xl animate-fadeIn">
              <div className="flex items-start gap-3">
                <span className="text-2xl">⚠️</span>
                <div className="flex-1 space-y-2">
                  <div className="flex items-center justify-between">
                    <h4 className="text-sm font-bold text-amber-300 uppercase tracking-wide">
                      Automatic Date Gap Detection: Missing Statement Periods
                    </h4>
                    <span className="text-[11px] bg-amber-500/20 text-amber-300 font-bold px-2.5 py-0.5 rounded-full border border-amber-500/30">
                      {gapAnalysis.gaps.length} {gapAnalysis.gaps.length === 1 ? 'Date Gap' : 'Date Gaps'} Found
                    </span>
                  </div>
                  <p className="text-xs text-slate-300 leading-relaxed">
                    The following date ranges are missing between your uploaded fuel statements. Diesel expenses for trips conducted on these dates may not be accounted for:
                  </p>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                    {gapAnalysis.gaps.map((gap, gIdx) => (
                      <div key={gIdx} className="bg-slate-900/80 border border-amber-500/30 rounded-xl p-2.5 flex items-center justify-between">
                        <div>
                          <div className="text-xs font-mono font-bold text-white">
                            📅 {formatDate(gap.start)} to {formatDate(gap.end)}
                          </div>
                          <div className="text-[10px] text-amber-400 font-medium">
                            {gap.isRecent ? 'Recent Period (Pending Statement)' : 'Uncovered Historical Gap'}
                          </div>
                        </div>
                        <span className="text-xs font-bold text-amber-300 bg-amber-950/60 border border-amber-800/60 px-2 py-1 rounded-lg">
                          {gap.days} {gap.days === 1 ? 'day' : 'days'}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {gapAnalysis.status === 'COVERED' && (
            <div className="bg-emerald-500/10 border border-emerald-500/30 rounded-2xl p-4 flex items-center justify-between shadow-md">
              <div className="flex items-center gap-3">
                <span className="text-xl">✅</span>
                <div>
                  <h4 className="text-xs font-bold text-emerald-300">Continuous Statement Coverage Active</h4>
                  <p className="text-[11px] text-slate-300">
                    No missing date gaps detected across your {fuelStatementLogs.length} uploaded statements ({formatDate(gapAnalysis.coveredRanges[0]?.start)} to {formatDate(gapAnalysis.coveredRanges[gapAnalysis.coveredRanges.length - 1]?.end)}).
                  </p>
                </div>
              </div>
              <span className="text-[10px] bg-emerald-500/20 text-emerald-400 font-mono font-bold px-3 py-1 rounded-full border border-emerald-500/30">
                100% Reconciled
              </span>
            </div>
          )}

          {gapAnalysis.status === 'NO_LOGS' && (
            <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 flex items-center gap-3 text-xs text-slate-400">
              <span className="text-xl">ℹ️</span>
              <div>
                <span className="font-bold text-slate-200">Date Gap Tracking Ready:</span> Upload your first fuel statement (Excel or CSV) below. Antigravity will automatically record covered date ranges and notify you if any future days or weeks are missed.
              </div>
            </div>
          )}

          {/* SUCCESS BANNER AFTER IMPORT */}
          {importSuccess && (
            <div className="bg-emerald-500/15 border-2 border-emerald-500/50 rounded-2xl p-5 shadow-2xl animate-fadeIn space-y-3">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <span className="text-3xl">🎉</span>
                  <div>
                    <h3 className="text-base font-bold text-emerald-300">Statement Ingestion Complete!</h3>
                    <p className="text-xs text-slate-300">
                      Successfully imported <strong className="text-white">{importSuccess.importedCount} transactions</strong> ({formatCurr(importSuccess.totalAmount)}) covering {formatDate(importSuccess.periodStart)} to {formatDate(importSuccess.periodEnd)}.
                    </p>
                  </div>
                </div>
                <button onClick={() => setImportSuccess(null)} className="text-slate-400 hover:text-white text-xs px-2 py-1">✕ Close</button>
              </div>
              {importSuccess.skippedDuplicates > 0 && (
                <div className="bg-slate-950/60 border border-slate-800 rounded-xl p-3 text-xs text-amber-300 flex items-center gap-2">
                  <span>🛡️</span>
                  <span><strong>{importSuccess.skippedDuplicates} duplicate records</strong> already existed in your accounts and were safely skipped.</span>
                </div>
              )}
            </div>
          )}

          {/* 2. FILE UPLOAD DROPZONE */}
          {rawRows.length === 0 ? (
            <div
              onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
              onDragLeave={() => setIsDragging(false)}
              onDrop={(e) => {
                e.preventDefault();
                setIsDragging(false);
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                  handleFileSelected(e.dataTransfer.files[0]);
                }
              }}
