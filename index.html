                        <td className="py-3 px-3 text-right font-mono font-bold text-emerald-400">{formatCurr(t.tdsAmount)}</td>
                        <td className="py-3 px-3 text-right font-mono text-blue-300">{formatCurr(t.netRent)}</td>
                        <td className="py-3 px-3 text-center font-mono text-[11px] text-slate-400">{t.id}</td>
                      </tr>
                    );
                  })
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- TAB 6: UNIVERSAL DATA ENTRY LEDGER (VIEW, EDIT & DELETE) (NEW) ---
    function UniversalLedgerTab() {
      const {
        filteredTrips, filteredExpenses, filteredDriverPayments, filteredSettlements,
        trucks, companies, drivers, deleteTrip, deleteTruckExpense, deleteDriverPayment, deleteSettlement
      } = useFleet();

      const [typeFilter, setTypeFilter] = useState('ALL');
      const [searchTerm, setSearchTerm] = useState('');
      const [editTarget, setEditTarget] = useState(null);

      const unified = useMemo(() => {
        const list = [];
        filteredTrips.forEach(t => {
          list.push({
            id: t.id, type: 'TRIP', date: t.date, entity: t.companyName,
            title: `Trip: ${t.route}`, amount: t.totalRent,
            details: `Net: ${formatCurr(t.netRent)} | 15% Comm: ${formatCurr(t.driverCommission)} | Due: ${formatCurr(t.balancePending)}`,
            rawObj: t
          });
        });
        filteredExpenses.forEach(e => {
          const trk = trucks.find(x => x.id === e.truckId);
          list.push({
            id: e.id, type: 'EXPENSE', date: e.date, entity: trk ? trk.registrationNumber : e.truckId,
            title: `Expense: ${e.category}`, amount: e.amount,
            details: `${e.paymentMethod} • ${e.notes || ''}`,
            rawObj: e
          });
        });
        filteredDriverPayments.forEach(p => {
          list.push({
            id: p.id, type: 'DRIVER_PAY', date: p.date, entity: p.driverName,
            title: p.type === 'SALARY_PAYOUT' ? 'Advance Payout' : 'Expense Claim',
            amount: p.amount, details: p.description,
            rawObj: p
          });
        });
        filteredSettlements.forEach(s => {
          list.push({
            id: s.id, type: 'SETTLEMENT', date: s.date, entity: s.companyName,
            title: `Settlement (${s.paymentMethod})`, amount: s.amount, details: s.referenceNumber || s.notes || '',
            rawObj: s
          });
        });
        return list.sort((a, b) => b.date.localeCompare(a.date));
      }, [filteredTrips, filteredExpenses, filteredDriverPayments, filteredSettlements, trucks]);

      const filtered = unified.filter(item => {
        if (typeFilter !== 'ALL' && item.type !== typeFilter) return false;
        if (searchTerm.trim()) {
          const q = searchTerm.toLowerCase();
          return item.entity.toLowerCase().includes(q) || item.title.toLowerCase().includes(q) || item.details.toLowerCase().includes(q);
        }
        return true;
      });

      const handleDelete = (item) => {
        if (!confirm(`Delete this ${item.type} record permanently? All ledgers will re-calculate.`)) return;
        if (item.type === 'TRIP') deleteTrip(item.id);
        else if (item.type === 'EXPENSE') deleteTruckExpense(item.id);
        else if (item.type === 'DRIVER_PAY') deleteDriverPayment(item.id);
        else if (item.type === 'SETTLEMENT') deleteSettlement(item.id);
      };

      return (
        <div className="space-y-6">
          <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg flex flex-wrap justify-between items-center gap-4">
            <div>
              <h2 className="text-lg font-bold text-white flex items-center gap-2">
                <span>📚</span> Universal Data Entry Ledger
              </h2>
              <p className="text-xs text-slate-400">Master chronological log with search, filter, and Delete/Edit actions</p>
            </div>
            <div className="flex items-center gap-3">
              <select value={typeFilter} onChange={(e) => setTypeFilter(e.target.value)} className="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                <option value="ALL">All Types</option>
                <option value="TRIP">Trips</option>
                <option value="EXPENSE">Expenses</option>
                <option value="DRIVER_PAY">Driver Payouts</option>
                <option value="SETTLEMENT">Settlements</option>
              </select>
              <input
                type="text"
                placeholder="Search..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                className="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
              />
            </div>
          </div>

          <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg overflow-x-auto">
            <table className="w-full text-left text-xs text-slate-300">
              <thead className="bg-slate-800/80 text-[10px] uppercase text-slate-400">
                <tr>
                  <th className="py-2.5 px-3">Date</th>
                  <th className="py-2.5 px-3">Type</th>
                  <th className="py-2.5 px-3">Entity</th>
                  <th className="py-2.5 px-3">Description</th>
                  <th className="py-2.5 px-3">Accounting Details</th>
                  <th className="py-2.5 px-3 text-right">Amount</th>
                  <th className="py-2.5 px-3 text-center">Action</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-800">
                {filtered.map(item => (
                  <tr key={`${item.type}-${item.id}`} className="hover:bg-slate-800/40">
                    <td className="py-3 px-3 font-mono text-slate-400 whitespace-nowrap">{item.date}</td>
                    <td className="py-3 px-3">
                      <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-800 text-slate-300">{item.type}</span>
                    </td>
                    <td className="py-3 px-3 font-semibold text-white">{item.entity}</td>
                    <td className="py-3 px-3 text-slate-200">{item.title}</td>
                    <td className="py-3 px-3 text-slate-400 text-[11px]">{item.details}</td>
                    <td className="py-3 px-3 text-right font-mono font-bold text-white">{formatCurr(item.amount)}</td>
                    <td className="py-3 px-3 text-center whitespace-nowrap">
                      <div className="flex items-center justify-center gap-1.5">
                        <button onClick={() => setEditTarget({ type: item.type, data: item.rawObj })} className="p-1 px-2.5 rounded bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-300 text-[11px] font-bold">
                          Edit
                        </button>
                        <button onClick={() => handleDelete(item)} className="p-1 px-2.5 rounded bg-rose-900/40 hover:bg-rose-600 text-rose-300 hover:text-white text-[11px] font-bold">
                          Delete
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {editTarget && <EditRecordModal target={editTarget} onClose={() => setEditTarget(null)} />}
        </div>
      );
    }

    // --- TAB 7: DATA ENTRY PORTAL (WITH FROM/TO, DROPS, COMMISSION, TDS) ---
    function DataEntryTab() {
      const { trucks, companies, drivers, trips, addTrip, addTruckExpense, addDriverPayment, addTruck, addCompany, addDriver, activeRules } = useFleet();
      const [formType, setFormType] = useState('trip');
      const [msg, setMsg] = useState(null);

      const notify = (m) => { setMsg(m); setTimeout(() => setMsg(null), 4000); };

      // Trip Form
      const [tDate, setTDate] = useState(new Date().toISOString().split('T')[0]);
      const [tTruck, setTTruck] = useState(trucks[0]?.id || '');
      const [tComp, setTComp] = useState(companies[0]?.name || '');
      const [tDriver, setTDriver] = useState(drivers[0]?.name || '');
      const [fromLoc, setFromLoc] = useState('');
      const [toLoc, setToLoc] = useState('');
      const [drops, setDrops] = useState([]);
      const [tRent, setTRent] = useState('');
      const [tComm, setTComm] = useState('0');
      const [isTds, setIsTds] = useState(true);
      const [tAdv, setTAdv] = useState('');
      const [tNotes, setTNotes] = useState('');

      const handleAddDrop = () => setDrops([...drops, '']);
      const handleUpdateDrop = (i, val) => { const n = [...drops]; n[i] = val; setDrops(n); };
      const handleRemoveDrop = (i) => setDrops(drops.filter((_, idx) => idx !== i));

      const grossNum = parseFloat(tRent) || 0;
      const commNum = parseFloat(tComm) || 0;
      const advNum = parseFloat(tAdv) || 0;
      const defaultTdsRate = (activeRules && activeRules.defaultTdsPercent !== undefined) ? activeRules.defaultTdsPercent : 1;
      const defaultDrvRate = (activeRules && activeRules.defaultDriverSalaryPercent !== undefined) ? activeRules.defaultDriverSalaryPercent : 15;
      const tdsAmt = isTds ? (grossNum * (defaultTdsRate / 100)) : 0;
      const netRent = Math.max(0, grossNum - tdsAmt - commNum);
      const driver15 = netRent * (defaultDrvRate / 100);
      const balancePending = Math.max(0, grossNum - advNum - commNum - tdsAmt);

      const handleTripSubmit = (e) => {
        e.preventDefault();
        if (grossNum <= 0) return alert('Rent must be greater than 0');
        if (!tComp) return alert('Please select a client company from Master');
        if (!tDriver) return alert('Please select a driver from Master');
        if (!fromLoc.trim() || !toLoc.trim()) return alert('From and To locations are required');

        addTrip({
          date: tDate, truckId: tTruck, companyName: tComp, driverName: tDriver,
          fromLocation: fromLoc, toLocation: toLoc, additionalDrops: drops.filter(Boolean),
          totalRent: grossNum, commissionAmount: commNum, isTdsDeducted: isTds, advanceReceived: advNum, notes: tNotes
        });

        notify(`Trip saved! Net Rent: ${formatCurr(netRent)}, 15% Driver Salary: ${formatCurr(driver15)}, Company Balance Due: ${formatCurr(balancePending)}`);
        setTRent(''); setTComm('0'); setTAdv(''); setFromLoc(''); setToLoc(''); setDrops([]); setTNotes('');
      };

      // Expense
      const [eDate, setEDate] = useState(new Date().toISOString().split('T')[0]);
      const [eTruck, setETruck] = useState(trucks[0]?.id || '');
      const [eTripId, setETripId] = useState('');
      const [eCat, setECat] = useState('DIESEL');
      const [eAmt, setEAmt] = useState('');
      const [eMethod, setEMethod] = useState('Fleet Card');
      const [eNotes, setENotes] = useState('');
      const [eReimbursable, setEReimbursable] = useState(false);

      const filteredTripsForExpenseTruck = (trips || []).filter(t => t.truckId === eTruck);

      const handleExpenseSubmit = (e) => {
        e.preventDefault();
        const amt = parseFloat(eAmt);
        if (!amt || amt <= 0) return alert('Enter valid amount');
        addTruckExpense({
          date: eDate,
          truckId: eTruck,
          tripId: eTripId || undefined,
          category: eCat,
          amount: amt,
          paymentMethod: eMethod,
          notes: eNotes,
          isReimbursable: eReimbursable
        });
        notify(`Logged ${formatCurr(amt)} expense under ${eCat}${eTripId ? ' (linked to trip)' : ''}${eReimbursable ? ' [Reimbursable - added to Company Balance Due]' : ''}`);
        setEAmt(''); setENotes(''); setETripId(''); setEReimbursable(false);
      };

      // Driver
      const [dpDate, setDpDate] = useState(new Date().toISOString().split('T')[0]);
      const [dpDriver, setDpDriver] = useState(drivers[0]?.name || '');
      const [dpType, setDpType] = useState('SALARY_PAYOUT');
      const [dpAmt, setDpAmt] = useState('');
      const [dpMethod, setDpMethod] = useState('Cash');
      const [dpDesc, setDpDesc] = useState('');

      const handleDriverSubmit = (e) => {
        e.preventDefault();
        const amt = parseFloat(dpAmt);
        if (!amt || amt <= 0) return alert('Enter valid amount');
        if (!dpDriver) return alert('Please select a driver from Master');
        if (!dpDesc.trim()) return alert('Enter description');
        addDriverPayment({ date: dpDate, driverName: dpDriver, type: dpType, amount: amt, paymentMethod: dpMethod, description: dpDesc });
        notify(`Driver ${dpType === 'SALARY_PAYOUT' ? 'cash advance' : 'expense claim'} recorded`);
        setDpAmt(''); setDpDesc('');
      };

      return (
        <div className="space-y-6">
          {msg && <div className="p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold animate-fadeIn">✅ {msg}</div>}

          <div className="flex flex-wrap gap-2 border-b border-slate-800 pb-3">
            {[
              { id: 'trip', label: '1. Trip & Freight Entry' },
              { id: 'expense', label: '2. Truck Expense Entry' },
              { id: 'driver', label: '3. Driver Payout & Claims' },
            ].map(f => (
              <button
                key={f.id}
                onClick={() => setFormType(f.id)}
                className={`px-4 py-2.5 rounded-xl text-xs font-bold transition ${formType === f.id ? 'bg-amber-500 text-slate-950 shadow-md' : 'bg-slate-800 text-slate-300'}`}
              >
                {f.label}
              </button>
            ))}
          </div>

          {formType === 'trip' && (
            <form onSubmit={handleTripSubmit} className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl max-w-4xl mx-auto space-y-4">
              <h3 className="text-base font-bold text-white mb-2">New Trip Freight Entry</h3>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Date *</label>
                  <input type="date" required value={tDate} onChange={(e) => setTDate(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white [color-scheme:dark]" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Truck (Master) *</label>
                  <select value={tTruck} onChange={(e) => setTTruck(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-mono">
                    {trucks.map(t => <option key={t.id} value={t.id}>{t.registrationNumber} - {t.model}</option>)}
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Client Company (Master Dropdown) *</label>
                  <select required value={tComp} onChange={(e) => setTComp(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                    <option value="">-- Select Client Company --</option>
                    {companies.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                  </select>
                  {companies.length === 0 && <span className="text-[11px] text-amber-400 mt-1 block">Please add companies in Masters first</span>}
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Driver Assigned (Master Dropdown) *</label>
                  <select required value={tDriver} onChange={(e) => setTDriver(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                    <option value="">-- Select Assigned Driver --</option>
                    {drivers.map(d => <option key={d.id} value={d.name}>{d.name}</option>)}
                  </select>
                  {drivers.length === 0 && <span className="text-[11px] text-amber-400 mt-1 block">Please add drivers in Masters first</span>}
                </div>
              </div>

              {/* Dynamic Route Fields */}
              <div className="bg-slate-950/60 border border-slate-800 rounded-xl p-3.5 space-y-2.5">
                <div className="flex justify-between items-center">
                  <span className="text-xs font-bold text-amber-400">Route & Drops</span>
                  <button type="button" onClick={handleAddDrop} className="text-xs text-amber-400 hover:underline">+ Add Destination Drop (+)</button>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[11px] text-slate-400 mb-1">From (Origin) *</label>
                    <input type="text" required placeholder="Origin (e.g. Mumbai)" value={fromLoc} onChange={(e) => setFromLoc(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white" />
                  </div>
                  <div>
                    <label className="block text-[11px] text-slate-400 mb-1">To (Primary Destination) *</label>
                    <input type="text" required placeholder="Destination (e.g. Solapur)" value={toLoc} onChange={(e) => setToLoc(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white" />
                  </div>
                </div>
                {drops.map((d, i) => (
                  <div key={i} className="flex items-center gap-2">
                    <input type="text" placeholder={`Drop #${i + 1}`} value={d} onChange={(e) => handleUpdateDrop(i, e.target.value)} className="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white" />
                    <button type="button" onClick={() => handleRemoveDrop(i)} className="text-rose-400 text-xs px-2">✕</button>
                  </div>
                ))}
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Agreed Gross Rent (₹) *</label>
                  <input type="number" required min="1" placeholder="50000" value={tRent} onChange={(e) => setTRent(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-mono font-bold" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Commission Amount (₹)</label>
                  <input type="number" min="0" placeholder="0" value={tComm} onChange={(e) => setTComm(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-mono" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Advance Received (₹)</label>
                  <input type="number" min="0" placeholder="20000" value={tAdv} onChange={(e) => setTAdv(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-mono" />
                </div>
              </div>

              <div className="flex items-center gap-2 bg-slate-800/60 p-3 rounded-xl border border-slate-700">
                <input type="checkbox" id="tds" checked={isTds} onChange={(e) => setIsTds(e.target.checked)} className="rounded text-amber-500" />
                <label htmlFor="tds" className="text-xs text-white font-medium cursor-pointer">
                  TDS Deducted (1% withheld at source by client)
                </label>
              </div>

              {/* Calculations Preview */}
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3 bg-slate-950/70 border border-slate-800 rounded-xl p-4">
                <div className="bg-blue-500/10 border border-blue-500/20 p-2.5 rounded-lg">
                  <span className="text-[10px] uppercase font-bold text-blue-300">Net Rent</span>
                  <div className="text-base font-bold font-mono text-blue-400 mt-0.5">{formatCurr(netRent)}</div>
                </div>
                <div className="bg-purple-500/10 border border-purple-500/20 p-2.5 rounded-lg">
                  <span className="text-[10px] uppercase font-bold text-purple-300">Driver 15% Salary</span>
                  <div className="text-base font-bold font-mono text-purple-300 mt-0.5">{formatCurr(driver15)}</div>
                </div>
                <div className="bg-amber-500/10 border border-amber-500/20 p-2.5 rounded-lg">
                  <span className="text-[10px] uppercase font-bold text-amber-300">Company Due (Gross - Adv - Comm - TDS)</span>
                  <div className="text-base font-bold font-mono text-amber-400 mt-0.5">{formatCurr(balancePending)}</div>
                </div>
                <div className="bg-emerald-500/10 border border-emerald-500/20 p-2.5 rounded-lg">
                  <span className="text-[10px] uppercase font-bold text-emerald-300">1% TDS Amount</span>
                  <div className="text-base font-bold font-mono text-emerald-400 mt-0.5">{formatCurr(tdsAmt)}</div>
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-300 mb-1">Notes / Remarks</label>
                <input type="text" placeholder="Remarks..." value={tNotes} onChange={(e) => setTNotes(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
              </div>

              <div className="flex justify-end pt-2">
                <button type="submit" className="px-6 py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs shadow-lg">
                  Save Trip & Update Accounting
                </button>
              </div>
            </form>
          )}

          {formType === 'expense' && (
            <form onSubmit={handleExpenseSubmit} className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl max-w-3xl mx-auto space-y-4">
              <h3 className="text-base font-bold text-white mb-2">Truck Operating Expense Entry</h3>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Date *</label>
                  <input type="date" required value={eDate} onChange={(e) => setEDate(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white [color-scheme:dark]" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Truck (Master) *</label>
                  <select value={eTruck} onChange={(e) => { setETruck(e.target.value); setETripId(''); }} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-mono">
                    {trucks.map(t => <option key={t.id} value={t.id}>{t.registrationNumber} - {t.model}</option>)}
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-300 mb-1">
                  Link to Specific Trip (Optional - Deducts from Trip Profit)
                </label>
                <select
                  value={eTripId}
                  onChange={(e) => setETripId(e.target.value)}
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white"
                >
                  <option value="">-- General Truck Operating Expense (Unlinked) --</option>
                  {filteredTripsForExpenseTruck.map(tr => (
                    <option key={tr.id} value={tr.id}>
                      {tr.date} | {tr.route} (Rent: {formatCurr(tr.totalRent)})
                    </option>
                  ))}
                </select>
                <p className="text-[11px] text-slate-400 mt-1">
                  Shows only trips registered for the selected truck. Linking directly reduces that trip's net profitability.
                </p>
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Category *</label>
                  <select value={eCat} onChange={(e) => setECat(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                    <option value="DIESEL">⛽ Diesel / Fuel</option>
                    <option value="MAINTENANCE">🔧 Maintenance & Repairs</option>
                    <option value="TOLL">🛣️ Toll & FASTag</option>
                    <option value="INSURANCE">🛡️ Insurance Premium</option>
                    <option value="PERMITS">📑 State Permits</option>
                    <option value="SPARE_PARTS">⚙️ Spare Parts & Tires</option>
                    <option value="OTHER">📦 Other Sundry</option>

                </div>

              </div>

              <div className="flex justify-end pt-2">
                <button type="submit" className="px-6 py-3 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl text-xs shadow-lg">Save Expense</button>
              </div>
            </form>
          )}

          {formType === 'driver' && (
            <form onSubmit={handleDriverSubmit} className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl max-w-3xl mx-auto space-y-4">
              <h3 className="text-base font-bold text-white mb-2">Driver Cash Payout & Roadside Claims</h3>
              <div className="grid grid-cols-2 gap-2">
                <button type="button" onClick={() => setDpType('SALARY_PAYOUT')} className={`p-3 rounded-xl border text-xs font-bold ${dpType === 'SALARY_PAYOUT' ? 'border-purple-500 bg-purple-500/10 text-purple-300' : 'border-slate-700 bg-slate-800 text-slate-400'}`}>
                  💰 Advance Payout Paid
                </button>
                <button type="button" onClick={() => setDpType('DRIVER_EXPENSE')} className={`p-3 rounded-xl border text-xs font-bold ${dpType === 'DRIVER_EXPENSE' ? 'border-blue-500 bg-blue-500/10 text-blue-300' : 'border-slate-700 bg-slate-800 text-slate-400'}`}>
                  🧾 Driver Expense Claim
                </button>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Date *</label>
                  <input type="date" required value={dpDate} onChange={(e) => setDpDate(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white [color-scheme:dark]" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Driver (Master Dropdown) *</label>
                  <select required value={dpDriver} onChange={(e) => setDpDriver(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                    <option value="">-- Select Driver --</option>
                    {drivers.map(d => <option key={d.id} value={d.name}>{d.name}</option>)}
                  </select>
                  {drivers.length === 0 && <span className="text-[11px] text-amber-400 mt-1 block">Please add drivers in Masters first</span>}
                </div>
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-300 mb-1">Amount (₹) *</label>
                <input type="number" required min="1" placeholder="0.00" value={dpAmt} onChange={(e) => setDpAmt(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-mono" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-300 mb-1">Description *</label>
                <input type="text" required placeholder="Description..." value={dpDesc} onChange={(e) => setDpDesc(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
              </div>
              <div className="flex justify-end pt-2">
                <button type="submit" className="px-6 py-3 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl text-xs shadow-lg">Save Transaction</button>
              </div>
            </form>
          )}
        </div>
      );
    }

    // --- TAB 8: MASTER DATA MANAGEMENT (TRUCKS, COMPANIES, DRIVERS, RULES, EMAIL SYNC) ---
    function MastersTab() {
      const {
        trucks, companies, drivers,
        addTruck, updateTruck, deleteTruck,
        addCompany, updateCompany, deleteCompany,
        addDriver, updateDriver, deleteDriver,
        activeRules, updateRules, activeProfile,
        activeEmailConfig, updateEmailSyncConfig, syncExpensesFromEmails
      } = useFleet();

      const [subTab, setSubTab] = useState('trucks');
      const [searchQuery, setSearchQuery] = useState('');

      // Email Sync State
      const [syncEmail, setSyncEmail] = useState(activeEmailConfig?.linkedEmail || '');
      const [syncTollEnabled, setSyncTollEnabled] = useState(activeEmailConfig?.tollEnabled ?? true);
      const [syncTollSubject, setSyncTollSubject] = useState(activeEmailConfig?.tollSubjectFilter || 'FASTag Toll Debit Alert');
      const [syncFuelEnabled, setSyncFuelEnabled] = useState(activeEmailConfig?.fuelEnabled ?? true);
      const [syncFuelSubject, setSyncFuelSubject] = useState(activeEmailConfig?.fuelSubjectFilter || 'Fuel Transaction Alert');
      const [emailSyncSaved, setEmailSyncSaved] = useState(false);
      const [syncStatusMsg, setSyncStatusMsg] = useState(null);

      // Keep sync state synced when active profile changes
      useEffect(() => {
        if (activeEmailConfig) {
          setSyncEmail(activeEmailConfig.linkedEmail || '');
          setSyncTollEnabled(activeEmailConfig.tollEnabled ?? true);
          setSyncTollSubject(activeEmailConfig.tollSubjectFilter || 'FASTag Toll Debit Alert');
          setSyncFuelEnabled(activeEmailConfig.fuelEnabled ?? true);
          setSyncFuelSubject(activeEmailConfig.fuelSubjectFilter || 'Fuel Transaction Alert');
        }
      }, [activeEmailConfig]);

      // Truck Modal State
      const [truckModalOpen, setTruckModalOpen] = useState(false);
      const [editingTruck, setEditingTruck] = useState(null);
      const [trkReg, setTrkReg] = useState('');
      const [trkModel, setTrkModel] = useState('');
      const [trkCapacity, setTrkCapacity] = useState('25 Ton');
      const [trkDate, setTrkDate] = useState('');
      const [trkStatus, setTrkStatus] = useState('ACTIVE');
      const [trkNotes, setTrkNotes] = useState('');

      // Company Modal State
      const [compModalOpen, setCompModalOpen] = useState(false);
      const [editingComp, setEditingComp] = useState(null);
      const [cmpName, setCmpName] = useState('');
      const [cmpContact, setCmpContact] = useState('');
      const [cmpPhone, setCmpPhone] = useState('');
      const [cmpEmail, setCmpEmail] = useState('');
      const [cmpGstin, setCmpGstin] = useState('');

      // Driver Modal State
      const [drvModalOpen, setDrvModalOpen] = useState(false);
      const [editingDrv, setEditingDrv] = useState(null);
      const [dName, setDName] = useState('');
      const [dPhone, setDPhone] = useState('');
      const [dLicense, setDLicense] = useState('');
      const [dJoining, setDJoining] = useState('');
      const [dStatus, setDStatus] = useState('ACTIVE');

      // Rules State
      const currentSalaryPct = (activeRules && activeRules.defaultDriverSalaryPercent !== undefined) ? activeRules.defaultDriverSalaryPercent : 15;
      const currentTdsPct = (activeRules && activeRules.defaultTdsPercent !== undefined) ? activeRules.defaultTdsPercent : 1;
      const [driverSalaryPct, setDriverSalaryPct] = useState(currentSalaryPct.toString());
      const [tdsPct, setTdsPct] = useState(currentTdsPct.toString());
      const [rulesSaved, setRulesSaved] = useState(false);

      // Open Modal Helpers
      const openTruckModal = (t = null) => {
        setEditingTruck(t);
        setTrkReg(t ? t.registrationNumber : '');
        setTrkModel(t ? t.model : '');
        setTrkCapacity(t ? (t.capacity || '25 Ton') : '25 Ton');
        setTrkDate(t ? (t.registrationDate || '') : new Date().toISOString().split('T')[0]);
        setTrkStatus(t ? (t.status || 'ACTIVE') : 'ACTIVE');
        setTrkNotes(t ? (t.notes || '') : '');
        setTruckModalOpen(true);
      };

      const handleSaveTruck = (e) => {
        e.preventDefault();
        if (!trkReg.trim()) return alert('Registration number is required');
        if (!trkModel.trim()) return alert('Model is required');
        const payload = {
          registrationNumber: trkReg.trim().toUpperCase(),
          model: trkModel.trim(),
          capacity: trkCapacity.trim(),
          registrationDate: trkDate,
          status: trkStatus,
          notes: trkNotes.trim()
        };
        if (editingTruck) {
          updateTruck(editingTruck.id, payload);
        } else {
          addTruck(payload);
        }
        setTruckModalOpen(false);
      };

      const openCompanyModal = (c = null) => {
        setEditingComp(c);
        setCmpName(c ? c.name : '');
        setCmpContact(c ? (c.contactPerson || '') : '');
        setCmpPhone(c ? (c.phone || '') : '');
        setCmpEmail(c ? (c.email || '') : '');
        setCmpGstin(c ? (c.gstin || '') : '');
        setCompModalOpen(true);
      };

      const handleSaveCompany = (e) => {
        e.preventDefault();
        if (!cmpName.trim()) return alert('Company name is required');
        const payload = {
          name: cmpName.trim(),
          contactPerson: cmpContact.trim(),
          phone: cmpPhone.trim(),
          email: cmpEmail.trim(),
          gstin: cmpGstin.trim().toUpperCase()
        };
        if (editingComp) {
          updateCompany(editingComp.id, payload);
        } else {
          addCompany(payload);
        }
        setCompModalOpen(false);
      };

      const openDriverModal = (d = null) => {
        setEditingDrv(d);
        setDName(d ? d.name : '');
        setDPhone(d ? (d.phone || '') : '');
        setDLicense(d ? (d.licenseNumber || '') : '');
        setDJoining(d ? (d.joiningDate || '') : new Date().toISOString().split('T')[0]);
        setDStatus(d ? (d.status || 'ACTIVE') : 'ACTIVE');
        setDrvModalOpen(true);
      };

      const handleSaveDriver = (e) => {
        e.preventDefault();
        if (!dName.trim()) return alert('Driver name is required');
        const payload = {
          name: dName.trim(),
          phone: dPhone.trim(),
          licenseNumber: dLicense.trim().toUpperCase(),
          joiningDate: dJoining,
          status: dStatus
        };
        if (editingDrv) {
          updateDriver(editingDrv.id, payload);
        } else {
          addDriver(payload);
        }
        setDrvModalOpen(false);
      };

      const handleSaveRules = (e) => {
        e.preventDefault();
        const dVal = parseFloat(driverSalaryPct);
        const tVal = parseFloat(tdsPct);
        if (isNaN(dVal) || isNaN(tVal) || dVal < 0 || tVal < 0) return alert('Enter valid percentage');
        updateRules({ defaultDriverSalaryPercent: dVal, defaultTdsPercent: tVal });
        setRulesSaved(true);
        setTimeout(() => setRulesSaved(false), 3000);
      };

      // Filtered views
      const q = searchQuery.toLowerCase();
      const filteredTrucks = trucks.filter(t => (
        t.registrationNumber.toLowerCase().includes(q) ||
        (t.model && t.model.toLowerCase().includes(q)) ||
        (t.notes && t.notes.toLowerCase().includes(q))
      ));
      const filteredCompanies = companies.filter(c => (
        c.name.toLowerCase().includes(q) ||
        (c.contactPerson && c.contactPerson.toLowerCase().includes(q)) ||
        (c.phone && c.phone.toLowerCase().includes(q)) ||
        (c.gstin && c.gstin.toLowerCase().includes(q))
      ));
      const filteredDrivers = drivers.filter(d => (
        d.name.toLowerCase().includes(q) ||
        (d.phone && d.phone.toLowerCase().includes(q)) ||
        (d.licenseNumber && d.licenseNumber.toLowerCase().includes(q))
      ));

      return (
        <div className="space-y-6">
          {/* Header Banner */}
          <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg flex flex-wrap justify-between items-center gap-3">
            <div>
              <h2 className="text-lg font-bold text-white flex items-center gap-2">
                <span>🛡️</span> Centralized Master Data Management
              </h2>
              <p className="text-xs text-slate-400">Maintain trucks, client companies, drivers, and operational rules. Changes cascade immediately across trips and accounts.</p>
            </div>
            <span className="text-xs px-3 py-1.5 rounded-lg bg-amber-500/10 text-amber-400 border border-amber-500/20 font-bold">
              Active Entity: {activeProfile.name}
            </span>
          </div>

          {/* Sub Navigation Bar & Search */}
          <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 bg-slate-900/60 p-2.5 rounded-2xl border border-slate-800">
            <div className="flex items-center gap-2 overflow-x-auto scrollbar-none">
              {[
                { id: 'trucks', label: `Truck Master (${trucks.length})`, icon: '🚛' },
                { id: 'companies', label: `Company Master (${companies.length})`, icon: '🏢' },
                { id: 'drivers', label: `Driver Master (${drivers.length})`, icon: '👨‍✈️' },
                { id: 'rules', label: 'Rules & Formulas', icon: '⚙️' },
                { id: 'email_sync', label: 'Email Expense Sync', icon: '✉️' },
              ].map(st => (
                <button
                  key={st.id}
                  onClick={() => { setSubTab(st.id); setSearchQuery(''); }}
                  className={`flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${
                    subTab === st.id ? 'bg-amber-500 text-slate-950 shadow-md font-extrabold' : 'text-slate-400 hover:text-white hover:bg-slate-800'
                  }`}
                >
                  <span>{st.icon}</span>
                  <span>{st.label}</span>
                </button>
              ))}
            </div>

            {subTab !== 'rules' && subTab !== 'email_sync' && (
              <div className="flex items-center gap-2">
                <input
                  type="text"
                  placeholder={`Search ${subTab}...`}
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500 w-full sm:w-48"
                />
                {subTab === 'trucks' && (
                  <button onClick={() => openTruckModal()} className="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl whitespace-nowrap shadow">
                    + Add Truck
                  </button>
                )}
                {subTab === 'companies' && (
                  <button onClick={() => openCompanyModal()} className="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl whitespace-nowrap shadow">

                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800">
                  {filteredCompanies.length === 0 ? (
                    <tr><td colSpan={6} className="py-8 text-center text-slate-500">No client companies found.</td></tr>

                      <tr key={c.id} className="hover:bg-slate-800/40 transition">

                        <td className="py-3 px-3 text-slate-300">{c.contactPerson || '—'}</td>

                          </div>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>

              </div>
              <table className="w-full text-left text-xs text-slate-300">

                    <th className="py-2.5 px-3">Phone</th>
                    <th className="py-2.5 px-3">License No</th>

    // --- AUTHENTICATION & MULTI-TENANT ACCESS SCREEN ---
    function AuthScreen() {
      const { login, signup } = useFleet();
      const [authMode, setAuthMode] = useState('login'); // 'login' or 'signup'
      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [errorMsg, setErrorMsg] = useState('');
      const [isLoading, setIsLoading] = useState(false);

      // Registration fields
      const [regBusiness, setRegBusiness] = useState('');
      const [regUser, setRegUser] = useState('');
      const [regPass, setRegPass] = useState('');
      const [regEmail, setRegEmail] = useState('');

      const handleLogin = (e) => {
        if (e) e.preventDefault();
        setErrorMsg('');
        setIsLoading(true);
        try {
          login(loginUser, loginPass);
        } catch (err) {
          setErrorMsg(err.message || 'Invalid username or password');
        } finally {
          setIsLoading(false);
        }
      };

      const handleQuickLogin = (uname, pass) => {
        setErrorMsg('');
        setLoginUser(uname);
        setLoginPass(pass);
        try {
          login(uname, pass);
        } catch (err) {
          setErrorMsg(err.message);
        }
      };

      const handleSignup = (e) => {
        e.preventDefault();
        setErrorMsg('');
        if (!regBusiness.trim() || !regUser.trim() || !regPass.trim() || !regEmail.trim()) {
          setErrorMsg('All fields are required to register.');
          return;
        }
        setIsLoading(true);
        try {
          signup(regBusiness, regUser, regPass, regEmail);
        } catch (err) {
          setErrorMsg(err.message || 'Registration failed');
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-center items-center p-4 relative overflow-hidden font-sans">
          {/* Subtle background glow effect */}
          <div className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

          <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative z-10 backdrop-blur-xl">
            {/* Header / Logo */}
            <div className="flex flex-col items-center text-center mb-6">
              <ARLogo className="w-16 h-16 mb-2 drop-shadow-[0_4px_16px_rgba(245,158,11,0.3)]" />
              <div className="flex items-baseline tracking-wider uppercase font-black text-2xl text-white">
                <span className="text-3xl text-amber-400 mr-2 drop-shadow-[0_2px_8px_rgba(245,158,11,0.4)]">AR</span>
                FLEETTRACK
              </div>
              <p className="text-xs text-slate-400 mt-1">Multi-Entity Fleet Expense & Revenue Management System</p>
              <div className="mt-2 inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-slate-800 border border-slate-700 text-[10px] text-amber-400 font-bold uppercase tracking-wider">
                <span>🔒 Isolated Multi-Tenant Workspace</span>
              </div>
            </div>

            {/* Mode Tabs */}
            <div className="grid grid-cols-2 gap-1.5 p-1 bg-slate-950/80 rounded-2xl border border-slate-800 mb-6">
              <button
                type="button"
                onClick={() => { setAuthMode('login'); setErrorMsg(''); }}
                className={`py-2 rounded-xl text-xs font-bold transition ${
                  authMode === 'login'
                    ? 'bg-amber-500 text-slate-950 font-black shadow-md'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                Sign In
              </button>
              <button
                type="button"
                onClick={() => { setAuthMode('signup'); setErrorMsg(''); }}
                className={`py-2 rounded-xl text-xs font-bold transition ${
                  authMode === 'signup'
                    ? 'bg-amber-500 text-slate-950 font-black shadow-md'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                Register Business
              </button>
            </div>

            {/* Error Message */}
            {errorMsg && (
              <div className="mb-4 p-3 rounded-xl bg-rose-950/70 border border-rose-800/80 text-rose-200 text-xs font-semibold animate-fadeIn flex items-center gap-2">
                <span>⚠️</span>
                <span>{errorMsg}</span>
              </div>
            )}

            {/* Login Form */}
            {authMode === 'login' ? (
              <div>
                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1.5">Username</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. apex or kiran"
                      value={loginUser}
                      onChange={(e) => setLoginUser(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500 font-medium"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1.5">Password</label>
                    <input
                      type="password"
                      required
                      placeholder="••••••••"
                      value={loginPass}
                      onChange={(e) => setLoginPass(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500"
                    />
                  </div>
                  <button
                    type="submit"
                    disabled={isLoading}
                    className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs rounded-xl shadow-lg shadow-amber-500/20 transition duration-150 uppercase tracking-wider"
                  >
                    {isLoading ? 'Signing In...' : 'Sign In to Workspace'}
                  </button>
                </form>

                {/* Demo Accounts Quick Login */}
                <div className="mt-6 pt-5 border-t border-slate-800/80">
                  <div className="text-[11px] font-bold text-slate-400 mb-2.5 flex items-center justify-between">
                    <span>⚡ Quick Demo Sign-In:</span>
                    <span className="text-[10px] text-slate-500">1-click isolated switch</span>
                  </div>
                  <div className="grid grid-cols-1 gap-2">
                    <button
                      type="button"
                      onClick={() => handleQuickLogin('apex', 'password123')}
                      className="p-2.5 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/50 text-left transition flex items-center justify-between group"
                    >
                      <div>
                        <div className="text-xs font-bold text-white group-hover:text-amber-400 transition-colors">🏢 Apex Logistics India</div>
                        <div className="text-[10px] font-mono text-slate-400">user: apex &bull; pass: password123</div>
                      </div>
                      <span className="text-xs text-amber-400 opacity-0 group-hover:opacity-100 transition-opacity">Login →</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => handleQuickLogin('kiran', 'password123')}
                      className="p-2.5 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/50 text-left transition flex items-center justify-between group"
                    >
                      <div>
                        <div className="text-xs font-bold text-white group-hover:text-amber-400 transition-colors">🚛 Kiran Roadways Enterprise</div>
                        <div className="text-[10px] font-mono text-slate-400">user: kiran &bull; pass: password123</div>
                      </div>
                      <span className="text-xs text-amber-400 opacity-0 group-hover:opacity-100 transition-opacity">Login →</span>
                    </button>
                  </div>
                </div>
              </div>
            ) : (
              /* Signup Form */
              <form onSubmit={handleSignup} className="space-y-3.5">
                <div>
                  <label className="block text-xs font-bold text-slate-300 mb-1">Business / Company Name *</label>
                  <input
                    type="text"
                    required
                    placeholder="e.g. Sunrise Freight Carriers Ltd"
                    value={regBusiness}
                    onChange={(e) => setRegBusiness(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-amber-500"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-300 mb-1">Admin Username *</label>
                  <input
                    type="text"
                    required
                    placeholder="e.g. sunrise_ops"
                    value={regUser}
                    onChange={(e) => setRegUser(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-amber-500 font-mono"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-300 mb-1">Password *</label>
                  <input
                    type="password"
                    required
                    placeholder="Create a secure password"
                    value={regPass}
                    onChange={(e) => setRegPass(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-amber-500"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-300 mb-1">Business Email ID (For FASTag & Fuel Alerts) *</label>
                  <input
                    type="email"
                    required
                    placeholder="accounts@yourcompany.com"
                    value={regEmail}
                    onChange={(e) => setRegEmail(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-amber-500 font-mono"
                  />
                  <p className="text-[10px] text-slate-400 mt-1">This email will be automatically linked for Email Expense Sync</p>
                </div>
                <button
                  type="submit"
                  disabled={isLoading}
                  className="w-full mt-2 py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs rounded-xl shadow-lg shadow-amber-500/20 transition duration-150 uppercase tracking-wider"
                >
                  {isLoading ? 'Creating Account...' : 'Register & Launch Workspace'}
                </button>
              </form>
            )}
          </div>

          <div className="mt-6 text-center text-xs text-slate-500">
            <span>AR FleetTrack &bull; Multi-Entity Enterprise Fleet Accounting</span>
          </div>
        </div>
      );
    }

                  }`}
                >
                  <span className="text-sm">{t.icon}</span>
                  <span className="truncate">{t.label}</span>
                </button>
              ))}
            </div>

            {/* Tab Views */}
            <div className="animate-fadeIn">
              {activeTab === 'overview' && <OverviewTab setActiveTab={setActiveTab} />}
              {activeTab === 'truck_performance' && <TruckPerformanceTab />}
              {activeTab === 'company_accounts' && <CompanyAccountsTab />}
              {activeTab === 'driver_ledger' && <DriverLedgerTab />}
              {activeTab === 'tds_ledger' && <TdsLedgerTab />}
              {activeTab === 'universal_ledger' && <UniversalLedgerTab />}
              {activeTab === 'data_entry' && <DataEntryTab />}
              {activeTab === 'masters' && <MastersTab />}
            </div>
          </main>

          {/* Profiles Modal */}
          {showProfModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md shadow-2xl p-6">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-white text-base">Entity Profile Management</h3>
                  <button onClick={() => setShowProfModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleAddProfileSubmit} className="flex gap-2 mb-4">
                  <input
                    type="text"
                    required
                    placeholder="New profile name"
                    value={newProfName}
                    onChange={(e) => setNewProfName(e.target.value)}
                    className="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white"
                  />
                  <button type="submit" className="px-3 py-1.5 bg-amber-500 text-slate-950 font-bold rounded-xl text-xs">+ Add</button>
                </form>

                <div className="space-y-2 max-h-60 overflow-y-auto mb-4">
                  {profiles.map(p => (
                    <div key={p.id} className={`p-2.5 rounded-xl border flex justify-between items-center text-xs ${p.id === activeProfileId ? 'border-amber-500 bg-amber-500/10 text-white' : 'border-slate-800 bg-slate-800/50 text-slate-300'}`}>
                      <div className="cursor-pointer" onClick={() => setActiveProfileId(p.id)}>
                        <div className="font-bold">{p.name} {p.id === activeProfileId && '✓ (Active)'}</div>
                      </div>
                      {profiles.length > 1 && (
                        <button onClick={() => deleteProfile(p.id)} className="text-rose-400 hover:text-white text-xs">Delete</button>
                      )}
                    </div>
                  ))}
                </div>

                <div className="flex justify-end">
                  <button onClick={() => setShowProfModal(false)} className="px-4 py-2 bg-slate-800 text-white rounded-xl text-xs font-semibold">Done</button>
                </div>
              </div>
            </div>
          )}

          <footer className="bg-slate-900 border-t border-slate-800/80 py-4 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
              <span>AR FleetTrack &copy; 2026 Multi-Entity Operations</span>
              <span className="font-mono text-[11px] text-slate-400">Section 194C TDS &bull; 15% Net Commission &bull; Universal Edit/Delete &bull; Isolated Tenancy</span>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <FleetProvider>
        <App />
      </FleetProvider>
    );
  </script>
</body>
</html>
