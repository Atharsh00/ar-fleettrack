      const requestPasswordResetOtp = async (usernameOrEmail) => {
        const query = usernameOrEmail.trim().toLowerCase();
        let targetUser = null;

        // 1. Check Supabase app_users
        if (supabaseClient) {
          try {
            const { data, error } = await supabaseClient
              .from('app_users')
              .select('*')
              .or(`username.ilike.${query},email.ilike.${query}`)
              .limit(1);
            if (!error && data && data.length > 0) {
              const u = data[0];
              targetUser = {
                id: u.id,
                username: u.username,
                password: u.password,
                businessName: u.business_name,
                email: u.email
              };
            }
          } catch (e) {
            console.warn('Supabase app_users OTP lookup warning:', e);
          }
        }

        // 2. Fallback to local users
        if (!targetUser) {
          targetUser = users.find(x =>
            x.username.toLowerCase() === query ||
            (x.email && x.email.toLowerCase() === query)
          );
        }

        if (!targetUser) {
          throw new Error('No registered account found matching that username or email address.');
        }

        // Generate secure 6-digit OTP code & 15-minute expiration
        const otpCode = Math.floor(100000 + Math.random() * 900000).toString();
        const otpExpiresAtMs = Date.now() + 15 * 60 * 1000;

        // Save OTP to Supabase app_users using matching column names: reset_otp, reset_otp_expires
        if (supabaseClient) {
          try {
            await supabaseClient
              .from('app_users')
              .update({
                reset_otp: otpCode,
                reset_otp_expires: otpExpiresAtMs
              })
              .eq('id', targetUser.id);
          } catch (e) {
            console.warn('Could not save OTP to Supabase app_users:', e);
          }
        }

        // Update local users state for offline / instant validation
        setUsers(prev => prev.map(u => u.id === targetUser.id ? { ...u, reset_otp: otpCode, reset_otp_expires: otpExpiresAtMs, otpCode, otpExpiresAt: otpExpiresAtMs } : u));

        // Trigger Supabase Auth OTP email dispatch (creates user in auth.users if needed and sends 6-digit confirmation code)
        if (supabaseClient && targetUser.email) {
          try {
            supabaseClient.auth.signInWithOtp({
              email: targetUser.email,
              options: {
                shouldCreateUser: true
              }
            }).then(r => console.info('Supabase Auth OTP dispatched:', r))
              .catch(err => console.warn('Supabase Auth OTP dispatch note:', err?.message || err));
          } catch (e) {
            console.warn('Supabase Auth OTP call error:', e);
          }
        }

        const emailParts = targetUser.email.split('@');
        const maskedName = emailParts[0].length > 2
          ? emailParts[0][0] + '*'.repeat(emailParts[0].length - 2) + emailParts[0].slice(-1)
          : emailParts[0] + '*';
        const maskedEmail = `${maskedName}@${emailParts[1] || ''}`;

        return {
          success: true,
          userId: targetUser.id,
          email: targetUser.email,
          maskedEmail
        };
      };

      const verifyOtpAndResetPassword = async (userIdOrEmail, otpEntered, newPassword) => {
        if (!newPassword || newPassword.length < 6) {
          throw new Error('New password must be at least 6 characters long.');
        }

        const cleanEntered = (otpEntered || '').trim();
        const query = (userIdOrEmail || '').trim().toLowerCase();
        let targetUser = null;
        let dbOtp = null;
        let dbExpires = null;

        // 1. Check Supabase app_users
        if (supabaseClient) {
          try {
            const { data, error } = await supabaseClient
              .from('app_users')
              .select('*')
              .or(`id.eq.${userIdOrEmail},email.ilike.${query},username.ilike.${query}`)
              .limit(1);
            if (!error && data && data.length > 0) {
              const u = data[0];
              targetUser = { id: u.id, username: u.username, email: u.email };
              dbOtp = u.reset_otp || u.otp_code;
              dbExpires = u.reset_otp_expires ? Number(u.reset_otp_expires) : (u.otp_expires_at ? new Date(u.otp_expires_at).getTime() : null);
            }
          } catch (e) {
            console.warn('Supabase verify lookup warning:', e);
          }
        }

        // 2. Fallback to local users
        if (!targetUser) {
          const lu = users.find(x => x.id === userIdOrEmail || (x.email && x.email.toLowerCase() === query) || x.username.toLowerCase() === query);
          if (lu) {
            targetUser = lu;
            dbOtp = lu.reset_otp || lu.otpCode;
            dbExpires = lu.reset_otp_expires || lu.otpExpiresAt;
          }
        }

        if (!targetUser) {
          throw new Error('User account not found. Please restart the password reset process.');
        }

        // Validate OTP: Check against custom DB OTP or Supabase Auth verifyOtp
        let isValidOtp = false;

        // Check 1: Custom OTP stored in DB
        if (dbOtp && String(dbOtp).trim() === cleanEntered) {
          if (dbExpires && Number(dbExpires) < Date.now()) {
            throw new Error('OTP code has expired (valid for 15 minutes). Please request a new code.');
          }
          isValidOtp = true;
        }

        // Check 2: Verify with Supabase Auth token if Supabase emailed a token
        if (!isValidOtp && supabaseClient && targetUser.email) {
          try {
            for (const otpType of ['email', 'magiclink', 'recovery', 'signup']) {
              const { data: authData, error: authVerifyErr } = await supabaseClient.auth.verifyOtp({
                email: targetUser.email,
                token: cleanEntered,
                type: otpType
              });
              if (!authVerifyErr && (authData?.user || authData?.session)) {
                isValidOtp = true;
                break;
              }
            }
          } catch (authErr) {
            console.info('Supabase Auth token validation check:', authErr);
          }
        }

        if (!isValidOtp) {
          throw new Error('Invalid OTP code. Please check the 6-digit code or request a new code.');
        }

        // Update password in Supabase app_users and clear OTP
        if (supabaseClient) {
          try {
            await supabaseClient
              .from('app_users')
              .update({
                password: newPassword,
                reset_otp: null,
                reset_otp_expires: null
              })
              .eq('id', targetUser.id);
          } catch (e) {
            console.warn('Supabase password update error:', e);
          }
        }

        // Update password in local storage
        setUsers(prev => prev.map(u => u.id === targetUser.id ? { ...u, password: newPassword, reset_otp: null, reset_otp_expires: null, otpCode: null, otpExpiresAt: null } : u));
        if (currentUser && currentUser.id === targetUser.id) {
          setCurrentUser(prev => ({ ...prev, password: newPassword }));
        }

        return true;
      };

      const resetPassword = (usernameOrEmail, email, newPassword) => {
        const target = users.find(x =>
          (x.username.toLowerCase() === usernameOrEmail.trim().toLowerCase() || x.email.toLowerCase() === usernameOrEmail.trim().toLowerCase()) &&
          x.email.toLowerCase() === email.trim().toLowerCase()
        );
        if (!target) {
          throw new Error('No account found matching this username/ID and registered email address.');
        }
        if (!newPassword || newPassword.length < 6) {
          throw new Error('New password must be at least 6 characters long.');
        }
        if (supabaseClient) {
          supabaseClient.from('app_users').update({ password: newPassword }).eq('id', target.id).catch(() => {});
        }
        setUsers(prev => prev.map(u => u.id === target.id ? { ...u, password: newPassword } : u));
        if (currentUser && currentUser.id === target.id) {
          setCurrentUser(prev => ({ ...prev, password: newPassword }));
        }
        return target;
      };

      const changePassword = async (currentPassword, newPassword) => {
        if (!currentUser) throw new Error('No user is currently signed in.');
        const target = users.find(x => x.id === currentUser.id);
        if (!target || target.password !== currentPassword) {
          throw new Error('Current password is incorrect.');
        }
        if (!newPassword || newPassword.length < 6) {
          throw new Error('New password must be at least 6 characters long.');
        }
        // Update Supabase app_users
        if (supabaseClient && !currentUser.isDemo) {
          try {
            await supabaseClient.from('app_users').update({ password: newPassword }).eq('id', currentUser.id);
          } catch (e) {
            console.warn('Supabase change password error:', e);
          }
        }
        setUsers(prev => prev.map(u => u.id === target.id ? { ...u, password: newPassword } : u));
        setCurrentUser(prev => ({ ...prev, password: newPassword }));
        return true;
      };

      // Scoped Profiles: strictly isolated to current user's business
      const scopedProfiles = useMemo(() => {
        if (!currentUser) return [];
        const userProfs = profiles.filter(p => p.userId === currentUser.id || (!p.userId && p.name.toLowerCase() === currentUser.businessName?.toLowerCase()));
        if (userProfs.length === 0) {
          return [{ id: `prof-${currentUser.id}`, userId: currentUser.id, name: currentUser.businessName, isDefault: true, createdAt: new Date().toISOString().split('T')[0] }];
        }
        return userProfs;
      }, [profiles, currentUser]);

      useEffect(() => {
        if (currentUser && scopedProfiles.length > 0) {
          const exists = scopedProfiles.some(p => p.id === activeProfileId);
          if (!exists) {
            setActiveProfileId(scopedProfiles[0].id);
          }
        }
      }, [currentUser, scopedProfiles, activeProfileId]);

      // Email Sync Configuration Actions
      const activeEmailConfig = useMemo(() => {
        const raw = emailSyncConfigs[activeProfileId] || { ...defaultEmailSyncConfig };
        const effectiveEmail = raw.linkedEmail || currentUser?.email || localStorage.getItem('fleet_google_email') || '';
        return {
          ...raw,
          linkedEmail: effectiveEmail
        };
      }, [emailSyncConfigs, activeProfileId, currentUser]);

      const updateEmailSyncConfig = (updates) => {
        const merged = { ...(emailSyncConfigs[activeProfileId] || defaultEmailSyncConfig), ...updates };
        setEmailSyncConfigs(prev => ({
          ...prev,
          [activeProfileId]: merged
        }));
        if (updates.linkedEmail) {
          localStorage.setItem('fleet_google_email', updates.linkedEmail);
          if (currentUser && !currentUser.isDemo) {
            setCurrentUser(prev => prev ? ({ ...prev, email: updates.linkedEmail }) : prev);
            if (supabaseClient) {
              safeCloudExec(supabaseClient.from('app_users').update({ email: updates.linkedEmail }).eq('id', currentUser.id), 'SyncLinkedEmail');
            }
          }
        }
        if (supabaseClient && currentUser && !currentUser.isDemo && activeProfileId) {
          safeCloudExec(supabaseClient.from('email_sync_configs').upsert({
            profile_id: activeProfileId,
            linked_email: merged.linkedEmail || '',
            toll_enabled: merged.tollEnabled ?? true,
            toll_subject_filter: merged.tollSubjectFilter || '',
            fuel_enabled: merged.fuelEnabled ?? true,
            fuel_subject_filter: merged.fuelSubjectFilter || '',
          }), 'SaveEmailSyncConfig');
        }
      };

      const activeProfile = useMemo(() => scopedProfiles.find(p => p.id === activeProfileId) || scopedProfiles[0] || { id: 'prof-1', name: currentUser?.businessName || 'Default Entity' }, [scopedProfiles, activeProfileId, currentUser]);
      const activeRules = useMemo(() => rules[activeProfileId] || { defaultDriverSalaryPercent: 15, defaultTdsPercent: 1, autoDriverSalaryEnabled: true }, [rules, activeProfileId]);

      const updateRules = (newRules) => {
        setRules(prev => ({
          ...prev,
          [activeProfileId]: { ...(prev[activeProfileId] || { defaultDriverSalaryPercent: 15, defaultTdsPercent: 1, autoDriverSalaryEnabled: true }), ...newRules }
        }));
        if (storageMode === 'cloud' && supabaseClient && currentUser && !currentUser.isDemo) {
          safeCloudExec(supabaseClient.from('rules').upsert({
            profile_id: activeProfileId,
            default_driver_salary_percent: newRules.defaultDriverSalaryPercent !== undefined ? newRules.defaultDriverSalaryPercent : (rules[activeProfileId]?.defaultDriverSalaryPercent || 15),
            default_tds_percent: newRules.defaultTdsPercent !== undefined ? newRules.defaultTdsPercent : (rules[activeProfileId]?.defaultTdsPercent || 1)
          }), 'UpdateRules');
        }
      };

      const addProfile = (name) => {
        const newP = {
          id: `prof-${Date.now()}`,
          userId: currentUser?.id,
          name: name.trim(),
          isDefault: false,
          createdAt: new Date().toISOString().split('T')[0]
        };
        setProfiles(prev => [...prev, newP]);
        setRules(prev => ({ ...prev, [newP.id]: { defaultDriverSalaryPercent: 15, defaultTdsPercent: 1, autoDriverSalaryEnabled: true } }));
        setActiveProfileId(newP.id);

        if (supabaseClient && currentUser && !currentUser.isDemo) {
          try {
            safeCloudExec(supabaseClient.from('profiles').upsert(toSnakeObj(newP)), 'AddProfile');
            safeCloudExec(supabaseClient.from('rules').upsert({
              profile_id: newP.id,
              default_driver_salary_percent: 15,
              default_tds_percent: 1
            }), 'AddProfileRules');
          } catch (e) {
            console.warn('Supabase add profile error:', e);
          }
        }
        return newP;
      };

      const updateProfile = (id, name) => {
        setProfiles(prev => prev.map(p => p.id === id ? { ...p, name: name.trim() } : p));
        if (supabaseClient && currentUser && !currentUser.isDemo) {
          try {
            safeCloudExec(supabaseClient.from('profiles').update({ name: name.trim() }).eq('id', id), 'UpdateProfile');
          } catch (e) {
            console.warn('Supabase update profile error:', e);
          }
        }
      };

      const deleteProfile = (id) => {
        if (scopedProfiles.length <= 1) return alert('Cannot delete the only remaining profile for your business account.');
        const remaining = profiles.filter(p => p.id !== id);
        setProfiles(remaining);
        const remScoped = scopedProfiles.filter(p => p.id !== id);
        if (remScoped.length > 0) setActiveProfileId(remScoped[0].id);
        setTrucks(prev => prev.filter(t => t.profileId !== id));
        setCompanies(prev => prev.filter(c => c.profileId !== id));
        setDrivers(prev => prev.filter(d => d.profileId !== id));
        setTrips(prev => prev.filter(t => t.profileId !== id));
        setExpenses(prev => prev.filter(e => e.profileId !== id));
        setDriverPayments(prev => prev.filter(p => p.profileId !== id));
        setSettlements(prev => prev.filter(s => s.profileId !== id));
        setFuelStatementLogs(prev => (prev || []).filter(l => l.profileId !== id));

        if (supabaseClient && currentUser && !currentUser.isDemo) {
          try {
            safeCloudExec(supabaseClient.from('profiles').delete().eq('id', id), 'DeleteProfile');
          } catch (e) {
            console.warn('Supabase delete profile error:', e);
          }
        }
      };

      // Scoped Data (sorted newest date first, with last entry made topmost)
      const scopedTrucks = useMemo(() => trucks.filter(t => t.profileId === activeProfileId), [trucks, activeProfileId]);
      const scopedCompanies = useMemo(() => companies.filter(c => c.profileId === activeProfileId), [companies, activeProfileId]);
      const scopedDrivers = useMemo(() => drivers.filter(d => d.profileId === activeProfileId), [drivers, activeProfileId]);
      const scopedTrips = useMemo(() => [...trips.filter(t => t.profileId === activeProfileId)].sort(compareRecordsDesc), [trips, activeProfileId]);
      const scopedExpenses = useMemo(() => {
        const list = expenses.filter(e => e.profileId === activeProfileId);
        const seenEmailRefs = new Set();
        const seenTxnIds = new Set();
        const unique = [];
        for (const e of list) {
          const refMatch = (e.notes || '').match(/\[ref:([^\]]+)\]/);
          const txnMatch = (e.notes || '').match(/\[txn:([^\]]+)\]/);
          const emailRef = e.sourceEmailId || (refMatch ? refMatch[1] : null);
          const txnRef = txnMatch ? txnMatch[1] : null;

          // Automatically eliminate known duplicate 343 email debit (1a14ebf6759b8d0a is duplicate of 1a146aa51637a7f7)
          if (emailRef === '1a14ebf6759b8d0a') {
            continue;
          }

          if (emailRef) {
            if (seenEmailRefs.has(emailRef)) continue;
            seenEmailRefs.add(emailRef);
          }

          if (txnRef) {
            if (seenTxnIds.has(txnRef)) continue;
            seenTxnIds.add(txnRef);
          }

          const comboKey = e.paymentMethod && e.paymentMethod.includes('Auto-Email') ? `${e.truckId}-${e.date}-${e.category}-${Number(e.amount)}` : null;
          if (comboKey) {
            if (seenEmailRefs.has(comboKey)) continue;
            seenEmailRefs.add(comboKey);
          }

          unique.push(e);
        }
        return unique.sort(compareRecordsDesc);
      }, [expenses, activeProfileId]);
      const scopedDriverPayments = useMemo(() => [...driverPayments.filter(p => p.profileId === activeProfileId)].sort(compareRecordsDesc), [driverPayments, activeProfileId]);
      const scopedSettlements = useMemo(() => [...settlements.filter(s => s.profileId === activeProfileId)].sort(compareRecordsDesc), [settlements, activeProfileId]);
      const scopedFuelStatementLogs = useMemo(() => {
        return (fuelStatementLogs || []).filter(l => l.profileId === activeProfileId);
      }, [fuelStatementLogs, activeProfileId]);

      const addFuelStatementLog = (entry) => {
        const newLog = {
          id: `stmt-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
          profileId: activeProfileId,
          uploadedAt: new Date().toISOString(),
          ...entry
        };
        setFuelStatementLogs(prev => [newLog, ...(prev || [])]);
        return newLog;
      };

      const deleteFuelStatementLog = (id) => {
        setFuelStatementLogs(prev => (prev || []).filter(l => l.id !== id));
      };

      // Fresh state refs for background timers & workers to avoid stale closures
      const expensesRef = useRef(expenses);
      useEffect(() => { expensesRef.current = expenses; }, [expenses]);
      const scopedTripsRef = useRef(scopedTrips);
      useEffect(() => { scopedTripsRef.current = scopedTrips; }, [scopedTrips]);
      const scopedTrucksRef = useRef(scopedTrucks);
      useEffect(() => { scopedTrucksRef.current = scopedTrucks; }, [scopedTrucks]);

      // --- SUPABASE CLOUD SYNC & DEMO SANDBOX ENGINES ---
      const pullCloudData = async (profId = null) => {
        if (!supabaseClient) return;
        const targetProf = profId || activeProfileId;
        setCloudSyncStatus(prev => ({ ...prev, syncing: true, error: null }));
        try {
          const [tRes, cRes, dRes, trRes, expRes, dpRes, setRes, rulRes, cfgRes] = await Promise.all([
            supabaseClient.from('trucks').select('*').eq('profile_id', targetProf),
            supabaseClient.from('companies').select('*').eq('profile_id', targetProf),
            supabaseClient.from('drivers').select('*').eq('profile_id', targetProf),
            supabaseClient.from('trips').select('*').eq('profile_id', targetProf).order('date', { ascending: false }).order('created_at', { ascending: false }),
            supabaseClient.from('expenses').select('*').eq('profile_id', targetProf).order('date', { ascending: false }).order('created_at', { ascending: false }),
            supabaseClient.from('driver_payments').select('*').eq('profile_id', targetProf).order('date', { ascending: false }).order('created_at', { ascending: false }),
            supabaseClient.from('settlements').select('*').eq('profile_id', targetProf).order('date', { ascending: false }).order('created_at', { ascending: false }),
            supabaseClient.from('rules').select('*').eq('profile_id', targetProf),
            supabaseClient.from('email_sync_configs').select('*').eq('profile_id', targetProf)
          ]);

          const cloudHasData = (tRes.data && tRes.data.length > 0) || (trRes.data && trRes.data.length > 0) || (cRes.data && cRes.data.length > 0) || (expRes.data && expRes.data.length > 0);

          if (cloudHasData) {
            if (tRes.data) setTrucks(prev => [...tRes.data.map(toCamelObj), ...prev.filter(x => x.profileId !== targetProf)]);
            if (cRes.data) setCompanies(prev => [...cRes.data.map(toCamelObj), ...prev.filter(x => x.profileId !== targetProf)]);
            if (dRes.data) setDrivers(prev => [...dRes.data.map(toCamelObj), ...prev.filter(x => x.profileId !== targetProf)]);
            if (trRes.data) {
              const mappedTrips = trRes.data.map(t => {
                const camel = toCamelObj(t);
                let drops = camel.additionalDrops;
                if (typeof drops === 'string') {
                  try { drops = JSON.parse(drops); } catch (e) { drops = []; }
                }
                return {
                  ...camel,
                  additionalDrops: Array.isArray(drops) ? drops : [],
                  totalRent: Number(camel.totalRent || 0),
                  commissionAmount: Number(camel.commissionAmount || 0),
                  advanceReceived: Number(camel.advanceReceived || 0),
                  receivedAmount: Number(camel.receivedAmount || 0),
                  tdsAmount: Number(camel.tdsAmount || 0),
                  netRent: Number(camel.netRent || 0),
                  driverCommission: Number(camel.driverCommission || 0),
                  balancePending: Number(camel.balancePending || 0),
                  isSimulation: Boolean(camel.isSimulation)
                };
              });
              setTrips(prev => [...mappedTrips, ...prev.filter(x => x.profileId !== targetProf)]);
            }
            if (expRes.data) {
              const cloudExpenses = expRes.data.map(toCamelObj);
              const seenEmailRefs = new Set();
              const uniqueCloudExpenses = [];
              const duplicateIdsToDelete = [];
              const seenTxnIds = new Set();

              for (const e of cloudExpenses) {
                const refMatch = (e.notes || '').match(/\[ref:([^\]]+)\]/);
                const txnMatch = (e.notes || '').match(/\[txn:([^\]]+)\]/);
                const emailRef = e.sourceEmailId || (refMatch ? refMatch[1] : null);
                const txnRef = txnMatch ? txnMatch[1] : null;

                // Automatically eliminate known duplicate 343 email debit (1a14ebf6759b8d0a is duplicate of 1a146aa51637a7f7)
                if (emailRef === '1a14ebf6759b8d0a') {
                  duplicateIdsToDelete.push(e.id);
                  continue;
                }

                if (emailRef) {
                  if (seenEmailRefs.has(emailRef)) {
                    duplicateIdsToDelete.push(e.id);
                    continue;
                  }
                  seenEmailRefs.add(emailRef);
                }

                if (txnRef) {
                  if (seenTxnIds.has(txnRef)) {
                    duplicateIdsToDelete.push(e.id);
                    continue;
                  }
                  seenTxnIds.add(txnRef);
                }

                const comboKey = e.paymentMethod && e.paymentMethod.includes('Auto-Email') ? `${e.truckId}-${e.date}-${e.category}-${Number(e.amount)}` : null;
                if (comboKey) {
                  if (seenEmailRefs.has(comboKey)) {
                    duplicateIdsToDelete.push(e.id);
                    continue; // Skip duplicate email record
                  }
                  seenEmailRefs.add(comboKey);
                }
                uniqueCloudExpenses.push(e);
              }

              // Auto-purge any duplicate email records from Supabase cloud database
              if (duplicateIdsToDelete.length > 0 && supabaseClient) {
                safeCloudExec(supabaseClient.from('expenses').delete().in('id', duplicateIdsToDelete), 'PurgeDuplicateEmailExpenses');
              }

              setExpenses(prev => [...uniqueCloudExpenses, ...prev.filter(x => x.profileId !== targetProf)]);
            }
            if (dpRes.data) setDriverPayments(prev => [...dpRes.data.map(toCamelObj), ...prev.filter(x => x.profileId !== targetProf)]);
            if (setRes.data) setSettlements(prev => [...setRes.data.map(toCamelObj), ...prev.filter(x => x.profileId !== targetProf)]);
            if (rulRes.data && rulRes.data.length > 0) {
              const r = rulRes.data[0];
              setRules(prev => ({
                ...prev,
                [targetProf]: {
                  autoDriverSalaryEnabled: true,
                  ...(prev[targetProf] || {}),
                  defaultDriverSalaryPercent: Number(r.default_driver_salary_percent) || 15,
                  defaultTdsPercent: Number(r.default_tds_percent) || 1
                }
              }));
            }
          }

          if (cfgRes && cfgRes.data && cfgRes.data.length > 0) {
            const c = cfgRes.data[0];
            setEmailSyncConfigs(prev => ({
              ...prev,
              [targetProf]: {
                linkedEmail: c.linked_email || prev[targetProf]?.linkedEmail || '',
                tollEnabled: c.toll_enabled ?? true,
                tollSubjectFilter: c.toll_subject_filter ?? '',
                fuelEnabled: c.fuel_enabled ?? true,
                fuelSubjectFilter: c.fuel_subject_filter ?? '',
              }
            }));
            if (c.linked_email) {
              localStorage.setItem('fleet_google_email', c.linked_email);
            }
          }

          // Cross-device Profile Synchronization (ensures profiles created on laptop immediately appear on phone)
          if (currentUser && !currentUser.isDemo) {
            try {
              const { data: cloudProfs } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('user_id', currentUser.id);
              if (cloudProfs && cloudProfs.length > 0) {
                const mappedProfs = cloudProfs.map(toCamelObj);
                setProfiles(prev => {
                  const combined = [...mappedProfs];
                  prev.forEach(p => {
                    if (p.userId === currentUser.id && !combined.some(cp => cp.id === p.id)) {
                      // Profile exists locally but not in cloud yet -> backfill to Supabase!
                      safeCloudExec(supabaseClient.from('profiles').upsert(toSnakeObj(p)), 'SyncLocalProfileToCloud');
                      combined.push(p);
                    }
                  });
                  return combined;
                });
              } else {
                // If cloud has no profiles yet, backfill all local profiles for this user to cloud
                const localUserProfs = profiles.filter(p => p.userId === currentUser.id);
                localUserProfs.forEach(p => {
                  safeCloudExec(supabaseClient.from('profiles').upsert(toSnakeObj(p)), 'BackfillProfileToCloud');
                });
              }
            } catch (pErr) {
              console.warn('Profile sync in pullCloudData warning:', pErr);
            }
          }

          setCloudSyncStatus({
            connected: true,
            lastSyncedAt: new Date().toISOString(),
            syncing: false,
            error: null
          });
        } catch (err) {
          console.warn('Cloud sync error:', err);
          setCloudSyncStatus(prev => ({ ...prev, syncing: false, error: err.message }));
        }
      };

      // Automatic Cloud Data Pull: On load, profile switch, window focus, and 60s background polling
      useEffect(() => {
        if (!currentUser || currentUser.isDemo || !supabaseClient || !activeProfileId) return;

        // 1. Initial pull
        pullCloudData(activeProfileId);

        // 2. Window focus pull: Automatically refreshes when the user returns to this browser tab
        const onFocus = () => {
          pullCloudData(activeProfileId);
        };
        window.addEventListener('focus', onFocus);

        // 3. Periodic background sync every 60 seconds
        const pollInterval = setInterval(() => {
          pullCloudData(activeProfileId);
        }, 60000);

        return () => {
          window.removeEventListener('focus', onFocus);
          clearInterval(pollInterval);
        };
      }, [currentUser, activeProfileId]);

      // Push local data into Supabase Cloud
      const syncLocalToCloud = async () => {
        if (!supabaseClient) throw new Error('Supabase client is not connected.');
        setCloudSyncStatus(prev => ({ ...prev, syncing: true, error: null }));
        try {
          const curProf = profiles.find(p => p.id === activeProfileId) || { id: activeProfileId, name: activeProfile?.name || 'Default Entity', isDefault: true };
          await supabaseClient.from('profiles').upsert(toSnakeObj(curProf));

          if (scopedTrucks.length > 0) await supabaseClient.from('trucks').upsert(scopedTrucks.map(toSnakeObj));
          if (scopedCompanies.length > 0) await supabaseClient.from('companies').upsert(scopedCompanies.map(toSnakeObj));
          if (scopedDrivers.length > 0) await supabaseClient.from('drivers').upsert(scopedDrivers.map(toSnakeObj));

          if (scopedTrips.length > 0) await supabaseClient.from('trips').upsert(scopedTrips.map(toSnakeObj));
          if (scopedExpenses.length > 0) await supabaseClient.from('expenses').upsert(scopedExpenses.map(toSnakeObj));

      // Date Filtering
      const isDateInRange = (dateStr) => {
        if (dateFilter.preset === 'all') return true;
        const target = new Date(dateStr);
        const now = new Date();
        if (dateFilter.preset === 'this_month') {
          return target.getFullYear() === now.getFullYear() && target.getMonth() === now.getMonth();
        }
        if (dateFilter.preset === 'last_month') {
          const prevMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
          return target.getFullYear() === prevMonth.getFullYear() && target.getMonth() === prevMonth.getMonth();
        }
        if (dateFilter.preset === 'custom') {
          if (dateFilter.startDate && dateFilter.endDate) return dateStr >= dateFilter.startDate && dateStr <= dateFilter.endDate;
          if (dateFilter.startDate) return dateStr >= dateFilter.startDate;
          if (dateFilter.endDate) return dateStr <= dateFilter.endDate;
          return true;
        }
        return true;
      };

      const filteredTrips = useMemo(() => [...scopedTrips.filter(t => isDateInRange(t.date))].sort(compareRecordsDesc), [scopedTrips, dateFilter]);
      const filteredExpenses = useMemo(() => [...scopedExpenses.filter(e => isDateInRange(e.date))].sort(compareRecordsDesc), [scopedExpenses, dateFilter]);
      const filteredDriverPayments = useMemo(() => [...scopedDriverPayments.filter(p => isDateInRange(p.date))].sort(compareRecordsDesc), [scopedDriverPayments, dateFilter]);
      const filteredSettlements = useMemo(() => [...scopedSettlements.filter(s => isDateInRange(s.date))].sort(compareRecordsDesc), [scopedSettlements, dateFilter]);

      // Summary Metrics
      const summaryMetrics = useMemo(() => {
        const totalRevenue = filteredTrips.reduce((s, t) => s + Number(t.totalRent || 0), 0);
        const totalDirectExpenses = filteredExpenses.reduce((s, e) => s + Number(e.amount || 0), 0);
        const totalPendingRentFromTrips = filteredTrips.reduce((s, t) => {
          const reimbExp = scopedExpenses.filter(e => e.tripId === t.id && e.isReimbursable).reduce((sum, e) => sum + Number(e.amount || 0), 0);
          const reimbDrv = scopedDriverPayments.filter(p => p.tripId === t.id && p.type === 'DRIVER_EXPENSE' && p.isReimbursable).reduce((sum, p) => sum + Number(p.amount || 0), 0);
          const reimb = reimbExp + reimbDrv;
          return s + Math.max(0, Number(t.totalRent || 0) + reimb - Number(t.advanceReceived || 0) - Number(t.receivedAmount || 0) - Number(t.commissionAmount || 0) - Number(t.tdsAmount || 0));
        }, 0);
        const companyReceivableAdj = filteredSettlements
          .filter(st => st.paymentMethod === 'OPENING_BALANCE' && (st.notes || '').includes('[adjType:RECEIVABLE]'))
          .reduce((s, st) => s + Number(st.amount || 0), 0);
        const normalSettlementsAndAdvanceAdj = filteredSettlements
          .filter(st => !(st.paymentMethod === 'OPENING_BALANCE' && (st.notes || '').includes('[adjType:RECEIVABLE]')))
          .reduce((s, st) => s + Number(st.amount || 0), 0);
        const totalCompanyReceivables = Math.max(0, (totalPendingRentFromTrips + companyReceivableAdj) - normalSettlementsAndAdvanceAdj);

        const totalDriverCommissions = filteredTrips.reduce((s, t) => s + Number(t.driverCommission || 0), 0);
        const totalExpensesClaimed = filteredDriverPayments.filter(p => p.type === 'DRIVER_EXPENSE').reduce((s, p) => s + Number(p.amount || 0), 0);
        const totalPayoutsMade = filteredDriverPayments.filter(p => p.type === 'SALARY_PAYOUT').reduce((s, p) => s + Number(p.amount || 0), 0);
        const netDriverPayable = (totalDriverCommissions + totalExpensesClaimed) - totalPayoutsMade;

        // Fleet Net Profit calculation:
        // Operational truck expenses only (excluding reimbursable expenses that client pays back)
        const totalOperationalTruckExpenses = filteredExpenses.filter(e => !e.isReimbursable).reduce((s, e) => s + Number(e.amount || 0), 0);
        // Operational driver expense claims only (excluding reimbursable driver claims and prior opening balance adjustments)
        const totalOperationalDriverExpenses = filteredDriverPayments.filter(p => p.type === 'DRIVER_EXPENSE' && !p.isReimbursable && p.paymentMethod !== 'OPENING_BALANCE').reduce((s, p) => s + Number(p.amount || 0), 0);
        const totalBrokerCommissions = filteredTrips.reduce((s, t) => s + Number(t.commissionAmount || 0), 0);
        const totalTdsDeducted = filteredTrips.reduce((s, t) => s + Number(t.tdsAmount || 0), 0);
        
        // Net Profit = Revenue - (Operational Truck Expenses + Operational Driver Claims + Driver Wages + Broker Commissions + TDS)
        const fleetProfit = totalRevenue - totalOperationalTruckExpenses - totalOperationalDriverExpenses - totalDriverCommissions - totalBrokerCommissions - totalTdsDeducted;
        const tripsWithTdsCount = filteredTrips.filter(t => t.isTdsDeducted && Number(t.tdsAmount) > 0).length;

        return {
          totalRevenue,
          totalDirectExpenses,
          totalCompanyReceivables,
          netDriverPayable,
          fleetProfit,
          tripsCount: filteredTrips.length,
          totalTdsDeducted,
          tripsWithTdsCount,
        };
      }, [filteredTrips, filteredExpenses, filteredDriverPayments, filteredSettlements, scopedExpenses]);

      // Recomputation Helper
      const computeTripFields = (gross, comm, isTds, adv, received = 0, customDriverSalary = undefined) => {
        const g = Number(gross) || 0;
        const c = Number(comm) || 0;
        const a = Number(adv) || 0;
        const r = Number(received) || 0;
        const tdsAmount = isTds ? (g * (activeRules.defaultTdsPercent / 100)) : 0;
        const netRent = Math.max(0, g - tdsAmount - c);
        const isAuto = activeRules?.autoDriverSalaryEnabled !== false;
        let driverCommission = 0;
        if (customDriverSalary !== undefined && customDriverSalary !== null) {
          driverCommission = Number(customDriverSalary) || 0;
        } else if (!isAuto) {
          driverCommission = 0;
        } else {
          driverCommission = netRent * (activeRules.defaultDriverSalaryPercent / 100);
        }
        // Receivables Formula: Balance Due = Total Rent - Advance Received - Amount Received from Company - Commission - TDS
        const balancePending = Math.max(0, g - a - r - c - tdsAmount);
        return { tdsAmount, netRent, driverCommission, balancePending };
      };

      // Trip Actions
      // Find the active ongoing trip for a truck on an expense date:
      // Any fuel or FASTag expense from the start of a trip up until the start date of the NEXT trip belongs to that trip.
      const findOngoingTripForTruck = (truckId, expenseDate, customTrips = null) => {
        if (!truckId || !expenseDate) return null;
        const tripSource = customTrips || scopedTrips;
        const truckTrips = tripSource.filter(t => t.truckId === truckId && t.date && (t.profileId ? t.profileId === activeProfileId : true));
        if (truckTrips.length === 0) return null;
        const sorted = [...truckTrips].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        return sorted.find(t => t.date <= expenseDate) || null;

      // Automatically re-evaluate and retag automated toll and diesel expenses to their correct chronological trip
      const autoRetagExpensesForTruck = (truckId, updatedTrips) => {
        if (!truckId) return;
        setExpenses(prevExpenses => {
          let updatedCount = 0;
          const nextExpenses = prevExpenses.map(exp => {
            if (exp.truckId !== truckId) return exp;
            if (exp.profileId && exp.profileId !== activeProfileId) return exp;
            if (!isAutoExpenseRecord(exp)) return exp; // Leave manual user entries intact

            const matchedTrip = findOngoingTripForTruck(truckId, exp.date, updatedTrips);
            const targetTripId = matchedTrip ? matchedTrip.id : null;
            if (exp.tripId !== targetTripId) {
              updatedCount++;
              return { ...exp, tripId: targetTripId };
            }
            return exp;
          });

          if (updatedCount > 0) {
            try { localStorage.setItem(`${STORAGE_KEY}_expenses`, JSON.stringify(nextExpenses)); } catch(e){}
            if (supabaseClient) {
              const changedList = nextExpenses.filter(e => {
                const old = prevExpenses.find(o => o.id === e.id);
                return old && old.tripId !== e.tripId;
              });
              const payloads = changedList.map(e => ({
                id: e.id,
                profile_id: e.profileId,
                truck_id: e.truckId,
                trip_id: e.tripId || null,
                date: e.date,
                category: e.category,
                amount: Number(e.amount) || 0,
                payment_method: e.paymentMethod,
                is_reimbursable: Boolean(e.isReimbursable),
                notes: e.notes || '',
                is_simulation: false
              }));
              safeCloudExec(supabaseClient.from('expenses').upsert(payloads), 'AutoRetagExpenses');
            }
            return nextExpenses;
          }
          return prevExpenses;
        });
      };

      const addTrip = (input) => {
        const recAmt = Number(input.receivedAmount || 0);
        const salInput = input.driverCommission !== undefined ? input.driverCommission : input.manualDriverSalary;
        const { tdsAmount, netRent, driverCommission, balancePending } = computeTripFields(
          input.totalRent, input.commissionAmount, input.isTdsDeducted, input.advanceReceived, recAmt, salInput
        );

        if (!scopedCompanies.some(c => c.name.toLowerCase() === input.companyName.trim().toLowerCase())) {
          addCompany({ name: input.companyName.trim() });
        }
        if (!scopedDrivers.some(d => d.name.toLowerCase() === input.driverName.trim().toLowerCase())) {
          addDriver({ name: input.driverName.trim(), phone: 'Pending', licenseNumber: 'Pending' });
        }

        const drops = (input.additionalDrops || []).filter(Boolean);
        const route = [input.fromLocation, ...drops, input.toLocation].filter(Boolean).join(' -> ');

        const newTrip = {
          id: `trp-${Date.now()}`,
          profileId: activeProfileId,
          date: input.date,
          createdAt: new Date().toISOString(),
          truckId: input.truckId,
          companyName: input.companyName.trim(),
          driverName: input.driverName.trim(),
          fromLocation: input.fromLocation.trim(),
          toLocation: input.toLocation.trim(),
          additionalDrops: drops,
          route: route || 'Freight Route',
          totalRent: Number(input.totalRent) || 0,
          commissionAmount: Number(input.commissionAmount) || 0,
          isTdsDeducted: Boolean(input.isTdsDeducted),
          advanceReceived: Number(input.advanceReceived) || 0,
          receivedAmount: recAmt,
          tdsAmount,
          netRent,
          driverCommission,
          balancePending,
          notes: input.notes,
          isSimulation: Boolean(input.isSimulation)
        };

        const nextTrips = [newTrip, ...trips];
        setTrips(nextTrips);
        autoRetagExpensesForTruck(newTrip.truckId, nextTrips);

        if (storageMode === 'cloud' && supabaseClient) {
          safeCloudExec(supabaseClient.from('trips').upsert(toSnakeObj(newTrip)), 'InsertTrip');
        }
        return newTrip;
      };

      const updateTrip = (id, updates) => {
        const targetOld = trips.find(t => t.id === id);
        const oldTruckId = targetOld?.truckId;
        let updatedItem = null;
        let nextTrips = trips;

        setTrips(prev => {
          nextTrips = prev.map(t => {
            if (t.id !== id) return t;
            const merged = { ...t, ...updates };
            const recAmt = Number(merged.receivedAmount || 0);
            const salInput = updates.driverCommission !== undefined ? updates.driverCommission : (activeRules?.autoDriverSalaryEnabled !== false ? undefined : merged.driverCommission);
            const { tdsAmount, netRent, driverCommission, balancePending } = computeTripFields(
              merged.totalRent, merged.commissionAmount, merged.isTdsDeducted, merged.advanceReceived, recAmt, salInput
            );
            const drops = (merged.additionalDrops || []).filter(Boolean);
            const route = [merged.fromLocation, ...drops, merged.toLocation].filter(Boolean).join(' -> ');
            updatedItem = { ...merged, route: route || merged.route, receivedAmount: recAmt, tdsAmount, netRent, driverCommission, balancePending };
            return updatedItem;
          });
          return nextTrips;
        });

        if (updatedItem) {
          autoRetagExpensesForTruck(updatedItem.truckId, nextTrips);
          if (oldTruckId && oldTruckId !== updatedItem.truckId) {
            autoRetagExpensesForTruck(oldTruckId, nextTrips);
          }
        }

        if (storageMode === 'cloud' && supabaseClient && updatedItem) {
          safeCloudExec(supabaseClient.from('trips').update(toSnakeObj(updatedItem)).eq('id', id), 'UpdateTrip');
        }
      };

      const deleteTrip = (id) => {
        const targetTrip = trips.find(t => t.id === id);
        const nextTrips = trips.filter(t => t.id !== id);
        setTrips(nextTrips);

        if (targetTrip?.truckId) {
          autoRetagExpensesForTruck(targetTrip.truckId, nextTrips);
        }

        if (storageMode === 'cloud' && supabaseClient) {
          safeCloudExec(supabaseClient.from('trips').delete().eq('id', id), 'DeleteTrip');

      const addTruckExpense = (input) => {

        if (storageMode === 'cloud' && supabaseClient) {

        }

      const deleteTruckExpense = (id) => {
        setExpenses(prev => prev.filter(e => e.id !== id));
        if (storageMode === 'cloud' && supabaseClient) {
          safeCloudExec(supabaseClient.from('expenses').delete().eq('id', id), 'DeleteExpense');
        }
      };
      const addExpensesBatch = (newExpenses) => {
        if (!newExpenses || newExpenses.length === 0) return;
        setExpenses(prev => [...newExpenses, ...prev]);
        if (storageMode === 'cloud' && supabaseClient && currentUser && !currentUser.isDemo) {
          const dbPayloads = newExpenses.map(e => ({
            id: e.id,
            profile_id: e.profileId,
            truck_id: e.truckId,
            trip_id: e.tripId || null,
            date: e.date,
            category: e.category,
            amount: Number(e.amount) || 0,
            payment_method: e.paymentMethod,
            is_reimbursable: Boolean(e.isReimbursable),
            notes: e.notes || '',
            is_simulation: false
          }));
          safeCloudExec(supabaseClient.from('expenses').upsert(dbPayloads), 'BatchStatementExpenses');
        }
      };
      const deleteExpensesBatch = (ids) => {
        if (!ids || ids.length === 0) return;
        const idSet = new Set(ids);
        setExpenses(prev => {
          const updated = prev.filter(e => !idSet.has(e.id));

      // Driver Payment Actions
      const addDriverPayment = (input) => {
        const newDp = {
          id: `dp-${Date.now()}`,

        };
        setDriverPayments(prev => [newDp, ...prev]);

      };
      const updateDriverPayment = (id, updates) => {
        setDriverPayments(prev => prev.map(p => p.id === id ? { ...p, ...updates, amount: Number(updates.amount ?? p.amount) } : p));
        if (storageMode === 'cloud' && supabaseClient) {

        if (storageMode === 'cloud' && supabaseClient) {

      // Master Entity Actions (with cascading)
      const addTruck = (input) => {

        setTrucks(prev => [...prev, newT]);

          safeCloudExec(supabaseClient.from('trucks').update(toSnakeObj(fields)).eq('id', id), 'UpdateTruck');

      };
      const deleteTruck = (id) => {
        if (trips.some(t => t.truckId === id) || expenses.some(e => e.truckId === id)) {
          if (!confirm('This truck has associated trips or expenses. Deleting it will delete them as well. Continue?')) return;
          setTrips(prev => prev.filter(t => t.truckId !== id));

      const addCompany = (input) => {

        setCompanies(prev => [...prev, newC]);

      const updateCompany = (id, fields) => {
        const old = companies.find(c => c.id === id);

          setTrips(prev => prev.map(t => t.companyName === old.name ? { ...t, companyName: fields.name } : t));
          setSettlements(prev => prev.map(s => s.companyName === old.name ? { ...s, companyName: fields.name } : s));

      const deleteCompany = (id) => {

      const addDriver = (input) => {
        const newD = { id: `drv-${Date.now()}`, profileId: activeProfileId, ...input, status: 'ACTIVE', isSimulation: Boolean(input.isSimulation) };
        setDrivers(prev => [...prev, newD]);
        if (storageMode === 'cloud' && supabaseClient) {
