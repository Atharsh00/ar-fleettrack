      <button onclick="location.reload();" class="px-4 py-2 bg-slate-800 text-slate-200 hover:text-white rounded-xl text-xs font-semibold">

    window.onerror = function(msg, url, line, col, error) {

      var errEl = document.getElementById('error-message');
      if (banner && errEl) {
        banner.style.display = 'block';
        errEl.textContent = (error && error.stack) ? error.stack : (msg + ' at line ' + line + ':' + col);
      }
      console.error('Captured window error:', msg, error);
    };
  </script>

    const initialUsers = [
      { id: 'usr-1', username: 'apex', password: 'password123', businessName: 'Apex Logistics India', email: 'owner@apexlogistics.in' },
      { id: 'usr-2', username: 'kiran', password: 'password123', businessName: 'Kiran Roadways Enterprise', email: 'transport@kiranroadways.com' },

    const defaultEmailSyncConfig = {

      fuelSubjectFilter: 'Fuel Transaction Alert',
      lastSyncedAt: null,
    };

    // --- CONTEXT ---
    const FleetContext = createContext();

    // Safe JSON parser for localStorage
    const safeStorageGet = (key, fallback) => {
      try {
        const item = localStorage.getItem(key);
        if (!item) return fallback;
        const parsed = JSON.parse(item);
        return parsed || fallback;
      } catch (err) {
        console.warn(`Error reading ${key} from storage, using fallback:`, err);
        return fallback;
      }
    };

    function FleetProvider({ children }) {
      const STORAGE_KEY = 'fleettrack_v4';

      // --- USER AUTHENTICATION & MULTI-TENANCY ---
      const [users, setUsers] = useState(() => safeStorageGet(`${STORAGE_KEY}_users`, initialUsers));
      const [currentUser, setCurrentUser] = useState(() => safeStorageGet(`${STORAGE_KEY}_cur_user`, null));

      const [profiles, setProfiles] = useState(() => safeStorageGet(`${STORAGE_KEY}_profiles`, initialProfiles));
      const [activeProfileId, setActiveProfileId] = useState(() => {
        try {
          return localStorage.getItem(`${STORAGE_KEY}_active_prof`) || (profiles && profiles[0]?.id) || 'prof-1';
        } catch (e) {
          return 'prof-1';
        }
      });
      const [rules, setRules] = useState(() => safeStorageGet(`${STORAGE_KEY}_rules`, initialRules));

      // Email Sync Configuration per profile
      const [emailSyncConfigs, setEmailSyncConfigs] = useState(() => safeStorageGet(`${STORAGE_KEY}_email_sync`, {
        'prof-1': { ...defaultEmailSyncConfig, linkedEmail: 'billing@apexlogistics.in' },
        'prof-2': { ...defaultEmailSyncConfig, linkedEmail: 'fastag@kiranroadways.com' },
      }));

      const [trucks, setTrucks] = useState(() => safeStorageGet(`${STORAGE_KEY}_trucks`, initialTrucks));
      const [companies, setCompanies] = useState(() => safeStorageGet(`${STORAGE_KEY}_companies`, initialCompanies));
      const [drivers, setDrivers] = useState(() => safeStorageGet(`${STORAGE_KEY}_drivers`, initialDrivers));
      const [trips, setTrips] = useState(() => {
        try {
          const saved = localStorage.getItem(`${STORAGE_KEY}_trips`) || localStorage.getItem('fleettrack_v3_trips');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) {
              return parsed.map(t => {
                const g = Number(t.totalRent) || 0;
                const a = Number(t.advanceReceived) || 0;
                const c = Number(t.commissionAmount) || 0;
                const tds = Number(t.tdsAmount) || 0;
                return { ...t, balancePending: Math.max(0, g - a - c - tds) };
              });
            }
          }
        } catch (e) {
          console.warn('Trips parse error:', e);
        }
        return initialTrips;
      });
      const [expenses, setExpenses] = useState(() => safeStorageGet(`${STORAGE_KEY}_expenses`, safeStorageGet('fleettrack_v3_expenses', initialExpenses)));
      const [driverPayments, setDriverPayments] = useState(() => safeStorageGet(`${STORAGE_KEY}_dp`, safeStorageGet('fleettrack_v3_dp', initialDriverPayments)));
      const [settlements, setSettlements] = useState(() => safeStorageGet(`${STORAGE_KEY}_settlements`, safeStorageGet('fleettrack_v3_settlements', initialSettlements)));

      const [dateFilter, setDateFilter] = useState({ preset: 'all', startDate: '', endDate: '' });
      const currency = '₹'; // Exclusively INR

      // Sync to localStorage
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_users`, JSON.stringify(users)); }, [users]);
      useEffect(() => {
        if (currentUser) localStorage.setItem(`${STORAGE_KEY}_cur_user`, JSON.stringify(currentUser));
        else localStorage.removeItem(`${STORAGE_KEY}_cur_user`);
      }, [currentUser]);
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_profiles`, JSON.stringify(profiles)); }, [profiles]);
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_active_prof`, activeProfileId); }, [activeProfileId]);
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_rules`, JSON.stringify(rules)); }, [rules]);
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_email_sync`, JSON.stringify(emailSyncConfigs)); }, [emailSyncConfigs]);
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_trucks`, JSON.stringify(trucks)); }, [trucks]);
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_companies`, JSON.stringify(companies)); }, [companies]);
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_drivers`, JSON.stringify(drivers)); }, [drivers]);
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_trips`, JSON.stringify(trips)); }, [trips]);
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_expenses`, JSON.stringify(expenses)); }, [expenses]);
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_dp`, JSON.stringify(driverPayments)); }, [driverPayments]);
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_settlements`, JSON.stringify(settlements)); }, [settlements]);

      // Auth actions
      const login = (username, password) => {
        const u = users.find(x => x.username.toLowerCase() === username.trim().toLowerCase() && x.password === password);
        if (!u) throw new Error('Invalid username or password');
        setCurrentUser(u);
        const userProfs = profiles.filter(p => p.userId === u.id || (!p.userId && p.name.toLowerCase() === u.businessName.toLowerCase()));
        if (userProfs.length > 0) {
          setActiveProfileId(userProfs[0].id);
        } else {
          const newProfId = `prof-${Date.now()}`;
          const newProf = { id: newProfId, userId: u.id, name: u.businessName, isDefault: true, createdAt: new Date().toISOString().split('T')[0] };
          setProfiles(prev => [...prev, newProf]);
          setActiveProfileId(newProfId);
        }
        return u;
      };

      const signup = (businessName, username, password, email) => {
        if (users.some(x => x.username.toLowerCase() === username.trim().toLowerCase())) {
          throw new Error('Username already exists. Please choose another.');
        }
        const newUserId = `usr-${Date.now()}`;
        const newProfId = `prof-${Date.now()}`;
        const newProf = { id: newProfId, userId: newUserId, name: businessName.trim(), isDefault: true, createdAt: new Date().toISOString().split('T')[0] };
        const newUser = { id: newUserId, username: username.trim(), password, businessName: businessName.trim(), email: email.trim() };

        setProfiles(prev => [...prev, newProf]);
        setRules(prev => ({ ...prev, [newProfId]: { defaultDriverSalaryPercent: 15, defaultTdsPercent: 1 } }));
        setEmailSyncConfigs(prev => ({ ...prev, [newProfId]: { ...defaultEmailSyncConfig, linkedEmail: email.trim() } }));
        setUsers(prev => [...prev, newUser]);

        setCurrentUser(newUser);
        setActiveProfileId(newProfId);
        return newUser;
      };

      const logout = () => {
        setCurrentUser(null);
      };

      // Scoped Profiles: strictly isolated to current user's business
      const scopedProfiles = useMemo(() => {
        if (!currentUser) return [];
        const userProfs = profiles.filter(p => p.userId === currentUser.id || (!p.userId && p.name.toLowerCase() === currentUser.businessName?.toLowerCase()));
        if (userProfs.length === 0) {
          return [{ id: `prof-${currentUser.id}`, userId: currentUser.id, name: currentUser.businessName, isDefault: true, createdAt: new Date().toISOString().split('T')[0] }];
        }
        return userProfs;
      }, [profiles, currentUser]);

      useEffect(() => {
        if (currentUser && scopedProfiles.length > 0) {
          const exists = scopedProfiles.some(p => p.id === activeProfileId);
          if (!exists) {
            setActiveProfileId(scopedProfiles[0].id);
          }
        }
      }, [currentUser, scopedProfiles, activeProfileId]);

      // Email Sync Configuration Actions
      const activeEmailConfig = useMemo(() => {
        return emailSyncConfigs[activeProfileId] || { ...defaultEmailSyncConfig };
      }, [emailSyncConfigs, activeProfileId]);

      const updateEmailSyncConfig = (updates) => {
        setEmailSyncConfigs(prev => ({
          ...prev,
          [activeProfileId]: { ...(prev[activeProfileId] || defaultEmailSyncConfig), ...updates }
        }));
      };

      const activeProfile = useMemo(() => scopedProfiles.find(p => p.id === activeProfileId) || scopedProfiles[0] || { id: 'prof-1', name: currentUser?.businessName || 'Default Entity' }, [scopedProfiles, activeProfileId, currentUser]);
      const activeRules = useMemo(() => rules[activeProfileId] || { defaultDriverSalaryPercent: 15, defaultTdsPercent: 1 }, [rules, activeProfileId]);

      const updateRules = (newRules) => {
        setRules(prev => ({
          ...prev,
          [activeProfileId]: { ...(prev[activeProfileId] || { defaultDriverSalaryPercent: 15, defaultTdsPercent: 1 }), ...newRules }
        }));
      };

      const addProfile = (name) => {
        const newP = { id: `prof-${Date.now()}`, userId: currentUser?.id, name: name.trim(), isDefault: false, createdAt: new Date().toISOString().split('T')[0] };
        setProfiles(prev => [...prev, newP]);
        setRules(prev => ({ ...prev, [newP.id]: { defaultDriverSalaryPercent: 15, defaultTdsPercent: 1 } }));
        setActiveProfileId(newP.id);
        return newP;
      };

      const updateProfile = (id, name) => {
        setProfiles(prev => prev.map(p => p.id === id ? { ...p, name: name.trim() } : p));
      };

      const deleteProfile = (id) => {
        if (scopedProfiles.length <= 1) return alert('Cannot delete the only remaining profile for your business account.');
        const remaining = profiles.filter(p => p.id !== id);
        setProfiles(remaining);
        const remScoped = scopedProfiles.filter(p => p.id !== id);
        if (remScoped.length > 0) setActiveProfileId(remScoped[0].id);
        setTrucks(prev => prev.filter(t => t.profileId !== id));
        setCompanies(prev => prev.filter(c => c.profileId !== id));
        setDrivers(prev => prev.filter(d => d.profileId !== id));
        setTrips(prev => prev.filter(t => t.profileId !== id));
        setExpenses(prev => prev.filter(e => e.profileId !== id));
        setDriverPayments(prev => prev.filter(p => p.profileId !== id));
        setSettlements(prev => prev.filter(s => s.profileId !== id));
      };

      // Scoped Data
      const scopedTrucks = useMemo(() => trucks.filter(t => t.profileId === activeProfileId), [trucks, activeProfileId]);
      const scopedCompanies = useMemo(() => companies.filter(c => c.profileId === activeProfileId), [companies, activeProfileId]);
      const scopedDrivers = useMemo(() => drivers.filter(d => d.profileId === activeProfileId), [drivers, activeProfileId]);
      const scopedTrips = useMemo(() => trips.filter(t => t.profileId === activeProfileId), [trips, activeProfileId]);
      const scopedExpenses = useMemo(() => expenses.filter(e => e.profileId === activeProfileId), [expenses, activeProfileId]);
      const scopedDriverPayments = useMemo(() => driverPayments.filter(p => p.profileId === activeProfileId), [driverPayments, activeProfileId]);
      const scopedSettlements = useMemo(() => settlements.filter(s => s.profileId === activeProfileId), [settlements, activeProfileId]);

      // Date Filtering
      const isDateInRange = (dateStr) => {
        if (dateFilter.preset === 'all') return true;
        const target = new Date(dateStr);
        const now = new Date();
        if (dateFilter.preset === 'this_month') {
          return target.getFullYear() === now.getFullYear() && target.getMonth() === now.getMonth();
        }
        if (dateFilter.preset === 'last_month') {
          const prevMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
          return target.getFullYear() === prevMonth.getFullYear() && target.getMonth() === prevMonth.getMonth();
        }
        if (dateFilter.preset === 'custom') {
          if (dateFilter.startDate && dateFilter.endDate) return dateStr >= dateFilter.startDate && dateStr <= dateFilter.endDate;
          if (dateFilter.startDate) return dateStr >= dateFilter.startDate;
          if (dateFilter.endDate) return dateStr <= dateFilter.endDate;
          return true;
        }
        return true;
      };

      const filteredTrips = useMemo(() => scopedTrips.filter(t => isDateInRange(t.date)), [scopedTrips, dateFilter]);
      const filteredExpenses = useMemo(() => scopedExpenses.filter(e => isDateInRange(e.date)), [scopedExpenses, dateFilter]);
      const filteredDriverPayments = useMemo(() => scopedDriverPayments.filter(p => isDateInRange(p.date)), [scopedDriverPayments, dateFilter]);
      const filteredSettlements = useMemo(() => scopedSettlements.filter(s => isDateInRange(s.date)), [scopedSettlements, dateFilter]);

      // Summary Metrics
      const summaryMetrics = useMemo(() => {
        const totalRevenue = filteredTrips.reduce((s, t) => s + Number(t.totalRent || 0), 0);
        const totalDirectExpenses = filteredExpenses.reduce((s, e) => s + Number(e.amount || 0), 0);
        const totalPendingRentFromTrips = filteredTrips.reduce((s, t) => {
          const reimb = scopedExpenses.filter(e => e.tripId === t.id && e.isReimbursable).reduce((sum, e) => sum + Number(e.amount || 0), 0);
          return s + Math.max(0, Number(t.totalRent || 0) + reimb - Number(t.advanceReceived || 0) - Number(t.commissionAmount || 0) - Number(t.tdsAmount || 0));
        }, 0);
        const totalSettlementsInPeriod = filteredSettlements.reduce((s, st) => s + Number(st.amount || 0), 0);
        const totalCompanyReceivables = Math.max(0, totalPendingRentFromTrips - totalSettlementsInPeriod);

        const totalDriverCommissions = filteredTrips.reduce((s, t) => s + Number(t.driverCommission || 0), 0);
        const totalExpensesClaimed = filteredDriverPayments.filter(p => p.type === 'DRIVER_EXPENSE').reduce((s, p) => s + Number(p.amount || 0), 0);
        const totalPayoutsMade = filteredDriverPayments.filter(p => p.type === 'SALARY_PAYOUT').reduce((s, p) => s + Number(p.amount || 0), 0);
        const netDriverPayable = (totalDriverCommissions + totalExpensesClaimed) - totalPayoutsMade;

        const fleetProfit = totalRevenue - totalDirectExpenses - totalDriverCommissions;
        const totalTdsDeducted = filteredTrips.reduce((s, t) => s + Number(t.tdsAmount || 0), 0);
        const tripsWithTdsCount = filteredTrips.filter(t => t.isTdsDeducted && Number(t.tdsAmount) > 0).length;

        return {
          totalRevenue,
          totalDirectExpenses,
          totalCompanyReceivables,
          netDriverPayable,
          fleetProfit,
          tripsCount: filteredTrips.length,
          totalTdsDeducted,
          tripsWithTdsCount,
        };
      }, [filteredTrips, filteredExpenses, filteredDriverPayments, filteredSettlements, scopedExpenses]);

      // Recomputation Helper
      const computeTripFields = (gross, comm, isTds, adv) => {
        const g = Number(gross) || 0;
        const c = Number(comm) || 0;
        const a = Number(adv) || 0;
        const tdsAmount = isTds ? (g * (activeRules.defaultTdsPercent / 100)) : 0;
        const netRent = Math.max(0, g - tdsAmount - c);
        const driverCommission = netRent * (activeRules.defaultDriverSalaryPercent / 100);
        // Receivables Formula: Balance Due = Total Rent - Advance Received - Commission - TDS
        const balancePending = Math.max(0, g - a - c - tdsAmount);
        return { tdsAmount, netRent, driverCommission, balancePending };
      };

      // Trip Actions
      const addTrip = (input) => {
        const { tdsAmount, netRent, driverCommission, balancePending } = computeTripFields(
          input.totalRent, input.commissionAmount, input.isTdsDeducted, input.advanceReceived
        );

        if (!scopedCompanies.some(c => c.name.toLowerCase() === input.companyName.trim().toLowerCase())) {
          setCompanies(prev => [...prev, { id: `cmp-${Date.now()}`, profileId: activeProfileId, name: input.companyName.trim() }]);
        }
        if (!scopedDrivers.some(d => d.name.toLowerCase() === input.driverName.trim().toLowerCase())) {
          setDrivers(prev => [...prev, { id: `drv-${Date.now()}`, profileId: activeProfileId, name: input.driverName.trim(), phone: 'Pending', licenseNumber: 'Pending' }]);
        }

        const drops = (input.additionalDrops || []).filter(Boolean);
        const route = [input.fromLocation, ...drops, input.toLocation].filter(Boolean).join(' -> ');

        const newTrip = {
          id: `trp-${Date.now()}`,
          profileId: activeProfileId,
          date: input.date,
          truckId: input.truckId,
          companyName: input.companyName.trim(),
          driverName: input.driverName.trim(),
          fromLocation: input.fromLocation.trim(),
          toLocation: input.toLocation.trim(),
          additionalDrops: drops,
          route: route || 'Freight Route',
          totalRent: Number(input.totalRent) || 0,
          commissionAmount: Number(input.commissionAmount) || 0,
          isTdsDeducted: Boolean(input.isTdsDeducted),
          advanceReceived: Number(input.advanceReceived) || 0,
          tdsAmount,
          netRent,
          driverCommission,
          balancePending,
          notes: input.notes,
        };

        setTrips(prev => [newTrip, ...prev]);
        return newTrip;
      };

      const updateTrip = (id, updates) => {
        setTrips(prev => prev.map(t => {
          if (t.id !== id) return t;
          const merged = { ...t, ...updates };
          const { tdsAmount, netRent, driverCommission, balancePending } = computeTripFields(
            merged.totalRent, merged.commissionAmount, merged.isTdsDeducted, merged.advanceReceived
          );
          const drops = (merged.additionalDrops || []).filter(Boolean);
          const route = [merged.fromLocation, ...drops, merged.toLocation].filter(Boolean).join(' -> ');
          return { ...merged, route: route || merged.route, tdsAmount, netRent, driverCommission, balancePending };
        }));
      };

      const deleteTrip = (id) => setTrips(prev => prev.filter(t => t.id !== id));

      // Expense Actions
      const addTruckExpense = (input) => {
        const newExp = {
          id: `exp-${Date.now()}`,
          profileId: activeProfileId,
          date: input.date,
          truckId: input.truckId,
          tripId: input.tripId || undefined,
          isReimbursable: Boolean(input.isReimbursable),
          category: input.category,
          amount: Number(input.amount) || 0,
          paymentMethod: input.paymentMethod,
          notes: input.notes,
        };
        setExpenses(prev => [newExp, ...prev]);
        return newExp;
      };
      const updateTruckExpense = (id, updates) => setExpenses(prev => prev.map(e => e.id === id ? { ...e, ...updates, amount: Number(updates.amount ?? e.amount) } : e));
      const deleteTruckExpense = (id) => setExpenses(prev => prev.filter(e => e.id !== id));

      // Driver Payment Actions
      const addDriverPayment = (input) => {
        const newDp = {
          id: `dp-${Date.now()}`,
          profileId: activeProfileId,
          date: input.date,
          driverName: input.driverName,
          type: input.type,
          amount: Number(input.amount) || 0,
          paymentMethod: input.paymentMethod,
          description: input.description,
        };
        setDriverPayments(prev => [newDp, ...prev]);
        return newDp;
      };
      const updateDriverPayment = (id, updates) => setDriverPayments(prev => prev.map(p => p.id === id ? { ...p, ...updates, amount: Number(updates.amount ?? p.amount) } : p));
      const deleteDriverPayment = (id) => setDriverPayments(prev => prev.filter(p => p.id !== id));

      // Settlement Actions
      const addSettlement = (input) => {
        const newSt = {
          id: `set-${Date.now()}`,
          profileId: activeProfileId,
          date: input.date,
          companyName: input.companyName,
          amount: Number(input.amount) || 0,
          paymentMethod: input.paymentMethod,
          referenceNumber: input.referenceNumber,
          notes: input.notes,
        };
        setSettlements(prev => [newSt, ...prev]);
        return newSt;
      };
      const updateSettlement = (id, updates) => setSettlements(prev => prev.map(s => s.id === id ? { ...s, ...updates, amount: Number(updates.amount ?? s.amount) } : s));
      const deleteSettlement = (id) => setSettlements(prev => prev.filter(s => s.id !== id));

      // Master Entity Actions (with cascading)
      const addTruck = (input) => {
        const newT = { id: `trk-${Date.now()}`, profileId: activeProfileId, ...input };
        setTrucks(prev => [...prev, newT]);
        return newT;
      };
      const updateTruck = (id, fields) => setTrucks(prev => prev.map(t => t.id === id ? { ...t, ...fields } : t));
      const deleteTruck = (id) => {
        if (trips.some(t => t.truckId === id) || expenses.some(e => e.truckId === id)) {
          if (!confirm('This truck has associated trips or expenses. Deleting it will delete them as well. Continue?')) return;
          setTrips(prev => prev.filter(t => t.truckId !== id));
          setExpenses(prev => prev.filter(e => e.truckId !== id));
        }
        setTrucks(prev => prev.filter(t => t.id !== id));
      };

      const addCompany = (input) => {
        const newC = { id: `cmp-${Date.now()}`, profileId: activeProfileId, ...input };
        setCompanies(prev => [...prev, newC]);
        return newC;
      };
      const updateCompany = (id, fields) => {
        const old = companies.find(c => c.id === id);
        if (old && fields.name && fields.name !== old.name) {
          // cascade rename
          setTrips(prev => prev.map(t => t.companyName === old.name ? { ...t, companyName: fields.name } : t));
          setSettlements(prev => prev.map(s => s.companyName === old.name ? { ...s, companyName: fields.name } : s));
        }
        setCompanies(prev => prev.map(c => c.id === id ? { ...c, ...fields } : c));
      };
      const deleteCompany = (id) => {
        const old = companies.find(c => c.id === id);
        if (old) {
          if (trips.some(t => t.companyName === old.name)) {
            if (!confirm('Company has associated trips. Deleting it will remove them. Continue?')) return;
            setTrips(prev => prev.filter(t => t.companyName !== old.name));
            setSettlements(prev => prev.filter(s => s.companyName !== old.name));
          }
        }
        setCompanies(prev => prev.filter(c => c.id !== id));
      };

      const addDriver = (input) => {
        const newD = { id: `drv-${Date.now()}`, profileId: activeProfileId, ...input, status: 'ACTIVE' };
        setDrivers(prev => [...prev, newD]);
        return newD;
      };
      const updateDriver = (id, fields) => {
        const old = drivers.find(d => d.id === id);
        if (old && fields.name && fields.name !== old.name) {
          // cascade rename
          setTrips(prev => prev.map(t => t.driverName === old.name ? { ...t, driverName: fields.name } : t));
          setDriverPayments(prev => prev.map(p => p.driverName === old.name ? { ...p, driverName: fields.name } : p));
        }
        setDrivers(prev => prev.map(d => d.id === id ? { ...d, ...fields } : d));
      };
      const deleteDriver = (id) => {
        const old = drivers.find(d => d.id === id);
        if (old) {
          if (trips.some(t => t.driverName === old.name) || driverPayments.some(p => p.driverName === old.name)) {
            if (!confirm('Driver has associated trips or payments. Deleting will remove them. Continue?')) return;
            setTrips(prev => prev.filter(t => t.driverName !== old.name));
            setDriverPayments(prev => prev.filter(p => p.driverName !== old.name));
          }
        }
        setDrivers(prev => prev.filter(d => d.id !== id));
      };

      const getTruckReg = (idOrReg) => {
        const found = scopedTrucks.find(t => t.id === idOrReg || t.registrationNumber === idOrReg);
        return found ? found.registrationNumber : idOrReg;
      };
      const getCompanyName = (idOrName) => {
        const found = scopedCompanies.find(c => c.id === idOrName || c.name === idOrName);
        return found ? found.name : idOrName;
      };
      const getDriverName = (idOrName) => {
        const found = scopedDrivers.find(d => d.id === idOrName || d.name === idOrName);
        return found ? found.name : idOrName;
      };
      const getTripExpenses = (tripId) => {
        return scopedExpenses.filter(e => e.tripId === tripId).reduce((sum, e) => sum + Number(e.amount || 0), 0);
      };
      const getTripReimbursable = (tripId) => {
        return scopedExpenses.filter(e => e.tripId === tripId && e.isReimbursable).reduce((sum, e) => sum + Number(e.amount || 0), 0);
      };
      const getTripBalancePending = (tripOrId) => {
        if (!tripOrId) return 0;
        const trip = typeof tripOrId === 'string' ? scopedTrips.find(t => t.id === tripOrId) : tripOrId;
        if (!trip) return 0;
        const reimb = getTripReimbursable(trip.id);
        const g = Number(trip.totalRent || 0);
        const a = Number(trip.advanceReceived || 0);
        const c = Number(trip.commissionAmount || 0);
        const tds = Number(trip.tdsAmount || 0);
        return Math.max(0, g + reimb - a - c - tds);
      };
      const getTripProfit = (tripOrId) => {
        if (!tripOrId) return 0;
        const trip = typeof tripOrId === 'string' ? scopedTrips.find(t => t.id === tripOrId) : tripOrId;
        if (!trip) return 0;
        const nonReimbursableExp = scopedExpenses.filter(e => e.tripId === trip.id && !e.isReimbursable).reduce((sum, e) => sum + Number(e.amount || 0), 0);
        return Number(trip.totalRent || 0) - Number(trip.commissionAmount || 0) - Number(trip.tdsAmount || 0) - Number(trip.driverCommission || 0) - nonReimbursableExp;
      };

      // Automated Email Parsing Engine for Toll & Fuel Debits
      const syncExpensesFromEmails = (customSampleEmails = null) => {
        const config = activeEmailConfig;
        if (!config.linkedEmail) {
          throw new Error('Please link an email address in Master Management > Email Expense Sync before syncing.');
        }
        if (!config.tollEnabled && !config.fuelEnabled) {
          throw new Error('Both Toll and Fuel sync options are currently toggled OFF in Master Management.');
        }

        // Available sample emails or operator-provided batch
        const sampleEmails = customSampleEmails || [
          {
            id: `eml-${Date.now()}-1`,
            from: 'fastag-alerts@icicibank.com',
            subject: config.tollSubjectFilter || 'FASTag Toll Debit Alert',
            date: new Date().toISOString().split('T')[0],
            body: `Dear Customer, your FASTag account has been debited by INR 650.00 at Khed-Shivapur Toll Plaza on ${new Date().toISOString().split('T')[0]} for Vehicle ${scopedTrucks[0]?.registrationNumber || 'MH-12-RN-4825'}. Balance remaining: INR 4,200.00.`,
            type: 'TOLL'
          },
          {
            id: `eml-${Date.now()}-2`,
            from: 'fleetcard@iocl.co.in',
            subject: config.fuelSubjectFilter || 'Fuel Transaction Alert',
            date: new Date().toISOString().split('T')[0],
            body: `Transaction Successful. Fuel Purchase of Rs 18,200.00 recorded on Card 4402 for Vehicle ${scopedTrucks[1]?.registrationNumber || 'MH-14-GH-3518'} at IOCL COCO Highway Pump on ${new Date().toISOString().split('T')[0]}. Volume: 198.5 Ltrs.`,
            type: 'DIESEL'
          }
        ];

        let createdCount = 0;
        const newExpensesCreated = [];

        sampleEmails.forEach(mail => {
          const subjectLower = mail.subject.toLowerCase();
          const tollFilterLower = (config.tollSubjectFilter || '').toLowerCase().trim();
          const fuelFilterLower = (config.fuelSubjectFilter || '').toLowerCase().trim();

          const isToll = config.tollEnabled && tollFilterLower && subjectLower.includes(tollFilterLower);
          const isFuel = config.fuelEnabled && fuelFilterLower && subjectLower.includes(fuelFilterLower);

          if (!isToll && !isFuel) return; // Skip if subject filter doesn't match or toggled off

          const category = isToll ? 'TOLL' : 'DIESEL';

          // Extract Amount (e.g., INR 650.00 or Rs 18,200.00)
          let amount = 0;
          const amtMatch = mail.body.match(/(?:INR|Rs\.?|₹)\s*([\d,]+(?:\.\d+)?)/i);
          if (amtMatch) {
            amount = parseFloat(amtMatch[1].replace(/,/g, '')) || 0;
          }

          // Extract Truck Number from Body by checking registered trucks in active profile
          let matchedTruck = scopedTrucks.find(trk => {
            const cleanReg = trk.registrationNumber.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
            const cleanBody = mail.body.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
            return cleanBody.includes(cleanReg);
          });

          // Fallback: search regex pattern like MH-12-RN-4825 or similar
          if (!matchedTruck) {
            const regPattern = /[A-Z]{2}[-\s]?[0-9]{2}[-\s]?[A-Z]{1,3}[-\s]?[0-9]{4}/i;
            const regMatch = mail.body.match(regPattern);
            if (regMatch) {
              const matchedStr = regMatch[0].replace(/\s+/g, '-').toUpperCase();
              matchedTruck = scopedTrucks.find(t => t.registrationNumber.toUpperCase() === matchedStr) || scopedTrucks[0];
            }
          }
          if (!matchedTruck && scopedTrucks.length > 0) matchedTruck = scopedTrucks[0];
          if (!matchedTruck || amount <= 0) return;

          // Tag current ongoing trip for that truck based on date
          const mailDate = mail.date;
          const ongoingTrip = scopedTrips.find(t => {
            return t.truckId === matchedTruck.id && t.date <= mailDate;
          }) || scopedTrips.find(t => t.truckId === matchedTruck.id);

          const newExp = {
            id: `exp-auto-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
            profileId: activeProfileId,
            date: mailDate,
            truckId: matchedTruck.id,
            tripId: ongoingTrip ? ongoingTrip.id : undefined,
            isReimbursable: false,
            category: category,
            amount: amount,
            paymentMethod: isToll ? 'FASTag (Auto-Email)' : 'Fleet Card (Auto-Email)',
            notes: `Auto-parsed from email [${mail.from}]: ${mail.subject} | Ref Truck: ${matchedTruck.registrationNumber}${ongoingTrip ? ` | Tagged to Trip: ${ongoingTrip.route}` : ' | Unlinked (no ongoing trip)'}`
          };

          newExpensesCreated.push(newExp);
          createdCount++;
        });

        if (newExpensesCreated.length > 0) {
          setExpenses(prev => [...newExpensesCreated, ...prev]);
          updateEmailSyncConfig({ lastSyncedAt: new Date().toISOString() });
        }

        return {
          syncedCount: createdCount,
          expenses: newExpensesCreated,
          lastSyncedAt: new Date().toISOString()
        };
      };

      return (
        <FleetContext.Provider value={{
          currentUser, users, login, signup, logout,
          profiles: scopedProfiles, activeProfileId, activeProfile, setActiveProfileId, addProfile, updateProfile, deleteProfile,
          activeRules, updateRules,
          activeEmailConfig, updateEmailSyncConfig, syncExpensesFromEmails,
          trucks: scopedTrucks, companies: scopedCompanies, drivers: scopedDrivers,
          trips: scopedTrips, expenses: scopedExpenses, driverPayments: scopedDriverPayments, settlements: scopedSettlements,
          filteredTrips, filteredExpenses, filteredDriverPayments, filteredSettlements,
          summaryMetrics, dateFilter, setDateFilter, currency,
          addTrip, updateTrip, deleteTrip,
          addTruckExpense, updateTruckExpense, deleteTruckExpense,
          addDriverPayment, updateDriverPayment, deleteDriverPayment,
          addSettlement, updateSettlement, deleteSettlement,
          addTruck, updateTruck, deleteTruck,
          addCompany, updateCompany, deleteCompany,
          addDriver, updateDriver, deleteDriver,
          getTruckReg, getCompanyName, getDriverName,
          getTripExpenses, getTripReimbursable, getTripBalancePending, getTripProfit,
        }}>
          {children}
        </FleetContext.Provider>
      );
    }

    const useFleet = () => useContext(FleetContext);
    const formatCurr = (val) => `₹ ${Number(val || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 })}`;

    // --- COMPONENT: SUMMARY CARDS ---
    function SummaryCards() {
      const { summaryMetrics } = useFleet();
      const cards = [
        { title: 'Total Revenue', value: formatCurr(summaryMetrics.totalRevenue), sub: `${summaryMetrics.tripsCount} Trips logged`, icon: '💵', color: 'from-blue-600/20 to-blue-500/5', border: 'border-blue-500/30', text: 'text-blue-100' },
        { title: 'Outstanding Receivables', value: formatCurr(summaryMetrics.totalCompanyReceivables), sub: 'Pending client collection', icon: '⏳', color: 'from-amber-600/20 to-amber-500/5', border: 'border-amber-500/30', text: 'text-amber-100' },
        { title: 'Net Driver Payable', value: formatCurr(summaryMetrics.netDriverPayable), sub: '15% Comm + claims - advances', icon: '👥', color: 'from-purple-600/20 to-purple-500/5', border: 'border-purple-500/30', text: 'text-purple-100' },
        { title: 'Fleet Net Profit', value: formatCurr(summaryMetrics.fleetProfit), sub: `Direct Costs: ${formatCurr(summaryMetrics.totalDirectExpenses)}`, icon: '📈', color: summaryMetrics.fleetProfit >= 0 ? 'from-emerald-600/20 to-emerald-500/5' : 'from-rose-600/20 to-rose-500/5', border: summaryMetrics.fleetProfit >= 0 ? 'border-emerald-500/30' : 'border-rose-500/30', text: summaryMetrics.fleetProfit >= 0 ? 'text-emerald-100' : 'text-rose-100' }
      ];

      return (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          {cards.map((c, i) => (
            <div key={i} className={`bg-gradient-to-br ${c.color} bg-slate-900/80 border ${c.border} rounded-2xl p-5 shadow-lg backdrop-blur`}>
              <div className="flex items-center justify-between mb-2">
                <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">{c.title}</span>
                <span className="text-xl p-1.5 rounded-lg bg-slate-800/80">{c.icon}</span>
              </div>
              <div className={`text-2xl font-bold tracking-tight font-mono ${c.text}`}>{c.value}</div>
              <p className="text-xs text-slate-400 mt-1">{c.sub}</p>
            </div>
          ))}
        </div>
      );
    }

    // --- COMPONENT: STICKY DATE FILTER ---
    function DateFilter() {
      const { dateFilter, setDateFilter } = useFleet();
      const handlePreset = (preset) => {
        if (preset === 'custom') {
          const today = new Date().toISOString().split('T')[0];
          const past = new Date(Date.now() - 30 * 86400000).toISOString().split('T')[0];
          setDateFilter({ preset: 'custom', startDate: dateFilter.startDate || past, endDate: dateFilter.endDate || today });
        } else {
          setDateFilter({ preset, startDate: '', endDate: '' });
        }
      };

      return (
        <div className="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3 shadow-md mb-6">
          <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-2 text-slate-300 text-xs font-bold uppercase tracking-wider">
              <span className="text-amber-500">📅</span> Date Range Filter:
            </div>
            <div className="flex items-center flex-wrap gap-2">
              {['all', 'this_month', 'last_month', 'custom'].map((p) => {
                const label = p === 'all' ? 'All Time' : p === 'this_month' ? 'This Month' : p === 'last_month' ? 'Last Month' : 'Custom Range';
                const active = dateFilter.preset === p;
                return (
                  <button
                    key={p}
                    onClick={() => handlePreset(p)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${active ? 'bg-amber-500 text-slate-950 font-bold shadow-md' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                  >
                    {label}
                  </button>
                );
              })}
              {dateFilter.preset === 'custom' && (
                <div className="flex items-center gap-2 bg-slate-950/80 border border-slate-700 rounded-lg px-2.5 py-1 ml-1">
                  <input
                    type="date"
                    value={dateFilter.startDate}
                    onChange={(e) => setDateFilter({ ...dateFilter, startDate: e.target.value })}
                    className="bg-transparent text-xs text-slate-200 focus:outline-none [color-scheme:dark]"
                  />
                  <span className="text-slate-500 text-xs">to</span>
                  <input
                    type="date"
                    value={dateFilter.endDate}
                    onChange={(e) => setDateFilter({ ...dateFilter, endDate: e.target.value })}
                    className="bg-transparent text-xs text-slate-200 focus:outline-none [color-scheme:dark]"
                  />
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- SHARED UNIVERSAL EDIT RECORD MODAL ---
    function EditRecordModal({ target, onClose }) {
      const { trucks, companies, drivers, trips, updateTrip, updateTruckExpense, updateDriverPayment, updateSettlement, activeRules } = useFleet();
      if (!target) return null;

      // TRIP STATE
      const [tripDate, setTripDate] = useState(target.data.date || '');
      const [tripTruck, setTripTruck] = useState(target.data.truckId || (trucks[0]?.id || ''));
      const [tripCompany, setTripCompany] = useState(target.data.companyName || '');
      const [tripDriver, setTripDriver] = useState(target.data.driverName || '');
      const [fromLoc, setFromLoc] = useState(target.data.fromLocation || '');
      const [toLoc, setToLoc] = useState(target.data.toLocation || '');
      const [drops, setDrops] = useState(target.data.additionalDrops || []);
      const [totalRent, setTotalRent] = useState(target.data.totalRent?.toString() || '');
      const [comm, setComm] = useState(target.data.commissionAmount?.toString() || '0');
      const [isTds, setIsTds] = useState(target.data.isTdsDeducted ?? true);
      const [adv, setAdv] = useState(target.data.advanceReceived?.toString() || '0');
      const [tripNotes, setTripNotes] = useState(target.data.notes || '');

      // Dynamic calculation helper for live Trip preview
      const modalGross = parseFloat(totalRent) || 0;
      const modalComm = parseFloat(comm) || 0;
      const modalAdv = parseFloat(adv) || 0;
      const modalTdsRate = (activeRules && activeRules.defaultTdsPercent) ? activeRules.defaultTdsPercent : 1;
      const modalDrvRate = (activeRules && activeRules.defaultDriverSalaryPercent) ? activeRules.defaultDriverSalaryPercent : 15;
      const modalTdsAmt = isTds ? (modalGross * (modalTdsRate / 100)) : 0;
      const modalNetRent = Math.max(0, modalGross - modalTdsAmt - modalComm);
      const modalDriverSalary = modalNetRent * (modalDrvRate / 100);
      const modalBalDue = Math.max(0, modalGross - modalAdv - modalComm - modalTdsAmt);

      // EXPENSE STATE
      const [expDate, setExpDate] = useState(target.data.date || '');
      const [expTruck, setExpTruck] = useState(target.data.truckId || '');
      const [expTripId, setExpTripId] = useState(target.data.tripId || '');
      const [expCat, setExpCat] = useState(target.data.category || 'DIESEL');
      const [expAmt, setExpAmt] = useState(target.data.amount?.toString() || '');
      const [expMethod, setExpMethod] = useState(target.data.paymentMethod || 'Fleet Card');
      const [expNotes, setExpNotes] = useState(target.data.notes || '');
      const [expReimbursable, setExpReimbursable] = useState(target.data.isReimbursable || false);

      const truckTrips = (trips || []).filter(t => t.truckId === expTruck);

      // DRIVER PAY STATE
      const [dpDate, setDpDate] = useState(target.data.date || '');
      const [dpDriver, setDpDriver] = useState(target.data.driverName || '');
      const [dpType, setDpType] = useState(target.data.type || 'SALARY_PAYOUT');
      const [dpAmt, setDpAmt] = useState(target.data.amount?.toString() || '');
      const [dpDesc, setDpDesc] = useState(target.data.description || '');

      // SETTLEMENT STATE
      const [setDate, setSetDate] = useState(target.data.date || '');
      const [setCompany, setSetCompany] = useState(target.data.companyName || '');
      const [setAmt, setSetAmt] = useState(target.data.amount?.toString() || '');
      const [setMethod, setSetMethod] = useState(target.data.paymentMethod || 'NEFT');
      const [setRef, setSetRef] = useState(target.data.referenceNumber || '');

      const handleSave = (e) => {
        e.preventDefault();
        if (target.type === 'TRIP') {
          const rentNum = parseFloat(totalRent);
          if (!rentNum || rentNum <= 0) return alert('Enter valid gross rent');
          updateTrip(target.data.id, {
            date: tripDate,
            truckId: tripTruck,
            companyName: tripCompany.trim(),
            driverName: tripDriver.trim(),
            fromLocation: fromLoc.trim(),
            toLocation: toLoc.trim(),
            additionalDrops: drops.filter(Boolean),
            totalRent: rentNum,
            commissionAmount: modalComm,
            isTdsDeducted: isTds,
            advanceReceived: modalAdv,
            tdsAmount: modalTdsAmt,
            netRent: modalNetRent,
            driverCommission: modalDriverSalary,
            balancePending: modalBalDue,
            notes: tripNotes.trim(),
          });
        } else if (target.type === 'EXPENSE' || target.type === 'TRUCK_EXPENSE') {
          const amt = parseFloat(expAmt);
          if (!amt || amt <= 0) return alert('Enter valid amount');
          updateTruckExpense(target.data.id, {
            date: expDate,
            truckId: expTruck,
            tripId: expTripId || undefined,
            category: expCat,
            amount: amt,
            paymentMethod: expMethod,
            notes: expNotes.trim(),
            isReimbursable: expReimbursable,

      const [settleModal, setSettleModal] = useState(null);

        const cTrips = filteredTrips.filter(t => t.companyName === cmp.name);
        const cSettles = filteredSettlements.filter(s => s.companyName === cmp.name);
        const contracted = cTrips.reduce((s, t) => s + Number(t.totalRent), 0);
        const advReceived = cTrips.reduce((s, t) => s + Number(t.advanceReceived), 0);
        const commTotal = cTrips.reduce((s, t) => s + Number(t.commissionAmount || 0), 0);
        const tdsTotal = cTrips.reduce((s, t) => s + Number(t.tdsAmount || 0), 0);
        const reimbTotal = cTrips.reduce((s, t) => s + (getTripReimbursable ? getTripReimbursable(t.id) : 0), 0);
        const settled = cSettles.reduce((s, st) => s + Number(st.amount), 0);
        const totalReceived = advReceived + settled;
        const balanceDue = Math.max(0, contracted + reimbTotal - totalReceived - commTotal - tdsTotal);
        return { cmp, contracted, advReceived, commTotal, tdsTotal, reimbTotal, settled, totalReceived, balanceDue, trips: cTrips, settlements: cSettles };
      });

                            <td className="p-2 text-right font-mono text-white font-bold">{formatCurr(t.totalRent)}</td>

                            <td className="p-2 text-right font-mono text-blue-400">{formatCurr(t.tdsAmount || 0)}</td>

                          -{formatCurr(deepDiveCmp.commTotal)}

                          -{formatCurr(deepDiveCmp.tdsTotal)}

                          +{formatCurr(deepDiveCmp.reimbTotal)}

                        <td className="p-2.5 text-right font-mono text-emerald-400">
                          -{formatCurr(deepDiveCmp.advReceived)}
                        </td>
                        <td className="p-2.5 text-right font-mono text-amber-400 font-extrabold">
                          {formatCurr(deepDiveCmp.balanceDue)}

          {/* Settle Modal */}

              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md shadow-2xl p-6">
                <h3 className="text-base font-bold text-white mb-1">Record Client Settlement</h3>
                <p className="text-xs text-amber-400 mb-4">{settleModal.cmp.name} (Due: {formatCurr(settleModal.balanceDue)})</p>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Payment Method</label>
                    <select value={settleMethod} onChange={(e) => setSettleMethod(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">

    // --- TAB 4: DRIVER SALARY & EXPENDITURE LEDGER ---
    function DriverLedgerTab() {
      const { drivers, filteredTrips, filteredDriverPayments, addDriverPayment, deleteTrip, deleteDriverPayment } = useFleet();
      const [driverModal, setDriverModal] = useState(null);
      const [pType, setPType] = useState('SALARY_PAYOUT');
      const [pAmount, setPAmount] = useState('');
      const [pMethod, setPMethod] = useState('Cash');
      const [pDesc, setPDesc] = useState('');
      const [deepDiveDrvId, setDeepDiveDrvId] = useState(null);
      const [editTarget, setEditTarget] = useState(null);

      const driverLedgers = drivers.map(drv => {
        const dTrips = filteredTrips.filter(t => t.driverName === drv.name);
        const dPayments = filteredDriverPayments.filter(p => p.driverName === drv.name);
        const totalSalaryEarned = dTrips.reduce((s, t) => s + Number(t.driverCommission), 0);
        const totalPayoutsMade = dPayments.filter(p => p.type === 'SALARY_PAYOUT').reduce((s, p) => s + Number(p.amount), 0);
        const totalDriverExpenses = dPayments.filter(p => p.type === 'DRIVER_EXPENSE').reduce((s, p) => s + Number(p.amount), 0);
        const netBalanceDue = (totalSalaryEarned + totalDriverExpenses) - totalPayoutsMade;
        return { drv, totalSalaryEarned, totalPayoutsMade, totalDriverExpenses, netBalanceDue, trips: dTrips, payments: dPayments };
      });

      const deepDiveDrv = deepDiveDrvId ? driverLedgers.find(dl => dl.drv.id === deepDiveDrvId) : null;

      const handlePaymentSubmit = (e) => {
        e.preventDefault();
        const amt = parseFloat(pAmount);
        if (!amt || amt <= 0) return alert('Enter valid amount');
        if (!pDesc.trim()) return alert('Enter description');
        addDriverPayment({
          date: new Date().toISOString().split('T')[0],
          driverName: driverModal.name,
          type: pType,
          amount: amt,
          paymentMethod: pMethod,
          description: pDesc.trim(),
        });
        setDriverModal(null);
        setPAmount('');
        setPDesc('');
      };

      return (
        <div className="space-y-6">
          <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg flex justify-between items-center">
            <div>
              <h2 className="text-lg font-bold text-white">Driver Salary & Expenditure Ledger</h2>
              <p className="text-xs text-slate-400">15% salary on Net Rent, advances tracking, and roadside claims</p>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            {driverLedgers.map(dl => (
              <div key={dl.drv.id} className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg flex flex-col justify-between">
                <div>
                  <div className="flex justify-between items-start mb-2">
                    <h4 onClick={() => setDeepDiveDrvId(dl.drv.id)} className="font-bold text-white text-sm hover:text-purple-400 cursor-pointer">{dl.drv.name}</h4>
                    <span className="text-[10px] px-2 py-0.5 rounded font-bold bg-slate-800 text-slate-300">
                      {dl.trips.length} Trips
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-500 mb-3">{dl.drv.phone}</p>

                  <div className="space-y-1 text-xs">
                    <div className="flex justify-between text-slate-400">
                      <span>15% Net Salary:</span>
                      <span className="text-purple-300 font-mono font-bold">{formatCurr(dl.totalSalaryEarned)}</span>
                    </div>
                    <div className="flex justify-between text-slate-400">
                      <span>Expenses Claimed:</span>
                      <span className="text-blue-300 font-mono">{formatCurr(dl.totalDriverExpenses)}</span>
                    </div>
                    <div className="flex justify-between text-slate-400">
                      <span>Payouts Made:</span>
                      <span className="text-rose-400 font-mono">{formatCurr(dl.totalPayoutsMade)}</span>
                    </div>
                    <div className="flex justify-between text-slate-400 pt-1.5 border-t border-slate-800">
                      <span className="font-bold text-slate-200">Net Due:</span>
                      <span className={`font-bold font-mono ${dl.netBalanceDue >= 0 ? 'text-amber-400' : 'text-emerald-400'}`}>
                        {formatCurr(dl.netBalanceDue)}
                      </span>
                    </div>
                  </div>
                </div>

                <div className="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between gap-2">
                  <button onClick={() => setDeepDiveDrvId(dl.drv.id)} className="text-xs text-slate-400 hover:text-white">
                    Deep-Dive &rarr;
                  </button>
                  <button
                    onClick={() => { setDriverModal(dl.drv); setPType('SALARY_PAYOUT'); }}
                    className="px-2.5 py-1 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-lg text-xs"
                  >
                    + Payout
                  </button>
                </div>
              </div>
            ))}
          </div>

          {/* Deep-Dive Modal */}
          {deepDiveDrv && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-4xl shadow-2xl p-6 max-h-[85vh] flex flex-col">
                <div className="flex justify-between items-center pb-3 border-b border-slate-800">
                  <div>
                    <h3 className="text-lg font-bold text-white">{deepDiveDrv.drv.name} - Driver Deep-Dive</h3>
                    <p className="text-xs text-slate-400">Phone: {deepDiveDrv.drv.phone} • License: {deepDiveDrv.drv.licenseNumber}</p>
                  </div>
                  <button onClick={() => setDeepDiveDrvId(null)} className="text-slate-400 hover:text-white text-lg">✕</button>
                </div>
                <div className="py-4 overflow-y-auto flex-1 space-y-4">
                  <table className="w-full text-left text-xs text-slate-300">
                    <thead className="bg-slate-800/80 text-[10px] uppercase text-slate-400">
                      <tr>
                        <th className="p-2">Date</th>
                        <th className="p-2">Type</th>
                        <th className="p-2">Details</th>
                        <th className="p-2 text-right">Earned/Claimed</th>
                        <th className="p-2 text-right">Paid Out</th>
                        <th className="p-2 text-center">Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {deepDiveDrv.trips.map(t => (
                        <tr key={t.id} className="hover:bg-slate-800/40">
                          <td className="p-2 font-mono text-slate-400">{t.date}</td>
                          <td className="p-2 text-purple-300 font-bold">15% Trip Salary</td>
                          <td className="p-2">{t.route} (Net: {formatCurr(t.netRent)})</td>
                          <td className="p-2 text-right font-mono text-purple-300 font-bold">+{formatCurr(t.driverCommission)}</td>
                          <td className="p-2 text-right font-mono text-slate-500">-</td>
                          <td className="p-2 text-center whitespace-nowrap">
                            <div className="flex items-center justify-center gap-2">
                              <button onClick={() => setEditTarget({ type: 'TRIP', data: t })} className="text-amber-400 hover:underline">
                                Edit
                              </button>
                              <button onClick={() => { if (confirm('Delete trip? Dependent salary will recalculate.')) deleteTrip(t.id); }} className="text-rose-400 hover:underline">
                                Delete
                              </button>
                            </div>
                          </td>
                        </tr>
                      ))}
                      {deepDiveDrv.payments.map(p => (
                        <tr key={p.id} className="hover:bg-slate-800/40">
                          <td className="p-2 font-mono text-slate-400">{p.date}</td>
                          <td className={`p-2 font-bold ${p.type === 'SALARY_PAYOUT' ? 'text-rose-400' : 'text-blue-300'}`}>
                            {p.type === 'SALARY_PAYOUT' ? 'Advance' : 'Expense Claim'}
                          </td>
                          <td className="p-2">{p.description} ({p.paymentMethod || 'Cash'})</td>
                          <td className="p-2 text-right font-mono text-blue-300 font-bold">
                            {p.type === 'DRIVER_EXPENSE' ? `+${formatCurr(p.amount)}` : '-'}
                          </td>
                          <td className="p-2 text-right font-mono text-rose-400 font-bold">
                            {p.type === 'SALARY_PAYOUT' ? `-${formatCurr(p.amount)}` : '-'}
                          </td>
                          <td className="p-2 text-center whitespace-nowrap">
                            <div className="flex items-center justify-center gap-2">
                              <button onClick={() => setEditTarget({ type: 'DRIVER_PAY', data: p })} className="text-amber-400 hover:underline">
                                Edit
                              </button>
                              <button onClick={() => { if (confirm('Delete payment? Driver balance will recalculate.')) deleteDriverPayment(p.id); }} className="text-rose-400 hover:underline">
                                Delete
                              </button>
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                    {/* Driver Deep-Dive Column Totals Footer */}
                    <tfoot className="bg-slate-950 font-bold border-t-2 border-slate-700 text-white">
                      <tr>
                        <td colSpan={3} className="p-2.5 uppercase tracking-wider text-purple-400 font-extrabold text-[11px]">
                          Total ({deepDiveDrv.trips.length} Trips, {deepDiveDrv.payments.length} Payments/Claims)
                        </td>
                        <td className="p-2.5 text-right font-mono text-purple-300 font-extrabold">
                          +{formatCurr(
                            deepDiveDrv.trips.reduce((s, t) => s + Number(t.driverCommission || 0), 0) +
                            deepDiveDrv.payments.filter(p => p.type === 'DRIVER_EXPENSE').reduce((s, p) => s + Number(p.amount || 0), 0)
                          )}
                        </td>
                        <td className="p-2.5 text-right font-mono text-rose-400 font-extrabold">
                          -{formatCurr(
                            deepDiveDrv.payments.filter(p => p.type === 'SALARY_PAYOUT').reduce((s, p) => s + Number(p.amount || 0), 0)
                          )}
                        </td>
                        <td className="p-2.5 text-center font-mono font-extrabold text-amber-400 text-[11px] whitespace-nowrap">
                          Net: {formatCurr(deepDiveDrv.balance)}
                        </td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
                <div className="pt-3 border-t border-slate-800 flex justify-end">
                  <button onClick={() => setDeepDiveDrvId(null)} className="px-4 py-2 bg-slate-800 text-white rounded-lg text-xs font-semibold">Done</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal */}
          {driverModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md shadow-2xl p-6">
                <h3 className="text-base font-bold text-white mb-1">Record Driver Transaction</h3>
                <p className="text-xs text-purple-400 mb-4">{driverModal.name}</p>
                <form onSubmit={handlePaymentSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Type</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => setPType('SALARY_PAYOUT')}
                        className={`p-2.5 rounded-lg border text-xs font-bold text-left ${pType === 'SALARY_PAYOUT' ? 'border-purple-500 bg-purple-500/10 text-purple-300' : 'border-slate-700 bg-slate-800'}`}
                      >
                        💰 Cash Advance
                      </button>
                      <button
                        type="button"
                        onClick={() => setPType('DRIVER_EXPENSE')}
                        className={`p-2.5 rounded-lg border text-xs font-bold text-left ${pType === 'DRIVER_EXPENSE' ? 'border-blue-500 bg-blue-500/10 text-blue-300' : 'border-slate-700 bg-slate-800'}`}
                      >
                        🧾 Expense Claim
                      </button>
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Amount (₹)</label>
                    <input type="number" required min="1" value={pAmount} onChange={(e) => setPAmount(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Payment Method</label>
                    <select value={pMethod} onChange={(e) => setPMethod(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                      <option value="Cash">Cash Handover</option>
                      <option value="UPI">UPI / Mobile</option>
                      <option value="Bank Transfer">Bank Transfer</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Description / Remarks</label>
                    <input type="text" required placeholder="Description..." value={pDesc} onChange={(e) => setPDesc(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white" />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setDriverModal(null)} className="px-4 py-2 text-xs text-slate-400 hover:text-white">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-purple-600 text-white font-bold text-xs rounded-lg shadow-md">Save</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {editTarget && <EditRecordModal target={editTarget} onClose={() => setEditTarget(null)} />}
        </div>
      );
    }

    // --- TAB 5: TDS DEDUCTION LEDGER (NEW) ---
    function TdsLedgerTab() {

      const totalGrossSubjectToTds = tdsTrips.reduce((s, t) => s + Number(t.totalRent), 0);

      return (
        <div className="space-y-6">
          <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg flex justify-between items-center">
            <div>
              <h2 className="text-lg font-bold text-white flex items-center gap-2">
                <span>🧾</span> TDS Deduction Ledger (Section 194C)
              </h2>
              <p className="text-xs text-slate-400">Track 1% TDS withheld at source across client freight contracts</p>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-slate-900/80 border border-emerald-500/30 rounded-2xl p-5 shadow-lg">
              <span className="text-xs font-semibold uppercase text-slate-400">Total TDS Deducted</span>
              <div className="text-2xl font-bold font-mono text-emerald-400 mt-1">{formatCurr(summaryMetrics.totalTdsDeducted)}</div>

            <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg">
              <span className="text-xs font-semibold uppercase text-slate-400">Gross Freight Subject to TDS</span>
              <div className="text-2xl font-bold font-mono text-white mt-1">{formatCurr(totalGrossSubjectToTds)}</div>
              <p className="text-xs text-slate-400 mt-1">Total taxable freight contracts</p>
            </div>
            <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg">
              <span className="text-xs font-semibold uppercase text-slate-400">Trips Without TDS</span>
              <div className="text-2xl font-bold font-mono text-slate-300 mt-1">{filteredTrips.length - tdsTrips.length} Trips</div>

                  <th className="py-2.5 px-3">Truck No.</th>
                  <th className="py-2.5 px-3">Company Name</th>
                  <th className="py-2.5 px-3 text-right">Agreed Gross Rent</th>
                  <th className="py-2.5 px-3 text-right">TDS Amount (1%)</th>
                  <th className="py-2.5 px-3 text-right">Net Rent</th>
                  <th className="py-2.5 px-3 text-center">Trip ID</th>

              <tbody className="divide-y divide-slate-800">
                {tdsTrips.length === 0 ? (
                  <tr><td colSpan={7} className="py-6 text-center text-slate-500">No TDS deducted trips in this period.</td></tr>
