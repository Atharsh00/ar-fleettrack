        trucks, companies, drivers,
        addTruck, updateTruck, deleteTruck,
        addCompany, updateCompany, deleteCompany,
        addDriver, updateDriver, deleteDriver,
        activeProfile,
      } = useFleet();

      const [subTab, setSubTab] = useState('trucks');
      const [searchQuery, setSearchQuery] = useState('');

      // Truck Modal State
      const [truckModalOpen, setTruckModalOpen] = useState(false);
      const [editingTruck, setEditingTruck] = useState(null);
      const [trkReg, setTrkReg] = useState('');
      const [trkModel, setTrkModel] = useState('');
      const [trkCapacity, setTrkCapacity] = useState('25 Ton');
      const [trkDate, setTrkDate] = useState('');
      const [trkStatus, setTrkStatus] = useState('ACTIVE');
      const [trkNotes, setTrkNotes] = useState('');

      // Company Modal State
      const [compModalOpen, setCompModalOpen] = useState(false);
      const [editingComp, setEditingComp] = useState(null);
      const [cmpName, setCmpName] = useState('');
      const [cmpContact, setCmpContact] = useState('');
      const [cmpPhone, setCmpPhone] = useState('');
      const [cmpEmail, setCmpEmail] = useState('');
      const [cmpGstin, setCmpGstin] = useState('');

      // Driver Modal State
      const [drvModalOpen, setDrvModalOpen] = useState(false);
      const [editingDrv, setEditingDrv] = useState(null);
      const [dName, setDName] = useState('');
      const [dPhone, setDPhone] = useState('');
      const [dLicense, setDLicense] = useState('');
      const [dJoining, setDJoining] = useState('');
      const [dStatus, setDStatus] = useState('ACTIVE');

      // Open Modal Helpers
      const openTruckModal = (t = null) => {
        setEditingTruck(t);
        setTrkReg(t ? t.registrationNumber : '');
        setTrkModel(t ? t.model : '');
        setTrkCapacity(t ? (t.capacity || '25 Ton') : '25 Ton');
        setTrkDate(t ? (t.registrationDate || '') : new Date().toISOString().split('T')[0]);
        setTrkStatus(t ? (t.status || 'ACTIVE') : 'ACTIVE');
        setTrkNotes(t ? (t.notes || '') : '');
        setTruckModalOpen(true);
      };

      const handleSaveTruck = (e) => {
        e.preventDefault();
        if (!trkReg.trim()) return alert('Registration number is required');
        if (!trkModel.trim()) return alert('Model is required');
        const payload = {
          registrationNumber: trkReg.trim().toUpperCase(),
          model: trkModel.trim(),
          capacity: trkCapacity.trim(),
          registrationDate: trkDate,
          status: trkStatus,
          notes: trkNotes.trim()
        };
        if (editingTruck) {
          updateTruck(editingTruck.id, payload);
        } else {
          addTruck(payload);
        }
        setTruckModalOpen(false);
      };

      const openCompanyModal = (c = null) => {
        setEditingComp(c);
        setCmpName(c ? c.name : '');
        setCmpContact(c ? (c.contactPerson || '') : '');
        setCmpPhone(c ? (c.phone || '') : '');
        setCmpEmail(c ? (c.email || '') : '');
        setCmpGstin(c ? (c.gstin || '') : '');
        setCompModalOpen(true);
      };

      const handleSaveCompany = (e) => {
        e.preventDefault();
        if (!cmpName.trim()) return alert('Company name is required');
        const payload = {
          name: cmpName.trim(),
          contactPerson: cmpContact.trim(),
          phone: cmpPhone.trim(),
          email: cmpEmail.trim(),
          gstin: cmpGstin.trim().toUpperCase()
        };
        if (editingComp) {
          updateCompany(editingComp.id, payload);
        } else {
          addCompany(payload);
        }
        setCompModalOpen(false);
      };

      const openDriverModal = (d = null) => {
        setEditingDrv(d);
        setDName(d ? d.name : '');
        setDPhone(d ? (d.phone || '') : '');
        setDLicense(d ? (d.licenseNumber || '') : '');
        setDJoining(d ? (d.joiningDate || '') : new Date().toISOString().split('T')[0]);
        setDStatus(d ? (d.status || 'ACTIVE') : 'ACTIVE');
        setDrvModalOpen(true);
      };

      const handleSaveDriver = (e) => {
        e.preventDefault();
        if (!dName.trim()) return alert('Driver name is required');
        const payload = {
          name: dName.trim(),
          phone: dPhone.trim(),
          licenseNumber: dLicense.trim().toUpperCase(),
          joiningDate: dJoining,
          status: dStatus
        };
        if (editingDrv) {
          updateDriver(editingDrv.id, payload);
        } else {
          addDriver(payload);
        }
        setDrvModalOpen(false);
      };

      // Column filter states for Master Tables
      const [truckColFilters, setTruckColFilters] = useState({});
      const [compColFilters, setCompColFilters] = useState({});
      const [drvColFilters, setDrvColFilters] = useState({});

      // Filtered views
      const q = searchQuery.toLowerCase();
      const filteredTrucks = trucks.filter(t => (
        (!q || t.registrationNumber.toLowerCase().includes(q) || (t.model && t.model.toLowerCase().includes(q)) || (t.notes && t.notes.toLowerCase().includes(q))) &&
        (!truckColFilters.reg || t.registrationNumber.toLowerCase().includes(truckColFilters.reg.toLowerCase())) &&
        (!truckColFilters.model || (t.model && t.model.toLowerCase().includes(truckColFilters.model.toLowerCase()))) &&
        (!truckColFilters.capacity || (t.capacity && t.capacity.toLowerCase().includes(truckColFilters.capacity.toLowerCase()))) &&
        (!truckColFilters.date || (t.registrationDate && (t.registrationDate.toLowerCase().includes(truckColFilters.date.toLowerCase()) || formatDate(t.registrationDate).toLowerCase().includes(truckColFilters.date.toLowerCase())))) &&
        (!truckColFilters.notes || (t.notes && t.notes.toLowerCase().includes(truckColFilters.notes.toLowerCase()))) &&
        (!truckColFilters.status || (t.status && t.status.toLowerCase().includes(truckColFilters.status.toLowerCase())))
      ));

      const filteredCompanies = companies.filter(c => (
        (!q || c.name.toLowerCase().includes(q) || (c.contactPerson && c.contactPerson.toLowerCase().includes(q)) || (c.phone && c.phone.toLowerCase().includes(q)) || (c.gstin && c.gstin.toLowerCase().includes(q))) &&
        (!compColFilters.name || c.name.toLowerCase().includes(compColFilters.name.toLowerCase())) &&
        (!compColFilters.contact || (c.contactPerson && c.contactPerson.toLowerCase().includes(compColFilters.contact.toLowerCase()))) &&
        (!compColFilters.phone || (c.phone && c.phone.toLowerCase().includes(compColFilters.phone.toLowerCase()))) &&
        (!compColFilters.email || (c.email && c.email.toLowerCase().includes(compColFilters.email.toLowerCase()))) &&
        (!compColFilters.gstin || (c.gstin && c.gstin.toLowerCase().includes(compColFilters.gstin.toLowerCase())))
      ));

      const filteredDrivers = drivers.filter(d => (
        (!q || d.name.toLowerCase().includes(q) || (d.phone && d.phone.toLowerCase().includes(q)) || (d.licenseNumber && d.licenseNumber.toLowerCase().includes(q))) &&
        (!drvColFilters.name || d.name.toLowerCase().includes(drvColFilters.name.toLowerCase())) &&
        (!drvColFilters.phone || (d.phone && d.phone.toLowerCase().includes(drvColFilters.phone.toLowerCase()))) &&
        (!drvColFilters.license || (d.licenseNumber && d.licenseNumber.toLowerCase().includes(drvColFilters.license.toLowerCase()))) &&
        (!drvColFilters.joining || (d.joiningDate && (d.joiningDate.toLowerCase().includes(drvColFilters.joining.toLowerCase()) || formatDate(d.joiningDate).toLowerCase().includes(drvColFilters.joining.toLowerCase())))) &&
        (!drvColFilters.status || (d.status && d.status.toLowerCase().includes(drvColFilters.status.toLowerCase())))
      ));

      const hasTruckFilters = Object.values(truckColFilters).some(Boolean);
      const hasCompFilters = Object.values(compColFilters).some(Boolean);
      const hasDriverFilters = Object.values(drvColFilters).some(Boolean);

      return (
        <div className="space-y-6">
          {/* Header Banner */}
          <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg flex flex-wrap justify-between items-center gap-3">
            <div>
              <h2 className="text-lg font-bold text-white flex items-center gap-2">
                <span>🛡️</span> Centralized Master Data Management
              </h2>
              <p className="text-xs text-slate-400">Maintain trucks, client companies, drivers, and operational rules. Changes cascade immediately across trips and accounts.</p>
            </div>
            <span className="text-xs px-3 py-1.5 rounded-lg bg-amber-500/10 text-amber-400 border border-amber-500/20 font-bold">
              Active Entity: {activeProfile.name}
            </span>
          </div>

          {/* Sub Navigation Bar & Search */}
          <div className="flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-3 bg-slate-900/60 p-2.5 rounded-2xl border border-slate-800">
            <div className="flex flex-wrap items-center gap-1.5 flex-1">
              {[
                { id: 'trucks', label: `Truck Master (${trucks.length})`, icon: '🚛' },
                { id: 'companies', label: `Company Master (${companies.length})`, icon: '🏢' },
                { id: 'drivers', label: `Driver Master (${drivers.length})`, icon: '👨‍✈️' },
              ].map(st => (
                <button
                  key={st.id}
                  onClick={() => { setSubTab(st.id); setSearchQuery(''); }}
                  className={`flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold transition ${
                    subTab === st.id ? 'bg-amber-500 text-slate-950 shadow-md font-extrabold' : 'text-slate-400 hover:text-white hover:bg-slate-800'
                  }`}
                >
                  <span>{st.icon}</span>
                  <span>{st.label}</span>
                </button>
              ))}
            </div>

            <div className="flex items-center gap-2">
              <input
                type="text"
                placeholder={`Search ${subTab}...`}
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500 w-full sm:w-48"
              />
              {subTab === 'trucks' && (
                <button onClick={() => openTruckModal()} className="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl whitespace-nowrap shadow">
                  + Add Truck
                </button>
              )}
              {subTab === 'companies' && (
                <button onClick={() => openCompanyModal()} className="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl whitespace-nowrap shadow">
                  + Add Company
                </button>
              )}
              {subTab === 'drivers' && (
                <button onClick={() => openDriverModal()} className="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl whitespace-nowrap shadow">
                  + Add Driver
                </button>
              )}
            </div>
          </div>

          {/* SUBTAB: TRUCKS */}
          {subTab === 'trucks' && (
            <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg overflow-x-auto">
              <div className="flex justify-between items-center mb-4">
                <h3 className="text-sm font-bold text-white">Registered Fleet Trucks ({filteredTrucks.length})</h3>
                <span className="text-[11px] text-slate-400">Truck numbers link directly to performance and expense audits</span>
              </div>
              <table className="w-full text-left text-xs text-slate-300">
                <thead className="bg-slate-800/80 text-slate-400 uppercase text-[10px] tracking-wider">
                  <tr>
                    <th className="py-2.5 px-3">Registration No</th>
                    <th className="py-2.5 px-3">Model / Make</th>
                    <th className="py-2.5 px-3">Capacity</th>
                    <th className="py-2.5 px-3">Reg. Date</th>
                    <th className="py-2.5 px-3">Notes</th>
                    <th className="py-2.5 px-3 text-center">Status</th>
                    <th className="py-2.5 px-3 text-center">Actions</th>
                  </tr>
                  <tr className="bg-slate-900/90 border-b border-slate-800">
                    <th className="p-1"><ColFilterInput value={truckColFilters.reg} onChange={v => setTruckColFilters({...truckColFilters, reg: v})} placeholder="Reg..." /></th>
                    <th className="p-1"><ColFilterInput value={truckColFilters.model} onChange={v => setTruckColFilters({...truckColFilters, model: v})} placeholder="Model..." /></th>
                    <th className="p-1"><ColFilterInput value={truckColFilters.capacity} onChange={v => setTruckColFilters({...truckColFilters, capacity: v})} placeholder="Capacity..." /></th>
                    <th className="p-1"><ColFilterInput value={truckColFilters.date} onChange={v => setTruckColFilters({...truckColFilters, date: v})} placeholder="Date..." /></th>
                    <th className="p-1"><ColFilterInput value={truckColFilters.notes} onChange={v => setTruckColFilters({...truckColFilters, notes: v})} placeholder="Notes..." /></th>
                    <th className="p-1"><ColFilterInput value={truckColFilters.status} onChange={v => setTruckColFilters({...truckColFilters, status: v})} placeholder="Status..." className="text-center" /></th>
                    <th className="p-1 text-center">
                      {hasTruckFilters && (
                        <button onClick={() => setTruckColFilters({})} className="text-[10px] text-amber-400 hover:underline font-bold">✕ Clear</button>
                      )}
                    </th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800">
                  {filteredTrucks.length === 0 ? (
                    <tr><td colSpan={7} className="py-8 text-center text-slate-500">No trucks found.</td></tr>
                  ) : (
                    filteredTrucks.map(t => (
                      <tr key={t.id} className="hover:bg-slate-800/40 transition">
                        <td className="py-3 px-3 font-mono font-bold text-amber-400">{t.registrationNumber}</td>
                        <td className="py-3 px-3 font-semibold text-white">{t.model}</td>
                        <td className="py-3 px-3 font-mono text-slate-300">{t.capacity || '25 Ton'}</td>
                        <td className="py-3 px-3 font-mono text-slate-400">{t.registrationDate ? formatDate(t.registrationDate) : '—'}</td>
                        <td className="py-3 px-3 text-slate-400">{t.notes || '—'}</td>
                        <td className="py-3 px-3 text-center">
                          <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${t.status === 'ACTIVE' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'}`}>
                            {t.status || 'ACTIVE'}
                          </span>
                        </td>
                        <td className="py-3 px-3 text-center whitespace-nowrap">
                          <div className="flex items-center justify-center gap-1.5">
                            <button onClick={() => openTruckModal(t)} className="px-2.5 py-1 rounded bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-300 text-xs font-semibold transition">Edit</button>
                            <button onClick={() => deleteTruck(t.id)} className="px-2.5 py-1 rounded bg-slate-800 hover:bg-rose-600 hover:text-white text-rose-400 text-xs font-semibold transition">Delete</button>
                          </div>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          )}

          {/* SUBTAB: COMPANIES */}
          {subTab === 'companies' && (
            <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg overflow-x-auto">
              <div className="flex justify-between items-center mb-4">
                <h3 className="text-sm font-bold text-white">Client Shipper Companies ({filteredCompanies.length})</h3>
                <span className="text-[11px] text-slate-400">Renaming a company updates all historical trips and receivables automatically</span>
              </div>
              <table className="w-full text-left text-xs text-slate-300">
                <thead className="bg-slate-800/80 text-slate-400 uppercase text-[10px] tracking-wider">
                  <tr>
                    <th className="py-2.5 px-3">Company Name</th>
                    <th className="py-2.5 px-3">Contact Person</th>
                    <th className="py-2.5 px-3">Phone</th>
                    <th className="py-2.5 px-3">Email</th>
                    <th className="py-2.5 px-3">GSTIN / Tax ID</th>
                    <th className="py-2.5 px-3 text-center">Actions</th>
                  </tr>
                  <tr className="bg-slate-900/90 border-b border-slate-800">
                    <th className="p-1"><ColFilterInput value={compColFilters.name} onChange={v => setCompColFilters({...compColFilters, name: v})} placeholder="Company..." /></th>
                    <th className="p-1"><ColFilterInput value={compColFilters.contact} onChange={v => setCompColFilters({...compColFilters, contact: v})} placeholder="Contact..." /></th>
                    <th className="p-1"><ColFilterInput value={compColFilters.phone} onChange={v => setCompColFilters({...compColFilters, phone: v})} placeholder="Phone..." /></th>
                    <th className="p-1"><ColFilterInput value={compColFilters.email} onChange={v => setCompColFilters({...compColFilters, email: v})} placeholder="Email..." /></th>
                    <th className="p-1"><ColFilterInput value={compColFilters.gstin} onChange={v => setCompColFilters({...compColFilters, gstin: v})} placeholder="GSTIN..." /></th>
                    <th className="p-1 text-center">
                      {hasCompFilters && (
                        <button onClick={() => setCompColFilters({})} className="text-[10px] text-amber-400 hover:underline font-bold">✕ Clear</button>
                      )}
                    </th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800">
                  {filteredCompanies.length === 0 ? (
                    <tr><td colSpan={6} className="py-8 text-center text-slate-500">No client companies found.</td></tr>
                  ) : (
                    filteredCompanies.map(c => (
                      <tr key={c.id} className="hover:bg-slate-800/40 transition">
                        <td className="py-3 px-3 font-bold text-white">{c.name}</td>
                        <td className="py-3 px-3 text-slate-300">{c.contactPerson || '—'}</td>
                        <td className="py-3 px-3 font-mono text-slate-300">{c.phone || '—'}</td>
                        <td className="py-3 px-3 font-mono text-slate-400">{c.email || '—'}</td>
                        <td className="py-3 px-3 font-mono text-amber-400">{c.gstin || '—'}</td>
                        <td className="py-3 px-3 text-center whitespace-nowrap">
                          <div className="flex items-center justify-center gap-1.5">
                            <button onClick={() => openCompanyModal(c)} className="px-2.5 py-1 rounded bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-300 text-xs font-semibold transition">Edit</button>
                            <button onClick={() => deleteCompany(c.id)} className="px-2.5 py-1 rounded bg-slate-800 hover:bg-rose-600 hover:text-white text-rose-400 text-xs font-semibold transition">Delete</button>
                          </div>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          )}

          {/* SUBTAB: DRIVERS */}
          {subTab === 'drivers' && (
            <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg overflow-x-auto">
              <div className="flex justify-between items-center mb-4">
                <h3 className="text-sm font-bold text-white">Fleet Drivers Roster ({filteredDrivers.length})</h3>
                <span className="text-[11px] text-slate-400">Renaming a driver updates trips and 15% Net salary ledgers</span>
              </div>
              <table className="w-full text-left text-xs text-slate-300">
                <thead className="bg-slate-800/80 text-slate-400 uppercase text-[10px] tracking-wider">
                  <tr>
                    <th className="py-2.5 px-3">Driver Name</th>
                    <th className="py-2.5 px-3">Phone</th>
                    <th className="py-2.5 px-3">License No</th>
                    <th className="py-2.5 px-3">Joining Date</th>
                    <th className="py-2.5 px-3 text-center">Duty Status</th>
                    <th className="py-2.5 px-3 text-center">Actions</th>
                  </tr>
                  <tr className="bg-slate-900/90 border-b border-slate-800">
                    <th className="p-1"><ColFilterInput value={drvColFilters.name} onChange={v => setDrvColFilters({...drvColFilters, name: v})} placeholder="Driver..." /></th>
                    <th className="p-1"><ColFilterInput value={drvColFilters.phone} onChange={v => setDrvColFilters({...drvColFilters, phone: v})} placeholder="Phone..." /></th>
                    <th className="p-1"><ColFilterInput value={drvColFilters.license} onChange={v => setDrvColFilters({...drvColFilters, license: v})} placeholder="License..." /></th>
                    <th className="p-1"><ColFilterInput value={drvColFilters.joining} onChange={v => setDrvColFilters({...drvColFilters, joining: v})} placeholder="Joining..." /></th>
                    <th className="p-1"><ColFilterInput value={drvColFilters.status} onChange={v => setDrvColFilters({...drvColFilters, status: v})} placeholder="Status..." className="text-center" /></th>
                    <th className="p-1 text-center">
                      {hasDriverFilters && (
                        <button onClick={() => setDrvColFilters({})} className="text-[10px] text-amber-400 hover:underline font-bold">✕ Clear</button>
                      )}
                    </th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800">
                  {filteredDrivers.length === 0 ? (
                    <tr><td colSpan={6} className="py-8 text-center text-slate-500">No drivers found.</td></tr>
                  ) : (
                    filteredDrivers.map(d => (
                      <tr key={d.id} className="hover:bg-slate-800/40 transition">
                        <td className="py-3 px-3 font-bold text-white">{d.name}</td>
                        <td className="py-3 px-3 font-mono text-purple-300">{d.phone || '—'}</td>
                        <td className="py-3 px-3 font-mono text-slate-300">{d.licenseNumber || '—'}</td>
                        <td className="py-3 px-3 font-mono text-slate-400">{d.joiningDate ? formatDate(d.joiningDate) : '—'}</td>
                        <td className="py-3 px-3 text-center">
                          <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${d.status === 'ACTIVE' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'}`}>
                            {d.status || 'ACTIVE'}
                          </span>
                        </td>
                        <td className="py-3 px-3 text-center whitespace-nowrap">
                          <div className="flex items-center justify-center gap-1.5">
                            <button onClick={() => openDriverModal(d)} className="px-2.5 py-1 rounded bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-300 text-xs font-semibold transition">Edit</button>
                            <button onClick={() => deleteDriver(d.id)} className="px-2.5 py-1 rounded bg-slate-800 hover:bg-rose-600 hover:text-white text-rose-400 text-xs font-semibold transition">Delete</button>
                          </div>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          )}





          {/* TRUCK MODAL */}
          {truckModalOpen && (
            <ModalPortal>
              <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
                <div className="bg-slate-900 border border-slate-700 rounded-t-2xl sm:rounded-2xl w-full max-w-lg shadow-2xl p-4 sm:p-6 max-h-[92vh] overflow-y-auto">
                  <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-white text-base">{editingTruck ? 'Edit Vehicle Master' : 'Add New Fleet Truck'}</h3>
                  <button onClick={() => setTruckModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleSaveTruck} className="space-y-4">
                  <div className="grid grid-cols-2 gap-3">

    function SettingsModal({ onClose, onOpenExport, onOpenClearData, onOpenDeleteAccount }) {
      const {
        currentUser, profiles, activeProfileId, setActiveProfileId, activeProfile,
        addProfile, deleteProfile,
        activeRules, updateRules,
        activeEmailConfig, updateEmailSyncConfig, syncFromLiveGmail,
        storageMode, cloudSyncStatus, lastCloudSync, pullFromCloud, pushToCloud,
        changePassword, resetPassword, formatDate
      } = useFleet();

      const [activeTab, setActiveTab] = useState('profiles'); // 'profiles' | 'rules' | 'email' | 'cloud' | 'export' | 'security' | 'privacy'

      // Profile Management State
      const [newProfName, setNewProfName] = useState('');
      const handleAddProfile = (e) => {
        e.preventDefault();
        if (!newProfName.trim()) return;
        addProfile(newProfName.trim());
        setNewProfName('');
      };

      // Rules & Formulas State
      const [driverSalaryPct, setDriverSalaryPct] = useState(String(activeRules?.defaultDriverSalaryPercent ?? 15));
      const [autoSalaryEnabled, setAutoSalaryEnabled] = useState(activeRules?.autoDriverSalaryEnabled !== false);
      const [tdsPct, setTdsPct] = useState(String(activeRules?.defaultTdsPercent ?? 1));
      const [rulesSaved, setRulesSaved] = useState(false);

      useEffect(() => {
        if (activeRules) {
          setDriverSalaryPct(String(activeRules.defaultDriverSalaryPercent ?? 15));
          setAutoSalaryEnabled(activeRules.autoDriverSalaryEnabled !== false);
          setTdsPct(String(activeRules.defaultTdsPercent ?? 1));
        }
      }, [activeRules]);

      const handleSaveRules = (e) => {
        e.preventDefault();
        const dVal = parseFloat(driverSalaryPct);
        const tVal = parseFloat(tdsPct);
        if (isNaN(dVal) || isNaN(tVal) || dVal < 0 || tVal < 0) return alert('Enter valid percentage');
        updateRules({
          defaultDriverSalaryPercent: dVal,
          defaultTdsPercent: tVal,
          autoDriverSalaryEnabled: autoSalaryEnabled
        });
        setRulesSaved(true);
        setTimeout(() => setRulesSaved(false), 3000);
      };

      // Email Expense Sync State
      const DEFAULT_GOOGLE_CLIENT_ID = '371057355214-kc8o35sqpnopmth9rdtdsn4qllgj5fe3.apps.googleusercontent.com';
      const [googleToken, setGoogleToken] = useState(() => localStorage.getItem('fleet_google_token') || '');
      const [googleEmail, setGoogleEmail] = useState(() => localStorage.getItem('fleet_google_email') || activeEmailConfig?.linkedEmail || currentUser?.email || '');
      const [syncEmail, setSyncEmail] = useState(activeEmailConfig?.linkedEmail || currentUser?.email || '');
      const [syncTollEnabled, setSyncTollEnabled] = useState(activeEmailConfig?.tollEnabled ?? true);
      const [syncTollSubject, setSyncTollSubject] = useState(activeEmailConfig?.tollSubjectFilter ?? '');
      const [syncFuelEnabled, setSyncFuelEnabled] = useState(activeEmailConfig?.fuelEnabled ?? true);
      const [syncFuelSubject, setSyncFuelSubject] = useState(activeEmailConfig?.fuelSubjectFilter ?? '');
      const [autoSyncEnabled, setAutoSyncEnabled] = useState(() => localStorage.getItem('fleet_auto_sync') !== 'false');
      const [isSyncingGmail, setIsSyncingGmail] = useState(false);
      const [emailSyncSaved, setEmailSyncSaved] = useState(false);
      const [syncStatusMsg, setSyncStatusMsg] = useState(null);
      const [lastSyncTime, setLastSyncTime] = useState(null);

      useEffect(() => {
        const eff = activeEmailConfig?.linkedEmail || currentUser?.email || localStorage.getItem('fleet_google_email') || '';
        if (eff) {
          setSyncEmail(prev => prev || eff);
          setGoogleEmail(prev => prev || eff);
        }
        if (activeEmailConfig) {
          if (activeEmailConfig.tollSubjectFilter !== undefined) setSyncTollSubject(activeEmailConfig.tollSubjectFilter || '');
          if (activeEmailConfig.fuelSubjectFilter !== undefined) setSyncFuelSubject(activeEmailConfig.fuelSubjectFilter || '');
        }
      }, [activeEmailConfig, currentUser]);

      const handleConnectGmail = () => {
        if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
          alert('Google Identity Services script is still loading. Please check your internet connection or refresh the page.');
          return;
        }
        try {
          const effectiveHint = (syncEmail || googleEmail || activeEmailConfig?.linkedEmail || currentUser?.email || '').trim();
          const client = window.google.accounts.oauth2.initTokenClient({
            client_id: DEFAULT_GOOGLE_CLIENT_ID,
            scope: 'https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.modify',
            hint: effectiveHint || undefined,
            callback: async (tokenResponse) => {
              if (tokenResponse && tokenResponse.access_token) {
                const token = tokenResponse.access_token;
                setGoogleToken(token);
                localStorage.setItem('fleet_google_token', token);

                let userEmailFound = '';
                try {
                  const res = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
                    headers: { Authorization: `Bearer ${token}` }
                  });
                  if (res.ok) {
                    const data = await res.json();
                    if (data.email) userEmailFound = data.email;
                  }
                } catch (e) {
                  console.warn('Could not fetch user email info:', e);
                }

                const finalEmail = userEmailFound || effectiveHint || '';
                if (finalEmail) {
                  setGoogleEmail(finalEmail);
                  localStorage.setItem('fleet_google_email', finalEmail);
                  setSyncEmail(finalEmail);
                  updateEmailSyncConfig({ linkedEmail: finalEmail });
                }

                setSyncStatusMsg({
                  error: false,
                  text: `🎉 Successfully connected to Gmail! (${finalEmail || 'Authorized'}) Auto-sync active.`
                });
              } else if (tokenResponse && tokenResponse.error) {
                setSyncStatusMsg({
                  error: true,
                  text: `⚠️ Google authorization failed: ${tokenResponse.error_description || tokenResponse.error}`
                });
              }
            }
          });
          client.requestAccessToken();
        } catch (err) {
          setSyncStatusMsg({ error: true, text: `⚠️ Error initiating Google OAuth: ${err.message}` });
        }
      };

      const handleDisconnectGmail = () => {
        setGoogleToken('');
        setGoogleEmail('');
        localStorage.removeItem('fleet_google_token');
        localStorage.removeItem('fleet_google_email');
        setSyncStatusMsg({
          error: false,
          text: 'Gmail account disconnected.'
        });
      };

      const handleSyncLiveGmail = async (isForce = false) => {
        if (!googleToken) {
          alert('Please connect your Gmail account first.');
          return;
        }
        setIsSyncingGmail(true);
        setSyncStatusMsg(null);

        const currentConfig = {
          linkedEmail: syncEmail.trim() || googleEmail,
          tollEnabled: syncTollEnabled,
          tollSubjectFilter: syncTollSubject.trim(),
          fuelEnabled: syncFuelEnabled,
          fuelSubjectFilter: syncFuelSubject.trim(),
        };
        updateEmailSyncConfig(currentConfig);

        try {
          const res = await syncFromLiveGmail(googleToken, currentConfig, isForce);
          setLastSyncTime(new Date().toLocaleTimeString());
          setSyncStatusMsg({
            error: false,
            text: `✅ ${res.message}`
          });
        } catch (err) {
          setSyncStatusMsg({
            error: true,
            text: `⚠️ Gmail Sync Error: ${err.message}`
          });
        } finally {
          setIsSyncingGmail(false);
        }
      };

      const handleForceRescan = () => {
        localStorage.removeItem('fleet_processed_gmail_msg_ids');
        handleSyncLiveGmail(true);
      };

      // Security / Change Password State
      const [curPass, setCurPass] = useState('');
      const [newPass, setNewPass] = useState('');
      const [confPass, setConfPass] = useState('');
      const [passStatus, setPassStatus] = useState(null);
      const [passLoading, setPassLoading] = useState(false);
      const [skipCurPass, setSkipCurPass] = useState(false);

      const handleChangePass = async (e) => {
        e.preventDefault();
        setPassStatus(null);
        if (newPass !== confPass) {
          setPassStatus({ type: 'error', message: 'New password and confirmation password do not match.' });
          return;
        }
        setPassLoading(true);
        try {
          if (skipCurPass) {
            await resetPassword(currentUser.id, newPass);
          } else {
            await changePassword(curPass, newPass);
          }
          setPassStatus({ type: 'success', message: 'Password successfully updated!' });
          setCurPass('');
          setNewPass('');
          setConfPass('');
        } catch (err) {
          setPassStatus({ type: 'error', message: err.message || 'Failed to update password.' });
        } finally {
          setPassLoading(false);
        }
      };

      // Cloud Action State
      const [dbActionStatus, setDbActionStatus] = useState(null);
      const [dbActionLoading, setDbActionLoading] = useState(false);

        { id: 'profiles', label: 'Entity Profiles', icon: '🏢' },

        { id: 'privacy', label: 'Privacy & Erasure', icon: '🔒' },

    // --- COMPONENT: RICH CSV DATA EXPORT MODAL ---
    function ExportDataModal({ onClose }) {
      const {
        trips, expenses, driverPayments, settlements,
        trucks, companies, drivers,
        activeProfile, getTruckReg, getCompanyName, getDriverName,
        getTripExpenses, getTripBalancePending, getTripProfit,
        dateFilter
      } = useFleet();

      const [exportPreset, setExportPreset] = useState(dateFilter?.preset || 'all');
      const today = new Date().toISOString().split('T')[0];
      const thirtyDaysAgo = new Date(Date.now() - 30 * 86400000).toISOString().split('T')[0];
      const [customStart, setCustomStart] = useState(dateFilter?.startDate || thirtyDaysAgo);
      const [customEnd, setCustomEnd] = useState(dateFilter?.endDate || today);
      const [activeBifurcation, setActiveBifurcation] = useState('trips');
      const [exportSuccess, setExportSuccess] = useState('');

      // Determine date boundary based on preset
      const getDateBounds = () => {
        if (exportPreset === 'all') return { start: '', end: '' };
        if (exportPreset === 'this_month') {
          const now = new Date();
          const start = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
          const end = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0];
          return { start, end };
        }
        if (exportPreset === 'last_month') {
          const now = new Date();
          const start = new Date(now.getFullYear(), now.getMonth() - 1, 1).toISOString().split('T')[0];
          const end = new Date(now.getFullYear(), now.getMonth(), 0).toISOString().split('T')[0];
          return { start, end };
        }
        if (exportPreset === 'last_30_days') {
          return { start: thirtyDaysAgo, end: today };
        }
        if (exportPreset === 'custom') {
          return { start: customStart, end: customEnd };
        }
        return { start: '', end: '' };
      };

      const { start: filterStart, end: filterEnd } = getDateBounds();

      // Filter helpers
      const filterByDate = (items) => {
        return items.filter(item => {
          if (!filterStart && !filterEnd) return true;
          if (filterStart && item.date < filterStart) return false;
          if (filterEnd && item.date > filterEnd) return false;
          return true;
        });
      };

      const expTrips = useMemo(() => filterByDate(trips).sort(compareRecordsDesc), [trips, filterStart, filterEnd]);
      const expExpenses = useMemo(() => filterByDate(expenses).sort(compareRecordsDesc), [expenses, filterStart, filterEnd]);
      const expPayments = useMemo(() => filterByDate(driverPayments).sort(compareRecordsDesc), [driverPayments, filterStart, filterEnd]);
      const expSettlements = useMemo(() => filterByDate(settlements).sort(compareRecordsDesc), [settlements, filterStart, filterEnd]);

      // RFC 4180 Escaping helper
      const escapeCSV = (val) => {
        if (val === null || val === undefined) return '""';
        const str = String(val).replace(/"/g, '""');
        return `"${str}"`;
      };

      const triggerDownload = (filename, csvContent) => {
        const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      };

      // Bifurcation data extractors (returns { headers: string[], rows: (string|number)[][] })
      const getBifurcationData = (key) => {
        const profileName = (activeProfile?.name || 'Fleet').replace(/[^a-zA-Z0-9_-]/g, '_');
        if (key === 'trips') {
          const headers = [
            'Trip ID', 'Date', 'Truck Reg', 'Company / Client', 'Driver Name', 'Route',
            'Gross Freight (INR)', 'Advance (INR)', 'Balance Pending (INR)',
            'TDS Deducted (INR)', 'TDS Rate (%)', 'Driver Cash Tolls (INR)',
            'FASTag Tolls (INR)', 'Fuel Expenses (INR)', 'Other Expenses (INR)',
            'Driver Comm 15% (INR)', 'Net Trip Profit (INR)', 'Status', 'Notes'
          ];
          const rows = expTrips.map(t => {
            const exp = getTripExpenses ? getTripExpenses(t.id) : { driverTolls: 0, fastagTolls: 0, dieselExpenses: 0, otherDirectExpenses: 0 };
            const bal = getTripBalancePending ? getTripBalancePending(t) : ((Number(t.freightAmount) || 0) - (Number(t.advance) || 0) - (Number(t.tdsDeducted) || 0));
            const comm = Math.round((Number(t.freightAmount) || 0) * 0.15);
            const prof = getTripProfit ? getTripProfit(t) : 0;
            return [
              t.id, t.date, getTruckReg(t.truckId), getCompanyName(t.companyName), getDriverName(t.driverName), t.route,
              t.freightAmount || 0, t.advance || 0, bal,
              t.tdsDeducted || 0, t.tdsRate || 0, exp.driverTolls || 0,
              exp.fastagTolls || 0, exp.dieselExpenses || 0, exp.otherDirectExpenses || 0,
              comm, prof, t.status || 'COMPLETED', t.notes || ''
            ];
          });
          return { headers, rows, title: 'Trips & Freight Ledger', filename: `Trips_${profileName}_${exportPreset}.csv` };
        }

        if (key === 'expenses') {
          const headers = [
            'Expense ID', 'Date', 'Truck Reg', 'Category', 'Payment Method',
            'Amount (INR)', 'Reimbursable (Trip Advance)', 'Linked Trip Route', 'Notes'
          ];
          const rows = expExpenses.map(e => {
            const linkedTrip = trips.find(t => t.id === e.tripId);
            return [
              e.id, e.date, getTruckReg(e.truckId), e.category, e.paymentMethod,
              e.amount || 0, e.isReimbursable ? 'YES' : 'NO', linkedTrip ? linkedTrip.route : 'Unlinked', e.notes || ''
            ];
          });
          return { headers, rows, title: 'Truck Expenses (Fuel, Tolls & Repairs)', filename: `Expenses_${profileName}_${exportPreset}.csv` };
        }

        if (key === 'driver_payments') {
          const headers = [
            'Payment ID', 'Date', 'Driver Name', 'Payment Type', 'Amount (INR)',
            'Payment Mode', 'Notes'
          ];
          const rows = expPayments.map(p => [
            p.id, p.date, getDriverName(p.driverName), p.type || 'ADVANCE', p.amount || 0,
            p.paymentMethod || 'CASH', p.notes || ''
          ]);
          return { headers, rows, title: 'Driver Payments & Road Advances', filename: `Driver_Ledger_${profileName}_${exportPreset}.csv` };
        }

        if (key === 'settlements') {
          const headers = [
            'Settlement ID', 'Date', 'Company / Client', 'Amount Received (INR)',
            'Payment Mode', 'Reference / Cheque No', 'Notes'
          ];
          const rows = expSettlements.map(s => [
            s.id, s.date, getCompanyName(s.companyName), s.amount || 0,
            s.paymentMethod || 'BANK_TRANSFER', s.referenceNumber || '', s.notes || ''
          ]);
          return { headers, rows, title: 'Client Settlements & Freight Receipts', filename: `Settlements_${profileName}_${exportPreset}.csv` };
        }

        if (key === 'trucks') {
          const headers = [
            'Truck ID', 'Registration Number', 'Model / Make', 'Year', 'Fuel Capacity (L)',
            'Insurance Due', 'Fitness Due', 'Status'
          ];
          const rows = trucks.map(t => [
            t.id, t.registrationNumber, t.model || '', t.year || '', t.fuelCapacity || '',
            t.insuranceDueDate || '', t.fitnessDueDate || '', t.status || 'ACTIVE'
          ]);
          return { headers, rows, title: 'Master: Trucks Registered', filename: `Trucks_Master_${profileName}.csv` };
        }

        if (key === 'companies') {
          const headers = [
            'Company ID', 'Company Name', 'Contact Person', 'Phone', 'Email', 'GSTIN', 'Address'
          ];
          const rows = companies.map(c => [
            c.id, c.name, c.contactPerson || '', c.phone || '', c.email || '', c.gstin || '', c.address || ''
          ]);
          return { headers, rows, title: 'Master: Companies & Clients', filename: `Companies_Master_${profileName}.csv` };
        }

        if (key === 'drivers') {
          const headers = [
            'Driver ID', 'Name', 'Phone', 'License Number', 'Daily Wage (INR)', 'Status'
          ];
          const rows = drivers.map(d => [
            d.id, d.name, d.phone || '', d.licenseNumber || '', d.dailyWage || 0, d.status || 'ACTIVE'
          ]);
          return { headers, rows, title: 'Master: Drivers', filename: `Drivers_Master_${profileName}.csv` };
        }

        if (key === 'summary') {
          const totalFreight = expTrips.reduce((acc, t) => acc + (Number(t.freightAmount) || 0), 0);
          const totalAdvReceived = expTrips.reduce((acc, t) => acc + (Number(t.advance) || 0), 0);
          const totalSettlements = expSettlements.reduce((acc, s) => acc + (Number(s.amount) || 0), 0);
          const totalTDS = expTrips.reduce((acc, t) => acc + (Number(t.tdsDeducted) || 0), 0);
          const pendingReceivable = totalFreight - totalAdvReceived - totalSettlements - totalTDS;
          const totalDirectExp = expExpenses.reduce((acc, e) => acc + (Number(e.amount) || 0), 0);
          const totalDriverPaid = expPayments.reduce((acc, p) => acc + (Number(p.amount) || 0), 0);
          const total15Comm = expTrips.reduce((acc, t) => acc + Math.round((Number(t.freightAmount) || 0) * 0.15), 0);
          const netEstimatedProfit = totalFreight - totalDirectExp - total15Comm;

          const headers = ['Financial Metric', 'Value (INR)', 'Detailed Breakdown / Notes'];
          const rows = [
            ['Active Business Profile', profileName, 'Scope of generated report'],
            ['Date Range Filter', `${filterStart || 'Beginning'} to ${filterEnd || 'Present'}`, `Preset: ${exportPreset}`],
            ['Total Trips Dispatched', expTrips.length, 'Count of freight trips completed in period'],
            ['Total Gross Freight Revenue', totalFreight, 'Sum of all billable trip freight amounts'],
            ['Freight Advance Received', totalAdvReceived, 'Advances paid upon loading'],
            ['Company Settlements Collected', totalSettlements, 'Balance bank transfers and cheques received'],
            ['TDS Deducted by Clients', totalTDS, 'Withholding tax deducted under Section 194C'],
            ['Net Outstanding Client Receivables', pendingReceivable, 'Pending collection from all companies'],
            ['Total Truck Operating Costs', totalDirectExp, 'Fuel, Tolls (Cash & FASTag), Repairs & Maintenance'],
            ['Driver 15% Standard Commission', total15Comm, '15% net commission on trip freight'],
            ['Driver Road Advances & Salary Paid', totalDriverPaid, 'Direct payments made to drivers'],
            ['Net Fleet Operating Profit', netEstimatedProfit, 'Gross Freight minus direct truck operating costs minus 15% driver commission']
          ];
          return { headers, rows, title: 'Financial P&L Summary', filename: `Financial_Summary_${profileName}_${exportPreset}.csv` };
        }

        return { headers: [], rows: [], title: '', filename: 'export.csv' };
      };

      const currentBifurcation = getBifurcationData(activeBifurcation);

      const downloadBifurcationCSV = (key) => {
        const data = getBifurcationData(key);
        if (!data.headers.length) return;
        const csvRows = [
          data.headers.map(escapeCSV).join(','),
          ...data.rows.map(row => row.map(escapeCSV).join(','))
        ];
        triggerDownload(data.filename, csvRows.join('\r\n'));
      };

      const handleDownloadCurrent = () => {
        downloadBifurcationCSV(activeBifurcation);
        setExportSuccess(`Exported "${currentBifurcation.title}" to CSV successfully!`);
        setTimeout(() => setExportSuccess(''), 4000);
      };

      const handleDownloadAll = async () => {
        const keys = ['trips', 'expenses', 'driver_payments', 'settlements', 'trucks', 'companies', 'drivers', 'summary'];
        setExportSuccess('Exporting all 8 tables to separate CSV files...');
        for (let i = 0; i < keys.length; i++) {
          downloadBifurcationCSV(keys[i]);
          await new Promise(r => setTimeout(r, 250)); // Stagger downloads to prevent browser blocking
        }
        setExportSuccess('All 8 CSV tables exported successfully!');
        setTimeout(() => setExportSuccess(''), 5000);
      };

      const bifurcationTabs = [

    // --- AUTHENTICATION & MULTI-TENANT ACCESS SCREEN ---
    function AuthScreen() {
      const { login, signup, resetPassword, loginDemo, requestPasswordResetOtp, verifyOtpAndResetPassword } = useFleet();
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'signup' | 'forgot'
      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [errorMsg, setErrorMsg] = useState('');
      const [successMsg, setSuccessMsg] = useState('');
      const [isLoading, setIsLoading] = useState(false);

      // Registration fields
      const [regBusiness, setRegBusiness] = useState('');
      const [regUser, setRegUser] = useState('');
      const [regPass, setRegPass] = useState('');
      const [regEmail, setRegEmail] = useState('');

      // Forgot Password OTP flow
      const [forgotStep, setForgotStep] = useState(1); // 1 = Enter Username/Email & Get OTP, 2 = Verify OTP & Reset Pass
      const [forgotUserOrEmail, setForgotUserOrEmail] = useState('');
      const [forgotOtp, setForgotOtp] = useState('');
      const [forgotMaskedEmail, setForgotMaskedEmail] = useState('');
      const [forgotNewPass, setForgotNewPass] = useState('');
      const [forgotConfirmPass, setForgotConfirmPass] = useState('');

      const handleLogin = async (e) => {
        if (e) e.preventDefault();
        setErrorMsg('');
        setSuccessMsg('');
        setIsLoading(true);
        try {
          await login(loginUser, loginPass);
        } catch (err) {
          setErrorMsg(err.message || 'Invalid username or password');
        } finally {
          setIsLoading(false);
        }
      };

      const handleSignup = async (e) => {
        if (e) e.preventDefault();
        setErrorMsg('');
        setSuccessMsg('');
        if (!regBusiness.trim() || !regUser.trim() || !regPass.trim() || !regEmail.trim()) {
          setErrorMsg('All fields are required to register.');
          return;
        }
        setIsLoading(true);
        try {
          await signup(regBusiness, regUser, regPass, regEmail);
        } catch (err) {
          setErrorMsg(err.message || 'Registration failed');
        } finally {
          setIsLoading(false);
        }
      };

      const handleRequestOtp = async (e) => {
        if (e) e.preventDefault();
        setErrorMsg('');
        setSuccessMsg('');
        if (!forgotUserOrEmail.trim()) {
          setErrorMsg('Please enter your username or registered email.');
          return;
        }
        setIsLoading(true);
        try {
          const res = await requestPasswordResetOtp(forgotUserOrEmail.trim());
          setForgotMaskedEmail(res.maskedEmail || res.email);
          setForgotStep(2);
          setSuccessMsg(`A 6-digit OTP code has been dispatched to ${res.maskedEmail || res.email}. Please check your inbox and spam folder.`);
        } catch (err) {
          setErrorMsg(err.message || 'Failed to send OTP.');
        } finally {
          setIsLoading(false);
        }
      };

      const handleVerifyOtpAndReset = async (e) => {
        if (e) e.preventDefault();
        setErrorMsg('');
        setSuccessMsg('');
        if (!forgotOtp.trim()) {
          setErrorMsg('Please enter the 6-digit verification OTP code.');
          return;
        }
        if (forgotOtp.trim().length !== 6) {
          setErrorMsg('OTP code must be exactly 6 digits.');
          return;
        }
        if (!forgotNewPass.trim() || forgotNewPass.length < 6) {
          setErrorMsg('New password must be at least 6 characters long.');
          return;
        }
        if (forgotNewPass !== forgotConfirmPass) {
          setErrorMsg('New password and confirmation password do not match.');
          return;
        }
        setIsLoading(true);
        try {
          await verifyOtpAndResetPassword(forgotUserOrEmail.trim(), forgotOtp.trim(), forgotNewPass);
          setSuccessMsg('Your password has been successfully reset! You can now sign in with your new password.');
          setLoginUser(forgotUserOrEmail.trim());
          setLoginPass(forgotNewPass);
          setForgotStep(1);
          setForgotOtp('');
          setForgotNewPass('');
          setForgotConfirmPass('');
          setAuthMode('login');
        } catch (err) {
          setErrorMsg(err.message || 'OTP verification failed.');
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-center items-center p-4 relative overflow-hidden font-sans">
          {/* Subtle background glow effect */}
          <div className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

          <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative z-10 backdrop-blur-xl">
            {/* Header / Logo */}
            <div className="flex flex-col items-center text-center mb-6">
              <ARLogo className="w-16 h-16 mb-2 drop-shadow-[0_4px_16px_rgba(245,158,11,0.3)]" />
              <div className="flex items-baseline tracking-wider uppercase font-black text-2xl text-white">
                <span className="text-3xl text-amber-400 mr-2 drop-shadow-[0_2px_8px_rgba(245,158,11,0.4)]">AR</span>
                FLEETTRACK
              </div>
              <p className="text-xs text-slate-400 mt-1">Multi-Entity Fleet Expense & Revenue Management System</p>
              <div className="mt-2 inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-slate-800 border border-slate-700 text-[10px] text-amber-400 font-bold uppercase tracking-wider">
                <span>🔒 Isolated Multi-Tenant Workspace</span>
              </div>
            </div>

            {/* Mode Tabs */}
            <div className="grid grid-cols-2 gap-1.5 p-1 bg-slate-950/80 rounded-2xl border border-slate-800 mb-6">
              <button
                type="button"
                onClick={() => { setAuthMode('login'); setErrorMsg(''); setSuccessMsg(''); }}
                className={`py-2 rounded-xl text-xs font-bold transition ${
                  authMode === 'login' || authMode === 'forgot'
                    ? 'bg-amber-500 text-slate-950 font-black shadow-md'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                Sign In
              </button>
              <button
                type="button"
                onClick={() => { setAuthMode('signup'); setErrorMsg(''); setSuccessMsg(''); }}
                className={`py-2 rounded-xl text-xs font-bold transition ${
                  authMode === 'signup'
                    ? 'bg-amber-500 text-slate-950 font-black shadow-md'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                Register Business
              </button>
            </div>

            {/* Success Notification */}
            {successMsg && (
              <div className="mb-4 p-3 rounded-xl bg-emerald-950/70 border border-emerald-800/80 text-emerald-200 text-xs font-semibold animate-fadeIn flex items-center gap-2">
                <span>✅</span>
                <span>{successMsg}</span>
              </div>
            )}

            {/* Error Message */}
            {errorMsg && (
              <div className="mb-4 p-3 rounded-xl bg-rose-950/70 border border-rose-800/80 text-rose-200 text-xs font-semibold animate-fadeIn flex items-center gap-2">
                <span>⚠️</span>
                <span>{errorMsg}</span>
              </div>
            )}

            {/* Forgot Password Form (2-Step OTP Verification Flow) */}
            {authMode === 'forgot' ? (
              <div>
                {forgotStep === 1 ? (
                  <form onSubmit={handleRequestOtp} className="space-y-4">
                    <div className="text-center mb-3">
                      <div className="w-10 h-10 mx-auto rounded-full bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-lg mb-2">
                        🔑
                      </div>
                      <h3 className="text-sm font-bold text-white">Reset Account Password</h3>
                      <p className="text-[11px] text-slate-400 mt-0.5">
                        Step 1: Enter your registered username or email to receive a secure 6-digit OTP code via email.
                      </p>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-300 mb-1">Username or Registered Email *</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. apex or accounts@company.com"
                        value={forgotUserOrEmail}
                        onChange={(e) => setForgotUserOrEmail(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500 font-medium"
                      />
                      <p className="text-[10px] text-slate-500 mt-1">An authentication OTP code will be sent to your linked email address.</p>
                    </div>
                    <button
                      type="submit"
                      disabled={isLoading}
                      className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs rounded-xl shadow-lg shadow-amber-500/20 transition duration-150 uppercase tracking-wider flex items-center justify-center gap-2"
                    >
                      <span>✉️</span>
                      <span>{isLoading ? 'Generating & Sending OTP...' : 'Send OTP via Supabase Mail'}</span>
                    </button>
                    <div className="text-center pt-2">
                      <button
                        type="button"
                        onClick={() => { setAuthMode('login'); setErrorMsg(''); setSuccessMsg(''); }}
                        className="text-xs text-slate-400 hover:text-white underline font-medium"
                      >
                        ← Back to Sign In
                      </button>
                    </div>
                  </form>
                ) : (
                  <form onSubmit={handleVerifyOtpAndReset} className="space-y-3.5">
                    <div className="text-center mb-3">
                      <div className="w-10 h-10 mx-auto rounded-full bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-lg mb-2">
                        📬
                      </div>
                      <h3 className="text-sm font-bold text-white">Verify OTP & Set New Password</h3>
                      <p className="text-[11px] text-emerald-400 mt-0.5 font-medium">
                        OTP dispatched to <strong className="text-white font-mono">{forgotMaskedEmail}</strong>
                      </p>
                      <p className="text-[10px] text-slate-400 mt-0.5">Valid for 15 minutes. Check spam folder if not received.</p>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-amber-300 mb-1">Enter 6-Digit OTP Code *</label>
                      <input
                        type="text"
                        required
                        maxLength={6}
                        placeholder="••••••"
                        value={forgotOtp}
                        onChange={(e) => setForgotOtp(e.target.value.replace(/[^0-9]/g, ''))}
                        className="w-full bg-slate-950 border border-amber-500/50 rounded-xl px-3.5 py-2.5 text-center text-lg font-mono tracking-[0.5em] text-white focus:outline-none focus:border-amber-400 font-bold"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-300 mb-1">New Password * (Min 6 characters)</label>
                      <input
                        type="password"
                        required
                        placeholder="Enter new password"
                        value={forgotNewPass}
                        onChange={(e) => setForgotNewPass(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-amber-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-300 mb-1">Confirm New Password *</label>
                      <input
                        type="password"
                        required
                        placeholder="Re-enter new password"
                        value={forgotConfirmPass}
                        onChange={(e) => setForgotConfirmPass(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-amber-500"
                      />
                    </div>
                    <button
                      type="submit"
                      disabled={isLoading}
                      className="w-full mt-2 py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs rounded-xl shadow-lg shadow-emerald-500/20 transition duration-150 uppercase tracking-wider flex items-center justify-center gap-2"
                    >
                      <span>🔒</span>
                      <span>{isLoading ? 'Verifying & Resetting...' : 'Verify OTP & Reset Password'}</span>
                    </button>

                    {/* Email Delivery Assistance */}
                    <div className="bg-slate-950/70 border border-slate-800 rounded-xl p-3 text-[11px] text-slate-400 space-y-1.5 mt-3">
                      <div className="flex items-center gap-1.5 text-slate-300 font-semibold">
                        <span>💡</span>
                        <span>Didn't receive the email in your Inbox?</span>
                      </div>
                      <p className="leading-relaxed">
                        Please check your <strong>Spam / Junk</strong> or <strong>Promotions</strong> folder for an email from Supabase. The link or code remains valid for 15 minutes.
                      </p>
                    </div>

                    <div className="flex items-center justify-between pt-2 text-xs">
                      <button
                        type="button"
                        onClick={handleRequestOtp}
                        disabled={isLoading}
                        className="text-amber-400 hover:text-amber-300 underline font-medium"
                      >
                        Resend OTP Code
                      </button>
                      <button
                        type="button"
                        onClick={() => { setForgotStep(1); setErrorMsg(''); setSuccessMsg(''); }}
                        className="text-slate-400 hover:text-white underline font-medium"
                      >
                        Change Username/Email
                      </button>
                    </div>
                    <div className="text-center pt-1">
                      <button
                        type="button"
                        onClick={() => { setAuthMode('login'); setForgotStep(1); setErrorMsg(''); setSuccessMsg(''); }}
                        className="text-xs text-slate-400 hover:text-white underline font-medium"
                      >
                        ← Back to Sign In
                      </button>
                    </div>
                  </form>
                )}
              </div>
            ) : authMode === 'login' ? (
              /* Login Form */
              <div>
                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1.5">Username</label>
                    <input

                      required
                      placeholder="e.g. apex or kiran"
                      value={loginUser}
                      onChange={(e) => setLoginUser(e.target.value)}

                        Forgot Password?

                    <input

              onOpenClearData={(scope) => {
                setClearActionType(scope || 'ledgers');
                setClearWipeMasters(scope === 'masters');
                setClearConfirmed(false);
                setShowClearModal(true);
              }}
              onOpenDeleteAccount={() => {
                setClearActionType('account');
                setClearWipeMasters(true);
                setClearConfirmed(false);
                setShowClearModal(true);
              }}
            />
          )}

          {showChangePassModal && <ChangePasswordModal onClose={() => setShowChangePassModal(false)} />}
          {showExportModal && <ExportDataModal onClose={() => setShowExportModal(false)} />}

          {/* Android Mobile Slide-Over Drawer */}
          {mobileDrawerOpen && (
            <ModalPortal>
              <div className="fixed inset-0 z-50 md:hidden flex justify-end animate-fadeIn">
              {/* Backdrop */}
              <div
                className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm transition-opacity"
                onClick={() => setMobileDrawerOpen(false)}
              />

              {/* Drawer Panel */}
              <div className="relative w-4/5 max-w-xs bg-slate-900 border-l border-slate-800 h-full flex flex-col z-10 shadow-2xl overflow-y-auto">
                {/* Drawer Header */}
                <div className="p-4 border-b border-slate-800 bg-slate-950/70 flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <ARLogo className="w-8 h-8" />
                    <div>
                      <div className="text-sm font-black text-white">AR FLEETTRACK</div>
                      <div className="text-[10px] text-amber-400 truncate max-w-[150px]">
                        {activeProfile?.name || currentUser?.businessName || currentUser?.username}
                      </div>
                    </div>
                  </div>
                  <button
                    onClick={() => setMobileDrawerOpen(false)}
                    className="text-slate-400 hover:text-white p-1 text-lg rounded-lg leading-none"
                    title="Close Menu"
                  >
                    ✕
                  </button>
                </div>

                {/* Entity Switcher (when multiple profiles exist) */}
                {profiles && profiles.length > 1 && (
                  <div className="p-3 bg-slate-800/40 border-b border-slate-800">
                    <label className="block text-[10px] uppercase font-bold text-slate-400 mb-1">🏢 Active Entity</label>
                    <select
                      value={activeProfileId}
                      onChange={(e) => setActiveProfileId(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white font-bold"
                    >
                      {profiles.map(p => (
                        <option key={p.id} value={p.id}>
                          {p.name} {p.id === activeProfileId ? '✓' : ''}
                        </option>
                      ))}
                    </select>
                  </div>
                )}

                {/* Navigation Modules */}
                <div className="flex-1 p-3 space-y-1">
                  <div className="text-[10px] uppercase font-bold text-slate-500 px-3 py-1">Fleet Modules</div>
                  {tabs.map(t => (
                    <button
                      key={t.id}
                      onClick={() => {
                        setActiveTab(t.id);
                        setMobileDrawerOpen(false);
                      }}
                      className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold transition text-left ${
                        activeTab === t.id
                          ? 'bg-amber-500 text-slate-950 font-black shadow-md'
                          : 'text-slate-300 hover:bg-slate-800'
                      }`}
                    >
                      <span className="text-base">{t.icon}</span>
                      <span>{t.label}</span>
                    </button>
                  ))}

                  <div className="pt-3 pb-1 border-t border-slate-800 text-[10px] uppercase font-bold text-slate-500 px-3">
                    Tools & Account
                  </div>

                  {/* Gmail Auto-Sync status & trigger */}
                  {emailSyncStatus === 'active' && (
                    <button
                      type="button"
                      onClick={async () => {
                        setMobileDrawerOpen(false);
                        if (googleToken && !isSyncingGmail) {
                          try { await syncFromLiveGmail(googleToken); } catch(e) {}
                        }
                      }}
                      className="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs text-emerald-300 bg-emerald-500/10 border border-emerald-500/20"
                    >
                      <span className="flex items-center gap-2">
                        <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span>Gmail Auto-Sync</span>
                      </span>
                      <span className="text-[10px] font-bold">{isSyncingGmail ? 'Syncing...' : 'Scan Now'}</span>
                    </button>
                  )}
                  {emailSyncStatus === 'expired' && (
                    <button
                      type="button"
                      onClick={() => { setMobileDrawerOpen(false); authorizeGoogle(); }}
                      className="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs text-amber-300 bg-amber-500/10 border border-amber-500/30 animate-pulse"
                    >
                      <span>⚠️ Session Expired</span>
                      <span className="text-[10px] font-bold">Re-Auth</span>
                    </button>
                  )}
                  {emailSyncStatus === 'disconnected' && (
                    <button
                      type="button"
                      onClick={() => { setMobileDrawerOpen(false); authorizeGoogle(); }}
                      className="w-full flex items-center gap-2 px-3 py-2.5 rounded-xl text-xs text-blue-300 bg-blue-500/10 border border-blue-500/20"
                    >
                      <span>✉️</span>
                      <span>Connect Gmail</span>
                    </button>
                  )}

                  {/* CSV Export */}
                  <button
                    onClick={() => { setMobileDrawerOpen(false); setShowExportModal(true); }}
                    className="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800"
                  >
                    <span>📥</span>
                    <span>Export Records (CSV)</span>
                  </button>

                  {/* Settings */}
                  <button
                    onClick={() => { setMobileDrawerOpen(false); setShowSettingsModal(true); }}
                    className="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-semibold text-amber-400 hover:bg-slate-800"
                  >
                    <span>⚙️</span>
                    <span>Settings & Preferences</span>
                  </button>

                  {/* Change Password */}
                  <button
                    onClick={() => { setMobileDrawerOpen(false); setShowChangePassModal(true); }}
                    className="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800"
                  >
                    <span>🔑</span>
                    <span>Change Password</span>
                  </button>

                  {/* Clear Data */}
                  <button
                    onClick={() => {
                      setMobileDrawerOpen(false);
                      setClearActionType('ledgers');
                      setClearWipeMasters(false);
                      setClearConfirmed(false);
                      setShowClearModal(true);
                    }}
                    className="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-semibold text-rose-400 hover:bg-rose-950/30"
                  >
                    <span>⚠️</span>
                    <span>Clear Data / Erasure</span>
                  </button>
                </div>

                {/* Drawer Footer / Logout */}
                <div className="p-3 border-t border-slate-800 bg-slate-950/70">
                  <button
                    onClick={() => { setMobileDrawerOpen(false); logout(); }}
                    className="w-full py-2.5 rounded-xl bg-rose-950/50 hover:bg-rose-900/70 text-rose-300 border border-rose-800/50 font-bold text-xs flex items-center justify-center gap-2"
                  >
                    <span>🚪</span>
                    <span>Sign Out ({currentUser?.username})</span>
                  </button>
                </div>
              </div>
            </div>
          </ModalPortal>
        )}

          {/* Android Mobile Bottom Navigation Bar */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-slate-950/95 backdrop-blur-md border-t border-slate-800 flex items-center justify-around py-1.5 px-1 shadow-[0_-4px_25px_rgba(0,0,0,0.6)]">
            {/* Home */}
            <button
              onClick={() => { setActiveTab('home'); setMobileDrawerOpen(false); }}
              className={`flex flex-col items-center justify-center flex-1 py-1 transition ${
                activeTab === 'home' ? 'text-amber-400 font-black' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <span className="text-lg">🏠</span>
              <span className="text-[10px] mt-0.5 tracking-tight">Home</span>
            </button>

            {/* Trucks */}
            <button
              onClick={() => { setActiveTab('truck_performance'); setMobileDrawerOpen(false); }}
              className={`flex flex-col items-center justify-center flex-1 py-1 transition ${
                activeTab === 'truck_performance' ? 'text-amber-400 font-black' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <span className="text-lg">🚛</span>
              <span className="text-[10px] mt-0.5 tracking-tight">Trucks</span>
            </button>

            {/* Entry (Prominent Android Action Button) */}
            <button
              onClick={() => { setActiveTab('data_entry'); setMobileDrawerOpen(false); }}
              className={`flex flex-col items-center justify-center -mt-5 transition ${
                activeTab === 'data_entry' ? 'transform scale-105' : 'hover:scale-105'
              }`}
              title="Data Entry Portal"
            >
              <div className={`w-12 h-12 rounded-full flex items-center justify-center shadow-lg border-2 ${
                activeTab === 'data_entry'
                  ? 'bg-amber-400 text-slate-950 border-amber-300 shadow-amber-500/50 ring-4 ring-amber-500/20'
                  : 'bg-amber-500 text-slate-950 border-amber-400 shadow-amber-500/30'
              }`}>
                <span className="text-2xl font-black leading-none">＋</span>
              </div>
              <span className={`text-[10px] mt-0.5 font-bold ${activeTab === 'data_entry' ? 'text-amber-400 font-black' : 'text-slate-300'}`}>
                Entry
              </span>
            </button>

            {/* Company */}
            <button
              onClick={() => { setActiveTab('company_accounts'); setMobileDrawerOpen(false); }}
              className={`flex flex-col items-center justify-center flex-1 py-1 transition ${
                activeTab === 'company_accounts' ? 'text-amber-400 font-black' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <span className="text-lg">🏢</span>
              <span className="text-[10px] mt-0.5 tracking-tight">Company</span>
            </button>

            {/* Drivers */}
            <button
              onClick={() => { setActiveTab('driver_ledger'); setMobileDrawerOpen(false); }}
              className={`flex flex-col items-center justify-center flex-1 py-1 transition ${
                activeTab === 'driver_ledger' ? 'text-amber-400 font-black' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <span className="text-lg">👨‍✈️</span>
              <span className="text-[10px] mt-0.5 tracking-tight">Drivers</span>
            </button>
          </nav>

          <footer className="hidden md:block bg-slate-900 border-t border-slate-800/80 py-4 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex flex-wrap items-center gap-3">
                <span>AR FleetTrack &copy; 2026 Multi-Entity Operations</span>
              </div>
              <div className="flex flex-wrap items-center gap-2.5">
                <span className="font-mono text-[11px] text-slate-400">Section 194C TDS &bull; 15% Net Commission &bull; Universal Edit/Delete</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <FleetProvider>
        <App />
      </FleetProvider>
    );
  </script>
</body>
</html>
