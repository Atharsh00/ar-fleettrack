      const updateDriver = (id, fields) => {
        const old = drivers.find(d => d.id === id);
        if (old && fields.name && fields.name !== old.name) {
          // cascade rename
          setTrips(prev => prev.map(t => t.driverName === old.name ? { ...t, driverName: fields.name } : t));
          setDriverPayments(prev => prev.map(p => p.driverName === old.name ? { ...p, driverName: fields.name } : p));
        }
        setDrivers(prev => prev.map(d => d.id === id ? { ...d, ...fields } : d));
        if (storageMode === 'cloud' && supabaseClient) {
          safeCloudExec(supabaseClient.from('drivers').update(toSnakeObj(fields)).eq('id', id), 'UpdateDriver');
        }
      };
      const deleteDriver = (id) => {
        const old = drivers.find(d => d.id === id);
        if (old) {
          if (trips.some(t => t.driverName === old.name) || driverPayments.some(p => p.driverName === old.name)) {
            if (!confirm('Driver has associated trips or payments. Deleting will remove them. Continue?')) return;
            setTrips(prev => prev.filter(t => t.driverName !== old.name));
            setDriverPayments(prev => prev.filter(p => p.driverName !== old.name));
          }
        }
        setDrivers(prev => prev.filter(d => d.id !== id));
        if (storageMode === 'cloud' && supabaseClient) {
          safeCloudExec(supabaseClient.from('drivers').delete().eq('id', id), 'DeleteDriver');
        }
      };

      const getTruckReg = (idOrReg) => {
        const found = scopedTrucks.find(t => t.id === idOrReg || t.registrationNumber === idOrReg);
        return found ? found.registrationNumber : idOrReg;
      };
      const getCompanyName = (idOrName) => {
        const found = scopedCompanies.find(c => c.id === idOrName || c.name === idOrName);
        return found ? found.name : idOrName;
      };
      const getDriverName = (idOrName) => {
        const found = scopedDrivers.find(d => d.id === idOrName || d.name === idOrName);
        return found ? found.name : idOrName;
      };
      const getTripExpenses = (tripId) => {
        // Direct operational truck expenses (excluding client reimbursable) + roadside driver expense claims linked to this trip (excluding client reimbursable)
        const truckDirectExp = scopedExpenses.filter(e => e.tripId === tripId && !e.isReimbursable).reduce((sum, e) => sum + Number(e.amount || 0), 0);
        const drvClaims = scopedDriverPayments.filter(p => p.tripId === tripId && p.type === 'DRIVER_EXPENSE' && !p.isReimbursable).reduce((sum, p) => sum + Number(p.amount || 0), 0);
        return truckDirectExp + drvClaims;
      };
      const getTripReimbursable = (tripId) => {
        const expReimb = scopedExpenses.filter(e => e.tripId === tripId && e.isReimbursable).reduce((sum, e) => sum + Number(e.amount || 0), 0);
        const drvReimb = scopedDriverPayments.filter(p => p.tripId === tripId && p.type === 'DRIVER_EXPENSE' && p.isReimbursable).reduce((sum, p) => sum + Number(p.amount || 0), 0);
        return expReimb + drvReimb;
      };
      const getTripBalancePending = (tripOrId) => {
        if (!tripOrId) return 0;
        const trip = typeof tripOrId === 'string' ? scopedTrips.find(t => t.id === tripOrId) : tripOrId;
        if (!trip) return 0;
        const reimb = getTripReimbursable(trip.id);
        const g = Number(trip.totalRent || 0);
        const a = Number(trip.advanceReceived || 0);
        const r = Number(trip.receivedAmount || 0);
        const c = Number(trip.commissionAmount || 0);
        const tds = Number(trip.tdsAmount || 0);
        return Math.max(0, g + reimb - a - r - c - tds);
      };
      const getTripProfit = (tripOrId) => {
        if (!tripOrId) return 0;
        const trip = typeof tripOrId === 'string' ? scopedTrips.find(t => t.id === tripOrId) : tripOrId;
        if (!trip) return 0;
        const directOperationalExp = getTripExpenses(trip.id);
        const comm = Number(trip.commissionAmount || 0);
        const tds = Number(trip.tdsAmount || 0);
        const drvSal = Number(trip.driverCommission || 0);
        // Trip Profit = Gross Rent - (Direct Operational Expenses & Driver Claims + Driver Salary + Broker Commission + TDS)
        return Number(trip.totalRent || 0) - (directOperationalExp + drvSal + comm + tds);
      };

      // Relink any currently unlinked or misaligned fuel/fastag expenses in ledger based on their date window
      const relinkUnlinkedExpensesToTrips = () => {
        let updatedCount = 0;
        const updatedList = expenses.map(exp => {
          if (exp.profileId !== activeProfileId) return exp;
          if (!exp.truckId || !exp.date) return exp;
          if (!isAutoExpenseRecord(exp) && exp.tripId) return exp;
          if (exp.category === 'DIESEL' || exp.category === 'TOLL' || isAutoExpenseRecord(exp)) {
            const matchedTrip = findOngoingTripForTruck(exp.truckId, exp.date);
            const targetTripId = matchedTrip ? matchedTrip.id : null;
            if (exp.tripId !== targetTripId) {
              updatedCount++;
              return { ...exp, tripId: targetTripId };
            }
          }
          return exp;
        });

        if (updatedCount > 0) {
          setExpenses(updatedList);
          try { localStorage.setItem(`${STORAGE_KEY}_expenses`, JSON.stringify(updatedList)); } catch(e){}
          if (supabaseClient) {
            const newlyLinked = updatedList.filter(e => {
              const old = expenses.find(o => o.id === e.id);
              return old && old.tripId !== e.tripId;
            });
            const payloads = newlyLinked.map(e => ({
              id: e.id,
              profile_id: e.profileId,
              truck_id: e.truckId,
              trip_id: e.tripId || null,
              date: e.date,
              category: e.category,
              amount: Number(e.amount) || 0,
              payment_method: e.paymentMethod,
              is_reimbursable: Boolean(e.isReimbursable),
              notes: e.notes || '',
              is_simulation: false
            }));
            safeCloudExec(supabaseClient.from('expenses').upsert(payloads), 'RelinkExpensesToTrips');
          }
        }
        return updatedCount;
      };

      // Automated Email Parsing Engine for Toll & Fuel Debits
      const syncExpensesFromEmails = (customSampleEmails = null, overrideConfig = null) => {
        const config = overrideConfig || activeEmailConfig;
        if (!config.linkedEmail) {
          config.linkedEmail = localStorage.getItem('fleet_google_email') || currentUser?.email || 'accounts@fleet.app';
        }
        if (!config.tollEnabled && !config.fuelEnabled) {
          throw new Error('Both Toll and Fuel sync options are currently toggled OFF in Master Management.');
        }

        // Available sample emails or operator-provided batch
        const sampleEmails = customSampleEmails || [
          {
            id: `eml-${Date.now()}-1`,
            from: 'fastag-alerts@icicibank.com',
            subject: config.tollSubjectFilter || 'FASTag Toll Debit Alert',
            date: new Date().toISOString().split('T')[0],
            body: `Dear Customer, your FASTag account has been debited by INR 650.00 at Khed-Shivapur Toll Plaza on ${new Date().toISOString().split('T')[0]} for Vehicle ${scopedTrucks[0]?.registrationNumber || 'MH-12-RN-4825'}. Balance remaining: INR 4,200.00.`,
            type: 'TOLL'
          },
          {
            id: `eml-${Date.now()}-2`,
            from: 'fleetcard@iocl.co.in',
            subject: config.fuelSubjectFilter || 'Fuel Transaction Alert',
            date: new Date().toISOString().split('T')[0],
            body: `Transaction Successful. Fuel Purchase of Rs 18,200.00 recorded on Card 4402 for Vehicle ${scopedTrucks[1]?.registrationNumber || 'MH-14-GH-3518'} at IOCL COCO Highway Pump on ${new Date().toISOString().split('T')[0]}. Volume: 198.5 Ltrs.`,
            type: 'DIESEL'
          }
        ];

        let createdCount = 0;
        let skippedNoAmountCount = 0;
        let skippedUnmatchedTruckCount = 0;
        let skippedDuplicateCount = 0;
        let skippedBoundsCount = 0;
        const unmatchedVehiclesSet = new Set();
        const newExpensesCreated = [];
        const successfulEmailIds = [];

        sampleEmails.forEach(mail => {
          const subjectLower = (mail.subject || '').toLowerCase();
          const bodyLower = (mail.body || '').toLowerCase();
          const cleanTollFilter = (config.tollSubjectFilter || '').replace(/["']/g, '').toLowerCase().trim();
          const cleanFuelFilter = (config.fuelSubjectFilter || '').replace(/["']/g, '').toLowerCase().trim();

          // Determine category: if it contains fuel keywords, diesel, petrol, oil -> DIESEL; otherwise TOLL
          const isFuel = (cleanFuelFilter && (subjectLower.includes(cleanFuelFilter) || bodyLower.includes(cleanFuelFilter))) ||
                         subjectLower.includes('fuel') || subjectLower.includes('diesel') || bodyLower.includes('fuel');
          const category = isFuel ? 'DIESEL' : 'TOLL';

          // Clean HTML tags, styles, scripts and entities from email content
          const cleanBody = (mail.body || '')
            .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, ' ')
            .replace(/<script[^>]*>[\s\S]*?<\/script>/gi, ' ')
            .replace(/<[^>]+>/g, ' ')
            .replace(/&nbsp;/gi, ' ')
            .replace(/&amp;/gi, '&')
            .replace(/&lt;/gi, '<')
            .replace(/&gt;/gi, '>')
            .replace(/\s+/g, ' ')
            .trim();
          const cleanSubject = (mail.subject || '')
            .replace(/<[^>]+>/g, ' ')
            .trim();
          const fullText = `${cleanSubject} ${cleanBody}`;

          // Extract Amount (e.g., TXN AMOUNT: INR 120.00, Rs. 500, ₹ 500, 500/-, debited 500)
          let amount = 0;

          // 1. Primary: Explicit labeled Transaction / Toll / Debit Amount fields (KVB FASTag, ICICI, SBI, HDFC, IDFC, Paytm)
          const pLabeled = fullText.match(/\b(?:txn\s*amount|transaction\s*amount|toll\s*amount|toll\s*fare|toll\s*fee|toll\s*charge|debit\s*amount|debited\s*amount|total\s*amount|bill\s*amount|amount)\b\s*[:\-#=]?\s*(?:INR|Rs\.?|₹)?\s*([\d,]+(?:\.\d{1,2})?)/i);

          // 2. Secondary: Explicit debit / charge phrases
          const pDebit = fullText.match(/\b(?:debited|deducted|charged|spent|toll|fare|purchase)\b(?:\s*(?:is|of|by|with|for|:|-|=))?\s*(?:INR|Rs\.?|₹)?\s*([\d,]+(?:\.\d{1,2})?)/i);

          // 3. Tertiary: Explicit currency with amount (excluding remaining/wallet balances to avoid false positives)
          const textWithoutBalance = fullText.replace(/\b(?:balance|avail(?:able)?|wallet|remaining|limit|credit\s*limit)\b(?:\s*(?:is|of|by|with|for|:|-|=))?\s*(?:INR|Rs\.?|₹)?\s*[\d,]+(?:\.\d+)?/gi, ' ');
          const pCurr1 = textWithoutBalance.match(/(?:INR|Rs\.?|₹)\s*([\d,]+(?:\.\d{1,2})?)/i);
          const pCurr2 = textWithoutBalance.match(/([\d,]+(?:\.\d{1,2})?)\s*(?:INR|Rs\.?|₹|\/-)/i);

          const amtStr = pLabeled?.[1] || pDebit?.[1] || pCurr1?.[1] || pCurr2?.[1];
          if (amtStr) {
            amount = parseFloat(amtStr.replace(/,/g, '')) || 0;
          }

          if (amount <= 0) {
            skippedNoAmountCount++;
            return; // Skip if no valid debit amount detected
          }

          // Real-World Sanity Bounds Check:
          // Commercial multi-axle truck tolls in India range from ₹10 to ₹25,000 (expressways & toll corridors)
          // Fuel purchase: ₹50 to ₹80,000
          if (category === 'TOLL' && (amount < 1 || amount > 25000)) {
            skippedBoundsCount++;
            console.warn(`[Email Sync] Skipped TOLL debit: Amount ₹${amount} is outside realistic highway toll bounds (₹1 - ₹25,000). Email Ref: ${mail.id}`);
            return;
          }
          if (category === 'DIESEL' && (amount < 50 || amount > 80000)) {
            skippedBoundsCount++;
            console.warn(`[Email Sync] Skipped DIESEL purchase: Amount ₹${amount} is outside realistic commercial fuel bounds (₹50 - ₹80,000). Email Ref: ${mail.id}`);
            return;
          }

          // Extract candidate vehicle string from email if present
          let candidateVehicleStr = null;
          const vFieldMatch = fullText.match(/\b(?:vehicle\s*(?:number|no|#)?|vrn|reg(?:\s*no)?|truck(?:\s*no)?)\b\s*[:\-#=]?\s*([A-Za-z0-9\s\-]{6,20})/i);
          if (vFieldMatch) {
            candidateVehicleStr = vFieldMatch[1].trim();
          }

          const cleanText = fullText.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();

          // Extract Truck Number by checking registered trucks in active profile
          let matchedTruck = scopedTrucks.find(trk => {
            const cleanReg = trk.registrationNumber.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
            return cleanText.includes(cleanReg);
          });

          // Fallback: search across all trucks registered in this account
          if (!matchedTruck) {
            matchedTruck = trucks.find(trk => {
              const cleanReg = trk.registrationNumber.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
              return cleanText.includes(cleanReg);
            });
          }

          // Fallback: search regex pattern like KA-01-AJ-8977 or KA01AJ8977
          if (!matchedTruck) {
            const regPattern = /\b([A-Z]{2}[-\s]?[0-9]{1,2}[-\s]?[A-Z]{1,3}[-\s]?[0-9]{4})\b/i;
            const regMatch = fullText.match(regPattern);
            if (regMatch) {
              const matchedStr = regMatch[1].replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
              matchedTruck = scopedTrucks.find(t => t.registrationNumber.replace(/[^a-zA-Z0-9]/g, '').toLowerCase() === matchedStr) ||
                             trucks.find(t => t.registrationNumber.replace(/[^a-zA-Z0-9]/g, '').toLowerCase() === matchedStr);
              if (!candidateVehicleStr) candidateVehicleStr = regMatch[1];
            }
          }
          if (!matchedTruck) {
            skippedUnmatchedTruckCount++;
            if (candidateVehicleStr) unmatchedVehiclesSet.add(candidateVehicleStr);
            console.warn(`[Email Sync] Skipped alert: Vehicle "${candidateVehicleStr || 'unrecognized'}" does not match any registered truck in Masters.`);
            return;
          }

          const targetTruckId = matchedTruck.id;
          const targetTruckReg = matchedTruck.registrationNumber;

          // Extract actual transaction date from email body if present (FASTag/bank receipts often arrive hours or days after debit)
          const monthsMap = {
            jan: '01', feb: '02', mar: '03', apr: '04', may: '05', jun: '06',
            jul: '07', aug: '08', sep: '09', oct: '10', nov: '11', dec: '12'
          };
          let txnDate = null;
          const ctxDmy = fullText.match(/(?:on|date|dated|txn\s*date|time|debited\s*on)\s*[:\-]?\s*([0-3]?\d)[-/]([0-1]?\d)[-/](20\d\d)/i);
          const ctxDMonthY = fullText.match(/(?:on|date|dated|txn\s*date|time|debited\s*on)\s*[:\-]?\s*([0-3]?\d)[-\s]([A-Za-z]{3})[-\s](20\d\d)/i);
          const rawDmy = fullText.match(/\b([0-3]?\d)[-/]([0-1]?\d)[-/](20\d\d)\b/);
          const rawDMonthY = fullText.match(/\b([0-3]?\d)[-\s]([A-Za-z]{3})[-\s](20\d\d)\b/);

          if (ctxDmy) {
            txnDate = `${ctxDmy[3]}-${ctxDmy[2].padStart(2, '0')}-${ctxDmy[1].padStart(2, '0')}`;
          } else if (ctxDMonthY && monthsMap[ctxDMonthY[2].toLowerCase().slice(0, 3)]) {
            txnDate = `${ctxDMonthY[3]}-${monthsMap[ctxDMonthY[2].toLowerCase().slice(0, 3)]}-${ctxDMonthY[1].padStart(2, '0')}`;
          } else if (rawDmy) {
            txnDate = `${rawDmy[3]}-${rawDmy[2].padStart(2, '0')}-${rawDmy[1].padStart(2, '0')}`;
          } else if (rawDMonthY && monthsMap[rawDMonthY[2].toLowerCase().slice(0, 3)]) {
            txnDate = `${rawDMonthY[3]}-${monthsMap[rawDMonthY[2].toLowerCase().slice(0, 3)]}-${rawDMonthY[1].padStart(2, '0')}`;
          }

          const todayIso = new Date().toISOString().split('T')[0];
          const actualDate = (txnDate && txnDate <= todayIso) ? txnDate : (mail.date || todayIso);

          // Extract Transaction ID / Reference No / URN
          const txnIdMatch = fullText.match(/\b(?:txn\s*number|transaction\s*(?:id|number|ref)|reference\s*(?:number|id|no)|urn|rrn)\b\s*[:\-#=]?\s*([A-Za-z0-9_-]{6,35})/i) ||
                             fullText.match(/\b(?:txn(?:\s*id|\s*no)?|ref(?:\s*no)?)\b\s*[:\-#=]?\s*([A-Za-z0-9_-]{6,35})/i);
          const rawTxn = txnIdMatch ? txnIdMatch[1].trim() : null;
          const invalidTxnWords = ['kvbfastag', 'fastag', 'success', 'receipt', 'alert', 'transaction', 'payment', 'debited', 'account', 'customer', 'number'];
          const isValidTxnId = rawTxn && !invalidTxnWords.includes(rawTxn.toLowerCase()) && /\d{2,}/.test(rawTxn);
          const cleanTxnId = isValidTxnId ? rawTxn : null;

          // Extract Plaza or Fuel Station name
          const plazaMatch = fullText.match(/(?:at|plaza)\s+([A-Za-z0-9\s\-]{3,35}?)(?:\s+(?:toll\s*plaza|toll|plaza|pump|station))/i)
            || fullText.match(/Toll\s*Plaza\s*[:\-]?\s*([A-Za-z0-9\s\-]{3,30})/i);
          const plazaName = plazaMatch ? plazaMatch[1].trim() : null;

          // Tag active ongoing trip for that truck: fuel and FASTag debits from trip start until the start of next trip belong to this trip
          const ongoingTrip = findOngoingTripForTruck(targetTruckId, actualDate);

          const deterministicId = mail.id ? `exp-gmail-${mail.id}` : `exp-auto-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
          const curExpenses = expensesRef?.current || expenses || [];

          // Duplicate Guard:
          // Check if exact same Gmail email ID already logged, or genuinely unique transaction ID already logged
          const isDuplicate = curExpenses.some(e => {
            if (e.id === deterministicId) return true;
            if (mail.id && (e.sourceEmailId === mail.id || (e.notes && e.notes.includes(mail.id)))) return true;
            if (cleanTxnId && e.notes && e.notes.includes(`[txn:${cleanTxnId}]`)) return true;
            return false;
          }) || newExpensesCreated.some(e => {
            if (e.id === deterministicId) return true;
            if (mail.id && (e.sourceEmailId === mail.id || (e.notes && e.notes.includes(mail.id)))) return true;
            if (cleanTxnId && e.notes && e.notes.includes(`[txn:${cleanTxnId}]`)) return true;
            return false;
          });

          if (isDuplicate) {
            skippedDuplicateCount++;
            if (mail.id) successfulEmailIds.push(mail.id);
            return; // Skip duplicate email record
          }

          const noteParts = [
            category === 'TOLL' ? `FASTag Toll - ${targetTruckReg}` : `Diesel Fuel - ${targetTruckReg}`
          ];
          if (plazaName) noteParts.push(`at ${plazaName}`);
          if (cleanTxnId) noteParts.push(`[txn:${cleanTxnId}]`);
          if (mail.id) noteParts.push(`[ref:${mail.id}]`);
          const fullNote = noteParts.join(' ');

          const newExp = {
            id: deterministicId,
            profileId: activeProfileId,
            date: actualDate,
            createdAt: new Date().toISOString(),
            truckId: targetTruckId,
            tripId: ongoingTrip ? ongoingTrip.id : null,
            isReimbursable: false,
            category: category,
            amount: amount,
            paymentMethod: category === 'TOLL' ? 'FASTag (Auto-Email)' : 'Fleet Card (Auto-Email)',
            notes: fullNote,
            sourceEmailId: mail.id,
            isSimulation: false
          };

          newExpensesCreated.push(newExp);
          if (mail.id) successfulEmailIds.push(mail.id);
          createdCount++;
        });

        if (newExpensesCreated.length > 0) {
          setExpenses(prev => {
            const newIds = new Set(newExpensesCreated.map(e => e.id));
            const newRefs = new Set(newExpensesCreated.map(e => e.sourceEmailId).filter(Boolean));
            const filteredPrev = prev.filter(e => !newIds.has(e.id) && !(e.sourceEmailId && newRefs.has(e.sourceEmailId)));
            return [...newExpensesCreated, ...filteredPrev];
          });
          if (supabaseClient && currentUser && !currentUser.isDemo) {
            const dbPayloads = newExpensesCreated.map(e => ({
              id: e.id,
              profile_id: e.profileId,
              truck_id: e.truckId,
              trip_id: e.tripId || null,
              date: e.date,
              category: e.category,
              amount: Number(e.amount) || 0,
              payment_method: e.paymentMethod,
              is_reimbursable: Boolean(e.isReimbursable),
              notes: e.notes || '',
              is_simulation: false
            }));
            safeCloudExec(supabaseClient.from('expenses').upsert(dbPayloads), 'AutoEmailExpenses');
          }
          updateEmailSyncConfig({ lastSyncedAt: new Date().toISOString() });
        }

        return {
          syncedCount: createdCount,
          expenses: newExpensesCreated,
          successfulEmailIds: successfulEmailIds,
          skippedNoAmountCount,
          skippedUnmatchedTruckCount,
          unmatchedVehiclesFound: Array.from(unmatchedVehiclesSet),
          skippedDuplicateCount,
          skippedBoundsCount,
          lastSyncedAt: new Date().toISOString()
        };
      };

      // Decode base64url encoded string from Gmail API
      const decodeBase64Url = (str) => {
        if (!str) return '';
        try {
          let base64 = str.replace(/-/g, '+').replace(/_/g, '/');
          while (base64.length % 4) base64 += '=';
          return decodeURIComponent(escape(window.atob(base64)));
        } catch (e) {
          try {
            return window.atob(str.replace(/-/g, '+').replace(/_/g, '/'));
          } catch (e2) {
            return '';
          }
        }
      };

      // 1-Click Live Gmail Sync Engine
      const syncFromLiveGmail = async (accessToken, overrideConfig = null, isForceScan = false) => {
        if (!accessToken) throw new Error('Gmail is not connected. Please click "Connect Gmail" first.');

        const config = overrideConfig || activeEmailConfig;
        if (!config.tollEnabled && !config.fuelEnabled) {
          throw new Error('Both Toll and Fuel sync options are toggled OFF in your settings.');
        }

        const tollKeyword = (config.tollSubjectFilter || '').replace(/["']/g, '').trim();
        const fuelKeyword = (config.fuelSubjectFilter || '').replace(/["']/g, '').trim();

        const queries = [];
        if (config.tollEnabled && tollKeyword) {
          queries.push(`subject:(${tollKeyword})`);
        }
        if (config.fuelEnabled && fuelKeyword) {
          queries.push(`subject:(${fuelKeyword})`);
        }
        if (queries.length === 0) queries.push('subject:(FASTag OR Fuel OR Toll)');

        // Query recent messages matching the subject keywords (from last 30 days, or 60 days on Force Re-Scan)
        const daysBack = isForceScan ? '60d' : '30d';
        const searchQuery = `newer_than:${daysBack} (${queries.join(' OR ')})`;

        // 1. Query matching messages (scan up to 100 recent messages)
        const listRes = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages?q=${encodeURIComponent(searchQuery)}&maxResults=100`, {
          headers: { Authorization: `Bearer ${accessToken}` }
        });

        if (!listRes.ok) {
          if (listRes.status === 401) {
            localStorage.removeItem('fleet_google_token');
            throw new Error('Google authorization session has expired. Please open Settings -> Email Expense Sync and click "Authorize This Laptop/Phone" to re-authenticate.');
          }
          const errData = await listRes.json().catch(() => ({}));
          throw new Error(errData?.error?.message || `Gmail API error (status ${listRes.status})`);
        }

        const listData = await listRes.json();
        const allFound = listData.messages || [];

        // Track already processed IDs in localStorage to avoid duplicates (bypassed on Force Re-Scan)
        const processedSet = isForceScan
          ? new Set()
          : new Set(JSON.parse(localStorage.getItem('fleet_processed_gmail_msg_ids') || '[]'));

        // Safety Reconcile: If an email already exists in the expenses ledger, skip it permanently
        const activeExpList = expensesRef?.current || expenses || [];
        const newMsgList = allFound.filter(m => {
          const existsInLedger = activeExpList.some(e =>
            (e.id && e.id === `exp-gmail-${m.id}`) ||
            (e.sourceEmailId && e.sourceEmailId === m.id) ||
            (e.notes && e.notes.includes(m.id))
          );
          if (existsInLedger) {
            processedSet.add(m.id);
            return false;
          }
          if (processedSet.has(m.id)) return false;
          return true;
        });

        if (newMsgList.length === 0) {
          updateEmailSyncConfig({ lastSyncedAt: new Date().toISOString() });
          const explanation = allFound.length > 0
            ? `Found ${allFound.length} matching alert email(s) in Gmail, and all have already been recorded into your ledger.`
            : `Scanned Gmail for query [${searchQuery}]: 0 matching emails found. Please ensure the incoming alert email has arrived in your inbox.`;
          return {
            syncedCount: 0,
            hasCachedEmails: allFound.length > 0,
            message: explanation
          };
        }

        // 2. Fetch full message payloads
        const fetchedEmails = [];

        for (const item of newMsgList) {
          try {
            const detailRes = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${item.id}?format=full`, {
              headers: { Authorization: `Bearer ${accessToken}` }
            });
            if (!detailRes.ok) continue;
            const detail = await detailRes.json();

            const headers = detail.payload?.headers || [];
            const findHdr = (hName) => headers.find(h => h.name.toLowerCase() === hName.toLowerCase())?.value || '';
            const subject = findHdr('Subject');
            const from = findHdr('From');
            const dateStr = findHdr('Date');
            const mailDate = dateStr ? new Date(dateStr).toISOString().split('T')[0] : new Date().toISOString().split('T')[0];

            let bodyContent = detail.snippet ? `${detail.snippet} ` : '';
            const rawBodyData = [];

            // Recursively collect all text and html parts regardless of nesting depth
            const collectParts = (part) => {
              if (!part) return;
              if (part.body?.data) {
                const decoded = decodeBase64Url(part.body.data);
                if (decoded) rawBodyData.push(decoded);
              }
              if (Array.isArray(part.parts)) {
                part.parts.forEach(collectParts);
              }
            };
            collectParts(detail.payload);

            const cleanBodyHtml = rawBodyData.join(' ')
              .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, ' ')
              .replace(/<script[^>]*>[\s\S]*?<\/script>/gi, ' ')
              .replace(/<[^>]+>/g, ' ')
              .replace(/&nbsp;/gi, ' ')
              .replace(/&amp;/gi, '&')
              .replace(/&lt;/gi, '<')
              .replace(/&gt;/gi, '>')
              .replace(/\s+/g, ' ');
            bodyContent += cleanBodyHtml;

            fetchedEmails.push({
              id: item.id,
              from,
              subject,
              date: mailDate,
              body: bodyContent
            });
          } catch (itemErr) {
            console.warn('Error reading message detail:', itemErr);
          }
        }

        // 3. Ingest through our local trip-tagging engine
        const ingestRes = syncExpensesFromEmails(fetchedEmails, config);

        // ONLY mark as processed the email IDs that were ACTUALLY recorded!
        const actuallyRecordedIds = ingestRes.successfulEmailIds || [];

        if (actuallyRecordedIds.length > 0) {
          const updatedProcessed = Array.from(new Set([...processedSet, ...actuallyRecordedIds]));
          localStorage.setItem('fleet_processed_gmail_msg_ids', JSON.stringify(updatedProcessed.slice(-500)));

          for (const mId of actuallyRecordedIds) {
            try {
              await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${mId}/modify`, {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${accessToken}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({ removeLabelIds: ['UNREAD'] })
              });
            } catch (modErr) {
              console.warn('Error marking message as read in Gmail:', modErr);
            }
          }
        }

        if (ingestRes.syncedCount === 0 && fetchedEmails.length > 0) {
          const reasons = [];
          if (ingestRes.skippedUnmatchedTruckCount > 0) {
            const vList = ingestRes.unmatchedVehiclesFound.filter(Boolean).join(', ');
            reasons.push(`${ingestRes.skippedUnmatchedTruckCount} email(s) had debits for vehicle(s) [${vList || 'unrecognized'}], which are not yet added in Masters > Trucks.`);
          }
          if (ingestRes.skippedDuplicateCount > 0) {
            reasons.push(`${ingestRes.skippedDuplicateCount} email(s) were already recorded in your ledger.`);
          }
          if (ingestRes.skippedNoAmountCount > 0) {
            reasons.push(`${ingestRes.skippedNoAmountCount} email(s) did not have a recognizable debit amount.`);
          }
          if (ingestRes.skippedBoundsCount > 0) {
            reasons.push(`${ingestRes.skippedBoundsCount} email(s) had amounts outside normal toll limits.`);
          }
          const message = reasons.length > 0
            ? `Scanned ${fetchedEmails.length} matching email(s):\n• ${reasons.join('\n• ')}`
            : `Found ${fetchedEmails.length} matching email(s), but could not process new expenses.`;

          return {
            syncedCount: 0,
            message
          };
        }

        return {
          syncedCount: ingestRes.syncedCount,
          message: `Scanned Gmail: Found and logged ${ingestRes.syncedCount} new expense(s) tagged to active trips!`
        };
      };

      // Google OAuth & Email Sync Global State
      const DEFAULT_GOOGLE_CLIENT_ID = '371057355214-kc8o35sqpnopmth9rdtdsn4qllgj5fe3.apps.googleusercontent.com';
      const [googleToken, setGoogleToken] = useState(() => localStorage.getItem('fleet_google_token') || '');
      const [isSyncingGmail, setIsSyncingGmail] = useState(false);

      const emailSyncStatus = useMemo(() => {
        const effectiveEmail = (activeEmailConfig?.linkedEmail || currentUser?.email || localStorage.getItem('fleet_google_email') || '').trim();
        if (googleToken) return 'active';
        if (effectiveEmail) return 'expired';
        return 'disconnected';
      }, [googleToken, activeEmailConfig, currentUser]);

      const authorizeGoogle = (customHint = null) => {
        if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
          alert('Google Identity Services script is loading. Please check your internet connection or refresh.');
          return;
        }
        try {
          const effectiveHint = customHint || (activeEmailConfig?.linkedEmail || currentUser?.email || localStorage.getItem('fleet_google_email') || '').trim();
          const client = window.google.accounts.oauth2.initTokenClient({
            client_id: DEFAULT_GOOGLE_CLIENT_ID,
            scope: 'https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.modify',
            hint: effectiveHint || undefined,
            callback: async (tokenResponse) => {
              if (tokenResponse && tokenResponse.access_token) {
                const token = tokenResponse.access_token;
                setGoogleToken(token);
                localStorage.setItem('fleet_google_token', token);

                let userEmailFound = '';
                try {
                  const res = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
                    headers: { Authorization: `Bearer ${token}` }
                  });
                  if (res.ok) {
                    const data = await res.json();
                    if (data.email) userEmailFound = data.email;
                  }
                } catch (e) {
                  console.warn('Could not fetch user email info:', e);
                }

                const finalEmail = userEmailFound || effectiveHint || '';
                if (finalEmail) {
                  localStorage.setItem('fleet_google_email', finalEmail);
                  updateEmailSyncConfig({ linkedEmail: finalEmail });
                }

                // Immediately trigger background scan once authorized
                try {
                  setIsSyncingGmail(true);
                  await syncFromLiveGmail(token);
                } catch (sErr) {
                  console.debug('Initial scan after auth:', sErr?.message);
                } finally {
                  setIsSyncingGmail(false);
                }
              }
            }
          });
          client.requestAccessToken();
        } catch (err) {
          console.warn('Error starting Google auth:', err);
        }
      };

      // Automatic Background Gmail Scan Engine (runs whenever this browser has an active Google OAuth token)
      useEffect(() => {
        const token = localStorage.getItem('fleet_google_token');
        const autoSyncEnabled = localStorage.getItem('fleet_auto_sync') !== 'false';
        if (!token || !autoSyncEnabled || !currentUser || currentUser.isDemo) return;

        const triggerAutoScan = async () => {
          const currentToken = localStorage.getItem('fleet_google_token');
          if (!currentToken) return;
          try {
            await syncFromLiveGmail(currentToken);
          } catch (scanErr) {
            if (scanErr.message && (scanErr.message.includes('expired') || scanErr.message.includes('401'))) {
              setGoogleToken('');
              localStorage.removeItem('fleet_google_token');
            }
            console.debug('Background Gmail auto-scan note:', scanErr?.message);
          }
        };

        // 1. Scan 5 seconds after app loads
        const initialTimer = setTimeout(triggerAutoScan, 5000);

        // 2. Scan every 45 seconds while tab is open
        const intervalTimer = setInterval(triggerAutoScan, 45000);

        // 3. Scan when returning to the tab
        const onTabFocus = () => {
          triggerAutoScan();
        };
        window.addEventListener('focus', onTabFocus);

        return () => {
          clearTimeout(initialTimer);
          clearInterval(intervalTimer);
          window.removeEventListener('focus', onTabFocus);
        };
      }, [currentUser, activeProfileId]);

      // Data Erasure / Clear Data (Right to be Forgotten & Privacy Compliance)
      const clearAllUserData = async (wipeMasters = false, allProfiles = false) => {
        // Erase directly from Supabase Cloud Database for real production accounts
        if (currentUser && !currentUser.isDemo && supabaseClient) {
          try {
            const targetProf = activeProfileId;
            if (allProfiles) {
              const scopedIds = scopedProfiles.map(p => p.id);
              await Promise.all([
                supabaseClient.from('trips').delete().in('profile_id', scopedIds),
                supabaseClient.from('expenses').delete().in('profile_id', scopedIds),
                supabaseClient.from('driver_payments').delete().in('profile_id', scopedIds),
                supabaseClient.from('settlements').delete().in('profile_id', scopedIds),
                ...(wipeMasters ? [
                  supabaseClient.from('trucks').delete().in('profile_id', scopedIds),
                  supabaseClient.from('companies').delete().in('profile_id', scopedIds),
                  supabaseClient.from('drivers').delete().in('profile_id', scopedIds)
                ] : [])
              ]);
            } else {
              await Promise.all([
                supabaseClient.from('trips').delete().eq('profile_id', targetProf),
                supabaseClient.from('expenses').delete().eq('profile_id', targetProf),
                supabaseClient.from('driver_payments').delete().eq('profile_id', targetProf),
                supabaseClient.from('settlements').delete().eq('profile_id', targetProf),
                ...(wipeMasters ? [
                  supabaseClient.from('trucks').delete().eq('profile_id', targetProf),
                  supabaseClient.from('companies').delete().eq('profile_id', targetProf),
                  supabaseClient.from('drivers').delete().eq('profile_id', targetProf)
                ] : [])
              ]);
            }
          } catch (cloudErr) {
            console.error('Error erasing data from Supabase Cloud:', cloudErr);
          }
        }

        if (allProfiles) {
          setTrips([]);
          setExpenses([]);
          setDriverPayments([]);
          setSettlements([]);
          if (wipeMasters) {
            setTrucks([]);
            setCompanies([]);
            setDrivers([]);
          }
          try {
            localStorage.removeItem(`${STORAGE_KEY}_trips`);
            localStorage.removeItem(`${STORAGE_KEY}_expenses`);
            localStorage.removeItem(`${STORAGE_KEY}_dp`);
            localStorage.removeItem(`${STORAGE_KEY}_settlements`);
            localStorage.removeItem('fleettrack_v3_trips');
            localStorage.removeItem('fleettrack_v3_expenses');
            localStorage.removeItem('fleettrack_v3_dp');
            localStorage.removeItem('fleettrack_v3_settlements');
            localStorage.removeItem('fleet_google_token');
            localStorage.removeItem('fleet_google_email');
            localStorage.removeItem('fleet_processed_gmail_msg_ids');
            if (wipeMasters) {
              localStorage.removeItem(`${STORAGE_KEY}_trucks`);
              localStorage.removeItem(`${STORAGE_KEY}_companies`);
              localStorage.removeItem(`${STORAGE_KEY}_drivers`);
            }
          } catch (e) {
            console.warn('Storage clear error:', e);
          }
        } else {
          setTrips(prev => prev.filter(t => t.profileId !== activeProfileId));
          setExpenses(prev => prev.filter(e => e.profileId !== activeProfileId));
          setDriverPayments(prev => prev.filter(p => p.profileId !== activeProfileId));
          setSettlements(prev => prev.filter(s => s.profileId !== activeProfileId));
          if (wipeMasters) {
            setTrucks(prev => prev.filter(t => t.profileId !== activeProfileId));
            setCompanies(prev => prev.filter(c => c.profileId !== activeProfileId));
            setDrivers(prev => prev.filter(d => d.profileId !== activeProfileId));
          }
          try {
            localStorage.removeItem('fleet_google_token');
            localStorage.removeItem('fleet_google_email');
            localStorage.removeItem('fleet_processed_gmail_msg_ids');
          } catch (e) {
            console.warn('Storage clear error:', e);
          }
        }
      };

      // Permanently Delete User Account & All Associated Cloud Data (Full Account Termination)
      const deleteAccount = async () => {
        if (!currentUser) return;
        const targetUserId = currentUser.id;
        const userProfs = profiles.filter(p => p.userId === targetUserId || (!p.userId && p.name?.toLowerCase() === currentUser.businessName?.toLowerCase()));
        const profIds = userProfs.map(p => p.id);
        if (activeProfileId && !profIds.includes(activeProfileId)) {
          profIds.push(activeProfileId);
        }

        // 1. Wipe directly from Supabase Cloud Database for real production accounts
        if (!currentUser.isDemo && supabaseClient) {
          try {
            if (profIds.length > 0) {
              await Promise.allSettled([
                supabaseClient.from('trips').delete().in('profile_id', profIds),
                supabaseClient.from('expenses').delete().in('profile_id', profIds),
                supabaseClient.from('driver_payments').delete().in('profile_id', profIds),
                supabaseClient.from('settlements').delete().in('profile_id', profIds),
                supabaseClient.from('trucks').delete().in('profile_id', profIds),
                supabaseClient.from('companies').delete().in('profile_id', profIds),
                supabaseClient.from('drivers').delete().in('profile_id', profIds),
                supabaseClient.from('rules').delete().in('profile_id', profIds),
                supabaseClient.from('profiles').delete().in('id', profIds),
                supabaseClient.from('profiles').delete().eq('user_id', targetUserId)
              ]);
            }
          } catch (cloudErr) {
            console.error('Error erasing account data from Supabase Cloud:', cloudErr);
          }
        }

        // 2. Clear from React state
        setTrips(prev => prev.filter(t => !profIds.includes(t.profileId)));
        setExpenses(prev => prev.filter(e => !profIds.includes(e.profileId)));
        setDriverPayments(prev => prev.filter(d => !profIds.includes(d.profileId)));
        setSettlements(prev => prev.filter(s => !profIds.includes(s.profileId)));
        setFuelStatementLogs(prev => prev.filter(l => !profIds.includes(l.profileId)));
        setTrucks(prev => prev.filter(t => !profIds.includes(t.profileId)));
        setCompanies(prev => prev.filter(c => !profIds.includes(c.profileId)));
        setDrivers(prev => prev.filter(d => !profIds.includes(d.profileId)));
        setProfiles(prev => prev.filter(p => !profIds.includes(p.id) && p.userId !== targetUserId));

        // 3. Remove user from users array and update localStorage immediately
        const remainingUsers = users.filter(u => u.id !== targetUserId);
        setUsers(remainingUsers);
        try {
          localStorage.setItem(`${STORAGE_KEY}_users`, JSON.stringify(remainingUsers));
          localStorage.removeItem(`${STORAGE_KEY}_cur_user`);
          localStorage.removeItem(`${STORAGE_KEY}_active_prof`);
          localStorage.removeItem('fleet_google_token');
          localStorage.removeItem('fleet_google_email');
          localStorage.removeItem('fleet_processed_gmail_msg_ids');
        } catch (e) {
          console.warn('Storage cleanup error:', e);
        }

        // 4. Reset active profile and log user out
        setActiveProfileId(null);
        setCurrentUser(null);
      };

      return (
        <FleetContext.Provider value={{
          currentUser, users, login, signup, logout, loginDemo, resetPassword, changePassword,
          requestPasswordResetOtp, verifyOtpAndResetPassword,
          showExportModal, setShowExportModal,
          showChangePassModal, setShowChangePassModal,
          profiles: scopedProfiles, activeProfileId, activeProfile, setActiveProfileId, addProfile, updateProfile, deleteProfile,
          activeRules, updateRules,
          activeEmailConfig, updateEmailSyncConfig, syncExpensesFromEmails, syncFromLiveGmail,
          googleToken, setGoogleToken, emailSyncStatus, authorizeGoogle, isSyncingGmail, setIsSyncingGmail,
          trucks: scopedTrucks, companies: scopedCompanies, drivers: scopedDrivers,
          trips: scopedTrips, expenses: scopedExpenses, driverPayments: scopedDriverPayments, settlements: scopedSettlements,
          scopedTrucks, scopedCompanies, scopedDrivers,
          scopedTrips, scopedExpenses, scopedDriverPayments, scopedSettlements,
          filteredTrips, filteredExpenses, filteredDriverPayments, filteredSettlements,
          summaryMetrics, dateFilter, setDateFilter, currency,
          addTrip, updateTrip, deleteTrip,
          addTruckExpense, updateTruckExpense, deleteTruckExpense, addExpensesBatch, deleteExpensesBatch,
          addDriverPayment, updateDriverPayment, deleteDriverPayment,
          addSettlement, updateSettlement, deleteSettlement,
          fuelStatementLogs: scopedFuelStatementLogs, addFuelStatementLog, deleteFuelStatementLog,
          addTruck, updateTruck, deleteTruck,
          addCompany, updateCompany, deleteCompany,
          addDriver, updateDriver, deleteDriver,
          getTruckReg, getCompanyName, getDriverName,

    // --- COMPONENT: STICKY DATE FILTER ---
    function DateFilter() {
      const { dateFilter, setDateFilter } = useFleet();
      const handlePreset = (preset) => {
        if (preset === 'custom') {
          const today = new Date().toISOString().split('T')[0];
          const past = new Date(Date.now() - 30 * 86400000).toISOString().split('T')[0];
          setDateFilter({ preset: 'custom', startDate: dateFilter.startDate || past, endDate: dateFilter.endDate || today });
        } else {
          setDateFilter({ preset, startDate: '', endDate: '' });
        }
      };

      return (
        <div className="sticky top-0 z-20 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-3 sm:px-4 py-2 sm:py-2.5 shadow-md mb-4 sm:mb-6">
          <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2 sm:gap-3">
            <div className="flex items-center gap-1.5 text-slate-300 text-xs font-bold uppercase tracking-wider">
              <span className="text-amber-500">📅</span>
              <span className="hidden sm:inline">Date Range</span> Filter:
            </div>
            <div className="flex items-center flex-wrap gap-1.5 sm:gap-2">
              {['all', 'this_month', 'last_month', 'custom'].map((p) => {
                const label = p === 'all' ? 'All Time' : p === 'this_month' ? 'This Month' : p === 'last_month' ? 'Last Month' : 'Custom Range';
                const active = dateFilter.preset === p;
                return (
                  <button
                    key={p}
                    onClick={() => handlePreset(p)}
                    className={`px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-semibold transition ${active ? 'bg-amber-500 text-slate-950 font-bold shadow-md' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                  >
                    {label}
                  </button>
                );
              })}
              {dateFilter.preset === 'custom' && (
                <div className="flex items-center gap-1.5 bg-slate-950/80 border border-slate-700 rounded-lg px-2 py-1">
                  <input
                    type="date"
                    value={dateFilter.startDate}
                    onChange={(e) => setDateFilter({ ...dateFilter, startDate: e.target.value })}
                    className="bg-transparent text-xs text-slate-200 focus:outline-none [color-scheme:dark] max-w-[115px]"
                  />
                  <span className="text-slate-500 text-[10px]">to</span>

                    type="date"

                  />
                </div>
              )}
            </div>
          </div>
        </div>

    // --- TAB 2: TRUCK PERFORMANCE (STATUS BADGE REMOVED) ---
    function TruckPerformanceTab() {
      const { trucks, trips, filteredTrips, filteredExpenses, filteredDriverPayments, deleteTruckExpense, deleteDriverPayment, getCompanyName, getTripExpenses, getTripProfit, getTripBalancePending } = useFleet();
      const [selTruck, setSelTruck] = useState('all');
      const [editTarget, setEditTarget] = useState(null);
      const [selectedTripForDetail, setSelectedTripForDetail] = useState(null);

      // Column filter states
      const [fleetFilters, setFleetFilters] = useState({});
      const [tripColFilters, setTripColFilters] = useState({});
      const [expColFilters, setExpColFilters] = useState({});

      const truckData = trucks.map(trk => {
        const trkTrips = filteredTrips.filter(t => t.truckId === trk.id);
        // Exclude reimbursable expenses from vehicle operating costs
        const trkDirectExpenses = filteredExpenses.filter(e => e.truckId === trk.id && !e.isReimbursable).reduce((s, e) => s + Number(e.amount), 0);
        const trkDriverClaims = (filteredDriverPayments || []).filter(p => p.truckId === trk.id && p.type === 'DRIVER_EXPENSE' && !p.isReimbursable).reduce((s, p) => s + Number(p.amount || 0), 0);
        const trkDriverWages = trkTrips.reduce((s, t) => s + Number(t.driverCommission || 0), 0);
        const trkCommissions = trkTrips.reduce((s, t) => s + Number(t.commissionAmount || 0), 0);
        const trkTds = trkTrips.reduce((s, t) => s + Number(t.tdsAmount || 0), 0);
        
        const rev = trkTrips.reduce((s, t) => s + Number(t.totalRent), 0);
        // Total vehicle operating costs = direct operational expenses + driver claims + driver salaries + broker commissions + TDS
        const exp = trkDirectExpenses + trkDriverClaims + trkDriverWages + trkCommissions + trkTds;
        const profit = rev - exp;
        const margin = rev > 0 ? (profit / rev) * 100 : 0;
        return { trk, trips: trkTrips, expenses: filteredExpenses.filter(e => e.truckId === trk.id), rev, exp, profit, margin };
      });

      // Filtered truckData based on fleetFilters
      const filteredTruckData = useMemo(() => {
        return truckData.filter(td => {
          if (fleetFilters.reg && !td.trk.registrationNumber.toLowerCase().includes(fleetFilters.reg.toLowerCase())) return false;
          if (fleetFilters.model && !`${td.trk.model} ${td.trk.capacity}`.toLowerCase().includes(fleetFilters.model.toLowerCase())) return false;
          if (fleetFilters.trips && !String(td.trips.length).includes(fleetFilters.trips)) return false;
          if (fleetFilters.rev && !String(td.rev).includes(fleetFilters.rev)) return false;
          if (fleetFilters.exp && !String(td.exp).includes(fleetFilters.exp)) return false;
          if (fleetFilters.profit && !String(td.profit).includes(fleetFilters.profit)) return false;
          if (fleetFilters.margin && !String(Math.round(td.margin)).includes(fleetFilters.margin)) return false;
          return true;

      const activeView = selTruck === 'all' ? null : truckData.find(d => d.trk.id === selTruck);

      // Calculations for Fleet Overview Totals Row (dynamically recalculates from filteredTruckData)
      const fleetTotalTrips = filteredTruckData.reduce((s, td) => s + td.trips.length, 0);

      const fleetTotalExp = filteredTruckData.reduce((s, td) => s + td.exp, 0);
      const fleetTotalProfit = fleetTotalRev - fleetTotalExp;
      const fleetTotalMargin = fleetTotalRev > 0 ? (fleetTotalProfit / fleetTotalRev) * 100 : 0;

      // Filtered lists for itemized tables (sorted newest date first, last made entry topmost)
      const displayedTrips = useMemo(() => {

      // Combine direct truck expenses and driver expense claims tagged to truck

        const direct = (selTruck === 'all' ? filteredExpenses : filteredExpenses.filter(e => e.truckId === selTruck)).map(e => ({
          ...e,
          itemType: 'TRUCK_EXP',
          rawObj: e

            id: p.id,
            date: p.date,
            truckId: p.truckId,
            tripId: p.tripId,
            category: 'DRIVER CLAIM',
            notes: `${p.driverName}: ${p.description || 'Roadside Claim'}`,
            paymentMethod: p.paymentMethod || 'Driver Claim',
            amount: p.amount,
            isReimbursable: Boolean(p.isReimbursable),
            itemType: 'DRIVER_CLAIM',
            rawObj: p

        return [...direct, ...claims].sort(compareRecordsDesc);

      // Itemized Trips with Column Filters
      const filteredItemizedTrips = useMemo(() => {

          const directExp = Number(getTripExpenses ? getTripExpenses(t.id) : 0);

          const tds = Number(t.tdsAmount || 0);
          const tripExp = directExp + comm + drvSal + tds;
          const tripProfit = getTripProfit ? getTripProfit(t) : (Number(t.totalRent || 0) - tripExp);

        const tds = Number(t.tdsAmount || 0);

                      <th className="p-1 text-center">
                        {hasExpFilters && (
                          <button onClick={() => setExpColFilters({})} className="text-[10px] text-amber-400 hover:underline font-bold">✕ Clear</button>
                        )}
                      </th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800">
                    {filteredItemizedExpenses.map(e => {
                      const linkedTrip = e.tripId ? (trips || filteredTrips || []).find(t => t.id === e.tripId) : null;
                      return (
                        <tr key={e.id} className="hover:bg-slate-800/40">
                          <td className="py-2 px-3 font-mono text-slate-400 whitespace-nowrap">{formatDate(e.date)}</td>
                          <td className="py-2 px-3 whitespace-nowrap">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${e.itemType === 'DRIVER_CLAIM' ? 'bg-blue-500/20 text-blue-300 border border-blue-500/30' : 'bg-slate-800 text-slate-200'}`}>
                              {e.category}
                            </span>
                          </td>
                          <td className="py-2 px-3 whitespace-nowrap">
                            {e.tripId ? (
                              <span
                                className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500/10 text-amber-300 border border-amber-500/25"
                                title={linkedTrip ? `Route: ${linkedTrip.route} | Date: ${formatDate(linkedTrip.date)}` : `Trip ID: ${e.tripId}`}
                              >
                                <span>🔗</span>
                                <span>{linkedTrip ? `${linkedTrip.route} (${formatDate(linkedTrip.date)})` : `Trip: ${e.tripId.slice(-6)}`}</span>
                              </span>
                            ) : (
                              <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-[10px] font-medium bg-slate-800 text-slate-400 border border-slate-700/60">
                                <span>📦</span>
                                <span>General Expense</span>
                              </span>
                            )}
                          </td>
                          <td className="py-2 px-3 text-slate-300">{e.notes || e.paymentMethod}</td>
                          <td className="py-2 px-3 text-right font-mono text-rose-400 font-bold whitespace-nowrap">{formatCurr(e.amount)}</td>
                          <td className="py-2 px-3 text-center whitespace-nowrap">
                            <div className="flex items-center justify-center gap-2">
                              <button
                                onClick={() => setEditTarget({
                                  type: e.itemType === 'DRIVER_CLAIM' ? 'DRIVER_PAY' : 'TRUCK_EXPENSE',
                                  data: e.rawObj || e
                                })}
                                className="text-amber-400 hover:underline font-medium"
                              >
                                Edit
                              </button>
                              <button
                                onClick={() => {
                                  if (e.itemType === 'DRIVER_CLAIM') {
                                    if (confirm('Delete this driver expense claim? Driver balance and vehicle expenses will recalculate.')) {
                                      deleteDriverPayment(e.id);
                                    }
                                  } else {
                                    if (confirm('Delete this vehicle operating expense? Vehicle P&L will recalculate.')) {
                                      deleteTruckExpense(e.id);
                                    }
                                  }
                                }}
                                className="text-rose-400 hover:underline font-medium"
                              >
                                Delete
                              </button>
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                  {filteredItemizedExpenses.length > 0 && (
                    <tfoot className="bg-slate-950/90 font-bold border-t-2 border-slate-700 text-white sticky bottom-0">
                      <tr>
                        <td colSpan="4" className="py-2 px-3 text-amber-400 uppercase tracking-wider text-[10px] font-black">
                          Total ({filteredItemizedExpenses.length} Records)
                        </td>
                        <td className="py-2 px-3 text-right font-mono font-black text-rose-400 whitespace-nowrap">{formatCurr(expensesTotalAmt)}</td>
                        <td className="py-2 px-3"></td>
                      </tr>
                    </tfoot>
                  )}
                </table>
              </div>
            </div>
          </div>
          {editTarget && <EditRecordModal target={editTarget} onClose={() => setEditTarget(null)} />}
          {selectedTripForDetail && (
            <TripDetailModal
              trip={selectedTripForDetail}
              onClose={() => setSelectedTripForDetail(null)}
              onEdit={(tr) => setEditTarget({ type: 'TRIP', data: tr })}
            />
          )}
        </div>
      );
    }

    // --- SHARED UNIVERSAL EDIT RECORD MODAL ---
    function EditRecordModal({ target, onClose }) {
      const { trucks, companies, drivers, trips, filteredTrips, dateFilter, updateTrip, updateTruckExpense, updateDriverPayment, updateSettlement, activeRules } = useFleet();
      if (!target) return null;

      // TRIP STATE
      const [tripDate, setTripDate] = useState(target.data.date || '');
      const [tripTruck, setTripTruck] = useState(target.data.truckId || (trucks[0]?.id || ''));
      const [tripCompany, setTripCompany] = useState(target.data.companyName || '');
      const [tripDriver, setTripDriver] = useState(target.data.driverName || '');
      const [fromLoc, setFromLoc] = useState(target.data.fromLocation || '');
      const [toLoc, setToLoc] = useState(target.data.toLocation || '');
      const [drops, setDrops] = useState(target.data.additionalDrops || []);
      const [totalRent, setTotalRent] = useState(target.data.totalRent?.toString() || '');
      const [comm, setComm] = useState(target.data.commissionAmount?.toString() || '0');
      const [isTds, setIsTds] = useState(target.data.isTdsDeducted ?? true);
      const [adv, setAdv] = useState(target.data.advanceReceived?.toString() || '0');
      const [rec, setRec] = useState(target.data.receivedAmount?.toString() || '0');
      const [editDriverSalary, setEditDriverSalary] = useState(target.data.driverCommission?.toString() || '0');
      const [tripNotes, setTripNotes] = useState(target.data.notes || '');

      // Dynamic calculation helper for live Trip preview
      const isAutoSalary = activeRules?.autoDriverSalaryEnabled !== false;
      const modalGross = parseFloat(totalRent) || 0;
      const modalComm = parseFloat(comm) || 0;
      const modalAdv = parseFloat(adv) || 0;
      const modalRec = parseFloat(rec) || 0;
      const modalTdsRate = (activeRules && activeRules.defaultTdsPercent) ? activeRules.defaultTdsPercent : 1;
      const modalDrvRate = (activeRules && activeRules.defaultDriverSalaryPercent) ? activeRules.defaultDriverSalaryPercent : 15;
      const modalTdsAmt = isTds ? (modalGross * (modalTdsRate / 100)) : 0;
      const modalNetRent = Math.max(0, modalGross - modalTdsAmt - modalComm);
      const modalDriverSalary = isAutoSalary ? (modalNetRent * (modalDrvRate / 100)) : (parseFloat(editDriverSalary) || 0);
      const modalBalDue = Math.max(0, modalGross - modalAdv - modalRec - modalComm - modalTdsAmt);

      // EXPENSE STATE
      const [expDate, setExpDate] = useState(target.data.date || '');
      const [expTruck, setExpTruck] = useState(target.data.truckId || '');
      const [expTripId, setExpTripId] = useState(target.data.tripId || '');
      const [expCat, setExpCat] = useState(target.data.category || 'DIESEL');
      const [expAmt, setExpAmt] = useState(target.data.amount?.toString() || '');
      const [expMethod, setExpMethod] = useState((target.data.paymentMethod && target.data.paymentMethod !== 'Fleet Card') ? target.data.paymentMethod : '');
      const [expNotes, setExpNotes] = useState(target.data.notes || '');
      const [expReimbursable, setExpReimbursable] = useState(target.data.isReimbursable || false);
      const [showAllEditTripsExp, setShowAllEditTripsExp] = useState(false);

      const baseTruckTrips = (showAllEditTripsExp ? (trips || []) : (filteredTrips || [])).filter(t => t.truckId === expTruck);
      // Ensure the currently linked trip is always visible in the dropdown even if outside the date filter
      const truckTrips = (expTripId && !baseTruckTrips.some(t => t.id === expTripId))
        ? [...((trips || []).filter(t => t.id === expTripId)), ...baseTruckTrips]
        : baseTruckTrips;

      // DRIVER PAY STATE
      const [dpDate, setDpDate] = useState(target.data.date || '');
      const [dpDriver, setDpDriver] = useState(target.data.driverName || '');
      const [dpType, setDpType] = useState(target.data.type || 'SALARY_PAYOUT');
      const [dpAmt, setDpAmt] = useState(target.data.amount?.toString() || '');
      const [dpDesc, setDpDesc] = useState(target.data.description || '');
      const [dpTruck, setDpTruck] = useState(target.data.truckId || '');
      const [dpTripId, setDpTripId] = useState(target.data.tripId || '');
      const [dpReimbursable, setDpReimbursable] = useState(Boolean(target.data.isReimbursable));
      const [showAllEditTripsDrv, setShowAllEditTripsDrv] = useState(false);

      const baseDriverTrips = (showAllEditTripsDrv ? (trips || []) : (filteredTrips || [])).filter(t => !dpTruck || t.truckId === dpTruck);
      const driverTrips = (dpTripId && !baseDriverTrips.some(t => t.id === dpTripId))
        ? [...((trips || []).filter(t => t.id === dpTripId)), ...baseDriverTrips]
        : baseDriverTrips;

      // SETTLEMENT STATE
      const [setDate, setSetDate] = useState(target.data.date || '');
      const [setCompany, setSetCompany] = useState(target.data.companyName || '');
      const [setAmt, setSetAmt] = useState(target.data.amount?.toString() || '');
      const [setMethod, setSetMethod] = useState(target.data.paymentMethod || 'NEFT');
      const [setRef, setSetRef] = useState(target.data.referenceNumber || '');

      const handleSave = (e) => {
        e.preventDefault();
        if (target.type === 'TRIP') {
          const rentNum = parseFloat(totalRent);
          if (isNaN(rentNum) || rentNum < 0) return alert('Enter valid gross rent (0 or greater)');
          updateTrip(target.data.id, {
            date: tripDate,
            truckId: tripTruck,
            companyName: tripCompany.trim(),
            driverName: tripDriver.trim(),
            fromLocation: fromLoc.trim(),
            toLocation: toLoc.trim(),
            additionalDrops: drops.filter(Boolean),
            totalRent: rentNum,
            commissionAmount: modalComm,
            isTdsDeducted: isTds,
            advanceReceived: modalAdv,
            receivedAmount: modalRec,
            tdsAmount: modalTdsAmt,
            netRent: modalNetRent,
            driverCommission: modalDriverSalary,
            balancePending: modalBalDue,
            notes: tripNotes.trim(),
          });
        } else if (target.type === 'EXPENSE' || target.type === 'TRUCK_EXPENSE') {
          const amt = parseFloat(expAmt);
          if (!amt || amt <= 0) return alert('Enter valid amount');
          updateTruckExpense(target.data.id, {
            date: expDate,
            truckId: expTruck,
            tripId: expTripId || undefined,
            category: expCat,
            amount: amt,
            paymentMethod: expMethod || undefined,
            notes: expNotes.trim(),
            isReimbursable: expReimbursable,
          });
        } else if (target.type === 'DRIVER_PAY' || target.type === 'DRIVER_PAYMENT') {
          const amt = parseFloat(dpAmt);
          if (!amt || amt <= 0) return alert('Enter valid amount');
          updateDriverPayment(target.data.id, {
            date: dpDate,
            driverName: dpDriver,
            truckId: dpType === 'DRIVER_EXPENSE' ? dpTruck || undefined : undefined,
            tripId: dpType === 'DRIVER_EXPENSE' ? dpTripId || undefined : undefined,
            type: dpType,
            amount: amt,
            description: dpDesc.trim(),
            isReimbursable: dpType === 'DRIVER_EXPENSE' ? dpReimbursable : false,
          });
        } else if (target.type === 'SETTLEMENT' || target.type === 'COMPANY_SETTLEMENT') {
          const amt = parseFloat(setAmt);
          if (!amt || amt <= 0) return alert('Enter valid amount');
          updateSettlement(target.data.id, {
            date: setDate,
            companyName: setCompany,
            amount: amt,
            paymentMethod: setMethod,
            referenceNumber: setRef.trim(),
          });
        }
        onClose();
      };

      return (
        <ModalPortal>
          <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
          <div className="bg-slate-900 border border-slate-700 rounded-t-2xl sm:rounded-2xl w-full max-w-lg shadow-2xl p-4 sm:p-6 max-h-[92vh] overflow-y-auto">
            <div className="flex justify-between items-center pb-3 border-b border-slate-800 mb-4">
              <h3 className="text-base font-bold text-white">Edit Record ({target.type})</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            <form onSubmit={handleSave} className="space-y-4">
              {target.type === 'TRIP' && (
                <>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Date</label>
                      <input type="date" required value={tripDate} onChange={(e) => setTripDate(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white [color-scheme:dark]" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Truck</label>
                      <select value={tripTruck} onChange={(e) => setTripTruck(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white">
                        {trucks.map(t => <option key={t.id} value={t.id}>{t.registrationNumber}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Company</label>
                      <select value={tripCompany} onChange={(e) => setTripCompany(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white">
                        {companies.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Driver</label>
                      <select value={tripDriver} onChange={(e) => setTripDriver(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white">
                        {drivers.map(d => <option key={d.id} value={d.name}>{d.name}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">From</label>
                      <input type="text" required value={fromLoc} onChange={(e) => setFromLoc(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">To</label>
                      <input type="text" required value={toLoc} onChange={(e) => setToLoc(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white" />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Gross Rent (₹)</label>
                      <input type="number" required min="0" value={totalRent} onChange={(e) => setTotalRent(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white font-mono font-bold" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Commission (₹)</label>
                      <input type="number" min="0" value={comm} onChange={(e) => setComm(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white font-mono" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Advance (₹)</label>
                      <input type="number" min="0" value={adv} onChange={(e) => setAdv(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white font-mono" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-emerald-300 mb-1">Received (₹)</label>
                      <input type="number" min="0" value={rec} onChange={(e) => setRec(e.target.value)} className="w-full bg-slate-800 border border-emerald-500/40 rounded-lg px-2.5 py-1.5 text-xs text-white font-mono" title="Amount received from company for this trip" />
                    </div>
                  </div>

                  <div className="flex items-center gap-2 bg-slate-800/60 p-2.5 rounded-lg border border-slate-700">
                    <input type="checkbox" id="idx-edit-tds" checked={isTds} onChange={(e) => setIsTds(e.target.checked)} className="rounded text-amber-500" />
                    <label htmlFor="idx-edit-tds" className="text-xs text-white font-medium cursor-pointer">
                      TDS Deducted (1% by Shipper under Sec 194C)
                    </label>
                  </div>

                  {!isAutoSalary && (
                    <div className="bg-purple-950/30 border border-purple-800/60 rounded-xl p-3 space-y-1">
                      <div className="flex justify-between items-center">
                        <label className="block text-xs font-bold text-purple-300">
                          ✍️ Driver Salary / Commission (₹) *
                        </label>
                        <span className="text-[10px] text-purple-300 bg-purple-900/60 border border-purple-700/50 px-2 py-0.5 rounded font-semibold">
                          Manual Mode Active
                        </span>
                      </div>
                      <input
                        type="number"
                        min="0"
                        step="any"
                        required
                        value={editDriverSalary}
                        onChange={(e) => setEditDriverSalary(e.target.value)}
                        className="w-full bg-slate-800 border border-purple-500/50 rounded-lg px-2.5 py-1.5 text-xs text-white font-mono font-bold"
                        placeholder="Enter driver salary"
                      />
                    </div>
                  )}

                  {/* Live Calculations Preview */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 bg-slate-950/70 border border-slate-800 rounded-xl p-3">
                    <div className="bg-blue-500/10 border border-blue-500/20 p-2 rounded-lg">
                      <span className="text-[10px] uppercase font-bold text-blue-300 block">Net Rent</span>
                      <div className="text-xs font-bold font-mono text-blue-400 mt-0.5">{formatCurr(modalNetRent)}</div>
                    </div>
                    <div className="bg-purple-500/10 border border-purple-500/20 p-2 rounded-lg">
                      <span className="text-[10px] uppercase font-bold text-purple-300 block">
                        {isAutoSalary ? `Driver ${modalDrvRate}%` : 'Driver Salary (Manual)'}
                      </span>
                      <div className="text-xs font-bold font-mono text-purple-300 mt-0.5">{formatCurr(modalDriverSalary)}</div>
                    </div>
                    <div className="bg-amber-500/10 border border-amber-500/20 p-2 rounded-lg">
                      <span className="text-[10px] uppercase font-bold text-amber-300 block">Balance Due</span>
                      <div className="text-xs font-bold font-mono text-amber-400 mt-0.5">{formatCurr(modalBalDue)}</div>
                    </div>
                    <div className="bg-emerald-500/10 border border-emerald-500/20 p-2 rounded-lg">
                      <span className="text-[10px] uppercase font-bold text-emerald-300 block">{modalTdsRate}% TDS</span>
                      <div className="text-xs font-bold font-mono text-emerald-400 mt-0.5">{formatCurr(modalTdsAmt)}</div>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Notes</label>
                    <input type="text" value={tripNotes} onChange={(e) => setTripNotes(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white" />
                  </div>
                </>
              )}

              {(target.type === 'EXPENSE' || target.type === 'TRUCK_EXPENSE') && (
                <>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Date</label>
                      <input type="date" required value={expDate} onChange={(e) => setExpDate(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white [color-scheme:dark]" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Truck</label>
                      <select value={expTruck} onChange={(e) => { setExpTruck(e.target.value); setExpTripId(''); }} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white">
                        {trucks.map(t => <option key={t.id} value={t.id}>{t.registrationNumber}</option>)}
                      </select>
                    </div>
                  </div>
                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <label className="text-xs font-semibold text-slate-300">Link to Specific Trip (Optional)</label>
                      <button
                        type="button"
                        onClick={() => setShowAllEditTripsExp(!showAllEditTripsExp)}
                        className="text-[10px] text-amber-400 hover:text-amber-300 underline font-medium"
                      >
                        {showAllEditTripsExp ? '⟲ Filter by Date Period' : '👁️ Show All Trips'}
                      </button>
                    </div>
                    <select
                      value={expTripId}
                      onChange={(e) => setExpTripId(e.target.value)}
                      className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"
                    >
                      <option value="">-- General Vehicle Expense (Unlinked) --</option>
                      {truckTrips.map(tr => (
                        <option key={tr.id} value={tr.id}>
                          {formatDate(tr.date)} | {tr.route} (Rent: {formatCurr(tr.totalRent)})
                        </option>
                      ))}
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Category</label>
                      <select value={expCat} onChange={(e) => setExpCat(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white">
                        <option value="DIESEL">⛽ Diesel</option>
                        <option value="TOLL">🛣️ Toll</option>
                        <option value="MAINTENANCE">🔧 Maintenance</option>
                        <option value="INSURANCE">🛡️ Insurance</option>
                        <option value="SPARE_PARTS">⚙️ Spare Parts</option>
                        <option value="OTHER">📦 Other</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Amount (₹)</label>
                      <input type="number" required min="1" value={expAmt} onChange={(e) => setExpAmt(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white font-mono" />
                    </div>
                  </div>
                  <div className={`flex items-start gap-2 p-2.5 rounded-lg border ${!expTripId ? 'bg-slate-800/30 border-slate-800 opacity-60' : 'bg-slate-800/60 border-slate-700'}`}>
                    <input
                      type="checkbox"
                      id="edit-exp-reimbursable"
                      disabled={!expTripId}
                      checked={Boolean(expTripId && expReimbursable)}
                      onChange={(e) => setExpReimbursable(e.target.checked)}
                      className="rounded text-amber-500 mt-0.5 cursor-pointer disabled:cursor-not-allowed"
                    />
                    <label htmlFor="edit-exp-reimbursable" className={`text-xs font-medium ${!expTripId ? 'text-slate-400 cursor-not-allowed' : 'text-white cursor-pointer'}`}>
                      <span>Reimbursable by Company (Paid on behalf of client)</span>
                      {!expTripId ? (
                        <span className="block text-[10px] text-amber-400/90 font-medium">
                          ⚠️ Available only when linked to a specific trip above.
