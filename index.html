      <button onclick="location.reload();" class="px-4 py-2 bg-slate-800 text-slate-200 hover:text-white rounded-xl text-xs font-semibold">

    window.onerror = function(msg, url, line, col, error) {
      var banner = document.getElementById('error-banner');
      var errEl = document.getElementById('error-message');
      if (banner && errEl) {
        banner.style.display = 'block';
        errEl.textContent = (error && error.stack) ? error.stack : (msg + ' at line ' + line + ':' + col);
      }
      console.error('Captured window error:', msg, error);
    };
  </script>

    // --- MULTI-TENANT USER ACCOUNTS ---
    const initialUsers = [
      { id: 'usr-1', username: 'apex', password: 'password123', businessName: 'Apex Logistics India', email: 'owner@apexlogistics.in' },
      { id: 'usr-2', username: 'kiran', password: 'password123', businessName: 'Kiran Roadways Enterprise', email: 'transport@kiranroadways.com' },

    const defaultEmailSyncConfig = {
      linkedEmail: '',
      tollEnabled: true,
      tollSubjectFilter: 'FASTag Toll Debit Alert',
      fuelEnabled: true,
      fuelSubjectFilter: 'Fuel Transaction Alert',
      lastSyncedAt: null,
    };

    // --- CONTEXT ---
    const FleetContext = createContext();

    // Safe JSON parser for localStorage
    const safeStorageGet = (key, fallback) => {
      try {
        const item = localStorage.getItem(key);
        if (!item) return fallback;
        const parsed = JSON.parse(item);
        return parsed || fallback;
      } catch (err) {
        console.warn(`Error reading ${key} from storage, using fallback:`, err);
        return fallback;
      }
    };

    function FleetProvider({ children }) {
      const STORAGE_KEY = 'fleettrack_v4';

      // --- USER AUTHENTICATION & MULTI-TENANCY ---
      const [users, setUsers] = useState(() => safeStorageGet(`${STORAGE_KEY}_users`, initialUsers));
      const [currentUser, setCurrentUser] = useState(() => safeStorageGet(`${STORAGE_KEY}_cur_user`, null));

      const [profiles, setProfiles] = useState(() => safeStorageGet(`${STORAGE_KEY}_profiles`, initialProfiles));
      const [activeProfileId, setActiveProfileId] = useState(() => {
        try {
          return localStorage.getItem(`${STORAGE_KEY}_active_prof`) || (profiles && profiles[0]?.id) || 'prof-1';
        } catch (e) {
          return 'prof-1';
        }
      });
      const [rules, setRules] = useState(() => safeStorageGet(`${STORAGE_KEY}_rules`, initialRules));

      // Email Sync Configuration per profile
      const [emailSyncConfigs, setEmailSyncConfigs] = useState(() => safeStorageGet(`${STORAGE_KEY}_email_sync`, {
        'prof-1': { ...defaultEmailSyncConfig, linkedEmail: 'billing@apexlogistics.in' },
        'prof-2': { ...defaultEmailSyncConfig, linkedEmail: 'fastag@kiranroadways.com' },
      }));

      const [trucks, setTrucks] = useState(() => safeStorageGet(`${STORAGE_KEY}_trucks`, initialTrucks));
      const [companies, setCompanies] = useState(() => safeStorageGet(`${STORAGE_KEY}_companies`, initialCompanies));
      const [drivers, setDrivers] = useState(() => safeStorageGet(`${STORAGE_KEY}_drivers`, initialDrivers));
      const [trips, setTrips] = useState(() => {
        try {
          const saved = localStorage.getItem(`${STORAGE_KEY}_trips`) || localStorage.getItem('fleettrack_v3_trips');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) {
              return parsed.map(t => {
                const g = Number(t.totalRent) || 0;
                const a = Number(t.advanceReceived) || 0;
                const c = Number(t.commissionAmount) || 0;
                const tds = Number(t.tdsAmount) || 0;
                return { ...t, balancePending: Math.max(0, g - a - c - tds) };
              });
            }
          }
        } catch (e) {
          console.warn('Trips parse error:', e);
        }
        return initialTrips;
      });
      const [expenses, setExpenses] = useState(() => safeStorageGet(`${STORAGE_KEY}_expenses`, safeStorageGet('fleettrack_v3_expenses', initialExpenses)));
      const [driverPayments, setDriverPayments] = useState(() => safeStorageGet(`${STORAGE_KEY}_dp`, safeStorageGet('fleettrack_v3_dp', initialDriverPayments)));
      const [settlements, setSettlements] = useState(() => safeStorageGet(`${STORAGE_KEY}_settlements`, safeStorageGet('fleettrack_v3_settlements', initialSettlements)));

      const [dateFilter, setDateFilter] = useState({ preset: 'all', startDate: '', endDate: '' });
      const currency = '₹'; // Exclusively INR

      // Sync to localStorage
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_users`, JSON.stringify(users)); }, [users]);
      useEffect(() => {
        if (currentUser) localStorage.setItem(`${STORAGE_KEY}_cur_user`, JSON.stringify(currentUser));
        else localStorage.removeItem(`${STORAGE_KEY}_cur_user`);
      }, [currentUser]);
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_profiles`, JSON.stringify(profiles)); }, [profiles]);
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_active_prof`, activeProfileId); }, [activeProfileId]);
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_rules`, JSON.stringify(rules)); }, [rules]);
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_email_sync`, JSON.stringify(emailSyncConfigs)); }, [emailSyncConfigs]);
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_trucks`, JSON.stringify(trucks)); }, [trucks]);
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_companies`, JSON.stringify(companies)); }, [companies]);
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_drivers`, JSON.stringify(drivers)); }, [drivers]);
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_trips`, JSON.stringify(trips)); }, [trips]);
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_expenses`, JSON.stringify(expenses)); }, [expenses]);
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_dp`, JSON.stringify(driverPayments)); }, [driverPayments]);
      useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_settlements`, JSON.stringify(settlements)); }, [settlements]);

      // Auth actions
      const login = (username, password) => {
        const u = users.find(x => x.username.toLowerCase() === username.trim().toLowerCase() && x.password === password);
        if (!u) throw new Error('Invalid username or password');
        setCurrentUser(u);
        const userProfs = profiles.filter(p => p.userId === u.id || (!p.userId && p.name.toLowerCase() === u.businessName.toLowerCase()));
        if (userProfs.length > 0) {
          setActiveProfileId(userProfs[0].id);
        } else {
          const newProfId = `prof-${Date.now()}`;
          const newProf = { id: newProfId, userId: u.id, name: u.businessName, isDefault: true, createdAt: new Date().toISOString().split('T')[0] };
          setProfiles(prev => [...prev, newProf]);
          setActiveProfileId(newProfId);
        }
        return u;
      };

      const signup = (businessName, username, password, email) => {
        if (users.some(x => x.username.toLowerCase() === username.trim().toLowerCase())) {
          throw new Error('Username already exists. Please choose another.');
        }
        const newUserId = `usr-${Date.now()}`;
        const newProfId = `prof-${Date.now()}`;
        const newProf = { id: newProfId, userId: newUserId, name: businessName.trim(), isDefault: true, createdAt: new Date().toISOString().split('T')[0] };
        const newUser = { id: newUserId, username: username.trim(), password, businessName: businessName.trim(), email: email.trim() };

        setProfiles(prev => [...prev, newProf]);
        setRules(prev => ({ ...prev, [newProfId]: { defaultDriverSalaryPercent: 15, defaultTdsPercent: 1 } }));
        setEmailSyncConfigs(prev => ({ ...prev, [newProfId]: { ...defaultEmailSyncConfig, linkedEmail: email.trim() } }));
        setUsers(prev => [...prev, newUser]);

        setCurrentUser(newUser);
        setActiveProfileId(newProfId);
        return newUser;
      };

      const logout = () => {
        setCurrentUser(null);
      };

      // Scoped Profiles: strictly isolated to current user's business
      const scopedProfiles = useMemo(() => {
        if (!currentUser) return [];
        const userProfs = profiles.filter(p => p.userId === currentUser.id || (!p.userId && p.name.toLowerCase() === currentUser.businessName?.toLowerCase()));
        if (userProfs.length === 0) {
          return [{ id: `prof-${currentUser.id}`, userId: currentUser.id, name: currentUser.businessName, isDefault: true, createdAt: new Date().toISOString().split('T')[0] }];
        }
        return userProfs;
      }, [profiles, currentUser]);

      useEffect(() => {
        if (currentUser && scopedProfiles.length > 0) {
          const exists = scopedProfiles.some(p => p.id === activeProfileId);
          if (!exists) {
            setActiveProfileId(scopedProfiles[0].id);
          }
        }
      }, [currentUser, scopedProfiles, activeProfileId]);

      // Email Sync Configuration Actions
      const activeEmailConfig = useMemo(() => {
        return emailSyncConfigs[activeProfileId] || { ...defaultEmailSyncConfig };
      }, [emailSyncConfigs, activeProfileId]);

      const updateEmailSyncConfig = (updates) => {
        setEmailSyncConfigs(prev => ({
          ...prev,
          [activeProfileId]: { ...(prev[activeProfileId] || defaultEmailSyncConfig), ...updates }
        }));
      };

      const activeProfile = useMemo(() => scopedProfiles.find(p => p.id === activeProfileId) || scopedProfiles[0] || { id: 'prof-1', name: currentUser?.businessName || 'Default Entity' }, [scopedProfiles, activeProfileId, currentUser]);
      const activeRules = useMemo(() => rules[activeProfileId] || { defaultDriverSalaryPercent: 15, defaultTdsPercent: 1 }, [rules, activeProfileId]);

      const updateRules = (newRules) => {
        setRules(prev => ({
          ...prev,
          [activeProfileId]: { ...(prev[activeProfileId] || { defaultDriverSalaryPercent: 15, defaultTdsPercent: 1 }), ...newRules }
        }));
      };

      const addProfile = (name) => {
        const newP = { id: `prof-${Date.now()}`, userId: currentUser?.id, name: name.trim(), isDefault: false, createdAt: new Date().toISOString().split('T')[0] };
        setProfiles(prev => [...prev, newP]);
        setRules(prev => ({ ...prev, [newP.id]: { defaultDriverSalaryPercent: 15, defaultTdsPercent: 1 } }));
        setActiveProfileId(newP.id);
        return newP;
      };

      const updateProfile = (id, name) => {
        setProfiles(prev => prev.map(p => p.id === id ? { ...p, name: name.trim() } : p));
      };

      const deleteProfile = (id) => {
        if (scopedProfiles.length <= 1) return alert('Cannot delete the only remaining profile for your business account.');
        const remaining = profiles.filter(p => p.id !== id);
        setProfiles(remaining);
        const remScoped = scopedProfiles.filter(p => p.id !== id);
        if (remScoped.length > 0) setActiveProfileId(remScoped[0].id);
        setTrucks(prev => prev.filter(t => t.profileId !== id));
        setCompanies(prev => prev.filter(c => c.profileId !== id));
        setDrivers(prev => prev.filter(d => d.profileId !== id));
        setTrips(prev => prev.filter(t => t.profileId !== id));
        setExpenses(prev => prev.filter(e => e.profileId !== id));
        setDriverPayments(prev => prev.filter(p => p.profileId !== id));
        setSettlements(prev => prev.filter(s => s.profileId !== id));
      };

      // Scoped Data
      const scopedTrucks = useMemo(() => trucks.filter(t => t.profileId === activeProfileId), [trucks, activeProfileId]);
      const scopedCompanies = useMemo(() => companies.filter(c => c.profileId === activeProfileId), [companies, activeProfileId]);
      const scopedDrivers = useMemo(() => drivers.filter(d => d.profileId === activeProfileId), [drivers, activeProfileId]);
      const scopedTrips = useMemo(() => trips.filter(t => t.profileId === activeProfileId), [trips, activeProfileId]);
      const scopedExpenses = useMemo(() => expenses.filter(e => e.profileId === activeProfileId), [expenses, activeProfileId]);
      const scopedDriverPayments = useMemo(() => driverPayments.filter(p => p.profileId === activeProfileId), [driverPayments, activeProfileId]);
      const scopedSettlements = useMemo(() => settlements.filter(s => s.profileId === activeProfileId), [settlements, activeProfileId]);

      // Date Filtering
      const isDateInRange = (dateStr) => {
        if (dateFilter.preset === 'all') return true;
        const target = new Date(dateStr);
        const now = new Date();
        if (dateFilter.preset === 'this_month') {
          return target.getFullYear() === now.getFullYear() && target.getMonth() === now.getMonth();
        }
        if (dateFilter.preset === 'last_month') {
          const prevMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
          return target.getFullYear() === prevMonth.getFullYear() && target.getMonth() === prevMonth.getMonth();
        }
        if (dateFilter.preset === 'custom') {
          if (dateFilter.startDate && dateFilter.endDate) return dateStr >= dateFilter.startDate && dateStr <= dateFilter.endDate;
          if (dateFilter.startDate) return dateStr >= dateFilter.startDate;
          if (dateFilter.endDate) return dateStr <= dateFilter.endDate;
          return true;
        }
        return true;
      };

      const filteredTrips = useMemo(() => scopedTrips.filter(t => isDateInRange(t.date)), [scopedTrips, dateFilter]);
      const filteredExpenses = useMemo(() => scopedExpenses.filter(e => isDateInRange(e.date)), [scopedExpenses, dateFilter]);
      const filteredDriverPayments = useMemo(() => scopedDriverPayments.filter(p => isDateInRange(p.date)), [scopedDriverPayments, dateFilter]);
      const filteredSettlements = useMemo(() => scopedSettlements.filter(s => isDateInRange(s.date)), [scopedSettlements, dateFilter]);

      // Summary Metrics
      const summaryMetrics = useMemo(() => {
        const totalRevenue = filteredTrips.reduce((s, t) => s + Number(t.totalRent || 0), 0);
        const totalDirectExpenses = filteredExpenses.reduce((s, e) => s + Number(e.amount || 0), 0);
        const totalPendingRentFromTrips = filteredTrips.reduce((s, t) => {
          const reimb = scopedExpenses.filter(e => e.tripId === t.id && e.isReimbursable).reduce((sum, e) => sum + Number(e.amount || 0), 0);
          return s + Math.max(0, Number(t.totalRent || 0) + reimb - Number(t.advanceReceived || 0) - Number(t.receivedAmount || 0) - Number(t.commissionAmount || 0) - Number(t.tdsAmount || 0));
        }, 0);
        const totalSettlementsInPeriod = filteredSettlements.reduce((s, st) => s + Number(st.amount || 0), 0);
        const totalCompanyReceivables = Math.max(0, totalPendingRentFromTrips - totalSettlementsInPeriod);

        const totalDriverCommissions = filteredTrips.reduce((s, t) => s + Number(t.driverCommission || 0), 0);
        const totalExpensesClaimed = filteredDriverPayments.filter(p => p.type === 'DRIVER_EXPENSE').reduce((s, p) => s + Number(p.amount || 0), 0);
        const totalPayoutsMade = filteredDriverPayments.filter(p => p.type === 'SALARY_PAYOUT').reduce((s, p) => s + Number(p.amount || 0), 0);
        const netDriverPayable = (totalDriverCommissions + totalExpensesClaimed) - totalPayoutsMade;

        // Fleet Net Profit calculation:
        // Operational truck expenses only (excluding reimbursable expenses that client pays back)
        const totalOperationalTruckExpenses = filteredExpenses.filter(e => !e.isReimbursable).reduce((s, e) => s + Number(e.amount || 0), 0);
        const totalBrokerCommissions = filteredTrips.reduce((s, t) => s + Number(t.commissionAmount || 0), 0);
        const totalTdsDeducted = filteredTrips.reduce((s, t) => s + Number(t.tdsAmount || 0), 0);
        
        // Net Profit = Revenue - (Operational Truck Expenses + Driver Claims + Driver Wages + Broker Commissions + TDS)
        const fleetProfit = totalRevenue - totalOperationalTruckExpenses - totalExpensesClaimed - totalDriverCommissions - totalBrokerCommissions - totalTdsDeducted;
        const tripsWithTdsCount = filteredTrips.filter(t => t.isTdsDeducted && Number(t.tdsAmount) > 0).length;

        return {
          totalRevenue,
          totalDirectExpenses,
          totalCompanyReceivables,
          netDriverPayable,
          fleetProfit,
          tripsCount: filteredTrips.length,
          totalTdsDeducted,
          tripsWithTdsCount,
        };
      }, [filteredTrips, filteredExpenses, filteredDriverPayments, filteredSettlements, scopedExpenses]);

      // Recomputation Helper
      const computeTripFields = (gross, comm, isTds, adv, received = 0) => {
        const g = Number(gross) || 0;
        const c = Number(comm) || 0;
        const a = Number(adv) || 0;
        const r = Number(received) || 0;
        const tdsAmount = isTds ? (g * (activeRules.defaultTdsPercent / 100)) : 0;
        const netRent = Math.max(0, g - tdsAmount - c);
        const driverCommission = netRent * (activeRules.defaultDriverSalaryPercent / 100);
        // Receivables Formula: Balance Due = Total Rent - Advance Received - Amount Received from Company - Commission - TDS
        const balancePending = Math.max(0, g - a - r - c - tdsAmount);
        return { tdsAmount, netRent, driverCommission, balancePending };
      };

      // Trip Actions
      const addTrip = (input) => {
        const recAmt = Number(input.receivedAmount || 0);
        const { tdsAmount, netRent, driverCommission, balancePending } = computeTripFields(
          input.totalRent, input.commissionAmount, input.isTdsDeducted, input.advanceReceived, recAmt
        );

        if (!scopedCompanies.some(c => c.name.toLowerCase() === input.companyName.trim().toLowerCase())) {
          setCompanies(prev => [...prev, { id: `cmp-${Date.now()}`, profileId: activeProfileId, name: input.companyName.trim() }]);
        }
        if (!scopedDrivers.some(d => d.name.toLowerCase() === input.driverName.trim().toLowerCase())) {
          setDrivers(prev => [...prev, { id: `drv-${Date.now()}`, profileId: activeProfileId, name: input.driverName.trim(), phone: 'Pending', licenseNumber: 'Pending' }]);
        }

        const drops = (input.additionalDrops || []).filter(Boolean);
        const route = [input.fromLocation, ...drops, input.toLocation].filter(Boolean).join(' -> ');

        const newTrip = {
          id: `trp-${Date.now()}`,
          profileId: activeProfileId,
          date: input.date,
          truckId: input.truckId,
          companyName: input.companyName.trim(),
          driverName: input.driverName.trim(),
          fromLocation: input.fromLocation.trim(),
          toLocation: input.toLocation.trim(),
          additionalDrops: drops,
          route: route || 'Freight Route',
          totalRent: Number(input.totalRent) || 0,
          commissionAmount: Number(input.commissionAmount) || 0,
          isTdsDeducted: Boolean(input.isTdsDeducted),
          advanceReceived: Number(input.advanceReceived) || 0,
          receivedAmount: recAmt,
          tdsAmount,
          netRent,
          driverCommission,
          balancePending,
          notes: input.notes,
        };

        setTrips(prev => [newTrip, ...prev]);
        return newTrip;
      };

      const updateTrip = (id, updates) => {
        setTrips(prev => prev.map(t => {
          if (t.id !== id) return t;
          const merged = { ...t, ...updates };
          const recAmt = Number(merged.receivedAmount || 0);
          const { tdsAmount, netRent, driverCommission, balancePending } = computeTripFields(
            merged.totalRent, merged.commissionAmount, merged.isTdsDeducted, merged.advanceReceived, recAmt
          );
          const drops = (merged.additionalDrops || []).filter(Boolean);
          const route = [merged.fromLocation, ...drops, merged.toLocation].filter(Boolean).join(' -> ');
          return { ...merged, route: route || merged.route, receivedAmount: recAmt, tdsAmount, netRent, driverCommission, balancePending };
        }));
      };

      const deleteTrip = (id) => setTrips(prev => prev.filter(t => t.id !== id));

      // Expense Actions
      const addTruckExpense = (input) => {
        const newExp = {
          id: `exp-${Date.now()}`,
          profileId: activeProfileId,
          date: input.date,
          truckId: input.truckId,
          tripId: input.tripId || undefined,
          isReimbursable: Boolean(input.isReimbursable),
          category: input.category,
          amount: Number(input.amount) || 0,
          paymentMethod: input.paymentMethod,
          notes: input.notes,
        };
        setExpenses(prev => [newExp, ...prev]);
        return newExp;
      };
      const updateTruckExpense = (id, updates) => setExpenses(prev => prev.map(e => e.id === id ? { ...e, ...updates, amount: Number(updates.amount ?? e.amount) } : e));
      const deleteTruckExpense = (id) => setExpenses(prev => prev.filter(e => e.id !== id));

      // Driver Payment Actions
      const addDriverPayment = (input) => {
        const newDp = {
          id: `dp-${Date.now()}`,
          profileId: activeProfileId,
          date: input.date,
          driverName: input.driverName,
          truckId: input.truckId || undefined,
          tripId: input.tripId || undefined,
          type: input.type,
          amount: Number(input.amount) || 0,
          paymentMethod: input.paymentMethod,
          description: input.description,
        };
        setDriverPayments(prev => [newDp, ...prev]);
        return newDp;
      };
      const updateDriverPayment = (id, updates) => setDriverPayments(prev => prev.map(p => p.id === id ? { ...p, ...updates, amount: Number(updates.amount ?? p.amount) } : p));
      const deleteDriverPayment = (id) => setDriverPayments(prev => prev.filter(p => p.id !== id));

      // Settlement Actions
      const addSettlement = (input) => {
        const newSt = {
          id: `set-${Date.now()}`,
          profileId: activeProfileId,
          date: input.date,
          companyName: input.companyName,
          amount: Number(input.amount) || 0,
          paymentMethod: input.paymentMethod,
          referenceNumber: input.referenceNumber,
          notes: input.notes,
        };
        setSettlements(prev => [newSt, ...prev]);
        return newSt;
      };
      const updateSettlement = (id, updates) => setSettlements(prev => prev.map(s => s.id === id ? { ...s, ...updates, amount: Number(updates.amount ?? s.amount) } : s));
      const deleteSettlement = (id) => setSettlements(prev => prev.filter(s => s.id !== id));

      // Master Entity Actions (with cascading)
      const addTruck = (input) => {
        const newT = { id: `trk-${Date.now()}`, profileId: activeProfileId, ...input };
        setTrucks(prev => [...prev, newT]);
        return newT;
      };
      const updateTruck = (id, fields) => setTrucks(prev => prev.map(t => t.id === id ? { ...t, ...fields } : t));
      const deleteTruck = (id) => {
        if (trips.some(t => t.truckId === id) || expenses.some(e => e.truckId === id)) {
          if (!confirm('This truck has associated trips or expenses. Deleting it will delete them as well. Continue?')) return;
          setTrips(prev => prev.filter(t => t.truckId !== id));
          setExpenses(prev => prev.filter(e => e.truckId !== id));
        }
        setTrucks(prev => prev.filter(t => t.id !== id));
      };

      const addCompany = (input) => {
        const newC = { id: `cmp-${Date.now()}`, profileId: activeProfileId, ...input };
        setCompanies(prev => [...prev, newC]);
        return newC;
      };
      const updateCompany = (id, fields) => {
        const old = companies.find(c => c.id === id);
        if (old && fields.name && fields.name !== old.name) {
          // cascade rename
          setTrips(prev => prev.map(t => t.companyName === old.name ? { ...t, companyName: fields.name } : t));
          setSettlements(prev => prev.map(s => s.companyName === old.name ? { ...s, companyName: fields.name } : s));
        }
        setCompanies(prev => prev.map(c => c.id === id ? { ...c, ...fields } : c));
      };
      const deleteCompany = (id) => {
        const old = companies.find(c => c.id === id);
        if (old) {
          if (trips.some(t => t.companyName === old.name)) {
            if (!confirm('Company has associated trips. Deleting it will remove them. Continue?')) return;
            setTrips(prev => prev.filter(t => t.companyName !== old.name));
            setSettlements(prev => prev.filter(s => s.companyName !== old.name));
          }
        }
        setCompanies(prev => prev.filter(c => c.id !== id));
      };

      const addDriver = (input) => {
        const newD = { id: `drv-${Date.now()}`, profileId: activeProfileId, ...input, status: 'ACTIVE' };
        setDrivers(prev => [...prev, newD]);
        return newD;
      };
      const updateDriver = (id, fields) => {
        const old = drivers.find(d => d.id === id);
        if (old && fields.name && fields.name !== old.name) {
          // cascade rename
          setTrips(prev => prev.map(t => t.driverName === old.name ? { ...t, driverName: fields.name } : t));
          setDriverPayments(prev => prev.map(p => p.driverName === old.name ? { ...p, driverName: fields.name } : p));
        }
        setDrivers(prev => prev.map(d => d.id === id ? { ...d, ...fields } : d));
      };
      const deleteDriver = (id) => {
        const old = drivers.find(d => d.id === id);
        if (old) {
          if (trips.some(t => t.driverName === old.name) || driverPayments.some(p => p.driverName === old.name)) {
            if (!confirm('Driver has associated trips or payments. Deleting will remove them. Continue?')) return;
            setTrips(prev => prev.filter(t => t.driverName !== old.name));
            setDriverPayments(prev => prev.filter(p => p.driverName !== old.name));
          }
        }
        setDrivers(prev => prev.filter(d => d.id !== id));
      };

      const getTruckReg = (idOrReg) => {
        const found = scopedTrucks.find(t => t.id === idOrReg || t.registrationNumber === idOrReg);
        return found ? found.registrationNumber : idOrReg;
      };
      const getCompanyName = (idOrName) => {
        const found = scopedCompanies.find(c => c.id === idOrName || c.name === idOrName);
        return found ? found.name : idOrName;
      };
      const getDriverName = (idOrName) => {
        const found = scopedDrivers.find(d => d.id === idOrName || d.name === idOrName);
        return found ? found.name : idOrName;
      };
      const getTripExpenses = (tripId) => {
        // Direct operational truck expenses (excluding client reimbursable) + roadside driver expense claims linked to this trip
        const truckDirectExp = scopedExpenses.filter(e => e.tripId === tripId && !e.isReimbursable).reduce((sum, e) => sum + Number(e.amount || 0), 0);
        const drvClaims = scopedDriverPayments.filter(p => p.tripId === tripId && p.type === 'DRIVER_EXPENSE').reduce((sum, p) => sum + Number(p.amount || 0), 0);
        return truckDirectExp + drvClaims;
      };
      const getTripReimbursable = (tripId) => {
        return scopedExpenses.filter(e => e.tripId === tripId && e.isReimbursable).reduce((sum, e) => sum + Number(e.amount || 0), 0);
      };
      const getTripBalancePending = (tripOrId) => {
        if (!tripOrId) return 0;
        const trip = typeof tripOrId === 'string' ? scopedTrips.find(t => t.id === tripOrId) : tripOrId;
        if (!trip) return 0;
        const reimb = getTripReimbursable(trip.id);
        const g = Number(trip.totalRent || 0);
        const a = Number(trip.advanceReceived || 0);
        const r = Number(trip.receivedAmount || 0);
        const c = Number(trip.commissionAmount || 0);
        const tds = Number(trip.tdsAmount || 0);
        return Math.max(0, g + reimb - a - r - c - tds);
      };
      const getTripProfit = (tripOrId) => {
        if (!tripOrId) return 0;
        const trip = typeof tripOrId === 'string' ? scopedTrips.find(t => t.id === tripOrId) : tripOrId;
        if (!trip) return 0;
        const directOperationalExp = getTripExpenses(trip.id);
        const comm = Number(trip.commissionAmount || 0);
        const tds = Number(trip.tdsAmount || 0);
        const drvSal = Number(trip.driverCommission || 0);
        // Trip Profit = Gross Rent - (Direct Operational Expenses & Driver Claims + Driver Salary + Broker Commission + TDS)
        return Number(trip.totalRent || 0) - (directOperationalExp + drvSal + comm + tds);
      };

      // Automated Email Parsing Engine for Toll & Fuel Debits
      const syncExpensesFromEmails = (customSampleEmails = null, overrideConfig = null) => {
        const config = overrideConfig || activeEmailConfig;
        if (!config.linkedEmail) {
          config.linkedEmail = localStorage.getItem('fleet_google_email') || currentUser?.email || 'accounts@fleet.app';
        }
        if (!config.tollEnabled && !config.fuelEnabled) {
          throw new Error('Both Toll and Fuel sync options are currently toggled OFF in Master Management.');
        }

        // Available sample emails or operator-provided batch
        const sampleEmails = customSampleEmails || [
          {
            id: `eml-${Date.now()}-1`,
            from: 'fastag-alerts@icicibank.com',
            subject: config.tollSubjectFilter || 'FASTag Toll Debit Alert',
            date: new Date().toISOString().split('T')[0],
            body: `Dear Customer, your FASTag account has been debited by INR 650.00 at Khed-Shivapur Toll Plaza on ${new Date().toISOString().split('T')[0]} for Vehicle ${scopedTrucks[0]?.registrationNumber || 'MH-12-RN-4825'}. Balance remaining: INR 4,200.00.`,
            type: 'TOLL'
          },
          {
            id: `eml-${Date.now()}-2`,
            from: 'fleetcard@iocl.co.in',
            subject: config.fuelSubjectFilter || 'Fuel Transaction Alert',
            date: new Date().toISOString().split('T')[0],
            body: `Transaction Successful. Fuel Purchase of Rs 18,200.00 recorded on Card 4402 for Vehicle ${scopedTrucks[1]?.registrationNumber || 'MH-14-GH-3518'} at IOCL COCO Highway Pump on ${new Date().toISOString().split('T')[0]}. Volume: 198.5 Ltrs.`,
            type: 'DIESEL'
          }
        ];

        let createdCount = 0;
        const newExpensesCreated = [];
        const successfulEmailIds = [];

        sampleEmails.forEach(mail => {
          const subjectLower = (mail.subject || '').toLowerCase();
          const bodyLower = (mail.body || '').toLowerCase();
          const cleanTollFilter = (config.tollSubjectFilter || '').replace(/["']/g, '').toLowerCase().trim();
          const cleanFuelFilter = (config.fuelSubjectFilter || '').replace(/["']/g, '').toLowerCase().trim();

          // Determine category: if it contains fuel keywords, diesel, petrol, oil -> DIESEL; otherwise TOLL
          const isFuel = (cleanFuelFilter && (subjectLower.includes(cleanFuelFilter) || bodyLower.includes(cleanFuelFilter))) ||
                         subjectLower.includes('fuel') || subjectLower.includes('diesel') || bodyLower.includes('fuel');
          const category = isFuel ? 'DIESEL' : 'TOLL';

          // Extract Amount (e.g., INR 650.00, Rs. 500, ₹ 500, 500/-, debited 500, or raw digits)
          let amount = 0;
          const fullText = `${mail.subject} ${mail.body}`;
          
          const p1 = fullText.match(/(?:INR|Rs\.?|₹)\s*([\d,]+(?:\.\d+)?)/i);
          const p2 = fullText.match(/([\d,]+(?:\.\d+)?)\s*(?:INR|Rs\.?|₹|\/-)/i);
          const p3 = fullText.match(/(?:debited|deducted|charged|spent|amount|toll|fare|payment|purchase|fee|rs)(?:\s*(?:is|of|by|with|for|:))?\s*(?:INR|Rs\.?|₹)?\s*([\d,]+(?:\.\d+)?)/i);
          const p4 = fullText.match(/\b([1-9]\d{1,5}(?:\.\d{1,2})?)\b/);

          const amtStr = p1?.[1] || p2?.[1] || p3?.[1] || p4?.[1];
          if (amtStr) {
            amount = parseFloat(amtStr.replace(/,/g, '')) || 0;
          }

          if (amount <= 0) return; // Skip if no amount detected

          // Extract Truck Number by checking registered trucks
          let matchedTruck = scopedTrucks.find(trk => {
            const cleanReg = trk.registrationNumber.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
            const cleanText = fullText.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
            return cleanText.includes(cleanReg);
          });

          // Fallback: search regex pattern like MH-12-RN-4825 or similar
          if (!matchedTruck) {
            const regPattern = /[A-Z]{2}[-\s]?[0-9]{2}[-\s]?[A-Z]{1,3}[-\s]?[0-9]{4}/i;
            const regMatch = fullText.match(regPattern);
            if (regMatch) {
              const matchedStr = regMatch[0].replace(/\s+/g, '-').toUpperCase();
              matchedTruck = scopedTrucks.find(t => t.registrationNumber.toUpperCase() === matchedStr);
            }
          }
          if (!matchedTruck && scopedTrucks.length > 0) matchedTruck = scopedTrucks[0];

          const targetTruckId = matchedTruck ? matchedTruck.id : (scopedTrucks[0]?.id || 'trk-1');
          const targetTruckReg = matchedTruck ? matchedTruck.registrationNumber : (scopedTrucks[0]?.registrationNumber || 'Fleet Vehicle');

          // Tag current ongoing trip for that truck based on date
          const mailDate = mail.date || new Date().toISOString().split('T')[0];
          const ongoingTrip = scopedTrips.find(t => {
            return t.truckId === targetTruckId && t.date <= mailDate;
          }) || scopedTrips.find(t => t.truckId === targetTruckId);

          const newExp = {
            id: `exp-auto-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
            profileId: activeProfileId,
            date: mailDate,
            truckId: targetTruckId,
            tripId: ongoingTrip ? ongoingTrip.id : undefined,
            isReimbursable: false,
            category: category,
            amount: amount,
            paymentMethod: category === 'TOLL' ? 'FASTag (Auto-Email)' : 'Fleet Card (Auto-Email)',
            notes: `Auto-parsed from email [${mail.from || 'Gmail'}]: ${mail.subject} | Ref Truck: ${targetTruckReg}${ongoingTrip ? ` | Tagged to Trip: ${ongoingTrip.route}` : ' | Unlinked (no ongoing trip)'}`,
            sourceEmailId: mail.id
          };

          newExpensesCreated.push(newExp);
          if (mail.id) successfulEmailIds.push(mail.id);
          createdCount++;
        });

        if (newExpensesCreated.length > 0) {
          setExpenses(prev => [...newExpensesCreated, ...prev]);
          updateEmailSyncConfig({ lastSyncedAt: new Date().toISOString() });
        }

        return {
          syncedCount: createdCount,
          expenses: newExpensesCreated,
          successfulEmailIds: successfulEmailIds,
          lastSyncedAt: new Date().toISOString()
        };
      };

      // Decode base64url encoded string from Gmail API
      const decodeBase64Url = (str) => {
        if (!str) return '';
        try {
          let base64 = str.replace(/-/g, '+').replace(/_/g, '/');
          while (base64.length % 4) base64 += '=';
          return decodeURIComponent(escape(window.atob(base64)));
        } catch (e) {
          try {
            return window.atob(str.replace(/-/g, '+').replace(/_/g, '/'));
          } catch (e2) {
            return '';
          }
        }
      };

      // 1-Click Live Gmail Sync Engine
      const syncFromLiveGmail = async (accessToken, overrideConfig = null) => {
        if (!accessToken) throw new Error('Gmail is not connected. Please click "Connect Gmail" first.');

        const config = overrideConfig || activeEmailConfig;
        if (!config.tollEnabled && !config.fuelEnabled) {
          throw new Error('Both Toll and Fuel sync options are toggled OFF in your settings.');
        }

        const tollKeyword = (config.tollSubjectFilter || '').replace(/["']/g, '').trim();
        const fuelKeyword = (config.fuelSubjectFilter || '').replace(/["']/g, '').trim();

        const queries = [];
        if (config.tollEnabled && tollKeyword) {
          queries.push(`subject:(${tollKeyword})`);
        }
        if (config.fuelEnabled && fuelKeyword) {
          queries.push(`subject:(${fuelKeyword})`);
        }
        if (queries.length === 0) queries.push('subject:(FASTag OR Fuel OR Toll)');

        // Query recent messages matching the subject keywords (from last 14 days)
        const searchQuery = `newer_than:14d (${queries.join(' OR ')})`;

        // 1. Query matching messages
        const listRes = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages?q=${encodeURIComponent(searchQuery)}&maxResults=25`, {
          headers: { Authorization: `Bearer ${accessToken}` }
        });

        if (!listRes.ok) {
          const errData = await listRes.json().catch(() => ({}));
          throw new Error(errData?.error?.message || `Gmail API error (status ${listRes.status})`);
        }

        const listData = await listRes.json();
        const allFound = listData.messages || [];

        // Track already processed IDs in localStorage to avoid duplicates
        const processedSet = new Set(JSON.parse(localStorage.getItem('fleet_processed_gmail_msg_ids') || '[]'));
        const newMsgList = allFound.filter(m => !processedSet.has(m.id));

        if (newMsgList.length === 0) {
          updateEmailSyncConfig({ lastSyncedAt: new Date().toISOString() });
          const explanation = allFound.length > 0
            ? `Found ${allFound.length} matching alert email(s) in Gmail, but they were already in the processed cache. Click "Force Re-Scan (Clear Cache)" to re-parse them into the ledger!`
            : `Scanned Gmail for query [${searchQuery}]: 0 matching emails found. Please ensure the incoming email has arrived in your inbox and contains "${tollKeyword || fuelKeyword}" in the subject line.`;
          return {
            syncedCount: 0,
            hasCachedEmails: allFound.length > 0,
            message: explanation
          };
        }

        // 2. Fetch full message payloads
        const fetchedEmails = [];

        for (const item of newMsgList) {
          try {
            const detailRes = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${item.id}?format=full`, {
              headers: { Authorization: `Bearer ${accessToken}` }
            });
            if (!detailRes.ok) continue;
            const detail = await detailRes.json();

            const headers = detail.payload?.headers || [];
            const findHdr = (hName) => headers.find(h => h.name.toLowerCase() === hName.toLowerCase())?.value || '';
            const subject = findHdr('Subject');
            const from = findHdr('From');
            const dateStr = findHdr('Date');
            const mailDate = dateStr ? new Date(dateStr).toISOString().split('T')[0] : new Date().toISOString().split('T')[0];

            let bodyContent = detail.snippet ? `${detail.snippet} ` : '';
            if (detail.payload?.body?.data) {
              bodyContent += decodeBase64Url(detail.payload.body.data);
            } else if (detail.payload?.parts) {
              detail.payload.parts.forEach(part => {
                if (part.body?.data) bodyContent += ` ${decodeBase64Url(part.body.data)}`;
                if (part.parts) {
                  part.parts.forEach(subPart => {
                    if (subPart.body?.data) bodyContent += ` ${decodeBase64Url(subPart.body.data)}`;
                  });
                }
              });
            }

            fetchedEmails.push({
              id: item.id,
              from,
              subject,
              date: mailDate,
              body: bodyContent
            });
          } catch (itemErr) {
            console.warn('Error reading message detail:', itemErr);
          }
        }

        // 3. Ingest through our local trip-tagging engine
        const ingestRes = syncExpensesFromEmails(fetchedEmails, config);

        // ONLY mark as processed the email IDs that were ACTUALLY recorded!
        const actuallyRecordedIds = ingestRes.successfulEmailIds || [];

        if (actuallyRecordedIds.length > 0) {
          const updatedProcessed = Array.from(new Set([...processedSet, ...actuallyRecordedIds]));
          localStorage.setItem('fleet_processed_gmail_msg_ids', JSON.stringify(updatedProcessed.slice(-500)));

          for (const mId of actuallyRecordedIds) {
            try {
              await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${mId}/modify`, {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${accessToken}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({ removeLabelIds: ['UNREAD'] })
              });
            } catch (modErr) {
              console.warn('Error marking message as read in Gmail:', modErr);
            }
          }
        }

        if (ingestRes.syncedCount === 0 && fetchedEmails.length > 0) {
          return {
            syncedCount: 0,
            message: `Found ${fetchedEmails.length} matching email(s), but could not detect a valid debit amount (e.g. ₹500 or Rs 650) in them.`
          };
        }

        return {
          syncedCount: ingestRes.syncedCount,
          message: `Scanned Gmail: Found and logged ${ingestRes.syncedCount} new expense(s) tagged to active trips!`
        };
      };

      return (
        <FleetContext.Provider value={{
          currentUser, users, login, signup, logout,
          profiles: scopedProfiles, activeProfileId, activeProfile, setActiveProfileId, addProfile, updateProfile, deleteProfile,
          activeRules, updateRules,
          activeEmailConfig, updateEmailSyncConfig, syncExpensesFromEmails, syncFromLiveGmail,
          trucks: scopedTrucks, companies: scopedCompanies, drivers: scopedDrivers,
          trips: scopedTrips, expenses: scopedExpenses, driverPayments: scopedDriverPayments, settlements: scopedSettlements,
          filteredTrips, filteredExpenses, filteredDriverPayments, filteredSettlements,
          summaryMetrics, dateFilter, setDateFilter, currency,
          addTrip, updateTrip, deleteTrip,
          addTruckExpense, updateTruckExpense, deleteTruckExpense,
          addDriverPayment, updateDriverPayment, deleteDriverPayment,
          addSettlement, updateSettlement, deleteSettlement,
          addTruck, updateTruck, deleteTruck,
          addCompany, updateCompany, deleteCompany,
          addDriver, updateDriver, deleteDriver,
          getTruckReg, getCompanyName, getDriverName,
          getTripExpenses, getTripReimbursable, getTripBalancePending, getTripProfit,
        }}>
          {children}
        </FleetContext.Provider>
      );
    }

    const useFleet = () => useContext(FleetContext);
    const formatCurr = (val) => `₹ ${Number(val || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 })}`;

    // --- COMPONENT: SUMMARY CARDS ---

    // --- COMPONENT: STICKY DATE FILTER ---
    function DateFilter() {
      const { dateFilter, setDateFilter } = useFleet();
      const handlePreset = (preset) => {
        if (preset === 'custom') {
          const today = new Date().toISOString().split('T')[0];
          const past = new Date(Date.now() - 30 * 86400000).toISOString().split('T')[0];
          setDateFilter({ preset: 'custom', startDate: dateFilter.startDate || past, endDate: dateFilter.endDate || today });
        } else {
          setDateFilter({ preset, startDate: '', endDate: '' });
        }
      };

      return (
        <div className="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3 shadow-md mb-6">
          <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">

              <span className="text-amber-500">📅</span> Date Range Filter:
            </div>
            <div className="flex items-center flex-wrap gap-2">
              {['all', 'this_month', 'last_month', 'custom'].map((p) => {
                const label = p === 'all' ? 'All Time' : p === 'this_month' ? 'This Month' : p === 'last_month' ? 'Last Month' : 'Custom Range';
                const active = dateFilter.preset === p;
                return (
                  <button
                    key={p}
                    onClick={() => handlePreset(p)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${active ? 'bg-amber-500 text-slate-950 font-bold shadow-md' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                  >

                  </button>
                );

                  <span className="text-slate-500 text-xs">to</span>

    // --- TAB 2: TRUCK PERFORMANCE (STATUS BADGE REMOVED) ---
    function TruckPerformanceTab() {
      const { trucks, filteredTrips, filteredExpenses, filteredDriverPayments, getCompanyName, getTripExpenses, getTripProfit, getTripBalancePending } = useFleet();
      const [selTruck, setSelTruck] = useState('all');

      // Column filter states
      const [fleetFilters, setFleetFilters] = useState({});
      const [tripColFilters, setTripColFilters] = useState({});
      const [expColFilters, setExpColFilters] = useState({});

      const truckData = trucks.map(trk => {
        const trkTrips = filteredTrips.filter(t => t.truckId === trk.id);
        // Exclude reimbursable expenses from vehicle operating costs
        const trkDirectExpenses = filteredExpenses.filter(e => e.truckId === trk.id && !e.isReimbursable).reduce((s, e) => s + Number(e.amount), 0);
        const trkDriverClaims = (filteredDriverPayments || []).filter(p => p.truckId === trk.id && p.type === 'DRIVER_EXPENSE').reduce((s, p) => s + Number(p.amount || 0), 0);
        const trkDriverWages = trkTrips.reduce((s, t) => s + Number(t.driverCommission || 0), 0);
        const trkCommissions = trkTrips.reduce((s, t) => s + Number(t.commissionAmount || 0), 0);
        const trkTds = trkTrips.reduce((s, t) => s + Number(t.tdsAmount || 0), 0);
        
        const rev = trkTrips.reduce((s, t) => s + Number(t.totalRent), 0);
        // Total vehicle operating costs = direct operational expenses + driver claims + driver salaries + broker commissions + TDS
        const exp = trkDirectExpenses + trkDriverClaims + trkDriverWages + trkCommissions + trkTds;
        const profit = rev - exp;
        const margin = rev > 0 ? (profit / rev) * 100 : 0;
        return { trk, trips: trkTrips, expenses: filteredExpenses.filter(e => e.truckId === trk.id), rev, exp, profit, margin };
      });

      // Filtered truckData based on fleetFilters
      const filteredTruckData = useMemo(() => {
        return truckData.filter(td => {
          if (fleetFilters.reg && !td.trk.registrationNumber.toLowerCase().includes(fleetFilters.reg.toLowerCase())) return false;
          if (fleetFilters.model && !`${td.trk.model} ${td.trk.capacity}`.toLowerCase().includes(fleetFilters.model.toLowerCase())) return false;
          if (fleetFilters.trips && !String(td.trips.length).includes(fleetFilters.trips)) return false;
          if (fleetFilters.rev && !String(td.rev).includes(fleetFilters.rev)) return false;
          if (fleetFilters.exp && !String(td.exp).includes(fleetFilters.exp)) return false;
          if (fleetFilters.profit && !String(td.profit).includes(fleetFilters.profit)) return false;
          if (fleetFilters.margin && !String(Math.round(td.margin)).includes(fleetFilters.margin)) return false;
          return true;
        });
      }, [truckData, fleetFilters]);

      const activeView = selTruck === 'all' ? null : truckData.find(d => d.trk.id === selTruck);

      // Calculations for Fleet Overview Totals Row (dynamically recalculates from filteredTruckData)
      const fleetTotalTrips = filteredTruckData.reduce((s, td) => s + td.trips.length, 0);
      const fleetTotalRev = filteredTruckData.reduce((s, td) => s + td.rev, 0);
      const fleetTotalExp = filteredTruckData.reduce((s, td) => s + td.exp, 0);
      const fleetTotalProfit = fleetTotalRev - fleetTotalExp;
      const fleetTotalMargin = fleetTotalRev > 0 ? (fleetTotalProfit / fleetTotalRev) * 100 : 0;

      // Filtered lists for itemized tables
      const displayedTrips = selTruck === 'all' ? filteredTrips : filteredTrips.filter(t => t.truckId === selTruck);
      // Combine direct truck expenses and driver expense claims tagged to truck
      const displayedExpenses = useMemo(() => {
        const direct = (selTruck === 'all' ? filteredExpenses : filteredExpenses.filter(e => e.truckId === selTruck)).map(e => ({
          ...e,
          itemType: 'TRUCK_EXP'
        }));
        const claims = (filteredDriverPayments || [])
          .filter(p => p.type === 'DRIVER_EXPENSE' && (selTruck === 'all' ? Boolean(p.truckId) : p.truckId === selTruck))
          .map(p => ({
            id: p.id,
            date: p.date,
            truckId: p.truckId,
            tripId: p.tripId,
            category: 'DRIVER CLAIM',
            notes: `${p.driverName}: ${p.description || 'Roadside Claim'}`,
            paymentMethod: p.paymentMethod || 'Driver Claim',
            amount: p.amount,
            isReimbursable: false,
            itemType: 'DRIVER_CLAIM'
          }));
        return [...direct, ...claims].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      }, [filteredExpenses, filteredDriverPayments, selTruck]);

      // Itemized Trips with Column Filters
      const filteredItemizedTrips = useMemo(() => {
        return displayedTrips.filter(t => {
          const directExp = Number(getTripExpenses ? getTripExpenses(t.id) : 0);
          const comm = Number(t.commissionAmount || 0);
          const drvSal = Number(t.driverCommission || 0);
          const tds = Number(t.tdsAmount || 0);
          const tripExp = directExp + comm + drvSal + tds;
          const tripProfit = getTripProfit ? getTripProfit(t) : (Number(t.totalRent || 0) - tripExp);
          const compDisplay = getCompanyName ? getCompanyName(t.companyName || t.companyId) : (t.companyName || t.companyId);
          const receivedSoFar = Number(t.advanceReceived || 0) + Number(t.receivedAmount || 0);
          const balDue = getTripBalancePending ? getTripBalancePending(t) : Number(t.balancePending || 0);

          if (tripColFilters.date && !String(t.date || '').toLowerCase().includes(tripColFilters.date.toLowerCase())) return false;
          if (tripColFilters.company && !String(compDisplay || '').toLowerCase().includes(tripColFilters.company.toLowerCase())) return false;
          if (tripColFilters.route && !String(t.route || '').toLowerCase().includes(tripColFilters.route.toLowerCase())) return false;
          if (tripColFilters.rent && !String(t.totalRent || '').includes(tripColFilters.rent)) return false;
          if (tripColFilters.tripExp && !String(tripExp).includes(tripColFilters.tripExp)) return false;
          if (tripColFilters.tripProfit && !String(tripProfit).includes(tripColFilters.tripProfit)) return false;
          if (tripColFilters.received && !String(receivedSoFar).includes(tripColFilters.received)) return false;
          if (tripColFilters.pending && !String(balDue).includes(tripColFilters.pending)) return false;
          return true;
        });
      }, [displayedTrips, tripColFilters, getTripExpenses, getTripProfit, getCompanyName, getTripBalancePending]);

      // Itemized Trips Totals (dynamically calculated over filteredItemizedTrips)
      const tripsTotalRent = filteredItemizedTrips.reduce((s, t) => s + Number(t.totalRent || 0), 0);
      const tripsTotalReceived = filteredItemizedTrips.reduce((s, t) => s + Number(t.advanceReceived || 0) + Number(t.receivedAmount || 0), 0);
      const tripsTotalExp = filteredItemizedTrips.reduce((s, t) => {
        const directExp = Number(getTripExpenses ? getTripExpenses(t.id) : 0);
        const comm = Number(t.commissionAmount || 0);
        const drvSal = Number(t.driverCommission || 0);
        const tds = Number(t.tdsAmount || 0);
        return s + directExp + comm + drvSal + tds;
      }, 0);
      const tripsTotalProfit = filteredItemizedTrips.reduce((s, t) => s + Number(getTripProfit ? getTripProfit(t) : 0), 0);
      const tripsTotalPending = filteredItemizedTrips.reduce((s, t) => s + Number(getTripBalancePending ? getTripBalancePending(t) : t.balancePending || 0), 0);

      // Itemized Expenses with Column Filters
      const filteredItemizedExpenses = useMemo(() => {
        return displayedExpenses.filter(e => {
          if (expColFilters.date && !String(e.date || '').toLowerCase().includes(expColFilters.date.toLowerCase())) return false;
          if (expColFilters.category && !String(e.category || '').toLowerCase().includes(expColFilters.category.toLowerCase())) return false;
          if (expColFilters.notes && !String(e.notes || e.paymentMethod || '').toLowerCase().includes(expColFilters.notes.toLowerCase())) return false;
          if (expColFilters.amount && !String(e.amount || '').includes(expColFilters.amount)) return false;
          return true;
        });
      }, [displayedExpenses, expColFilters]);

      // Itemized Expenses Totals (dynamically calculated over filteredItemizedExpenses)
      const expensesTotalAmt = filteredItemizedExpenses.reduce((s, e) => s + Number(e.amount || 0), 0);

      const hasFleetFilters = Object.values(fleetFilters).some(Boolean);
      const hasTripFilters = Object.values(tripColFilters).some(Boolean);
      const hasExpFilters = Object.values(expColFilters).some(Boolean);

      return (
        <div className="space-y-6">
          <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg flex flex-wrap justify-between items-center gap-4">

            </div>
            <div className="flex items-center gap-2">
              <label className="text-xs text-slate-400 font-semibold">Select Truck:</label>
              <select

                onChange={(e) => setSelTruck(e.target.value)}
                className="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
              >
                <option value="all">🚛 All Trucks (Fleet Summary)</option>
                {trucks.map(t => (
                  <option key={t.id} value={t.id}>{t.registrationNumber} - {t.model}</option>
                ))}
              </select>
            </div>
          </div>

          {activeView && (
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 animate-fadeIn">
              <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-4">
                <span className="text-xs text-slate-400 uppercase">Gross Revenue</span>
                <div className="text-xl font-bold font-mono text-blue-400 mt-1">{formatCurr(activeView.rev)}</div>
                <div className="text-[10px] text-slate-500 mt-0.5">{activeView.trips.length} trips</div>
              </div>
              <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-4">
                <span className="text-xs text-slate-400 uppercase">Total Operating Costs</span>
                <div className="text-xl font-bold font-mono text-rose-400 mt-1">{formatCurr(activeView.exp)}</div>
                <div className="text-[10px] text-slate-500 mt-0.5">Fuel, repairs, driver wages, TDS</div>
              </div>
              <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-4">
                <span className="text-xs text-slate-400 uppercase">Net Vehicle Profit</span>
                <div className={`text-xl font-bold font-mono mt-1 ${activeView.profit >= 0 ? 'text-emerald-400' : 'text-rose-500'}`}>
                  {formatCurr(activeView.profit)}
                </div>
                <div className="text-[10px] text-slate-500 mt-0.5">Revenue - Costs</div>
              </div>
              <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-4">
                <span className="text-xs text-slate-400 uppercase">Profit Margin</span>
                <div className="text-xl font-bold font-mono text-amber-400 mt-1">{Math.round(activeView.margin)}%</div>
                <div className="text-[10px] text-slate-500 mt-0.5">ROI for period</div>
              </div>

          )}

          {selTruck === 'all' && (

    // --- SHARED UNIVERSAL EDIT RECORD MODAL ---
    function EditRecordModal({ target, onClose }) {
      const { trucks, companies, drivers, trips, updateTrip, updateTruckExpense, updateDriverPayment, updateSettlement, activeRules } = useFleet();
      if (!target) return null;

      // TRIP STATE
      const [tripDate, setTripDate] = useState(target.data.date || '');
      const [tripTruck, setTripTruck] = useState(target.data.truckId || (trucks[0]?.id || ''));
      const [tripCompany, setTripCompany] = useState(target.data.companyName || '');
      const [tripDriver, setTripDriver] = useState(target.data.driverName || '');
      const [fromLoc, setFromLoc] = useState(target.data.fromLocation || '');
      const [toLoc, setToLoc] = useState(target.data.toLocation || '');
      const [drops, setDrops] = useState(target.data.additionalDrops || []);
      const [totalRent, setTotalRent] = useState(target.data.totalRent?.toString() || '');
      const [comm, setComm] = useState(target.data.commissionAmount?.toString() || '0');
      const [isTds, setIsTds] = useState(target.data.isTdsDeducted ?? true);
      const [adv, setAdv] = useState(target.data.advanceReceived?.toString() || '0');
      const [rec, setRec] = useState(target.data.receivedAmount?.toString() || '0');
      const [tripNotes, setTripNotes] = useState(target.data.notes || '');

      // Dynamic calculation helper for live Trip preview
      const modalGross = parseFloat(totalRent) || 0;
      const modalComm = parseFloat(comm) || 0;
      const modalAdv = parseFloat(adv) || 0;
      const modalRec = parseFloat(rec) || 0;
      const modalTdsRate = (activeRules && activeRules.defaultTdsPercent) ? activeRules.defaultTdsPercent : 1;
      const modalDrvRate = (activeRules && activeRules.defaultDriverSalaryPercent) ? activeRules.defaultDriverSalaryPercent : 15;
      const modalTdsAmt = isTds ? (modalGross * (modalTdsRate / 100)) : 0;
      const modalNetRent = Math.max(0, modalGross - modalTdsAmt - modalComm);
      const modalDriverSalary = modalNetRent * (modalDrvRate / 100);
      const modalBalDue = Math.max(0, modalGross - modalAdv - modalRec - modalComm - modalTdsAmt);

      // EXPENSE STATE
      const [expDate, setExpDate] = useState(target.data.date || '');
      const [expTruck, setExpTruck] = useState(target.data.truckId || '');
      const [expTripId, setExpTripId] = useState(target.data.tripId || '');
      const [expCat, setExpCat] = useState(target.data.category || 'DIESEL');
      const [expAmt, setExpAmt] = useState(target.data.amount?.toString() || '');
      const [expMethod, setExpMethod] = useState(target.data.paymentMethod || 'Fleet Card');
      const [expNotes, setExpNotes] = useState(target.data.notes || '');
      const [expReimbursable, setExpReimbursable] = useState(target.data.isReimbursable || false);

      const truckTrips = (trips || []).filter(t => t.truckId === expTruck);

      // DRIVER PAY STATE
      const [dpDate, setDpDate] = useState(target.data.date || '');
      const [dpDriver, setDpDriver] = useState(target.data.driverName || '');
      const [dpType, setDpType] = useState(target.data.type || 'SALARY_PAYOUT');
      const [dpAmt, setDpAmt] = useState(target.data.amount?.toString() || '');
      const [dpDesc, setDpDesc] = useState(target.data.description || '');
      const [dpTruck, setDpTruck] = useState(target.data.truckId || '');
      const [dpTripId, setDpTripId] = useState(target.data.tripId || '');

      // SETTLEMENT STATE
      const [setDate, setSetDate] = useState(target.data.date || '');
      const [setCompany, setSetCompany] = useState(target.data.companyName || '');
      const [setAmt, setSetAmt] = useState(target.data.amount?.toString() || '');
      const [setMethod, setSetMethod] = useState(target.data.paymentMethod || 'NEFT');
      const [setRef, setSetRef] = useState(target.data.referenceNumber || '');

      const handleSave = (e) => {
        e.preventDefault();
        if (target.type === 'TRIP') {
          const rentNum = parseFloat(totalRent);
          if (!rentNum || rentNum <= 0) return alert('Enter valid gross rent');
          updateTrip(target.data.id, {
            date: tripDate,
            truckId: tripTruck,
            companyName: tripCompany.trim(),
            driverName: tripDriver.trim(),
            fromLocation: fromLoc.trim(),
            toLocation: toLoc.trim(),
            additionalDrops: drops.filter(Boolean),
            totalRent: rentNum,
            commissionAmount: modalComm,
            isTdsDeducted: isTds,
            advanceReceived: modalAdv,
            receivedAmount: modalRec,
            tdsAmount: modalTdsAmt,
            netRent: modalNetRent,
            driverCommission: modalDriverSalary,
            balancePending: modalBalDue,
            notes: tripNotes.trim(),
          });
        } else if (target.type === 'EXPENSE' || target.type === 'TRUCK_EXPENSE') {
          const amt = parseFloat(expAmt);
          if (!amt || amt <= 0) return alert('Enter valid amount');
          updateTruckExpense(target.data.id, {
            date: expDate,
            truckId: expTruck,
            tripId: expTripId || undefined,
            category: expCat,
            amount: amt,
            paymentMethod: expMethod,
            notes: expNotes.trim(),
            isReimbursable: expReimbursable,
          });
        } else if (target.type === 'DRIVER_PAY' || target.type === 'DRIVER_PAYMENT') {
          const amt = parseFloat(dpAmt);
          if (!amt || amt <= 0) return alert('Enter valid amount');
          updateDriverPayment(target.data.id, {
            date: dpDate,
            driverName: dpDriver,
            truckId: dpType === 'DRIVER_EXPENSE' ? dpTruck || undefined : undefined,
            tripId: dpType === 'DRIVER_EXPENSE' ? dpTripId || undefined : undefined,
            type: dpType,
            amount: amt,
            description: dpDesc.trim(),
          });
        } else if (target.type === 'SETTLEMENT' || target.type === 'COMPANY_SETTLEMENT') {
          const amt = parseFloat(setAmt);
          if (!amt || amt <= 0) return alert('Enter valid amount');
          updateSettlement(target.data.id, {
            date: setDate,
            companyName: setCompany,
            amount: amt,
            paymentMethod: setMethod,
            referenceNumber: setRef.trim(),
          });
        }
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-lg shadow-2xl p-6 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center pb-3 border-b border-slate-800 mb-4">
              <h3 className="text-base font-bold text-white">Edit Record ({target.type})</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            <form onSubmit={handleSave} className="space-y-4">
              {target.type === 'TRIP' && (
                <>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Date</label>
                      <input type="date" required value={tripDate} onChange={(e) => setTripDate(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white [color-scheme:dark]" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Truck</label>
                      <select value={tripTruck} onChange={(e) => setTripTruck(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white">
                        {trucks.map(t => <option key={t.id} value={t.id}>{t.registrationNumber}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Company</label>
                      <select value={tripCompany} onChange={(e) => setTripCompany(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white">
                        {companies.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Driver</label>
                      <select value={tripDriver} onChange={(e) => setTripDriver(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white">
                        {drivers.map(d => <option key={d.id} value={d.name}>{d.name}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">From</label>
                      <input type="text" required value={fromLoc} onChange={(e) => setFromLoc(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">To</label>
                      <input type="text" required value={toLoc} onChange={(e) => setToLoc(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white" />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Gross Rent (₹)</label>
                      <input type="number" required min="1" value={totalRent} onChange={(e) => setTotalRent(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white font-mono font-bold" />
                    </div>

    // --- TAB 3: COMPANY ACCOUNTS & RECEIVABLES LEDGER ---
    function CompanyAccountsTab() {
      const { companies, filteredTrips, filteredSettlements, addSettlement, deleteTrip, deleteSettlement, getTruckReg, getTripReimbursable, getTripBalancePending } = useFleet();
      const [settleModal, setSettleModal] = useState(null);
      const [settleAmt, setSettleAmt] = useState('');
      const [settleMethod, setSettleMethod] = useState('NEFT');
      const [settleRef, setSettleRef] = useState('');
      const [settleDate, setSettleDate] = useState(new Date().toISOString().split('T')[0]);
      const [settleNotes, setSettleNotes] = useState('');
      const [deepDiveCmpId, setDeepDiveCmpId] = useState(null);
      const [editTarget, setEditTarget] = useState(null);
      const [deepColFilters, setDeepColFilters] = useState({});
      const [payColFilters, setPayColFilters] = useState({});

      const companyLedgers = companies.map(cmp => {
        const cTrips = filteredTrips.filter(t => (t.companyName || '').trim().toLowerCase() === (cmp.name || '').trim().toLowerCase());
        const cSettles = filteredSettlements.filter(s => (s.companyName || '').trim().toLowerCase() === (cmp.name || '').trim().toLowerCase());
        const contracted = cTrips.reduce((s, t) => s + Number(t.totalRent), 0);
        const advReceived = cTrips.reduce((s, t) => s + Number(t.advanceReceived), 0);
        const tripReceived = cTrips.reduce((s, t) => s + Number(t.receivedAmount || 0), 0);
        const commTotal = cTrips.reduce((s, t) => s + Number(t.commissionAmount || 0), 0);
        const tdsTotal = cTrips.reduce((s, t) => s + Number(t.tdsAmount || 0), 0);
        const reimbTotal = cTrips.reduce((s, t) => s + (getTripReimbursable ? getTripReimbursable(t.id) : 0), 0);
        const settled = cSettles.reduce((s, st) => s + Number(st.amount), 0);
        const totalReceived = advReceived + tripReceived + settled;
        const balanceDue = Math.max(0, contracted + reimbTotal - totalReceived - commTotal - tdsTotal);
        return { cmp, contracted, advReceived, tripReceived, commTotal, tdsTotal, reimbTotal, settled, totalReceived, balanceDue, trips: cTrips, settlements: cSettles };
      });

      const deepDiveCmp = deepDiveCmpId ? companyLedgers.find(cl => cl.cmp.id === deepDiveCmpId) : null;

      // Unified Payments Received for the Selected Company:
      // Includes Trip Advances, Trip Payments Received, and General Settlements
      const deepPayments = useMemo(() => {
        if (!deepDiveCmp) return [];
        const rows = [];
        // Trip Advances
        (deepDiveCmp.trips || []).forEach(t => {
          const adv = Number(t.advanceReceived || 0);
          if (adv > 0) {
            rows.push({
              id: `adv-${t.id}`,
              date: t.date || '-',
              source: 'Trip Advance',
              details: `Truck: ${getTruckReg ? getTruckReg(t.truckId) : t.truckId} | Route: ${t.route || 'Direct'}`,
              method: 'Advance',
              ref: t.id ? `TRIP-${t.id.slice(-6)}` : '-',
              amount: adv,
              rawType: 'TRIP',
              rawObj: t
            });
          }
          // Direct Trip Payments Received
          const rec = Number(t.receivedAmount || 0);
          if (rec > 0) {
            rows.push({
              id: `rec-${t.id}`,
              date: t.date || '-',
              source: 'Trip Payment Received',
              details: `Truck: ${getTruckReg ? getTruckReg(t.truckId) : t.truckId} | Route: ${t.route || 'Direct'}`,
              method: 'Direct Receipt',
              ref: t.id ? `TRIP-${t.id.slice(-6)}` : '-',
              amount: rec,
              rawType: 'TRIP',
              rawObj: t
            });
          }
        });
        // Client Reimbursable Expenses (Paid on behalf of client, to be reimbursed)
        (deepDiveCmp.trips || []).forEach(t => {
          const tripExpList = (filteredExpenses || []).filter(e => e.tripId === t.id && e.isReimbursable);
          tripExpList.forEach(e => {
            const eAmt = Number(e.amount || 0);
            if (eAmt > 0) {
              rows.push({
                id: `reimb-${e.id}`,
                date: e.date || t.date || '-',
                source: 'Reimbursable Expense',
                details: `Truck: ${getTruckReg ? getTruckReg(e.truckId || t.truckId) : (e.truckId || t.truckId)} | Category: ${e.category} | ${e.notes || 'Incurred on behalf of client'}`,
                method: e.paymentMethod || 'Paid on Client Behalf',
                ref: `TRIP-${t.id ? t.id.slice(-6) : '-'}`,
                amount: eAmt,
                isReimbursableBill: true,
                rawType: 'EXPENSE',
                rawObj: e
              });
            }
          });
        });

        // Ledger Settlements / Receipts
        (deepDiveCmp.settlements || []).forEach(s => {
          const amt = Number(s.amount || 0);
          if (amt > 0) {
            rows.push({
              id: `set-${s.id}`,
              date: s.date || '-',
              source: 'Account Settlement',
              details: s.notes || 'Settlement Payment Received',
              method: s.paymentMethod || 'NEFT',
              ref: s.referenceNumber || '-',
              amount: amt,
              rawType: 'SETTLEMENT',
              rawObj: s
            });
          }
        });
        // Sort newest date first
        return rows.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
      }, [deepDiveCmp, filteredExpenses, getTruckReg]);

      // Filtered Payments Received
      const filteredDeepPayments = useMemo(() => {
        return deepPayments.filter(p => {
          if (payColFilters.date && !String(p.date || '').toLowerCase().includes(payColFilters.date.toLowerCase())) return false;
          if (payColFilters.source && !String(p.source || '').toLowerCase().includes(payColFilters.source.toLowerCase())) return false;
          if (payColFilters.details && !String(p.details || '').toLowerCase().includes(payColFilters.details.toLowerCase())) return false;
          if (payColFilters.method && !String(p.method || '').toLowerCase().includes(payColFilters.method.toLowerCase())) return false;
          if (payColFilters.ref && !String(p.ref || '').toLowerCase().includes(payColFilters.ref.toLowerCase())) return false;
          if (payColFilters.amount && !String(p.amount || '').includes(payColFilters.amount)) return false;
          return true;
        });
      }, [deepPayments, payColFilters]);

      const deepTotalPaymentsReceived = filteredDeepPayments.reduce((s, p) => s + Number(p.amount || 0), 0);
      const hasPayFilters = Object.values(payColFilters).some(Boolean);

      const filteredDeepTrips = useMemo(() => {
        if (!deepDiveCmp) return [];
        return deepDiveCmp.trips.filter(t => {
          const trkReg = getTruckReg ? getTruckReg(t.truckId) : t.truckId;
          const trReimb = getTripReimbursable ? getTripReimbursable(t.id) : 0;
          const trBal = getTripBalancePending ? getTripBalancePending(t) : t.balancePending;

          if (deepColFilters.date && !String(t.date || '').toLowerCase().includes(deepColFilters.date.toLowerCase())) return false;
          if (deepColFilters.truck && !String(trkReg || '').toLowerCase().includes(deepColFilters.truck.toLowerCase())) return false;
          if (deepColFilters.route && !String(t.route || '').toLowerCase().includes(deepColFilters.route.toLowerCase())) return false;
          if (deepColFilters.rent && !String(t.totalRent || '').includes(deepColFilters.rent)) return false;
          if (deepColFilters.comm && !String(t.commissionAmount || 0).includes(deepColFilters.comm)) return false;
          if (deepColFilters.tds && !String(t.tdsAmount || 0).includes(deepColFilters.tds)) return false;
          if (deepColFilters.reimb && !String(trReimb).includes(deepColFilters.reimb)) return false;
          if (deepColFilters.adv && !String(t.advanceReceived || 0).includes(deepColFilters.adv)) return false;
          if (deepColFilters.bal && !String(trBal).includes(deepColFilters.bal)) return false;
          return true;
        });
      }, [deepDiveCmp, deepColFilters, getTruckReg, getTripReimbursable, getTripBalancePending]);

      const deepTotalContracted = filteredDeepTrips.reduce((s, t) => s + Number(t.totalRent || 0), 0);
      const deepTotalComm = filteredDeepTrips.reduce((s, t) => s + Number(t.commissionAmount || 0), 0);
      const deepTotalTds = filteredDeepTrips.reduce((s, t) => s + Number(t.tdsAmount || 0), 0);
      const deepTotalReimb = filteredDeepTrips.reduce((s, t) => s + (getTripReimbursable ? getTripReimbursable(t.id) : 0), 0);
      const deepTotalAdv = filteredDeepTrips.reduce((s, t) => s + Number(t.advanceReceived || 0), 0);
      const deepTotalBal = filteredDeepTrips.reduce((s, t) => s + Number(getTripBalancePending ? getTripBalancePending(t) : t.balancePending || 0), 0);
      const hasDeepFilters = Object.values(deepColFilters).some(Boolean);

      const handleSettleSubmit = (e) => {
        e.preventDefault();
        const amt = parseFloat(settleAmt);
        if (!amt || amt <= 0) return alert('Enter valid settlement amount');
        addSettlement({
          date: settleDate || new Date().toISOString().split('T')[0],
          companyName: settleModal.cmp.name,
          amount: amt,
          paymentMethod: settleMethod,
          referenceNumber: settleRef || '',
          notes: settleNotes || 'Payment received from client',
        });
        setSettleModal(null);
        setSettleAmt('');
        setSettleRef('');
        setSettleNotes('');
        setSettleDate(new Date().toISOString().split('T')[0]);
      };

      return (
        <div className="space-y-6">
          <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg flex justify-between items-center">
            <div>
              <h2 className="text-lg font-bold text-white">Company Accounts & Receivables Ledger</h2>
              <p className="text-xs text-slate-400">Track client contracted business, 1% TDS, broker commissions, advances, and settlements</p>
            </div>
          </div>

          {/* Company Cards Grid */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            {companyLedgers.map(cl => (
              <div key={cl.cmp.id} className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg flex flex-col justify-between">
                <div>
