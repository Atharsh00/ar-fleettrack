    // Smart Resolver: City Name, Abbreviation, or Toll Plaza Fallback
    const resolveLocationSmart = (raw, fallbackTollPlazaName = null) => {
      if (!raw && !fallbackTollPlazaName) {
        return { name: 'Unknown', lat: 20.5937, lng: 78.9629, source: 'fallback' };
      }

      const cleanInput = (raw || '').trim().toUpperCase();

      for (const [key, hub] of Object.entries(LOGISTICS_HUBS)) {
        if (cleanInput === key || cleanInput.includes(key)) {
          return { name: `${hub.name}, ${hub.state}`, lat: hub.lat, lng: hub.lng, source: 'city_dictionary' };
        }
        if (hub.aliases && hub.aliases.some(a => a === cleanInput || cleanInput.includes(a))) {
          return { name: `${hub.name}, ${hub.state}`, lat: hub.lat, lng: hub.lng, source: 'alias_match' };
        }
      }

      if (cleanInput.length >= 3) {
        const prefix = cleanInput.slice(0, 3);
        for (const [key, hub] of Object.entries(LOGISTICS_HUBS)) {
          if (key.startsWith(prefix) || (hub.aliases && hub.aliases.some(a => a.startsWith(prefix)))) {
            return { name: `${hub.name}, ${hub.state}`, lat: hub.lat, lng: hub.lng, source: 'fuzzy_prefix' };
          }
        }
      }

      if (fallbackTollPlazaName) {
        const tollUpper = fallbackTollPlazaName.toUpperCase();
        for (const [key, toll] of Object.entries(TOLL_PLAZA_COORDINATES)) {
          if (tollUpper.includes(key)) {
            return { name: toll.name, lat: toll.lat, lng: toll.lng, source: 'toll_anchor' };
          }
        }
      }

      return {
        name: raw || 'Highway Corridor',
        lat: null,
        lng: null,
        source: 'needs_geocoding'
      };
    };

    // Enhanced Plaza and Fuel Station Location Extractor
    const extractCleanLocation = (notes, category) => {
      if (!notes) return category === 'TOLL' ? 'Highway Toll Plaza' : 'Highway Fuel Station';

      if (category === 'TOLL') {
        // 1. Check for "at <Name> Toll Plaza" or "at <Name> Plaza"
        const atPlaza = notes.match(/at\s+([A-Za-z0-9\s\-\.\/]+?)(?:\s*(?:\([^\)]*\)|\[|dated|on\s*\d|ref|txn|$))/i);
        if (atPlaza && atPlaza[1].trim()) {
          let name = atPlaza[1].trim();
          if (!name.toLowerCase().includes('plaza') && !name.toLowerCase().includes('toll')) {
            name = `${name} Toll Plaza`;
          }
          return name;
        }

        // 2. Check for "Plaza: <Name>" or "Toll Plaza: <Name>"
        const plazaMatch = notes.match(/(?:toll\s*plaza|fee\s*plaza|plaza)[:\s\-]+([A-Za-z0-9\s\-\.\/]+?)(?:\s*(?:\([^\)]*\)|\[|dated|on\s*\d|ref|txn|$))/i);
        if (plazaMatch && plazaMatch[1].trim()) {
          let name = plazaMatch[1].trim();
          if (!name.toLowerCase().includes('plaza')) name = `${name} Toll Plaza`;
          return name;
        }

        // 3. Fallback to any specific toll plaza in our dictionary
        const notesUpper = notes.toUpperCase();
        for (const [key, toll] of Object.entries(TOLL_PLAZA_COORDINATES)) {
          if (notesUpper.includes(key)) {
            return toll.name;
          }
        }

        return 'Highway Toll Plaza';
      }

      if (category === 'DIESEL') {
        const stationMatch = notes.match(/(?:at|pump|station)[:\s\-]+([A-Za-z0-9\s\-\.\/]+?)(?:\s*(?:\([^\)]*\)|\[|dated|ref|txn|$))/i) ||
                             notes.match(/Diesel\s*(?:\d+L)?\s*([A-Za-z0-9\s\-\.\/]+?)(?:\s*(?:\([^\)]*\)|\[|$))/i);
        if (stationMatch && stationMatch[1].trim()) {
          return stationMatch[1].trim();
        }
        return 'Highway Fuel Bunk';
      }

      return notes.split('[')[0].trim() || 'Transit Stop';
    };

            { id: 'exp-1-t4', date: getRelDate(2), time: '07:45 PM', location: 'Mohol Toll Plaza', timestamp: `${getRelDate(2)}T19:45:00`, truckId: 'trk-1', tripId: 'trp-1', category: 'TOLL', amount: 195, notes: 'Mohol Toll Plaza (Solapur Entry)' },

            // TRP-4
            { id: 'exp-4-t1', date: getRelDate(12), time: '05:30 AM', location: 'Khed-Shivapur Toll Plaza', timestamp: `${getRelDate(12)}T05:30:00`, truckId: 'trk-1', tripId: 'trp-4', category: 'TOLL', amount: 650, notes: 'Khed-Shivapur Toll Plaza (NH-48)' },
            { id: 'exp-4-t2', date: getRelDate(12), time: '11:15 AM', location: 'Tasawade Toll Plaza (Karad)', timestamp: `${getRelDate(12)}T11:15:00`, truckId: 'trk-1', tripId: 'trp-4', category: 'TOLL', amount: 420, notes: 'Tasawade Toll Plaza (Karad)' },
            { id: 'exp-4-d1', date: getRelDate(12), time: '01:00 PM', location: 'BPCL Kolhapur Highway', timestamp: `${getRelDate(12)}T13:00:00`, truckId: 'trk-1', tripId: 'trp-4', category: 'DIESEL', amount: 20900, notes: 'Diesel 220L BPCL Kolhapur Highway' },
            { id: 'exp-4-t3', date: getRelDate(12), time: '04:45 PM', location: 'Kognoli Toll Plaza (Border)', timestamp: `${getRelDate(12)}T16:45:00`, truckId: 'trk-1', tripId: 'trp-4', category: 'TOLL', amount: 380, notes: 'Kognoli Toll Plaza (Karnataka Border)' },
            { id: 'exp-4-t4', date: getRelDate(13), time: '02:10 AM', location: 'Chalageri Toll Plaza (Haveri)', timestamp: `${getRelDate(13)}T02:10:00`, truckId: 'trk-1', tripId: 'trp-4', category: 'TOLL', amount: 410, notes: 'Chalageri Toll Plaza (Haveri)' },
            { id: 'exp-4-d2', date: getRelDate(13), time: '05:30 AM', location: 'HPCL Chitradurga Bypass', timestamp: `${getRelDate(13)}T05:30:00`, truckId: 'trk-1', tripId: 'trp-4', category: 'DIESEL', amount: 13300, notes: 'Diesel 140L HPCL Chitradurga Bypass' },
            { id: 'exp-4-t5', date: getRelDate(13), time: '10:40 AM', location: 'Nelamangala Toll Plaza', timestamp: `${getRelDate(13)}T10:40:00`, truckId: 'trk-1', tripId: 'trp-4', category: 'TOLL', amount: 280, notes: 'Nelamangala Toll Plaza (Bengaluru Entry)' },

            // TRP-7
            { id: 'exp-7-t1', date: getRelDate(18), time: '04:15 AM', location: 'Samayanallur Toll Plaza', timestamp: `${getRelDate(18)}T04:15:00`, truckId: 'trk-1', tripId: 'trp-7', category: 'TOLL', amount: 180, notes: 'Samayanallur Toll Plaza (Madurai)' },
            { id: 'exp-7-t2', date: getRelDate(18), time: '10:30 AM', location: 'Boothakudi Toll Plaza', timestamp: `${getRelDate(18)}T10:30:00`, truckId: 'trk-1', tripId: 'trp-7', category: 'TOLL', amount: 240, notes: 'Boothakudi Toll Plaza (Trichy)' },
            { id: 'exp-7-d1', date: getRelDate(18), time: '01:00 PM', location: 'IOCL Ulundurpet Bunk', timestamp: `${getRelDate(18)}T13:00:00`, truckId: 'trk-1', tripId: 'trp-7', category: 'DIESEL', amount: 23750, notes: 'Diesel 250L IOCL Ulundurpet' },
            { id: 'exp-7-t3', date: getRelDate(18), time: '09:15 PM', location: 'Sullurupeta Toll Plaza', timestamp: `${getRelDate(18)}T21:15:00`, truckId: 'trk-1', tripId: 'trp-7', category: 'TOLL', amount: 360, notes: 'Sullurupeta Toll Plaza (Nellore)' },
            { id: 'exp-7-t4', date: getRelDate(19), time: '08:00 AM', location: 'Bollapalli Toll Plaza', timestamp: `${getRelDate(19)}T08:00:00`, truckId: 'trk-1', tripId: 'trp-7', category: 'TOLL', amount: 410, notes: 'Bollapalli Toll Plaza (Vijayawada)' },
            { id: 'exp-7-d2', date: getRelDate(19), time: '02:30 PM', location: 'BPCL Rajahmundry', timestamp: `${getRelDate(19)}T14:30:00`, truckId: 'trk-1', tripId: 'trp-7', category: 'DIESEL', amount: 26600, notes: 'Diesel 280L BPCL Rajahmundry' },
            { id: 'exp-7-t5', date: getRelDate(20), time: '07:30 AM', location: 'Sunakhala Toll Plaza', timestamp: `${getRelDate(20)}T07:30:00`, truckId: 'trk-1', tripId: 'trp-7', category: 'TOLL', amount: 390, notes: 'Sunakhala Toll Plaza (Odisha)' },
            { id: 'exp-7-t6', date: getRelDate(20), time: '08:45 PM', location: 'Dankuni Toll Plaza', timestamp: `${getRelDate(20)}T20:45:00`, truckId: 'trk-1', tripId: 'trp-7', category: 'TOLL', amount: 450, notes: 'Dankuni Toll Plaza (Kolkata)' }
          ];
        }

        // Apply retro-scan on all records
        return loaded.map(enrichHistoricalExpense);
      });

      // UI States
      const [selTruck, setSelTruck] = useState('trk-1');
      const [selTripId, setSelTripId] = useState('trp-1');
      const [isMapMaximized, setIsMapMaximized] = useState(false);

      // Route Telemetry State
      const [routeData, setRouteData] = useState(null);
      const [isLoadingRoute, setIsLoadingRoute] = useState(false);
      const [cacheHit, setCacheHit] = useState(false);

      // Map Refs
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const mapLayerGroupRef = useRef(null);

      // --- SUPABASE CLOUD MULTI-DEVICE SYNC (STRICTLY SCOPED TO ACTIVE PROFILE) ---
      useEffect(() => {
        if (!supabaseClient) return;
        let isMounted = true;
        setIsSyncingCloud(true);

        const fetchCloudData = async () => {
          try {
            const [tRes, trRes, expRes] = await Promise.all([
              supabaseClient.from('trucks').select('*').eq('profile_id', activeProfileId),
              supabaseClient.from('trips').select('*').eq('profile_id', activeProfileId).order('date', { ascending: false }),
              supabaseClient.from('expenses').select('*').eq('profile_id', activeProfileId).order('date', { ascending: false })
            ]);

            if (isMounted) {
              if (tRes.data && tRes.data.length > 0) {
                setTrucks(tRes.data.map(t => ({
                  id: t.id,
                  registrationNumber: t.registration_number || t.registrationNumber,
                  model: t.model || '',
                  profileId: t.profile_id || t.profileId
                })));
              }
              if (trRes.data && trRes.data.length > 0) {
                setTrips(trRes.data.map(tr => {
                  let drops = tr.additional_drops || tr.additionalDrops;
                  if (typeof drops === 'string') {
                    try { drops = JSON.parse(drops); } catch(e) { drops = []; }
                  }
                  return {
                    id: tr.id,
                    truckId: tr.truck_id || tr.truckId,
                    profileId: tr.profile_id || tr.profileId,
                    date: tr.date,
                    route: tr.route || '',
                    fromLocation: tr.from_location || tr.fromLocation || '',
                    toLocation: tr.to_location || tr.toLocation || '',
                    additionalDrops: Array.isArray(drops) ? drops : [],
                    companyName: tr.company_name || tr.companyName || '',
                    driverName: tr.driver_name || tr.driverName || '',
                    totalRent: Number(tr.total_rent || tr.totalRent || 0)
                  };
                }));
              }
              if (expRes.data && expRes.data.length > 0) {
                const cloudExpenses = expRes.data.map(e => ({
                  id: e.id,
                  date: e.date,
                  time: e.time || '',
                  timestamp: e.timestamp || `${e.date}T${e.time || '12:00'}:00`,
                  truckId: e.truck_id || e.truckId,
                  tripId: e.trip_id || e.tripId,
                  profileId: e.profile_id || e.profileId,
                  category: e.category,
                  amount: Number(e.amount || 0),
                  notes: e.notes || '',
                  location: e.location || ''
                }));
                setExpenses(cloudExpenses.map(enrichHistoricalExpense));
              }
            }
          } catch(err) {
            console.warn('Cloud sync notice:', err);
          } finally {
            if (isMounted) setIsSyncingCloud(false);
          }
        };

        fetchCloudData();
        return () => { isMounted = false; };
      }, [activeProfileId]);

      // Determine if a trip is completed (has a subsequent trip entered) or active/ongoing (latest trip)
      const getTripStatusInfo = (trip) => {
        if (!trip) return { isLatest: false, nextTrip: null, nextTripDate: null };
        const truckTripsAsc = trips
          .filter(t => t.truckId === trip.truckId && t.date)
          .sort((a, b) => a.date.localeCompare(b.date));
        const idx = truckTripsAsc.findIndex(t => t.id === trip.id);
        const isLatest = idx === truckTripsAsc.length - 1;
        const nextTrip = !isLatest && idx >= 0 ? truckTripsAsc[idx + 1] : null;
        return {
          isLatest,
          nextTrip,
          nextTripDate: nextTrip ? nextTrip.date : null
        };
      };

      // Filtered Trips
      const filteredTrips = useMemo(() => {
        return trips.filter(t => (selTruck === 'all' ? true : t.truckId === selTruck));
      }, [trips, selTruck]);

      // Active Trip Object
      const activeTrip = useMemo(() => {
        if (selTripId === 'all') return null;
        return trips.find(t => t.id === selTripId) || filteredTrips[0] || null;
      }, [selTripId, trips, filteredTrips]);

      // Active Trip Status (Completed vs In-Transit)
      const activeTripStatus = useMemo(() => {
        return getTripStatusInfo(activeTrip);
      }, [activeTrip, trips]);

      // Toll Entries for Active Trip (Strictly bounded by trip start date and next trip start date)
      const tollEntries = useMemo(() => {
        if (!activeTrip || activeTripStatus.isLatest) return [];
        const { nextTripDate } = activeTripStatus;
        const tolls = expenses.filter(e => {
          if (e.category !== 'TOLL') return false;
          if (e.truckId && e.truckId !== activeTrip.truckId) return false;
          if (e.tripId && e.tripId === activeTrip.id) return true;
          if (e.date) {
            if (e.date < activeTrip.date) return false;
            if (nextTripDate && e.date >= nextTripDate) return false;
            return true;
          }
          return false;
        });
        return [...tolls].sort((a, b) => {
          const tsA = a.timestamp || `${a.date}T${a.time || '00:00'}:00`;
          const tsB = b.timestamp || `${b.date}T${b.time || '00:00'}:00`;
          return tsA.localeCompare(tsB);
        });
      }, [activeTrip, activeTripStatus, expenses]);

      // Diesel Entries for Active Trip (Strictly bounded)
      const dieselEntries = useMemo(() => {
        if (!activeTrip || activeTripStatus.isLatest) return [];
        const { nextTripDate } = activeTripStatus;
        return expenses.filter(e => {
          if (e.category !== 'DIESEL') return false;
          if (e.truckId && e.truckId !== activeTrip.truckId) return false;
          if (e.tripId && e.tripId === activeTrip.id) return true;
          if (e.date) {
            if (e.date < activeTrip.date) return false;
            if (nextTripDate && e.date >= nextTripDate) return false;
            return true;
          }
          return false;
        });
      }, [activeTrip, activeTripStatus, expenses]);

      // Transit Duration Calculation
      const transitDuration = useMemo(() => {
        if (!tollEntries.length) return null;
        if (tollEntries.length === 1) {
          const single = tollEntries[0];
          return {
            firstTime: single.time || '-',
            lastTime: single.time || '-',
            firstPlaza: single.location || 'Toll Plaza',
            lastPlaza: single.location || 'Toll Plaza',
            durationFormatted: 'Single Toll Tagged',
            durationHours: 0
          };
        }

        const first = tollEntries[0];
        const last = tollEntries[tollEntries.length - 1];

        const getMs = (e) => {
          if (e.timestamp && e.timestamp.includes('T')) return new Date(e.timestamp).getTime();
          return new Date(`${e.date}T12:00:00`).getTime();
        };

        const diffMs = Math.max(0, getMs(last) - getMs(first));
        const totalMinutes = Math.floor(diffMs / (1000 * 60));
        const hours = Math.floor(totalMinutes / 60);
        const mins = totalMinutes % 60;

        return {
          firstTime: first.time ? `${first.time} (${formatDate(first.date)})` : formatDate(first.date),
          lastTime: last.time ? `${last.time} (${formatDate(last.date)})` : formatDate(last.date),
          firstPlaza: first.location || 'Origin Toll Plaza',
          lastPlaza: last.location || 'Destination Toll Plaza',
          durationHours: diffMs / (1000 * 60 * 60),
          durationFormatted: `${hours} hrs ${mins} mins`
        };
      }, [tollEntries]);

      // --- OSRM ROUTE CALCULATION WITH TOLL-ANCHOR SMART FALLBACK ---
      useEffect(() => {
        if (!activeTrip || activeTripStatus.isLatest) {
          setRouteData(null);
          setIsLoadingRoute(false);
          return;
        }

        let isMounted = true;
        setIsLoadingRoute(true);
        setCacheHit(false);

        const computeRoute = async () => {
          try {
            const firstTollPlaza = tollEntries[0]?.location || tollEntries[0]?.notes || null;
            const lastTollPlaza = tollEntries[tollEntries.length - 1]?.location || tollEntries[tollEntries.length - 1]?.notes || null;

            const origin = resolveLocationSmart(activeTrip.fromLocation, firstTollPlaza);
            const destination = resolveLocationSmart(activeTrip.toLocation, lastTollPlaza);
            const drops = (activeTrip.additionalDrops || []).map(d => resolveLocationSmart(d));

            const waypoints = [origin, ...drops, destination];
            const cacheKey = waypoints.map(w => w.name.toLowerCase().replace(/[^a-z0-9]/g, '')).join('_to_');

            let cachedRoutes = {};
            try { cachedRoutes = JSON.parse(localStorage.getItem(ROUTE_CACHE_KEY) || '{}'); } catch(e) {}

            if (cachedRoutes[cacheKey]) {
              if (isMounted) {
                setRouteData(cachedRoutes[cacheKey]);
                setCacheHit(true);
                setIsLoadingRoute(false);
              }
              return;
            }

            const coordsList = [];
            for (const wp of waypoints) {
              if (wp.lat && wp.lng) {
                coordsList.push([wp.lng, wp.lat]);
              } else {
                try {
                  const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(wp.name + ', India')}&format=json&limit=1`);
                  const data = await res.json();
                  if (data && data[0]) {
                    wp.lat = parseFloat(data[0].lat);
                    wp.lng = parseFloat(data[0].lon);
                    coordsList.push([wp.lng, wp.lat]);
                  } else {
                    coordsList.push([77.5946, 12.9716]);
                  }
                } catch(e) {
                  coordsList.push([77.5946, 12.9716]);
                }
              }
            }

            const coordStr = coordsList.map(c => `${c[0]},${c[1]}`).join(';');
            const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=full&geometries=geojson`;

            const res = await fetch(osrmUrl);
            const json = await res.json();

            if (json && json.routes && json.routes[0]) {
              const best = json.routes[0];
              const distanceKm = Math.round((best.distance / 1000) * 10) / 10;
              const payload = {
                distanceKm,
                estHours: Math.round((best.duration / 3600) * 10) / 10,
                geometry: best.geometry,
                waypoints: waypoints.map((w, idx) => ({
                  name: w.name,
                  lng: coordsList[idx][0],
                  lat: coordsList[idx][1]
                }))
              };

              cachedRoutes[cacheKey] = payload;
              try { localStorage.setItem(ROUTE_CACHE_KEY, JSON.stringify(cachedRoutes)); } catch(e) {}

              if (isMounted) {
                setRouteData(payload);
                setCacheHit(false);
                setIsLoadingRoute(false);
              }
            } else {
              throw new Error('OSRM Route calculation error');
            }
          } catch(err) {
            console.warn('Route calculation notice:', err);
            if (isMounted) setIsLoadingRoute(false);
          }
        };

        computeRoute();
        return () => { isMounted = false; };
      }, [activeTrip, activeTripStatus, tollEntries]);

      // --- RELIABLE LEAFLET MAP ENGINE (ESRI TILES - ZERO 403 BLOCKS) ---
      useEffect(() => {
        // If on ongoing trip (no map) or all trips summary, cleanly remove existing map
        if (selTripId === 'all' || activeTripStatus.isLatest || !mapContainerRef.current) {
          if (mapInstanceRef.current) {
            try {
              mapInstanceRef.current.remove();
            } catch(e) {}
            mapInstanceRef.current = null;
            mapLayerGroupRef.current = null;
          }
          return;
        }

        // If map exists on a detached/remounted container, remove old instance first
        if (mapInstanceRef.current) {
          try {
            const curContainer = mapInstanceRef.current.getContainer();
            if (curContainer !== mapContainerRef.current) {
              mapInstanceRef.current.remove();
              mapInstanceRef.current = null;
              mapLayerGroupRef.current = null;
            }
          } catch(e) {
            mapInstanceRef.current = null;
            mapLayerGroupRef.current = null;
          }
        }

        if (!mapInstanceRef.current) {
          const map = L.map(mapContainerRef.current, {
            center: [20.5937, 78.9629],
            zoom: 5,
            zoomControl: true,
            scrollWheelZoom: true
          });

          // ESRI World Street Map (Works locally on file:// and online with zero blocking)
          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
          }).addTo(map);

          mapLayerGroupRef.current = L.layerGroup().addTo(map);
          mapInstanceRef.current = map;
        }

        const map = mapInstanceRef.current;
        const layerGroup = mapLayerGroupRef.current;
        layerGroup.clearLayers();

        // Refresh container dimensions immediately
        setTimeout(() => {
          if (map && mapInstanceRef.current) map.invalidateSize();
        }, 120);

        if (!routeData || !routeData.geometry) return;

        // Highway Route Line
        const routeLine = L.geoJSON(routeData.geometry, {
          style: {
            color: '#0284C7',
            weight: 5,
            opacity: 0.9,
            lineJoin: 'round'
          }
        });
        layerGroup.addLayer(routeLine);

        // 1. Origin (Clean Clickable Dot)
        if (routeData.waypoints[0]) {
          const o = routeData.waypoints[0];
          const originIcon = L.divIcon({
            className: 'custom-pin',
            html: `
              <div class="w-6 h-6 rounded-full bg-emerald-600 border-2 border-white flex items-center justify-center text-white text-[11px] font-bold shadow-md transform -translate-x-1/2 -translate-y-1/2 hover:scale-125 transition cursor-pointer" title="Origin: ${o.name}">
                🟢
              </div>
            `,
            iconSize: [0, 0]
          });
          layerGroup.addLayer(
            L.marker([o.lat, o.lng], { icon: originIcon })
              .bindPopup(`
                <div class="text-xs p-1">
                  <div class="font-bold text-emerald-700 flex items-center gap-1"><span>🟢</span> Origin Dock / Hub</div>
                  <div class="text-slate-900 font-bold text-sm mt-0.5">${o.name}</div>
                </div>
              `)
          );
        }

        // 2. Intermediate Drops (Clean Clickable Dots)
        for (let i = 1; i < routeData.waypoints.length - 1; i++) {
          const d = routeData.waypoints[i];
          const dropIcon = L.divIcon({
            className: 'custom-pin',
            html: `
              <div class="w-6 h-6 rounded-full bg-sky-600 border-2 border-white flex items-center justify-center text-white text-[11px] font-bold shadow-md transform -translate-x-1/2 -translate-y-1/2 hover:scale-125 transition cursor-pointer" title="Drop #${i}: ${d.name}">
                🔵
              </div>
            `,
            iconSize: [0, 0]
          });
          layerGroup.addLayer(
            L.marker([d.lat, d.lng], { icon: dropIcon })
              .bindPopup(`
                <div class="text-xs p-1">
                  <div class="font-bold text-sky-700 flex items-center gap-1"><span>🔵</span> Intermediate Delivery Drop #${i}</div>
                  <div class="text-slate-900 font-bold text-sm mt-0.5">${d.name}</div>
                </div>
              `)
          );
        }

        // 3. Destination (Clean Clickable Dot)
        if (routeData.waypoints.length > 1) {
          const dest = routeData.waypoints[routeData.waypoints.length - 1];
          const destIcon = L.divIcon({
            className: 'custom-pin',
            html: `
              <div class="w-6 h-6 rounded-full bg-rose-600 border-2 border-white flex items-center justify-center text-white text-[11px] font-bold shadow-md transform -translate-x-1/2 -translate-y-1/2 hover:scale-125 transition cursor-pointer" title="Destination: ${dest.name}">
                🔴
              </div>
            `,
            iconSize: [0, 0]
          });
          layerGroup.addLayer(
            L.marker([dest.lat, dest.lng], { icon: destIcon })
              .bindPopup(`
                <div class="text-xs p-1">
                  <div class="font-bold text-rose-700 flex items-center gap-1"><span>🔴</span> Final Destination</div>
                  <div class="text-slate-900 font-bold text-sm mt-0.5">${dest.name}</div>
                </div>
              `)
          );
        }

        // 4. Sequential Toll Plazas & Diesel Fuel Stations along the Route (Dots only - details on click)
        if (routeData.geometry.coordinates && routeData.geometry.coordinates.length > 0) {
          const coords = routeData.geometry.coordinates;
          const totalPts = coords.length;

          // Combine Tolls and Diesel Stops chronologically along the corridor
          const allStops = [
            ...tollEntries.map(t => ({ ...t, kind: 'TOLL' })),
            ...dieselEntries.map(d => ({ ...d, kind: 'DIESEL' }))
          ].sort((a, b) => {
            const tsA = a.timestamp || `${a.date}T${a.time || '00:00'}:00`;
            const tsB = b.timestamp || `${b.date}T${b.time || '00:00'}:00`;
            return tsA.localeCompare(tsB);
          });

          let tollCount = 0;
          let dieselCount = 0;

          allStops.forEach((stop, stopIdx) => {
            const ratio = (stopIdx + 1) / (allStops.length + 1);
            const ptIdx = Math.min(totalPts - 1, Math.floor(ratio * totalPts));
            const pt = coords[ptIdx];

            if (stop.kind === 'TOLL') {
              tollCount++;
              const tollIcon = L.divIcon({
                className: 'toll-badge',
                html: `
                  <div class="w-6 h-6 rounded-full bg-amber-500 border-2 border-white flex items-center justify-center text-slate-950 font-black text-xs shadow-md transform -translate-x-1/2 -translate-y-1/2 hover:scale-125 transition cursor-pointer" title="${stop.location}">
                    ${tollCount}
                  </div>
                `,
                iconSize: [0, 0]
              });

              layerGroup.addLayer(
                L.marker([pt[1], pt[0]], { icon: tollIcon })
                  .bindPopup(`
                    <div class="text-xs space-y-1.5 p-1 min-w-[190px]">
                      <div class="flex items-center gap-1.5 font-bold text-amber-700 text-xs">
                        <span class="w-5 h-5 rounded-md bg-amber-100 flex items-center justify-center text-[11px]">🛣️</span>
                        <span>Toll Plaza #${tollCount}</span>
                      </div>
                      <div class="text-slate-900 font-extrabold text-sm leading-snug">${stop.location}</div>
                      <div class="text-slate-600 font-mono text-xs">Deduction: <strong class="text-amber-800 font-bold">${formatCurr(stop.amount)}</strong></div>

                    </div>
                  `)
              );
            } else {
              // DIESEL FUEL STOP
              dieselCount++;
              const lMatch = (stop.notes || '').match(/(\d+(?:\.\d+)?)\s*(?:L|ltr|liters)/i);
              const liters = lMatch ? parseFloat(lMatch[1]) : Math.round(Number(stop.amount || 0) / 95);

              const dieselIcon = L.divIcon({
                className: 'diesel-badge',
                html: `
                  <div class="w-6 h-6 rounded-full bg-purple-700 border-2 border-white flex items-center justify-center text-white font-black text-[11px] shadow-md transform -translate-x-1/2 -translate-y-1/2 hover:scale-125 transition cursor-pointer" title="${stop.location}">
                    ⛽
                  </div>
                `,
                iconSize: [0, 0]
              });

              layerGroup.addLayer(
                L.marker([pt[1], pt[0]], { icon: dieselIcon })

                    <div class="text-xs space-y-1.5 p-1 min-w-[190px]">
                      <div class="flex items-center gap-1.5 font-bold text-purple-700 text-xs">
                        <span class="w-5 h-5 rounded-md bg-purple-100 flex items-center justify-center text-[11px]">⛽</span>
                        <span>Diesel Station #${dieselCount}</span>
                      </div>
                      <div class="text-slate-900 font-extrabold text-sm leading-snug">${stop.location}</div>
                      <div class="text-purple-700 font-mono text-xs">Volume: <strong class="font-bold">${liters} Liters</strong> (${formatCurr(stop.amount)})</div>
                      <div class="text-slate-500 text-[11px] border-t border-slate-100 pt-1">🕒 Time: <strong>${stop.time}</strong> | 📅 ${formatDate(stop.date)}</div>
                    </div>
                  `)
              );
            }
          });

        map.fitBounds(routeLine.getBounds(), { padding: [35, 35] });

      useEffect(() => {
        if (mapInstanceRef.current) {
          setTimeout(() => {
            mapInstanceRef.current.invalidateSize();
          }, 150);
        }

      useEffect(() => {
        if ((selTripId === 'all' || activeTripStatus.isLatest) && mapInstanceRef.current) {
          try {
            mapInstanceRef.current.remove();
          } catch(e) {}

          mapLayerGroupRef.current = null;

      const totalTollsAmt = useMemo(() => tollEntries.reduce((s, e) => s + Number(e.amount || 0), 0), [tollEntries]);

        return dieselEntries.reduce((s, e) => {

      const mileage = (highwayKm > 0 && totalDieselLiters > 0) ? (highwayKm / totalDieselLiters) : 0;

                  <span className="text-xs text-slate-500 font-medium">{filteredTrips.length} Trips Available</span>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs text-slate-700">
                    <thead className="bg-slate-50 text-[10px] uppercase font-bold text-slate-500 border-b border-slate-200">
                      <tr>
                        <th className="p-3">Date</th>
                        <th className="p-3">Vehicle</th>
                        <th className="p-3">Status</th>
                        <th className="p-3">Corridor Route</th>
                        <th className="p-3 text-right">Freight Rent</th>
                        <th className="p-3 text-center">Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {filteredTrips.map(tr => {
                        const st = getTripStatusInfo(tr);
                        return (
                          <tr key={tr.id} className="hover:bg-slate-50">
                            <td className="p-3 font-mono text-slate-600 whitespace-nowrap">{formatDate(tr.date)}</td>
                            <td className="p-3 font-mono text-sky-700 font-bold whitespace-nowrap">
                              {trucks.find(t => t.id === tr.truckId)?.registrationNumber || tr.truckId}
                            </td>
                            <td className="p-3 whitespace-nowrap">
                              {st.isLatest ? (
                                <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-50 text-amber-700 border border-amber-200">
                                  🚚 In-Transit
                                </span>
                              ) : (
                                <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">
                                  ✅ Completed
                                </span>
                              )}
                            </td>
                            <td className="p-3 font-semibold text-slate-900">{tr.route}</td>
                            <td className="p-3 text-right font-mono text-slate-900 font-bold whitespace-nowrap">
                              {formatCurr(tr.totalRent)}
                            </td>
                            <td className="p-3 text-center whitespace-nowrap">
                              <button
                                type="button"
                                onClick={() => setSelTripId(tr.id)}
                                className="px-3.5 py-1.5 rounded-lg bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 font-bold text-xs transition shadow-xs"
                              >
                                {st.isLatest ? 'Inspect Trip ↗' : 'Inspect Route & Tolls ↗'}
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {/* Clean Light Footer */}
          <footer className="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 mt-auto">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
              <span className="font-semibold text-slate-600">AR Insights Telemetry</span>
              <span>Reliable World Street Routing Engine</span>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
