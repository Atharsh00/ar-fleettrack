    const findClosestPointOnRoute = (coords, targetLat, targetLng) => {
      if (!coords || coords.length === 0) return { pt: [targetLng, targetLat], index: 0 };
      let closestPt = coords[0];
      let minDistanceSq = Infinity;
      let closestIndex = 0;
      for (let i = 0; i < coords.length; i++) {
        const pt = coords[i]; // [lng, lat]
        const dLat = pt[1] - targetLat;
        const dLng = pt[0] - targetLng;
        const dSq = dLat * dLat + dLng * dLng;
        if (dSq < minDistanceSq) {
          minDistanceSq = dSq;
          closestPt = pt;
          closestIndex = i;
        }
      }
      return { pt: closestPt, index: closestIndex };

      if (!lat1 || !lon1 || !lat2 || !lon2) return 0;
      const R = 6371; // Earth radius in km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

      }

      // Check whole-word / contains match (WITHOUT dangerous 3-letter prefix slicing)
      if (!candidate && cleanUpper.length >= 3) {

          const wordRegex = new RegExp(`\\b${key}\\b`, 'i');

      // If a candidate was matched, but it is > 450 km away from the confirmed toll plaza

      // or "Goa" guessing "Arunachal Pradesh"):
      // Invalidate the candidate and anchor near the confirmed toll!
      if (candidate && tollAnchor && candidate.lat && candidate.lng && tollAnchor.lat && tollAnchor.lng) {
        const dist = haversineDistKm(candidate.lat, candidate.lng, tollAnchor.lat, tollAnchor.lng);
        if (dist > 450) {
          console.warn(`[Location Sanity] Rejected candidate '${candidate.name}' because it is ${Math.round(dist)}km away from confirmed toll '${tollAnchor.name}'. Anchoring to toll corridor.`);
          candidate = null;
        }
      }

      if (candidate) {

    // Comprehensive Toll and Fuel Location & PIN Code Parser
    const parseExpenseLocationDetails = (expense) => {
      if (!expense) return { name: 'Transit Stop', address: '', pincode: null, lat: null, lng: null };

      const isToll = expense.category === 'TOLL';
      const rawNotes = String(expense.notes || '').trim();
      const rawLoc = String(expense.location || '').trim();
      const combinedText = `${rawNotes} ${rawLoc}`;
      const upperCombined = combinedText.toUpperCase();

      // 1. Extract 6-digit Indian PIN code
      const pinMatch = rawNotes.match(/\b([1-9][0-9]{5})\b/) || rawLoc.match(/\b([1-9][0-9]{5})\b/);

      const hwyMatch = rawNotes.match(/\b(NH[-\s]?[0-9]+[A-Za-z]?|Mumbai[-\s]?Pune\s*Expressway|Yamuna\s*Expressway|Eastern\s*Peripheral|Outer\s*Ring\s*Road)\b/i) ||

      const highway = hwyMatch ? hwyMatch[0].trim() : null;

      // 3. Clean noise tags like [time:...], [txn:...], [ref:...], "FASTag Toll - MH-12-...", "Diesel Fuel - MH-12-..."
      let cleaned = rawNotes
        .replace(/\[(?:time|txn|ref|dated|on)[^\]]*\]/gi, '')
        .replace(/FASTag\s*Toll\s*[-:]?\s*[A-Z0-9\s\-]{6,20}\s*(?:at\s*)?/i, '')
        .replace(/Diesel\s*Fuel\s*[-:]?\s*[A-Z0-9\s\-]{6,20}\s*(?:at\s*)?/i, '')
        .replace(/^Diesel\s*(?:\d+(?:\.\d+)?\s*(?:L|ltrs?))?\s*/i, '')
        .trim();

      const isGenericLoc = !rawLoc || ['toll', 'highway toll', 'toll plaza', 'national highway toll', 'highway toll plaza', 'highway fuel bunk', 'highway fuel station', 'fuel station', 'fuel bunk', 'transit stop'].includes(rawLoc.toLowerCase());

      if (isToll) {
        // Match against known toll plaza coordinates dictionary
        let matchedToll = null;
        for (const [key, toll] of Object.entries(TOLL_PLAZA_COORDINATES)) {
          if (upperCombined.includes(key)) {
            matchedToll = toll;
            break;
          }
        }

        let name = '';
        if (matchedToll) {
          name = matchedToll.name;
        } else {
          const atMatch = cleaned.match(/(?:at\s+)?([A-Za-z0-9\s\-\.\/]+?)(?:\s*(?:\([^\)]*\)|,|$))/i);
          let extractedName = atMatch ? atMatch[1].trim() : cleaned;
          if (extractedName && extractedName.length > 2 && !isGenericLoc) {
            name = extractedName.toLowerCase().includes('plaza') ? extractedName : `${extractedName} Toll Plaza`;
          } else if (!isGenericLoc) {
            name = rawLoc;
          } else {
            name = 'FASTag Toll Plaza';
          }
        }

        // Extract city/region or expressway in parentheses
        let address = '';
        const parenMatch = rawNotes.match(/\(([^)]+)\)/);
        if (parenMatch) {
          address = parenMatch[1].trim();
        } else if (highway) {
          address = highway;
        } else {
          // Check if any logistics hub matches
          for (const [key, hub] of Object.entries(LOGISTICS_HUBS)) {
            if (upperCombined.includes(key)) {
              address = `${hub.name}, ${hub.state}`;
              break;
            }
          }
        }

        return {
          name,
          address,
          pincode,
          highway,
          lat: matchedToll ? matchedToll.lat : null,
          lng: matchedToll ? matchedToll.lng : null
        };
      } else {
        // DIESEL FUEL STOP
        const brandMatch = cleaned.match(/\b(IOCL|BPCL|HPCL|Indian\s*Oil|Bharat\s*Petroleum|Hindustan\s*Petroleum|Reliance|Nayara|Shell)\b/i);
        const brandName = brandMatch ? brandMatch[0].toUpperCase() : 'Fuel Station';

        // Check for merchant / pump name after 'at' or before PIN code
        const merchantMatch = cleaned.match(/(?:at|merchant[:\s\-]+|pump[:\s\-]+)?([A-Za-z0-9\s\.\-\/]+?)(?:,\s*|(?:\s*-\s*\d{6})|$)/i);
        let extractedStation = merchantMatch ? merchantMatch[1].trim() : '';
        extractedStation = extractedStation.replace(/^at\s+/i, '').trim();

        let name = '';
        if (extractedStation && extractedStation.length > 3 && !['diesel', 'fuel', 'pump', 'highway', 'bunk'].includes(extractedStation.toLowerCase())) {
          name = extractedStation;
        } else if (!isGenericLoc) {
          name = rawLoc;

          name = `${brandName} Service Bunk`;

        // Construct clean address including City, Highway, and PIN Code

            // Lightweight Mapbox / Geocode fallback for any unmapped fuel stops (cached permanently)
            for (const d of dieselEntries) {
              if (!d.cleanDetails?.lat) {
                const searchQ = d.cleanDetails?.name && !['fuel station', 'service bunk'].some(w => d.cleanDetails.name.toLowerCase().includes(w))
                  ? d.cleanDetails.name
                  : (d.cleanDetails?.address || d.location);
                if (searchQ && searchQ.length > 3) {
                  try {
                    const geo = await geocodeLocationOnline(searchQ);
                    if (geo && geo.lat && geo.lng) {
                      if (!d.cleanDetails) d.cleanDetails = parseExpenseLocationDetails(d);
                      d.cleanDetails.lat = geo.lat;
                      d.cleanDetails.lng = geo.lng;
                    }
                  } catch(e) {}
                }
              }
            }

            const coordStr = coordsList.map(c => `${c[0]},${c[1]}`).join(';');
            const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=full&geometries=geojson`;

            const res = await fetch(osrmUrl);
            const json = await res.json();

            if (json && json.routes && json.routes[0]) {
              const best = json.routes[0];
              const distanceKm = Math.round((best.distance / 1000) * 10) / 10;
              const payload = {
                distanceKm,
                estHours: Math.round((best.duration / 3600) * 10) / 10,
                geometry: best.geometry,
                waypoints: waypoints.map((w, idx) => ({
                  name: w.name,
                  lng: coordsList[idx][0],
                  lat: coordsList[idx][1]
                }))
              };

              cachedRoutes[cacheKey] = payload;
              try { localStorage.setItem(ROUTE_CACHE_KEY, JSON.stringify(cachedRoutes)); } catch(e) {}

              if (isMounted) {
                setRouteData(payload);
                setCacheHit(false);
                setIsLoadingRoute(false);
              }
            } else {
              throw new Error('OSRM Route calculation error');
            }
          } catch(err) {
            console.warn('Route calculation notice:', err);
            if (isMounted) setIsLoadingRoute(false);
          }
        };

        computeRoute();
        return () => { isMounted = false; };
      }, [activeTrip, activeTripStatus, tollEntries]);

      // --- RELIABLE LEAFLET MAP ENGINE (ESRI TILES - ZERO 403 BLOCKS) ---
      useEffect(() => {
        // If on ongoing trip (no map) or all trips summary, cleanly remove existing map
        if (selTripId === 'all' || activeTripStatus.isLatest || !mapContainerRef.current) {
          if (mapInstanceRef.current) {
            try {
              mapInstanceRef.current.remove();
            } catch(e) {}
            mapInstanceRef.current = null;
            mapLayerGroupRef.current = null;
          }
          return;
        }

        // If map exists on a detached/remounted container, remove old instance first
        if (mapInstanceRef.current) {
          try {
            const curContainer = mapInstanceRef.current.getContainer();
            if (curContainer !== mapContainerRef.current) {
              mapInstanceRef.current.remove();
              mapInstanceRef.current = null;
              mapLayerGroupRef.current = null;
            }
          } catch(e) {
            mapInstanceRef.current = null;
            mapLayerGroupRef.current = null;
          }
        }

        if (!mapInstanceRef.current) {
          const map = L.map(mapContainerRef.current, {
            center: [20.5937, 78.9629],
            zoom: 5,
            zoomControl: true,
            scrollWheelZoom: true
          });

          // ESRI World Street Map (Works locally on file:// and online with zero blocking)
          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
          }).addTo(map);

          mapLayerGroupRef.current = L.layerGroup().addTo(map);
          mapInstanceRef.current = map;
        }

        const map = mapInstanceRef.current;
        const layerGroup = mapLayerGroupRef.current;
        layerGroup.clearLayers();

        // Refresh container dimensions immediately
        setTimeout(() => {
          if (map && mapInstanceRef.current) map.invalidateSize();
        }, 120);

        if (!routeData || !routeData.geometry) return;

        // Highway Route Line
        const routeLine = L.geoJSON(routeData.geometry, {
          style: {
            color: '#0284C7',
            weight: 5,
            opacity: 0.9,
            lineJoin: 'round'
          }
        });
        layerGroup.addLayer(routeLine);

        // 1. Origin (Clean Clickable Dot)
        if (routeData.waypoints[0]) {
          const o = routeData.waypoints[0];
          const originIcon = L.divIcon({
            className: 'custom-pin',
            html: `
              <div class="w-6 h-6 rounded-full bg-emerald-600 border-2 border-white flex items-center justify-center text-white text-[11px] font-bold shadow-md transform -translate-x-1/2 -translate-y-1/2 hover:scale-125 transition cursor-pointer" title="Origin: ${o.name}">
                🟢
              </div>
            `,
            iconSize: [0, 0]
          });
          layerGroup.addLayer(
            L.marker([o.lat, o.lng], { icon: originIcon })
              .bindPopup(`
                <div class="text-xs p-1">
                  <div class="font-bold text-emerald-700 flex items-center gap-1"><span>🟢</span> Origin Dock / Hub</div>
                  <div class="text-slate-900 font-bold text-sm mt-0.5">${o.name}</div>
                </div>
              `)
          );
        }

        // 2. Intermediate Drops (Clean Clickable Dots)
        for (let i = 1; i < routeData.waypoints.length - 1; i++) {
          const d = routeData.waypoints[i];
          const dropIcon = L.divIcon({
            className: 'custom-pin',
            html: `
              <div class="w-6 h-6 rounded-full bg-sky-600 border-2 border-white flex items-center justify-center text-white text-[11px] font-bold shadow-md transform -translate-x-1/2 -translate-y-1/2 hover:scale-125 transition cursor-pointer" title="Drop #${i}: ${d.name}">
                🔵
              </div>
            `,
            iconSize: [0, 0]
          });
          layerGroup.addLayer(
            L.marker([d.lat, d.lng], { icon: dropIcon })
              .bindPopup(`
                <div class="text-xs p-1">
                  <div class="font-bold text-sky-700 flex items-center gap-1"><span>🔵</span> Intermediate Delivery Drop #${i}</div>
                  <div class="text-slate-900 font-bold text-sm mt-0.5">${d.name}</div>
                </div>
              `)
          );
        }

        // 3. Destination (Clean Clickable Dot)
        if (routeData.waypoints.length > 1) {
          const dest = routeData.waypoints[routeData.waypoints.length - 1];
          const destIcon = L.divIcon({
            className: 'custom-pin',
            html: `
              <div class="w-6 h-6 rounded-full bg-rose-600 border-2 border-white flex items-center justify-center text-white text-[11px] font-bold shadow-md transform -translate-x-1/2 -translate-y-1/2 hover:scale-125 transition cursor-pointer" title="Destination: ${dest.name}">
                🔴
              </div>
            `,
            iconSize: [0, 0]
          });
          layerGroup.addLayer(
            L.marker([dest.lat, dest.lng], { icon: destIcon })
              .bindPopup(`
                <div class="text-xs p-1">
                  <div class="font-bold text-rose-700 flex items-center gap-1"><span>🔴</span> Final Destination</div>
                  <div class="text-slate-900 font-bold text-sm mt-0.5">${dest.name}</div>
                </div>
              `)
          );
        }

        // 4. Sequential Toll Plazas & Diesel Fuel Stations along the Route (Dots only - details on click)
        if (routeData.geometry.coordinates && routeData.geometry.coordinates.length > 0) {
          const coords = routeData.geometry.coordinates;
          const totalPts = coords.length;

          // Combine Tolls and Diesel Stops chronologically along the corridor
          const allStops = [
            ...tollEntries.map(t => ({ ...t, kind: 'TOLL', cleanDetails: t.cleanDetails || parseExpenseLocationDetails(t) })),
            ...dieselEntries.map(d => ({ ...d, kind: 'DIESEL', cleanDetails: d.cleanDetails || parseExpenseLocationDetails(d) }))
          ].sort((a, b) => {
            const tsA = a.timestamp || `${a.date}T${a.time || '00:00'}:00`;
            const tsB = b.timestamp || `${b.date}T${b.time || '00:00'}:00`;
            return tsA.localeCompare(tsB);
          });

          let tollCount = 0;
          let dieselCount = 0;

          allStops.forEach((stop, stopIdx) => {
            const details = stop.cleanDetails || parseExpenseLocationDetails(stop);
            let pt = null;

            if (details.lat && details.lng) {
              const snap = findClosestPointOnRoute(coords, details.lat, details.lng);
              pt = snap.pt;
            } else {
              const ratio = (stopIdx + 1) / (allStops.length + 1);
              const ptIdx = Math.min(totalPts - 1, Math.floor(ratio * totalPts));
              pt = coords[ptIdx];
            }

            if (stop.kind === 'TOLL') {
              tollCount++;
              const tollIcon = L.divIcon({
                className: 'toll-badge',
                html: `
                  <div class="w-6 h-6 rounded-full bg-amber-500 border-2 border-white flex items-center justify-center text-slate-950 font-black text-xs shadow-md transform -translate-x-1/2 -translate-y-1/2 hover:scale-125 transition cursor-pointer" title="${details.name}">
                    ${tollCount}
                  </div>
                `,
                iconSize: [0, 0]
              });

              layerGroup.addLayer(
                L.marker([pt[1], pt[0]], { icon: tollIcon })
                  .bindPopup(`
                    <div class="text-xs space-y-1.5 p-1 min-w-[210px]">
                      <div class="flex items-center justify-between border-b border-amber-100 pb-1">
                        <span class="inline-flex items-center gap-1 font-bold text-amber-700 text-xs">
                          <span class="w-5 h-5 rounded-md bg-amber-100 flex items-center justify-center text-[11px]">🛣️</span>
                          <span>Toll Plaza #${tollCount}</span>
                        </span>
                        <span class="text-[10px] font-semibold text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded border border-amber-200">FASTag</span>
                      </div>
                      <div class="text-slate-900 font-extrabold text-sm leading-snug">${details.name}</div>
                      ${details.address ? `<div class="text-slate-600 text-[11px] font-medium flex items-center gap-1">📍 ${details.address}</div>` : ''}
                      <div class="bg-amber-50/70 rounded-md p-1.5 border border-amber-100/60 flex items-center justify-between text-xs">
                        <span class="text-slate-600 font-medium">Deduction:</span>
                        <strong class="text-amber-900 font-black text-sm">${formatCurr(stop.amount)}</strong>
                      </div>
                      <div class="text-slate-500 text-[11px] border-t border-slate-100 pt-1 flex items-center justify-between">
                        <span>🕒 <strong>${stop.time}</strong></span>
                        <span>📅 ${formatDate(stop.date)}</span>
                      </div>
                    </div>
                  `)
              );
            } else {
              // DIESEL FUEL STOP
              dieselCount++;
              const lMatch = (stop.notes || '').match(/(\d+(?:\.\d+)?)\s*(?:L|ltr|liters)/i);
              const liters = lMatch ? parseFloat(lMatch[1]) : Math.round(Number(stop.amount || 0) / 95);

              const dieselIcon = L.divIcon({
                className: 'diesel-badge',
                html: `
                  <div class="w-6 h-6 rounded-full bg-purple-700 border-2 border-white flex items-center justify-center text-white font-black text-[11px] shadow-md transform -translate-x-1/2 -translate-y-1/2 hover:scale-125 transition cursor-pointer" title="${details.name}">
                    ⛽
                  </div>
                `,
                iconSize: [0, 0]
              });

              layerGroup.addLayer(
                L.marker([pt[1], pt[0]], { icon: dieselIcon })
                  .bindPopup(`
                    <div class="text-xs space-y-1.5 p-1 min-w-[210px]">
                      <div class="flex items-center justify-between border-b border-purple-100 pb-1">
                        <span class="inline-flex items-center gap-1 font-bold text-purple-700 text-xs">
                          <span class="w-5 h-5 rounded-md bg-purple-100 flex items-center justify-center text-[11px]">⛽</span>
                          <span>Fuel Station #${dieselCount}</span>
                        </span>
                        <span class="text-[10px] font-semibold text-purple-700 bg-purple-50 px-1.5 py-0.5 rounded border border-purple-200">Diesel Bunk</span>
                      </div>
                      <div class="text-slate-900 font-extrabold text-sm leading-snug">${details.name}</div>
                      ${details.address ? `<div class="text-slate-600 text-[11px] font-medium flex items-center gap-1">📍 ${details.address}</div>` : ''}
                      <div class="bg-purple-50/70 rounded-md p-1.5 border border-purple-100/60 flex items-center justify-between text-xs">
                        <span class="text-slate-600 font-medium">Fuel Volume:</span>
                        <strong class="text-purple-900 font-black text-sm">${liters} Liters <span class="text-xs font-normal text-slate-500">(${formatCurr(stop.amount)})</span></strong>
                      </div>
                      <div class="text-slate-500 text-[11px] border-t border-slate-100 pt-1 flex items-center justify-between">
                        <span>🕒 <strong>${stop.time}</strong></span>
                        <span>📅 ${formatDate(stop.date)}</span>
                      </div>
                    </div>
                  `)
              );
            }
          });
        }

        map.fitBounds(routeLine.getBounds(), { padding: [35, 35] });
      }, [routeData, tollEntries, dieselEntries, isMapMaximized, selTripId, activeTripStatus.isLatest]);

      // Re-invalidate size whenever toggling fullscreen map
      useEffect(() => {
        if (mapInstanceRef.current) {
          setTimeout(() => {
            mapInstanceRef.current.invalidateSize();
          }, 150);
        }
      }, [isMapMaximized]);

      // Clean up map instance when navigating to summary or ongoing trips
      useEffect(() => {
        if ((selTripId === 'all' || activeTripStatus.isLatest) && mapInstanceRef.current) {
          try {
            mapInstanceRef.current.remove();
          } catch(e) {}
          mapInstanceRef.current = null;
          mapLayerGroupRef.current = null;
        }
      }, [selTripId, activeTripStatus.isLatest]);

      // Metrics
      const totalTollsAmt = useMemo(() => tollEntries.reduce((s, e) => s + Number(e.amount || 0), 0), [tollEntries]);
      const totalDieselAmt = useMemo(() => dieselEntries.reduce((s, e) => s + Number(e.amount || 0), 0), [dieselEntries]);
      const totalDieselLiters = useMemo(() => {
        return dieselEntries.reduce((s, e) => {
          const m = (e.notes || '').match(/(\d+(?:\.\d+)?)\s*(?:L|ltr|liters)/i);
          return s + (m ? parseFloat(m[1]) : (Number(e.amount || 0) / 95));
        }, 0);
      }, [dieselEntries]);

      const highwayKm = routeData?.distanceKm || 0;
      const fuelCostPerKm = highwayKm > 0 ? (totalDieselAmt / highwayKm) : 0;
      const mileage = (highwayKm > 0 && totalDieselLiters > 0) ? (highwayKm / totalDieselLiters) : 0;
      const avgSpeed = (highwayKm > 0 && transitDuration?.durationHours > 0) ? (highwayKm / transitDuration.durationHours) : 0;

      return (
        <div className="min-h-screen flex flex-col bg-[#F8FAFC]">
          {/* Top Brand Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <a href="./index.html" className="flex items-center gap-2.5 group">
                  <div className="w-9 h-9 rounded-xl bg-sky-600 flex items-center justify-center text-white font-black text-sm shadow-md group-hover:bg-sky-700 transition">
                    AR
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-lg font-extrabold text-slate-900 tracking-tight">AR Insights</span>
                      <span className="px-2 py-0.5 rounded-full bg-sky-50 text-sky-700 border border-sky-200 text-[10px] font-bold">
                        Telemetry v1.0
                      </span>
                    </div>
                    <p className="text-[11px] text-slate-500 hidden sm:block">Route Telemetry, Toll Timelines & Fuel Consumption</p>
                  </div>
                </a>
              </div>

              <div className="flex items-center gap-3">
                <span className="hidden sm:inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-50 border border-slate-200 text-slate-600 text-xs font-semibold">
                  <span className={`w-2 h-2 rounded-full ${isSyncingCloud ? 'bg-amber-400 animate-ping' : supabaseClient ? 'bg-emerald-500' : 'bg-slate-400'}`}></span>
                  {isSyncingCloud ? 'Syncing Cloud...' : supabaseClient ? 'Supabase Synced' : 'Offline Mode'}
                </span>

                {cacheHit && (
                  <span className="hidden sm:inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-semibold">
                    <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                    Instant Cache Active
                  </span>
                )}
                <a
                  href="./index.html"
                  className="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl border border-slate-200 transition shadow-xs flex items-center gap-1.5"
                >
                  <span>←</span>
                  <span>Return to FleetTrack</span>
                </a>
              </div>
            </div>
          </header>

          {/* Control Bar */}
          <div className="bg-white border-b border-slate-200 px-4 py-3 sticky top-[61px] z-20 shadow-xs">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center gap-3">
              {/* Active Account / Profile Dropdown */}
              <div className="flex-1 min-w-[220px]">
                <label className="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">
                  Active Account Entity
                </label>
                <select
                  value={activeProfileId}
                  onChange={(e) => {
                    const newId = e.target.value;
                    setActiveProfileId(newId);
                    try { localStorage.setItem(`${STORAGE_KEY}_active_prof`, newId); } catch(err){}
                    setSelTruck('all');
                    setSelTripId('all');
                  }}
                  className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 focus:ring-2 focus:ring-sky-500 focus:outline-none"
                >
                  {profiles.map(p => (
                    <option key={p.id} value={p.id}>🏢 {p.name}</option>
                  ))}
                </select>
              </div>

              {/* Vehicle Dropdown */}
              <div className="flex-1 min-w-[200px]">
                <label className="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Select Vehicle</label>
                <select
                  value={selTruck}
                  onChange={(e) => {
                    setSelTruck(e.target.value);
                    setSelTripId('all');
                  }}
                  className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 focus:ring-2 focus:ring-sky-500 focus:outline-none"
                >
                  <option value="all">All Fleet Trucks ({trucks.length})</option>
                  {trucks.map(t => (
                    <option key={t.id} value={t.id}>{t.registrationNumber} - {t.model?.split('(')[0]}</option>
                  ))}
                </select>
              </div>

              {/* Trip Dropdown */}
              <div className="flex-1 min-w-[260px]">
                <label className="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Select Trip</label>
                <select
                  value={selTripId}
                  onChange={(e) => setSelTripId(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold text-slate-900 focus:ring-2 focus:ring-sky-500 focus:outline-none"
                >
                  <option value="all">Summary Table (All Trips)</option>
                  {filteredTrips.map(tr => {
                    const st = getTripStatusInfo(tr);
                    return (
                      <option key={tr.id} value={tr.id}>
                        {st.isLatest ? '🚚 [Active / In-Transit] ' : '✅ [Completed] '}
                        {formatDate(tr.date)} | {tr.route} ({formatCurr(tr.totalRent)})
                      </option>
                    );
                  })}
                </select>
              </div>
            </div>
          </div>

          {/* Main Body */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">

            {activeTrip && selTripId !== 'all' ? (
              <div className="space-y-6">
                {/* Active Trip Header */}
                <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-wrap items-center justify-between gap-4">
                  <div>
                    <div className="flex items-center gap-2 mb-1">
                      <span className="px-2.5 py-1 rounded-md bg-sky-100 text-sky-800 font-bold text-xs font-mono">
                        {trucks.find(t => t.id === activeTrip.truckId)?.registrationNumber || activeTrip.truckId}
                      </span>
                      <span className="text-xs text-slate-500 font-semibold">📅 {formatDate(activeTrip.date)}</span>
                      {activeTripStatus.isLatest ? (
                        <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-50 text-amber-700 border border-amber-200">
                          🚚 Active Leg / On Road
                        </span>
                      ) : (
                        <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">
                          ✅ Completed Trip
                        </span>
                      )}
                    </div>
                    <h2 className="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight">
                      {activeTrip.route}
                    </h2>
                    <p className="text-xs text-slate-500 mt-1">
                      Shipper: <strong>{activeTrip.companyName}</strong> | Driver: <strong>{activeTrip.driverName}</strong> | Contracted Freight: <strong>{formatCurr(activeTrip.totalRent)}</strong>
                    </p>
                  </div>

                  <button
                    onClick={() => setSelTripId('all')}
                    className="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition border border-slate-300"
                  >
                    View All Trips
                  </button>
                </div>

                {activeTripStatus.isLatest ? (
                  /* Active / In-Transit Notice (Analytics locked until next trip is logged) */
                  <div className="bg-amber-50/70 border border-amber-200 rounded-2xl p-8 text-center space-y-4 shadow-xs">
                    <div className="w-16 h-16 bg-amber-100 text-amber-800 rounded-2xl flex items-center justify-center mx-auto text-3xl shadow-inner">
                      🚚
                    </div>
                    <div className="space-y-1.5 max-w-lg mx-auto">
                      <span className="inline-block px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-bold uppercase tracking-wider">
                        Trip In Progress
                      </span>
                      <h3 className="text-xl font-extrabold text-slate-900 tracking-tight">
                        Analytics Finalize Once Next Trip is Entered
                      </h3>
                      <p className="text-xs text-slate-600 leading-relaxed">
                        This is currently the latest trip logged for <strong>{trucks.find(t => t.id === activeTrip.truckId)?.registrationNumber || activeTrip.truckId}</strong>.
                        To guarantee 100% boundary accuracy and ensure subsequent repositioning or return tolls do not bleed into this trip, complete OSRM telemetry, exact toll timelines, and diesel analytics lock in once the subsequent trip entry is logged.
                      </p>
                    </div>

                    <div className="pt-2 flex flex-wrap justify-center gap-2">
                      <button
                        onClick={() => setSelTripId('all')}
                        className="px-4 py-2 bg-white hover:bg-slate-50 text-slate-800 text-xs font-bold rounded-xl border border-slate-300 shadow-xs transition"
                      >
                        Browse Completed Trips Summary
                      </button>
                    </div>
                  </div>
                ) : (
                  <>
                    {/* 4 Telemetry Metric Boxes */}
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                    <span className="text-[11px] font-bold text-sky-600 uppercase tracking-wider block mb-1">🛣️ Highway Distance</span>
                    <div className="text-2xl font-extrabold text-slate-900 font-mono">
                      {isLoadingRoute ? <span className="text-slate-400 text-sm">Calculating...</span> : `${highwayKm} km`}
                    </div>
                    <span className="text-[11px] text-slate-500 mt-1 block">National Highway routing</span>
                  </div>

                  <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                    <span className="text-[11px] font-bold text-amber-600 uppercase tracking-wider block mb-1">⏱️ Toll Transit Time</span>
                    <div className="text-2xl font-extrabold text-slate-900 font-mono">
                      {transitDuration?.durationFormatted || 'No Tolls Tagged'}
                    </div>
                    <span className="text-[11px] text-slate-500 mt-1 block truncate">
                      {transitDuration?.firstPlaza ? `${transitDuration.firstPlaza.split(' ')[0]} → ${transitDuration.lastPlaza.split(' ')[0]}` : 'First to last toll'}
                    </span>
                  </div>

                  <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                    <span className="text-[11px] font-bold text-purple-600 uppercase tracking-wider block mb-1">⛽ Fuel Mileage</span>
                    <div className="text-2xl font-extrabold text-slate-900 font-mono">
                      {mileage > 0 ? `${mileage.toFixed(1)} km/L` : formatCurr(totalDieselAmt)}
                    </div>
                    <span className="text-[11px] text-slate-500 mt-1 block">
                      Cost: <strong>₹{fuelCostPerKm.toFixed(1)}/km</strong> ({Math.round(totalDieselLiters)} L)
                    </span>
                  </div>

                  <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                    <span className="text-[11px] font-bold text-emerald-600 uppercase tracking-wider block mb-1">⚡ Average Speed</span>
                    <div className="text-2xl font-extrabold text-emerald-600 font-mono">
                      {avgSpeed > 0 ? `${avgSpeed.toFixed(1)} km/h` : '38 km/h'}
                    </div>
                    <span className="text-[11px] text-slate-500 mt-1 block">Wheels-on-road transit speed</span>
                  </div>
                </div>

                {/* Map Card */}
                <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
                  <div className="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-slate-200">
                    <div className="flex flex-wrap items-center gap-2">
                      <span className="text-lg">🗺️</span>
                      <h3 className="font-bold text-slate-900 text-sm">Interactive Road Route, Plazas & Fuel Bunks</h3>
                      <div className="hidden sm:flex items-center gap-2 text-[11px] font-bold pl-2 border-l border-slate-200">
                        <span className="inline-flex items-center gap-1 text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">🟢 Origin</span>
                        <span className="inline-flex items-center gap-1 text-amber-800 bg-amber-50 px-2 py-0.5 rounded border border-amber-200">🛣️ Tolls ({tollEntries.length})</span>
                        <span className="inline-flex items-center gap-1 text-purple-800 bg-purple-50 px-2 py-0.5 rounded border border-purple-200">⛽ Diesel ({dieselEntries.length})</span>
                        <span className="inline-flex items-center gap-1 text-rose-700 bg-rose-50 px-2 py-0.5 rounded border border-rose-200">🔴 Destination</span>
                      </div>
                    </div>

                    <button
                      type="button"
                      onClick={() => setIsMapMaximized(!isMapMaximized)}
                      className="px-3.5 py-1.5 bg-sky-50 hover:bg-sky-100 text-sky-700 font-bold rounded-lg text-xs border border-sky-200 transition flex items-center gap-1.5 shadow-xs"
                    >
                      <span>{isMapMaximized ? '🗗' : '⛶'}</span>
                      <span>{isMapMaximized ? 'Minimize Map' : 'Maximize Map (Edge-to-Edge)'}</span>
                    </button>
                  </div>

                  {/* Strictly Contained Map Box with True 100vw/100vh Fullscreen Toggle */}
                  <div className={isMapMaximized ? 'map-fullscreen' : 'map-box h-[420px] w-full border border-slate-200'}>
                    {isMapMaximized && (
                      <div className="absolute top-4 right-4 z-[10000]">
                        <button
                          type="button"
                          onClick={() => setIsMapMaximized(false)}
                          className="px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs shadow-2xl transition flex items-center gap-2 border border-slate-700"
                        >
                          <span className="text-base font-black">✕</span>
                          <span>Close Fullscreen</span>
                        </button>
                      </div>
                    )}
                    <div ref={mapContainerRef} className="w-full h-full"></div>
                  </div>
                </div>

                {/* Dedicated Location & Time Tables for Tolls & Diesel */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  {/* Sequential Toll Deductions Table */}
                  <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
                    <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                      <div>
                        <h4 className="font-bold text-slate-900 text-sm">FASTag Toll Deductions (Sequential)</h4>
                        <p className="text-xs text-slate-500">Includes Exact Toll Plaza Name and Deduction Timestamp</p>
                      </div>
                      <span className="text-xs font-mono font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded-md border border-amber-200">
                        Total: {formatCurr(totalTollsAmt)}
                      </span>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs text-slate-700">
                        <thead className="bg-slate-50 text-[10px] uppercase font-bold text-slate-500 border-b border-slate-200">
                          <tr>
                            <th className="py-2.5 px-3">#</th>
                            <th className="py-2.5 px-3">Time & Date</th>
                            <th className="py-2.5 px-3">Toll Plaza Location</th>
                            <th className="py-2.5 px-3 text-right">Amount</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {tollEntries.map((t, idx) => {
                            const details = t.cleanDetails || parseExpenseLocationDetails(t);
                            return (
                              <tr key={t.id} className="hover:bg-slate-50/80">
                                <td className="py-2.5 px-3 font-bold text-slate-400">{idx + 1}</td>
                                <td className="py-2.5 px-3 whitespace-nowrap">
                                  <div className="font-bold text-slate-900 font-mono">{t.time || '-'}</div>
                                  <div className="text-[10px] text-slate-500">{formatDate(t.date)}</div>
                                </td>
                                <td className="py-2.5 px-3 font-medium text-slate-800">
                                  <div className="flex items-center gap-1.5 font-bold text-amber-950 text-xs">
                                    <span className="px-1.5 py-0.5 rounded bg-amber-100 text-amber-800 text-[10px]">🛣️ Plaza</span>
                                    <span>{details.name}</span>
                                  </div>
                                  {details.address && (
                                    <div className="text-[11px] text-slate-500 pl-1 flex items-center gap-1.5 mt-0.5">
                                      <span>📍 {details.address}</span>
                                      {details.pincode && (
                                        <span className="bg-amber-50 text-amber-700 text-[9px] font-mono px-1 py-0.2 rounded border border-amber-200">PIN {details.pincode}</span>
                                      )}
                                    </div>
                                  )}
                                </td>
                                <td className="py-2.5 px-3 text-right font-mono font-bold text-amber-600 whitespace-nowrap">
                                  {formatCurr(t.amount)}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  {/* Diesel Fuel Stops Table */}
                  <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
                    <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                      <div>
                        <h4 className="font-bold text-slate-900 text-sm">Diesel Fuel Fills & Bunks</h4>
                        <p className="text-xs text-slate-500">Includes Fuel Station / Bunk Location, Time and Volume</p>
                      </div>
                      <span className="text-xs font-mono font-bold text-purple-600 bg-purple-50 px-2 py-1 rounded-md border border-purple-200">
                        Total: {formatCurr(totalDieselAmt)}
                      </span>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs text-slate-700">
                        <thead className="bg-slate-50 text-[10px] uppercase font-bold text-slate-500 border-b border-slate-200">
                          <tr>
                            <th className="py-2.5 px-3">#</th>
                            <th className="py-2.5 px-3">Time & Date</th>
                            <th className="py-2.5 px-3">Station & Location</th>
                            <th className="py-2.5 px-3 text-right">Volume</th>
                            <th className="py-2.5 px-3 text-right">Amount</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {dieselEntries.map((d, idx) => {
                            const details = d.cleanDetails || parseExpenseLocationDetails(d);
                            const lMatch = (d.notes || '').match(/(\d+(?:\.\d+)?)\s*(?:L|ltr|liters)/i);
                            const liters = lMatch ? parseFloat(lMatch[1]) : Math.round(Number(d.amount || 0) / 95);

                            return (
                              <tr key={d.id} className="hover:bg-slate-50/80">
                                <td className="py-2.5 px-3 font-bold text-slate-400">{idx + 1}</td>
                                <td className="py-2.5 px-3 whitespace-nowrap">
                                  <div className="font-bold text-slate-900 font-mono">{d.time || '-'}</div>
                                  <div className="text-[10px] text-slate-500">{formatDate(d.date)}</div>
                                </td>
                                <td className="py-2.5 px-3 font-medium text-slate-800">
                                  <div className="flex items-center gap-1.5 font-bold text-purple-950 text-xs">
                                    <span className="px-1.5 py-0.5 rounded bg-purple-100 text-purple-800 text-[10px]">⛽ Station</span>
                                    <span>{details.name}</span>
                                  </div>
                                  {details.address && (
                                    <div className="text-[11px] text-slate-500 pl-1 flex items-center gap-1.5 mt-0.5">
                                      <span>📍 {details.address}</span>
                                      {details.pincode && (
                                        <span className="bg-purple-50 text-purple-700 text-[9px] font-mono px-1 py-0.2 rounded border border-purple-200">PIN {details.pincode}</span>
                                      )}
                                    </div>
                                  )}
                                </td>
                                <td className="py-2.5 px-3 text-right font-mono text-purple-700 whitespace-nowrap">
                                  {liters} L
                                </td>
                                <td className="py-2.5 px-3 text-right font-mono font-bold text-purple-600 whitespace-nowrap">
                                  {formatCurr(d.amount)}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </>
            )}
              </div>
            ) : (
              /* All Trips Summary View */
              <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                  <h3 className="font-bold text-slate-900 text-sm">Vehicle Trips & Telemetry Overview</h3>
                  <span className="text-xs text-slate-500 font-medium">{filteredTrips.length} Trips Available</span>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs text-slate-700">
                    <thead className="bg-slate-50 text-[10px] uppercase font-bold text-slate-500 border-b border-slate-200">
                      <tr>
                        <th className="p-3">Date</th>
                        <th className="p-3">Vehicle</th>
                        <th className="p-3">Status</th>
                        <th className="p-3">Corridor Route</th>
                        <th className="p-3 text-right">Freight Rent</th>
                        <th className="p-3 text-center">Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {filteredTrips.map(tr => {
                        const st = getTripStatusInfo(tr);
                        return (
                          <tr key={tr.id} className="hover:bg-slate-50">
                            <td className="p-3 font-mono text-slate-600 whitespace-nowrap">{formatDate(tr.date)}</td>
                            <td className="p-3 font-mono text-sky-700 font-bold whitespace-nowrap">
                              {trucks.find(t => t.id === tr.truckId)?.registrationNumber || tr.truckId}
                            </td>
                            <td className="p-3 whitespace-nowrap">
                              {st.isLatest ? (
                                <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-50 text-amber-700 border border-amber-200">
                                  🚚 In-Transit
                                </span>
                              ) : (
                                <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">
                                  ✅ Completed
                                </span>
                              )}
                            </td>
                            <td className="p-3 font-semibold text-slate-900">{tr.route}</td>
                            <td className="p-3 text-right font-mono text-slate-900 font-bold whitespace-nowrap">
                              {formatCurr(tr.totalRent)}
                            </td>
                            <td className="p-3 text-center whitespace-nowrap">
                              <button
                                type="button"
                                onClick={() => setSelTripId(tr.id)}
                                className="px-3.5 py-1.5 rounded-lg bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 font-bold text-xs transition shadow-xs"
                              >
                                {st.isLatest ? 'Inspect Trip ↗' : 'Inspect Route & Tolls ↗'}
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {/* Clean Light Footer */}
          <footer className="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 mt-auto">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
              <span className="font-semibold text-slate-600">AR Insights Telemetry</span>
              <span>Reliable World Street Routing Engine</span>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
