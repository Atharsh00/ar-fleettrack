<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="arGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="arTruckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="arBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="arGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.5" flood-color="#F59E0B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Modern Rounded Shield Badge Base -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#arBadgeGrad)" stroke="url(#arGoldGrad)" stroke-width="2.5" />

  <!-- Distinct Bold Geometric Uppercase "AR" Monogram -->
  <g filter="url(#arGlow)">
    <!-- Letter 'A' (Capital, Width: 31.5, Height: 32, Y: 17 to 49) -->
    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="M 16 49 L 28.5 17 L 35 17 L 47.5 49 L 40.5 49 L 37.5 41.5 L 26 41.5 L 23 49 Z M 31.75 23 L 28 34.5 L 35.5 34.5 Z"
      fill="url(#arGoldGrad)"
    />
    <!-- Letter 'R' (Capital, Width: 31, Height: 32, Y: 17 to 49, with open visible counter) -->
    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="M 52.5 17 L 73 17 C 79.5 17 83.5 20.5 83.5 26.5 C 83.5 31.5 79.8 35 73.2 35.5 L 83.5 49 L 75 49 L 65.8 36 L 59.8 36 L 59.8 49 L 52.5 49 Z M 59.8 30.2 L 72.5 30.2 C 76.2 30.2 77.5 28.5 77.5 26.5 C 77.5 24.5 76.2 22.8 72.5 22.8 L 59.8 22.8 Z"
      fill="url(#arGoldGrad)"
    />
  </g>

  <!-- Sleek Modern Semi-Truck & Road Profile -->
  <g filter="url(#arGlow)">
    <!-- Highway Road Line with center dash -->
    <path d="M 12 83 L 88 83" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M 30 83 L 70 83" stroke="#FEF08A" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.9" />

    <!-- Truck Trailer Box -->
    <rect x="15" y="60" width="36" height="17" rx="2" fill="url(#arTruckGrad)" />
    <!-- Truck Trailer accent line -->
    <path d="M 17 63 L 49 63" stroke="#0F172A" stroke-width="1.2" opacity="0.6" />

    <!-- Truck Cab Body -->
    <path
      d="M 53 60 L 67 60 L 74 65 L 79 66 C 81 66 83 68 83 70 L 83 77 L 53 77 Z"
      fill="url(#arTruckGrad)"
    />

    <!-- Cab Windshield Glass -->
    <path d="M 66 62 L 72 66 L 56 66 L 56 62 Z" fill="#0F172A" />

    <!-- Headlight -->
    <path d="M 80 72 L 83 72 L 82 74 L 80 74 Z" fill="#FFFFFF" />

    <!-- Wheels (Trailer wheels & Cab wheels) -->
    <!-- Wheel 1 -->
    <circle cx="23" cy="78" r="4.5" fill="#090D16" stroke="#F59E0B" stroke-width="1.5" />
    <circle cx="23" cy="78" r="1.8" fill="#FDE68A" />
    <!-- Wheel 2 -->
    <circle cx="37" cy="78" r="4.5" fill="#090D16" stroke="#F59E0B" stroke-width="1.5" />
    <circle cx="37" cy="78" r="1.8" fill="#FDE68A" />
    <!-- Wheel 3 (Cab Drive) -->
    <circle cx="61" cy="78" r="4.5" fill="#090D16" stroke="#F59E0B" stroke-width="1.5" />
    <circle cx="61" cy="78" r="1.8" fill="#FDE68A" />
    <!-- Wheel 4 (Cab Front Steer) -->
    <circle cx="75" cy="78" r="4.5" fill="#090D16" stroke="#F59E0B" stroke-width="1.5" />
    <circle cx="75" cy="78" r="1.8" fill="#FDE68A" />
  </g>
</svg>
